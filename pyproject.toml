[project]
name = "mqlab"
version = "1.0.0"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["pymqrest>=1.2,<2", "ansible-core>=2.16", "pyyaml>=6"]

[dependency-groups]
dev = ["ruff", "mypy", "ty", "pytest", "pytest-cov", "pip-audit", "pip-licenses", "types-PyYAML"]
# Docs toolchain. vrg-container-docs runs `uv sync --group docs && uv run
# mkdocs ...`; the cd-docs/ci-docs pipelines build the same way. Kept out of
# the default groups so routine `uv run`/vrg-validate stay lean.
docs = ["mkdocs-material>=9", "mike>=2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mqlab"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "S", "B", "A", "C4", "SIM", "TCH", "ARG", "PTH", "ERA"]

[tool.ruff.lint.per-file-ignores]
# S106: dummy lab credentials in test fixtures (security out of scope, spec 1)
"tests/**" = ["S101", "S106", "ARG", "E402"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.report]
exclude_lines = [
    "if __name__ == .__main__.",
    "if TYPE_CHECKING:",
    "pragma: no cover",
]
