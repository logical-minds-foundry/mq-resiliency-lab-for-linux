[project]
name = "mqlab"
version = "1.0.0"
requires-python = ">=3.14"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["ansible-core>=2.16", "pyyaml>=6", "typer>=0.12", "rich>=13", "cryptography>=42"]

[project.scripts]
# The entry point is the thin launcher, not cli:main directly, so a venv too
# stale to parse the package still resolves to a module that surfaces
# remediation instead of a raw SyntaxError. See src/mqlab/launcher.py (#1063).
mqlab = "mqlab.launcher:main"

[dependency-groups]
# `ansible-lint` is version-matched tooling for `ansible-core` (a runtime
# dependency above): it lints against whatever `ansible-core` is installed, so it
# must live in the same venv. Declaring it here keeps the two co-resolved by uv —
# one venv holds one `ansible-core`, so `ansible-lint`'s module and the `ansible`
# CLI it shells out to can never skew. See #691.
dev = ["ruff", "mypy", "ty", "pytest", "pytest-cov", "pip-audit", "pip-licenses", "types-PyYAML", "ansible-lint", "pytest-xdist"]
# Docs toolchain. vrg-container-docs runs `uv sync --group docs && uv run
# mkdocs ...`; the cd-docs/ci-docs pipelines build the same way. Kept out of
# the default groups so routine `uv run`/vrg-validate stay lean.
# mkdocs<2: MkDocs 2.0 breaks plugins and theme overrides; see
# https://squidfunk.github.io/mkdocs-material/blog/2026/02/18/mkdocs-2.0/
docs = ["mkdocs>=1.6,<2", "mkdocs-material>=9", "mike>=2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mqlab"]

[tool.uv]
# Never seed the venv from the base OS interpreter. The Python VERSION follows
# Vergil's version window (no `.python-version`, no `requires-python` upper
# bound; `requires-python` is only the floor). This setting picks the SOURCE:
# `only-managed` forces a uv-downloaded, uv-managed build even when a matching
# system Python exists — so the lab's runtime on the VM can never silently
# depend on whatever Python the host happens to ship. This closes the
# regression in #1063, where a pre-bump venv was seeded from the OS's 3.12 and
# then could not parse the 3.14 code. The base OS Python is left untouched.
# Vergil containers and CI override it with UV_PYTHON_PREFERENCE=only-system so
# they run the image's interpreter (#1681, vergil-project/.github#407).
python-preference = "only-managed"

[tool.ruff]
target-version = "py314"
line-length = 100
# components/<name>/ are standalone uv projects with their OWN [tool.ruff] (epic
# .github#294 spec §5.1): mqlab's rules must never apply to them, even on a bare root
# `ruff` run or in an editor. tests/test_component_boundary.py guards this.
extend-exclude = ["components"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "S", "B", "A", "C4", "SIM", "TCH", "ARG", "PTH", "ERA"]

[tool.ruff.lint.per-file-ignores]
# S101: assert is idiomatic in pytest
# S106: dummy lab credentials in test fixtures (security out of scope, spec 1)
# S603/S607: subprocess calls in test helpers are trusted by definition
"tests/**" = ["S101", "S106", "S603", "S607", "ARG", "E402"]

[tool.mypy]
python_version = "3.14"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "real_build_root: use the real mqlab.paths.build_root (opt out of the #1569 isolation)",
]

[tool.coverage.report]
exclude_lines = [
    "if __name__ == .__main__.",
    "if TYPE_CHECKING:",
    "pragma: no cover",
    # Protocol / abstract method stub bodies (e.g. `def f() -> int: ...`) are
    # never executed — exclude their inline ellipsis from branch coverage.
    ": \\.\\.\\.$",
]
