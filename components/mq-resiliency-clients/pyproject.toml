[project]
name = "mq-resiliency-clients"
version = "0.1.0"
description = "IBM MQ reference clients (load, bench, probes, DR flow) and the DR measurement framework"
readme = "README.md"
requires-python = "==3.14.*"
license = "MIT"
dependencies = []

[project.optional-dependencies]
# IBM's maintained MQI binding. Installed on the guest: the abi3 wheel on x86_64,
# compiled from sdist against the box's MQ SDK on aarch64 (no upstream wheel yet,
# .github#302). NEVER on the dev VM (no MQ SDK): tests use a fake ibmmq module.
mqi = ["ibmmq==2.1.1"]

[project.scripts]
mq-app-requester = "mqrc.app_requester:main"
mq-bench = "mqrc.bench_client:main"
mq-svc-responder = "mqrc.svc_responder:main"
mq-authz-probe = "mqrc.authz_probe:main"
mq-dlq-probe = "mqrc.dlq_probe:main"
mq-reconnect-probe = "mqrc.reconnect_probe:main"
mq-dr-flow = "mqrc.dr_flow:main"
mq-dr-responder = "mqrc.dr_responder:main"
mq-dr-baseline = "mqrc.dr_baseline:main"
mq-dr-forced = "mqrc.dr_forced:main"
mq-resiliency-clients-selfcheck = "mqrc.selfcheck:main"

[dependency-groups]
dev = ["pytest", "pytest-cov", "ruff"]
# Build requirements of our sdist deps, pre-installed because guest installs are
# offline with --no-build-isolation: ibmmq's sdist declares setuptools>=75 as its
# build backend (needed on aarch64, where there is no wheel). Exported by
# `mqlab component build` to build-requirements.txt.
sdist-build = ["setuptools==84.2.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mqrc"]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=mqrc --cov-branch --cov-report=term-missing"
