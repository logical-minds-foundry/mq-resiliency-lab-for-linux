# Resolve the CURRENT Active instance of a Native HA group into `active_host` (#891).
#
# The one shared Native HA active-instance detection, used by both arms' provision plays
# (via nativeha-on-active.yml, which re-runs it on every attempt) and by the read-only
# validation plays. Include it from a play whose hosts are the group's instances:
#
#   - ansible.builtin.include_tasks: tasks/nativeha-find-active.yml
#     vars: { nha_group: nha_ubuntu_a, nha_qm: "{{ qm_name }}" }
#
# Inputs:
#   nha_group          inventory group holding the instances (e.g. nha_ubuntu_a)
#   nha_qm             the Native HA queue manager name
#   nha_find_retries   leader-election wait, polls (default 30)
#   nha_find_delay     leader-election wait, seconds between polls (default 5)
# Output (broadcast to every host in the play): active_host — the inventory hostname of the
# instance dspmq reports ROLE(Active) right now.
#
# The result is a snapshot: raft can re-elect at any moment after it (#891). A caller that
# CHANGES the queue manager must not pin it across later tasks; it goes through
# nativeha-on-active.yml, which re-resolves the Active on every attempt.
#
# Parse the per-instance detail lines 'INSTANCE(<node>) ROLE(Active)', NOT the local summary
# line 'ROLE(Active) INSTANCE(<node>)': dspmq -x runs on the group's first instance, and its
# summary line reports only that instance's OWN role, whereas the detail lines list every
# instance from any node — so this resolves the Active whichever instance answers (#722).
# Only names that are members of nha_group count, so a stray INSTANCE() line can never
# become a delegation target.
#
# Fail loud (#1540): when the polls run out with no Active, the lookup fails HERE, naming the
# queue manager, the group, the poll count and dspmq's last rc/stdout/stderr — never one task
# later with a template error, and active_host is never recorded without an Active.
#
# The regex stays backslash-free ([(] not \(): `until` and `assert` conditionals apply
# string-escape processing that a template does not, so a backslash would silently change
# meaning in one place and not the other (#1514).
- name: "find the active Native HA instance of {{ nha_qm }} in {{ nha_group }}"
  ansible.builtin.command:
    argv: [su, "-", mqm, -c, "/opt/mqm/bin/dspmq -m {{ nha_qm }} -o nativeha -x"]
  register: _nha_dspmq
  changed_when: false
  # A non-zero dspmq (e.g. mid-restart) is not final, so no single poll fails the task: the
  # until below polls again. Ansible lets failed_when decide the final status even after the
  # polls run out, so this task never fails on its own; the assert straight after is the
  # verdict, and it fails loud with dspmq's last output.
  failed_when: false
  run_once: true
  delegate_to: "{{ groups[nha_group][0] }}"
  # Wait out leader election: the HA role starts the instances but returns before the group
  # elects an Active, and a re-election leaves a short window with none. Poll until one
  # appears. (#421)
  until: >-
    _nha_dspmq.stdout | default('')
    | regex_findall('INSTANCE[(]([^)]+)[)] ROLE[(]Active[)]')
    | select('in', groups[nha_group]) | list | length > 0
  retries: "{{ nha_find_retries | default(30) }}"
  delay: "{{ nha_find_delay | default(5) }}"

- name: "collect the {{ nha_group }} members dspmq reports Active for {{ nha_qm }}"
  ansible.builtin.set_fact:
    _nha_actives: >-
      {{ _nha_dspmq.stdout | default('')
         | regex_findall('INSTANCE[(]([^)]+)[)] ROLE[(]Active[)]')
         | select('in', groups[nha_group]) | list }}
  run_once: true

- name: "fail loud unless {{ nha_qm }} has an Active instance in {{ nha_group }}"
  ansible.builtin.assert:
    that: _nha_actives | length > 0
    fail_msg: >-
      No Active instance of {{ nha_qm }} in {{ nha_group }} after
      {{ (nha_find_retries | default(30) | int) + 1 }} polls,
      {{ nha_find_delay | default(5) }}s apart: `dspmq -m {{ nha_qm }} -o nativeha -x`
      on {{ groups[nha_group][0] }} never listed a member of {{ nha_group }} as Active.
      Last dspmq rc={{ _nha_dspmq.rc | default('n/a') }};
      stdout: {{ _nha_dspmq.stdout | default('') | trim | default('(empty)', true) }};
      stderr: {{ _nha_dspmq.stderr | default('') | trim | default('(empty)', true) }}
    quiet: true
  run_once: true

- name: "record the active instance of {{ nha_qm }} (broadcast to every host in the play)"
  ansible.builtin.set_fact:
    active_host: "{{ _nha_actives | first }}"
  run_once: true
