# RDQM 3+3 HA/DR (#288, Plan C). Provisions BOTH sites' HA groups: site A via the
# existing site-rdqm.yml (idempotent), then the site-B HA group on rdqm_b with the same
# roles. The DR replication link itself is established at QM-create time
# (crtmqm -rr p/s -rl/-ri/-rp, net-wan, port 7001) — IBM's 9.4 worked example puts the DR
# IPs on the command line, so no rdqm.ini DR stanza is needed here (rdqm.ini stays the
# per-site HA Node/HA_Replication shape). This playbook only has to make the site-B HA
# group exist so the DR secondary can be created on it.
#
# This also makes `mqlab obs instrument rdqm_dr` succeed on rdqm_b: rdqm-install configures
# the DVD dnf repo, without which dnf has no source for packages like unzip (#288).

- import_playbook: site-rdqm.yml

- hosts: rdqm_b
  become: true
  tasks:
    - name: acl package for unprivileged become
      ansible.builtin.dnf:
        name: acl

- hosts: rdqm_b
  roles: [rdqm-install]

# Stateless per-node mqweb on every site-B node's RDQMAPP — administers the local QM
# whenever DR cutover lands it here. Mirrors the site-A play in site-rdqm.yml.
- hosts: rdqm_b
  roles: [mqweb]

- hosts: rdqm_b
  vars:
    rdqm_site_nodes:
      - { name: rdqm-b1, hb: 172.16.2.41, data: 10.10.2.41 }
      - { name: rdqm-b2, hb: 172.16.2.42, data: 10.10.2.42 }
      - { name: rdqm-b3, hb: 172.16.2.43, data: 10.10.2.43 }
  roles: [rdqm-ha]
