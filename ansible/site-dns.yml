---
# DNS bring-up (#478, epic .github#21): serve the generated zones on the infra
# nodes, then point every guest's resolver at them. Run (by the provision phase)
# BEFORE the stack's own provision playbook, so the app-requester's runtime
# reverse lookups (#454) resolve from the outset instead of paying the ~10s
# getnameinfo tax. Zone artifacts are rendered by `mqlab dns render` immediately
# before this. The caller limits the run to the stack's VM set (members +
# commons, which carries the infra nodes).

# Cold-boot guard: a freshly-booted infra guest may not be SSH-ready when this
# play fires (mirrors site-pcmk.yml / site-distributed-shared.yml, #151).
- name: wait for the infra nodes to be SSH-ready (cold-boot guard)
  hosts: infra
  gather_facts: false
  tasks:
    - name: wait for connection
      ansible.builtin.wait_for_connection:
        timeout: 180

# The BIND9 install (package + /etc/bind/zones scaffolding) is BAKED into the
# infra-ubuntu2404 box (ansible/bake-infra.yml), so per-run we run ONLY bind-dns's
# configure half: the topology-rendered zone data and this node's
# named.conf.{options,local} (keyed by inventory_hostname). This is the #606
# strip — the baked install half does not re-run at bootstrap. (node-exporter + alloy
# are baked whole and re-run idempotently in the observe phase, observability.yml.)
- name: serve DNS on the infra nodes (baked box carries bind9; run only configure)
  hosts: infra
  become: true
  tasks:
    - name: BIND9 per-run configure (zones + per-host named.conf)
      ansible.builtin.include_role:
        name: bind-dns
        tasks_from: configure

- name: point every guest's resolver at the lab nameserver
  hosts: all
  roles: [host-resolver]
