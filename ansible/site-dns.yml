---
# DNS bring-up (#478, epic .github#21): serve the generated zones on the infra
# nodes, then point every guest's resolver at them. Run (by the provision phase)
# BEFORE the stack's own provision playbook, so the app-requester's runtime
# reverse lookups (#454) resolve from the outset instead of paying the ~10s
# getnameinfo tax. Zone artifacts are rendered by `mqlab dns render` immediately
# before this. The caller limits the run to the stack's VM set (members +
# commons, which carries the infra nodes).

# Cold-boot guard: a freshly-booted infra guest may not be SSH-ready when this
# play fires (mirrors site-pcmk.yml / site-distributed-shared.yml, #151).
- name: wait for the infra nodes to be SSH-ready (cold-boot guard)
  hosts: infra
  gather_facts: false
  tasks:
    - name: wait for connection
      ansible.builtin.wait_for_connection:
        timeout: 180

# Root-cause gate for the "Service is in unknown state" systemd-module transient
# (#890; earlier per-task guards #879/#881/#882/#435). A freshly-booted guest can still
# be finishing systemd boot when provisioning's first systemd-module call fires, so
# systemctl/D-Bus returns an indeterminate unit state and the call fails. This is the
# earliest all-hosts touch (site-dns runs first in the provision phase), and it precedes
# BOTH systemd-using plays below (bind-dns `state: started` on infra, host-resolver on
# all). Wait until systemd finished booting once per host; every later systemd call in
# the run then runs against a settled systemd. Boot-readiness only — an already-booted
# host passes immediately (idempotent).
- name: wait for systemd to finish booting before any systemd-module call (#890)
  hosts: all
  gather_facts: false
  become: true
  tasks:
    - name: wait for connection (guests may be freshly booted)
      ansible.builtin.wait_for_connection:
        timeout: 180
    # noqa command-instead-of-module: `systemctl is-system-running` is a system-state
    # QUERY with no ansible.builtin.systemd equivalent (the module acts on units); and
    # using the systemd module here would re-introduce the very D-Bus query this gate
    # exists to avoid. A raw query is the correct tool.
    - name: wait for systemd to reach a settled state  # noqa: command-instead-of-module
      ansible.builtin.command: systemctl is-system-running
      register: _systemd_state
      # 'running' = fully booted; 'degraded' = booted but a unit failed (still queryable,
      # so unit ops are safe). 'starting'/'initializing'/'maintenance' → keep waiting.
      until: _systemd_state.stdout in ['running', 'degraded']
      retries: 30
      delay: 5
      changed_when: false
      # Best-effort gate: is-system-running exits non-zero on 'degraded', and we never want
      # the readiness wait itself to hard-fail the run — a genuinely broken systemd surfaces
      # loudly at the real systemd tasks that follow.
      failed_when: false

    # apt auto-updates stall the cold provision (#1173). On a freshly-booted Ubuntu node
    # apt-daily-upgrade.timer fires within minutes and unattended-upgrade grabs the dpkg
    # lock (verified: unattended-upgrade holding /var/lib/dpkg/lock-frontend), so the
    # stack's later apt tasks block on the lock — a ~20-min silent stall. The lab boxes are
    # pinned/ephemeral and must NOT auto-update at boot (epic #70 §4.5), so — at this
    # earliest all-hosts touch — mask the timers (they never (re-)fire) and then wait out
    # any in-flight run before provisioning continues. Debian/Ubuntu only (RHEL uses dnf).
    - name: detect a Debian/Ubuntu guest (apt present)
      ansible.builtin.stat:
        path: /etc/debian_version
      register: _apt_debian
      changed_when: false
    - name: mask apt auto-update timers so they never fire on the pinned box (#1173)
      ansible.builtin.systemd:
        name: "{{ item }}"
        masked: true
      loop:
        - apt-daily.timer
        - apt-daily-upgrade.timer
      when: _apt_debian.stat.exists
    # noqa command-instead-of-module: `systemctl is-active` is a state QUERY (the systemd
    # module acts on units); matches the is-system-running gate above.
    - name: wait for the apt auto-update services to go idle (dpkg lock free) (#1173)  # noqa: command-instead-of-module
      # The timer already fired on boot, so its service (apt-daily-upgrade.service →
      # unattended-upgrade) may still hold the dpkg lock. `is-active` prints one state per
      # unit; wait until NEITHER is active. The `until` is the real gate (fail-loud after a
      # bounded ~10-min budget); failed_when:false keeps is-active's non-zero rc (which it
      # returns when a unit is not active — exactly our success) from tripping a task
      # failure. Not stopped/killed — a mid-dpkg kill would corrupt state; we let the
      # in-flight run finish and release the lock.
      ansible.builtin.command: systemctl is-active apt-daily.service apt-daily-upgrade.service
      register: _apt_svc
      # apt-daily* are oneshot units: they report 'activating' while running (not 'active'),
      # then 'inactive'/'failed' when done. Wait until NEITHER unit is in any busy state.
      until: (_apt_svc.stdout_lines | intersect(['active', 'activating', 'deactivating', 'reloading'])) | length == 0
      retries: 60
      delay: 10
      changed_when: false
      failed_when: false
      when: _apt_debian.stat.exists

# The BIND9 install (package + /etc/bind/zones scaffolding) is BAKED into the
# infra-ubuntu2404 box (ansible/bake-infra.yml), so per-run we run ONLY bind-dns's
# configure half: the topology-rendered zone data and this node's
# named.conf.{options,local} (keyed by inventory_hostname). This is the #606
# strip — the baked install half does not re-run at bootstrap. (node-exporter + alloy
# are baked whole and re-run idempotently in the observe phase, observability.yml.)
- name: serve DNS on the infra nodes (baked box carries bind9; run only configure)
  hosts: infra
  become: true
  tasks:
    - name: BIND9 per-run configure (zones + per-host named.conf)
      ansible.builtin.include_role:
        name: bind-dns
        tasks_from: configure

- name: point every guest's resolver at the lab nameserver
  hosts: all
  roles: [host-resolver]
