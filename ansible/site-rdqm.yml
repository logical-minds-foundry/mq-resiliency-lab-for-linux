# One full-HADR provision for the rdqm-rhel stack (#350 Task 2). Composed from
# building blocks (move, don't rewrite):
#   1. _rdqm-cluster-ha.yml      — live site A 3-node RDQM HA group
#   2. _rdqm-dr-replication.yml  — standby site B 3-node group (DR receiver)
#   3. (folded qm-create)        — the replicated QM (DR link at crtmqm time)
#   4. site-distributed-shared.yml — the SVC counterparty QM + inter-QM channels
#                                    + the reconnect-aware app requester
#
# This supersedes the former site-rdqm.yml (site-A HA only) + site-rdqm-dr.yml
# (HA+DR) + site-rdqm-distributed.yml: the canonical stack is full HADR +
# distributed. Both sites' HA groups exist before qm-create so the DR secondary
# has a peer group to land on (#288).
#
# Provision-phase var contract (#350): the bootstrap `provision` phase passes the
# #351 QM extra-vars (qm_app / qm_svc / chl_to_svc / chl_to_app). The fixed
# lab-topology values (the data-plane VIP and the SVC CONNAME) are lab constants
# supplied below — matching topology.yaml's rdqm-rhel qm: block — so the phase
# stays pure and setup_dict (the #356 regression) is never referenced.
- import_playbook: _rdqm-cluster-ha.yml
- import_playbook: _rdqm-dr-replication.yml

# Secure the RDQM HA + DR replication links with TLS (#545) — the last
# optional-plaintext MQ path. Runs on every node of both HA groups AFTER the groups
# are formed (drbd-utils, which ships tlshd, is installed) and BEFORE qm-create,
# because the certs + tlshd service must be up before crtmqm -re opens a DRBD TLS
# handshake. Per IBM "Secure replication for DR/HA RDQM".
- name: secure RDQM replication links with TLS (certs + tlshd)
  hosts: rdqm_a:rdqm_b
  gather_facts: false
  roles:
    - rdqm-replication-tls

# Folded qm-create (#350 Task 2 step 2): the replicated queue manager + its
# inter-QM MQSC. Was the separate rdqm-qm-create.sh (`mqlab qm create`); now runs
# inside provision so a cold bootstrap is one pass. The script keeps the
# verified RDQM create order (secondaries before primary; site A primary -rr p,
# site B secondary -rr s) and auto-detects the formed site-B group for HA/DR — it
# is moved (invoked), not rewritten. Contract: QM VIP SVC_CONN (matches the old
# `mqlab qm create` _qm_script call).
- name: replicated queue manager + inter-QM MQSC (folded qm-create)
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    qm_name: "{{ qm_app }}"
    qm_vip: 10.10.1.100
    svc_conn: "svc-sim-ext.service.com"
  tasks:
    - name: create the RDQM queue manager (verified create order; DR auto-detect)
      ansible.builtin.command:
        cmd: >-
          bash {{ playbook_dir }}/../lab/scripts/rdqm-qm-create.sh
          {{ qm_name }} {{ qm_vip }} {{ svc_conn }} {{ qm_svc }} {{ svc_req_queue }}
      changed_when: true

# Remove the temporary mqm SSH + sudo access now the QMs are created (#560): the
# enable -> create -> remove lifecycle, so the coordinated-create access is not
# standing infrastructure (IBM's removable guidance).
- name: remove the temporary mqm SSH access (post-create)
  hosts: rdqm_a:rdqm_b
  become: true
  gather_facts: false
  tasks:
    - name: strip mqm SSH key material + sudo grant
      ansible.builtin.include_role:
        name: rdqm-ssh-access
        tasks_from: remove

# Reconcile the RDQM replication after the coordinated create (#559). On a COLD create the
# site-B HA group comes up in DRBD split-brain: a secondary boots with a divergent generation
# UUID, so the handshake asks the b1 Primary to become SyncTarget ("I shall become SyncTarget,
# but I am primary!"), the cluster-wide state change aborts, the group never reaches UpToDate,
# and — because HA never goes healthy — the stacked DR resource (<qm>.dr) is never brought up,
# leaving DR "Remote unavailable". The divergence is almost certainly the RDQM cold-create bug
# tracked for the IBM report (#563); this step is the mechanized work-around that makes a cold
# rebuild come up green, and it logs loudly (HEAL/DR-UP lines naming #559) rather than hiding it.
# SAFE BY CONSTRUCTION: it runs immediately post-create, when the secondaries hold only fresh,
# disposable data, and it only ever discards on a *Secondary* whose disk is not UpToDate — never
# the Primary's authoritative copy. Idempotent: a healthy group (site A, or a re-provision) is a
# no-op. Verified live 2026-07-11 (the manual form of these exact steps took a stuck cold rebuild
# to HA Normal + DR Normal on both sites).
- name: reconcile RDQM replication after the coordinated create (heal cold-create split-brain + bring up DR) (#559)
  hosts: rdqm_a:rdqm_b
  become: true
  gather_facts: false
  vars:
    qm_res: "{{ qm_app | lower }}"
  tasks:
    - name: "heal any non-UpToDate HA secondary — discard local + resync from the Primary (#559)"
      ansible.builtin.shell: |
        set -uo pipefail
        RES="{{ qm_res }}"
        role=$(drbdadm role "$RES" 2>/dev/null | head -1 || true)
        disk=$(drbdadm dstate "$RES" 2>/dev/null | cut -d/ -f1 || true)
        # SAFETY: only ever heal a Secondary; NEVER discard the Primary's authoritative data.
        [ "$role" = "Secondary" ] || { echo "SKIP $RES: role=$role (only secondaries are healed)"; exit 0; }
        [ "$disk" != "UpToDate" ] || { echo "SKIP $RES: secondary already UpToDate"; exit 0; }
        echo "HEAL $RES (#559 cold-create split-brain): secondary disk=$disk -> discard local, resync from Primary"
        drbdadm disconnect "$RES" || true
        drbdadm connect --discard-my-data "$RES" || true
        sleep 3
        disk=$(drbdadm dstate "$RES" 2>/dev/null | cut -d/ -f1 || true)
        # Inconsistent == resync in progress (good). Any other non-UpToDate state is still
        # stuck (e.g. Outdated where a peer's split-brain blocked the cluster-wide change) -> force it.
        case "$disk" in
          UpToDate|Inconsistent) : ;;
          *) echo "HEAL $RES: still $disk after reconnect -> invalidate to force resync"; drbdadm invalidate "$RES" ;;
        esac
      args:
        executable: /bin/bash
      register: rdqm_ha_heal
      changed_when: "'HEAL ' in rdqm_ha_heal.stdout"

    - name: "bring up the stacked DR resource if the split-brain left it down (#559)"
      ansible.builtin.shell: |
        set -uo pipefail
        RES="{{ qm_res }}.dr"
        [ -f "/etc/drbd.d/$RES.res" ] || { echo "SKIP $RES: not configured on this node"; exit 0; }
        # The stacked DR resource lives on the HA *Primary* only (the config file is present on
        # every site node, but it can only be brought up where the base resource is Primary).
        base_role=$(drbdadm role "{{ qm_res }}" 2>/dev/null | head -1 || true)
        [ "$base_role" = "Primary" ] || { echo "SKIP $RES: not the HA primary here (role=$base_role)"; exit 0; }
        drbdadm status "$RES" >/dev/null 2>&1 && { echo "SKIP $RES: DR resource already up"; exit 0; }
        echo "DR-UP $RES (#559): DR resource configured but down -> bringing up"
        # Retry: the DR up needs the HA cluster state to have settled after the heal above.
        for _ in $(seq 1 12); do
          drbdadm up "$RES" 2>/dev/null || true
          if drbdadm status "$RES" >/dev/null 2>&1; then echo "DR-UP $RES: up"; exit 0; fi
          sleep 5
        done
        echo "DR-UP $RES: FAILED to bring up after retries" >&2
        exit 1
      args:
        executable: /bin/bash
      register: rdqm_dr_up
      # Only the bring-up path emits "DR-UP"; both SKIP paths do not -> a healthy/re-provision run is unchanged.
      changed_when: "'DR-UP' in rdqm_dr_up.stdout"

    - name: "wait until HA + DR replication are healthy (fail loud; never leave a silent split-brain) (#559)"
      ansible.builtin.shell: |
        set -uo pipefail
        RES="{{ qm_res }}"
        role=$(drbdadm role "$RES" 2>/dev/null | head -1 || true)
        disk=$(drbdadm dstate "$RES" 2>/dev/null | cut -d/ -f1 || true)
        # Every node gates its own HA disk reaching UpToDate.
        [ "$disk" = "UpToDate" ] || { echo "HA $RES disk=$disk (not yet UpToDate)"; exit 1; }
        # The HA-primary additionally gates the DR LINK actually connecting/syncing — not just
        # the DR resource being loaded. A resource that is up but stuck 'Connecting' (peer side
        # down) would otherwise pass this gate and leave DR silently 'Remote unavailable' (#591).
        if [ "$role" = "Primary" ] && [ -f "/etc/drbd.d/$RES.dr.res" ]; then
          drbdadm status "$RES.dr" >/dev/null 2>&1 || { echo "DR $RES.dr not up"; exit 1; }
          drc=$(drbdadm cstate "$RES.dr" 2>/dev/null | head -1 || true)
          case "$drc" in
            Connected|SyncSource|SyncTarget|PausedSync*|Verify*) : ;;  # connected or actively (re)syncing
            *) echo "DR $RES.dr connection=$drc (not connected — peer DR resource down?)"; exit 1 ;;
          esac
        fi
        echo "OK $RES: HA UpToDate (role $role)"
      args:
        executable: /bin/bash
      register: rdqm_repl_ready
      changed_when: false
      until: rdqm_repl_ready.rc == 0
      retries: 60
      delay: 10

# Restore per-QM JSON diagnostic logging for the RDQM app QM (#569, follow-up to #562).
# #562 stops seeding the DiagnosticMessagesTemplate on RDQM (its `crtmqm -sx` rejects the
# template as a same-named ClusterSyslog conflict, AMQ7059E), so RDQMAPP no longer inherits
# a qm.ini DiagnosticMessages stanza — its OWN AMQERR events, including the HA/CRR/DR
# state-change messages that are the whole point of #282 for an HA/DR arm, would miss JSON
# syslog. Restore it the "direct qm.ini" way #282 dropped for the template arms: write the
# stanza straight into the QM's qm.ini and bounce the QM so it takes effect. Runs on the
# site-A primary (the qm.ini lives on the DRBD volume, mounted there) AFTER qm-create and
# BEFORE the app/partner connect. Ordered before rdqm-app-tls so the QM's one restart
# happens before TLS's runtime REFRESH SECURITY, not after it.
- name: restore per-QM JSON diagnostic logging for the RDQM app QM (#569, fixed by #581)
  hosts: rdqm_a
  gather_facts: false
  vars:
    qm_name: "{{ qm_app }}"
    # Name of the handler below — mq-diag-logging/qmini notifies it on a real stanza change.
    mq_diag_qmini_notify: bounce RDQMAPP for the qm.ini diagnostic change
  handlers:
    # A qm.ini DiagnosticMessages change only takes effect on QM start, so bounce RDQMAPP —
    # but only when the stanza was actually written (a re-provision leaves it in place and
    # skips the disruption; the handler fires on change, not every run). endmqm/strmqm are
    # the RDQM/Pacemaker-aware managed commands (mqm is in haclient, per rdqm-install), so
    # this is a clean admin restart, not a failover. Chained in one shell: if endmqm errors,
    # strmqm never runs and the handler fails loud rather than leaving the QM half-restarted.
    - name: bounce RDQMAPP for the qm.ini diagnostic change
      ansible.builtin.shell: "su mqm -c '/opt/mqm/bin/endmqm -w {{ qm_name }} && /opt/mqm/bin/strmqm {{ qm_name }}'"
      become: true
      changed_when: true
  tasks:
    # RDQM runs the QM on exactly one node (the HA primary) and that node floats across
    # rdqm_a — so the qm.ini edit must target the active node and its replicated DataPath,
    # NOT a fixed rdqm-a1 or the non-existent /var/mqm/qmgrs/<QM> (#581, which is why the
    # #569 stanza silently never landed). Resolve the active node + DataPath first;
    # `when: rdqm_is_active` (unlike run_once) propagates through include_role.
    - name: resolve the active RDQM node + its DataPath
      ansible.builtin.include_role:
        name: rdqm-active-node
      vars:
        rdqm_qm: "{{ qm_app }}"

    - name: seed the per-QM DiagnosticMessages stanza in RDQMAPP's qm.ini (active node)
      ansible.builtin.include_role:
        name: mq-diag-logging
        tasks_from: qmini
      vars:
        # The QM's real qm.ini lives under its DataPath on the DRBD volume; the edit
        # replicates via DRBD, mirroring the rdqm-app-tls keystore placement.
        mq_qmini_path: "{{ rdqm_datapath }}/qm.ini"
      when: rdqm_is_active

# TLS-enable the app QM (#410, #426): wire its lab-pki keystore and secure the
# app-facing channels (APP.SVRCONN, MON.SVRCONN, inter-QM SDR/RCVR) to parity with
# the pcmk/nativeha arms. Runs on the active site-A node AFTER qm-create (the QM + its
# base/inter-QM objects exist) and BEFORE site-distributed-shared, so RDQMAPP is
# already TLS-ready when the SVC counterparty (which pins our app-org cert) and the
# app requester connect. The RDQM-internal DRBD replication link is out of scope --
# its channel TLS is a v10 feature, tracked as a version-gated exception in #412.
- name: TLS-enable the RDQM app QM (keystore + channel SSLCIPH)
  hosts: rdqm_a
  gather_facts: false
  vars:
    qm_name: "{{ qm_app }}"
  tasks:
    # The QM's active node floats across rdqm_a and may have moved since qm-create (the
    # #569 diagnostic bounce above restarts it), so re-resolve it here. The keystore +
    # SSLKEYR go under the QM's replicated DataPath so they follow it across HA/DR moves
    # — NOT /var/mqm/qmgrs/<QM>, which does not exist on RDQM (#581). `when: rdqm_is_active`
    # (unlike run_once) propagates through include_role, so the role runs on the one
    # active node and its keystore then replicates via DRBD.
    - name: resolve the active RDQM node + its DataPath
      ansible.builtin.include_role:
        name: rdqm-active-node
      vars:
        rdqm_qm: "{{ qm_app }}"

    - name: TLS-enable the app QM on the active node (keystore replicates via DRBD)
      ansible.builtin.include_role:
        name: rdqm-app-tls
      # rdqm_datapath is a fact set by rdqm-active-node on the active host; the role
      # reads it directly. (Do NOT re-pass it as `vars: {rdqm_datapath: "{{ rdqm_datapath }}"}`
      # — a var defined in terms of itself is a recursive-template loop.)
      when: rdqm_is_active

- import_playbook: site-distributed-shared.yml
  vars:
    our_qm: "{{ qm_app }}"
    # RDQM spends its one floating IP on the data VIP (the app's HA path), so the
    # partner QM cannot reach us at a single net-ext VIP. Instead the SVC QM's SDR to us
    # carries a CONNAME list of the three rdqm_a net-ext node IPs: MQ tries them in
    # order and reconnects to whichever node currently runs the app QM, so the partner
    # link rides an HA failover without a second floating IP (#216 spike).
    our_conn: "rdqm-a1-ext.client.com(1414),rdqm-a2-ext.client.com(1414),rdqm-a3-ext.client.com(1414)"
    # The app host reaches the app QM on its one data VIP. APP.SVRCONN is now mutual
    # TLS on this arm (rdqm-app-tls role above, #410/#426) -> app_tls true, matching
    # pcmk/nativeha; the app-client keystore is already placed by mq-client. (#429)
    app_conn: "rdqm-vip-a.client.com(1414)"
    app_tls: true
