# The RDQM arm (Phase C), site-A 3-node HA group. Site B (rdqm_b) is the
# cross-site DR peer — it belongs to Plan C (RDQM 3+3 DR) and is provisioned by a
# future ansible/site-rdqm-dr.yml that imports this play set and adds the rdqm_b
# group + rdqmdr replication. Keeping this play set site-A-only means rdqm_ha and
# the distributed setup provision cleanly without an unreachable, uncreated site B.
- hosts: rdqm_a
  become: true
  tasks:
    - name: acl package for unprivileged become
      ansible.builtin.dnf:
        name: acl

- hosts: rdqm_a
  roles: [rdqm-install]

# REST on every node's QMRDQM (design §1). Stateless per-node mqweb (spec §8.3),
# set up at provision where mqweb_admin_password is injected; administers the local
# QM whenever RDQM lands it here. Mirrors the pcmk arm's site-pcmk.yml.
- hosts: rdqm_a
  roles: [mqweb]

- hosts: rdqm_a
  vars:
    rdqm_site_nodes:
      - { name: rdqm-a1, hb: 172.16.1.31, data: 10.10.1.31 }
      - { name: rdqm-a2, hb: 172.16.1.32, data: 10.10.1.32 }
      - { name: rdqm-a3, hb: 172.16.1.33, data: 10.10.1.33 }
  roles: [rdqm-ha]
