# One full-HADR provision for the nativeha-ubuntu stack (#417, Phase 2 of #246).
# The Debian peer of site-nativeha.yml — same compositional template, same order
# (live HA → our-side MQSC on the active instance → distributed SVC counterparty →
# DR/CRR last so NHAUAPP already holds the app/SVC objects the Recovery group
# inherits by CRR, the #267 keystone). Only the host group (nha_ubuntu_a), the
# active-instance hostnames, and the our-side CONNAME list (this arm's own net-ext
# IPs) differ; the MQSC body and the shared building blocks are identical.
#
# Provision-phase var contract (#350/#351/#446): the bootstrap `provision` phase passes
# qm_app (=NHAUAPP) / qm_svc (=SVCQM, shared) / chl_to_svc / chl_to_app / svc_req_queue
# (=NHAU.SVC.REQUEST). Native HA has no floating VIP, so the SVC CONNAME and our-side
# CONNAME list are lab constants here.

# Fast-fail reachability gate (#765). From a fully torn-down lab the generous
# connect tolerance (ConnectTimeout=60 x ssh retries=3 ~= 180s, #590) is paid IN
# FULL by every task that touches a host which was never provisioned — the
# delegated "find the active Native HA instance" poll below burns minutes only to
# conclude UNREACHABLE, and its until/retries leader-election wait (#421) never
# even engages because the connection never succeeds. That tolerance is correct
# for a LIVE-but-CPU/IO-starved node (slow SSH banner exchange) and the poll for
# leader election; it is pure dead time on a cold start. A short-timeout TCP probe
# of the active-instance host's port 22 cleanly separates the two cases: a
# torn-down host fails the TCP connect in seconds, whereas a live-but-busy host has
# sshd LISTENING (only the post-connect banner exchange is slow) and passes.
# connection: local makes this a plain socket connect from the control node — NOT
# an SSH connect subject to ConnectTimeout — and any_errors_fatal aborts the whole
# provision up front instead of marching the cluster-ha import into the same
# multi-minute hang. Scoped strictly to the initial "is anything up?" decision; the
# 60s tolerance and the until poll are untouched for the live path.
- name: preflight — fail fast if the nativeha-ubuntu stack is not up (#765)
  hosts: localhost
  connection: local
  gather_facts: false
  any_errors_fatal: true
  tasks:
    - name: probe the active Native HA instance host on SSH (short timeout)
      ansible.builtin.wait_for:
        host: "{{ hostvars[groups['nha_ubuntu_a'][0]].ansible_host | default(groups['nha_ubuntu_a'][0]) }}"
        port: "{{ hostvars[groups['nha_ubuntu_a'][0]].ansible_port | default(22) }}"
        timeout: 5
        msg: >-
          nativeha-ubuntu is not up: the active-instance host
          {{ groups['nha_ubuntu_a'][0] }} is unreachable on SSH within 5s. Bring the
          lab up first (mqlab bootstrap nativeha-ubuntu) before provisioning —
          failing fast instead of paying the full ~180s SSH connect-timeout budget
          on a torn-down lab (#765).

- import_playbook: _nativeha-ubuntu-cluster-ha.yml

# Stage 2 authorization (#74/#619): the OAM service principals (mqapp/mqmon/mqsvc)
# must exist on EVERY nativeha-ubuntu node BEFORE any setmqaut grant, and on both the
# HA site (nha_ubuntu_a) AND the DR site (nha_ubuntu_b) so authorization survives an
# instance failover AND a CRR/GroupRole cutover — the substrate-consistency invariant
# (spec §6). Arm-agnostic: same accounts role + authz.yml as the pcmk arm; only the
# node lists change. Native HA replicates the QM's authority records via raft, but the
# OS principals the records resolve against are node-local, so every node needs them.
- name: authz service accounts on every nativeha-ubuntu node (HA + DR)
  # Under `bootstrap --no-dr` (#188) site-B is not brought up, so drop nha_ubuntu_b
  # from the pattern — else this play targets absent DR guests and fails UNREACHABLE.
  # Default (dr_enabled unset → true) keeps the full HA+DR host set unchanged.
  hosts: "nha_ubuntu_a{{ ':nha_ubuntu_b' if (dr_enabled | default(true) | bool) else '' }}"
  become: true
  # `authz` tag (#235): lets the Stage-2 authorization be (re)applied on an
  # already-provisioned arm via `--tags authz`, without a full arm re-provision.
  # Tags are inert on a default (untagged) run, so this changes nothing for the
  # normal provision path. The tagged set below is self-contained: accounts here,
  # then active-instance discovery + the CHLAUTH/setmqaut tasks in the qm play.
  tags: [authz]
  roles: [mq-authz-accounts]

# Folded qm-create: our-side inter-QM + app MQSC on the ACTIVE Native HA instance.
# runmqsc must run on the active instance; Native HA replicates the objects to all
# instances via raft. Body identical to the RHEL arm — only the active-instance
# hostname pattern (nha-ubuntu-a) differs.
- hosts: nha_ubuntu_a
  become: true
  vars:
    qm_name: "{{ qm_app }}"
    qm_svc_name: "{{ qm_svc }}"
    svc_conn: "svc-sim-ext.service.com"
  tasks:
    # Every QM change below goes through tasks/nativeha-on-active.yml (#891): runmqsc and
    # setmqaut only work on the ACTIVE instance (a Replica rejects them, AMQ8478E), and raft
    # can re-elect between finding the Active and applying. So the Active is re-resolved on
    # every attempt and a leadership move is followed, never pinned; the AMQ8146E readiness
    # retry (#435/#888) is kept inside the same bounded loop, which fails loud when spent.
    # Native HA then raft-replicates the objects to every instance.
    - name: apply our-side + app MQSC on the active instance (once; raft-replicated)
      ansible.builtin.include_tasks: tasks/nativeha-on-active.yml
      vars:
        nha_group: nha_ubuntu_a
        nha_qm: "{{ qm_name }}"
        nha_label: our-side + app MQSC
        nha_steps:
          - label: runmqsc our-side + app MQSC
            cmd: /opt/mqm/bin/runmqsc {{ qm_name }}
            # rc 10 = warnings (e.g. START LISTENER/CHANNEL already running): a re-provision
            # no-op, accepted as before.
            ok_rcs: [0, 10]
            stdin: |
              DEFINE LISTENER(L1414) TRPTYPE(TCP) PORT(1414) CONTROL(QMGR) REPLACE
              START LISTENER(L1414)
              DEFINE CHANNEL(APP.SVRCONN) CHLTYPE(SVRCONN) TRPTYPE(TCP) MCAUSER('mqm') SSLCIPH({{ tls_cipher }}) SSLCAUTH(REQUIRED) SSLPEER('{{ tls_peer_client }}') HBINT(15) KAINT(15) REPLACE
              DEFINE CHANNEL(MON.SVRCONN) CHLTYPE(SVRCONN) TRPTYPE(TCP) MCAUSER('mqm') SSLCIPH({{ tls_cipher }}) SSLCAUTH(REQUIRED) SSLPEER('{{ tls_peer_client }}') REPLACE
              ALTER QMGR CHLAUTH(DISABLED) CONNAUTH(' ') CERTLABL('{{ qm_name }}') MONQ(HIGH) MONCHL(HIGH) MONACLS(HIGH) STATMQI(ON) STATQ(ON) STATCHL(HIGH) MAXHANDS(512)
              REFRESH SECURITY TYPE(CONNAUTH)
              DEFINE QLOCAL(APP.REPLY) DEFPSIST(YES) REPLACE
              DEFINE QREMOTE(SVC.REQUEST) RNAME({{ svc_req_queue }}) RQMNAME({{ qm_svc_name }}) XMITQ({{ qm_svc_name }}) REPLACE
              DEFINE QLOCAL({{ qm_svc_name }}) USAGE(XMITQ) TRIGGER TRIGTYPE(FIRST) INITQ(SYSTEM.CHANNEL.INITQ) TRIGDATA({{ qm_name }}.{{ qm_svc_name }}) REPLACE
              DEFINE CHANNEL({{ qm_name }}.{{ qm_svc_name }}) CHLTYPE(SDR) TRPTYPE(TCP) CONNAME('{{ svc_conn }}(1414)') XMITQ({{ qm_svc_name }}) SSLCIPH({{ tls_cipher }}) SSLPEER('{{ tls_peer_svc }}') SHORTRTY(10) SHORTTMR(5) LONGRTY(999999999) LONGTMR(20) REPLACE
              DEFINE CHANNEL({{ qm_svc_name }}.{{ qm_name }}) CHLTYPE(RCVR) TRPTYPE(TCP) SSLCIPH({{ tls_cipher }}) SSLCAUTH(REQUIRED) SSLPEER('{{ tls_peer_svc }}') REPLACE
              START CHANNEL({{ qm_name }}.{{ qm_svc_name }})

    # Stage 2 authorization (#74/#619): applied AFTER the base + inter-QM MQSC above so
    # the deny-all back-stop + SSLPEERMAP maps reference channels that already exist.
    # Reuses the ARM-AGNOSTIC authz.mqsc.j2 (CHLAUTH ENABLE + deny-all + SSLPEERMAP) and
    # group_vars/all/authz.yml (accounts/maps/grants) verbatim from the pcmk arm — only
    # chl_to_app (=SVCQM.NHAUAPP, this arm's inter-QM RCVR, the qm_svc.qm_app channel of
    # the base MQSC) and the node lists differ. Runs ONCE on the active instance; Native
    # HA raft-replicates the QM object catalog — CHLAUTH rules AND the OAM authority
    # records — to every instance, so the posture follows an HA failover. CONNAUTH stays
    # disabled (the cert is the credential); the base MQSC's transient CHLAUTH(DISABLED)
    # is flipped to ENABLED here, atomically, before any real client connects.
    #
    # The whole posture is ONE leadership-following unit (#891): the authz MQSC, then the
    # setmqaut grants (#74: the minimal least-privilege OAM surface, one invocation per
    # grant; -t qmgr grants omit -n; mirrors the pcmk role's grant loop, driven by the same
    # authz_grants), then REFRESH SECURITY. A leadership move anywhere in it re-applies the
    # whole unit on the new Active — every step is idempotent. The MQSC is rendered on the
    # controller and fed to runmqsc on stdin, so no file is left pinned to one instance.
    - name: compose the setmqaut grant steps (one per authz_grants entry)
      tags: [authz]
      ansible.builtin.set_fact:
        _authz_grant_steps: >-
          {{ _authz_grant_steps | default([]) + [{
               'label': 'setmqaut ' ~ item.group ~ ' -> ' ~ item.object_type ~ ' ' ~ item.object,
               'cmd': '/opt/mqm/bin/setmqaut -m ' ~ qm_name
                      ~ ((' -n ' ~ item.object) if item.object_type != 'qmgr' else '')
                      ~ ' -t ' ~ item.object_type ~ ' -g ' ~ item.group ~ ' ' ~ item.authorities }] }}
      loop: "{{ authz_grants }}"
      loop_control: { label: "{{ item.group }} -> {{ item.object_type }} {{ item.object }}" }
      run_once: true

    - name: apply the authorization posture (CHLAUTH + maps, setmqaut grants, REFRESH SECURITY)
      tags: [authz]
      ansible.builtin.include_tasks:
        file: tasks/nativeha-on-active.yml
        apply: { tags: [authz] }
      vars:
        nha_group: nha_ubuntu_a
        nha_qm: "{{ qm_name }}"
        nha_label: authorization posture
        nha_steps: >-
          {{ [{'label': 'runmqsc authz MQSC (flip CHLAUTH ENABLED + back-stop + SSLPEERMAP)',
               'cmd': '/opt/mqm/bin/runmqsc ' ~ qm_name,
               'ok_rcs': [0, 10],
               'stdin': lookup('ansible.builtin.template',
                               playbook_dir ~ '/roles/mq-pcmk-qmgr/templates/authz.mqsc.j2')}]
             + _authz_grant_steps
             + [{'label': 'runmqsc REFRESH SECURITY TYPE(AUTHSERV)',
                 'cmd': '/opt/mqm/bin/runmqsc ' ~ qm_name,
                 'stdin': 'REFRESH SECURITY TYPE(AUTHSERV)'}] }}

    # Enable classes + define/start the collector on the ACTIVE instance; Native HA
    # replicates the SERVICE/QMGR objects to all instances via raft. Leadership-following
    # like the applies above (#891): the role is retried on the re-detected Active.
    - name: event monitoring — enable classes + define/start collector (active, once) (#114)
      ansible.builtin.include_tasks: tasks/nativeha-on-active.yml
      vars:
        nha_group: nha_ubuntu_a
        nha_qm: "{{ qm_name }}"
        nha_label: event monitoring
        nha_event_monitor: true

# HA-site (Live group) TLS keystore — apply it here ONLY when the DR half is skipped
# (`bootstrap --no-dr`, dr_enabled=false). Site-A TLS is otherwise deployed inside
# _nativeha-ubuntu-dr-replication.yml (step 2, both groups), which --no-dr skips
# wholesale — so without this, NHAUAPP comes up with TLS channels (APP/MON.SVRCONN,
# SSLCAUTH REQUIRED, CERTLABL) but no key repository: every handshake fails AMQ9660E,
# the mutual-TLS app requester below and the client-mode exporter (observe phase)
# cannot connect, and no metrics flow (#1011). Placed BEFORE site-distributed-shared
# so the keystore exists before the app requester connects over TLS. The full-HADR
# path is unchanged: when dr_enabled is true this is a no-op and the DR playbook
# applies TLS to both groups as before.
- import_playbook: site-nativeha-ubuntu-tls.yml
  when: not (dr_enabled | default(true) | bool)

- import_playbook: site-distributed-shared.yml
  vars:
    our_qm: "{{ qm_app }}"
    # This arm's own site-A net-ext IPs (the active instance answers on whichever
    # of the three holds the QM) — NOT another arm's range.
    our_conn: "nha-ubuntu-a1-ext.client.com(1414),nha-ubuntu-a2-ext.client.com(1414),nha-ubuntu-a3-ext.client.com(1414)"
    # The app host reaches the app QM on the data plane; Native HA has no VIP, so it
    # lists the site-A instances. APP.SVRCONN is mutual-TLS here (matches pcmk), so
    # the app requester connects over TLS -> app_tls true. (#411)
    app_conn: "nha-ubuntu-a1-data-a.client.com(1414),nha-ubuntu-a2-data-a.client.com(1414),nha-ubuntu-a3-data-a.client.com(1414)"
    app_tls: true
    # This stack is Native HA: the bench-client role renders the Native-HA-only
    # mq-bench wrapper for it (non-Native-HA stacks leave the wrapper alone). (#1380)
    app_qm_nativeha: true

# Skip the DR (CRR) replication half entirely under `bootstrap --no-dr` (#188): with
# no site-B up there is nothing to replicate to. Default (dr_enabled unset → true) runs
# it, so the full HADR provision is unchanged.
- import_playbook: _nativeha-ubuntu-dr-replication.yml
  when: dr_enabled | default(true) | bool
