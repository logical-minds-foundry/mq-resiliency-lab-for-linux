- hosts: standalone
  become: true
  tasks:
    # setfacl is how Ansible hands temp files to an unprivileged become_user
    # (vagrant -> mqm); without it the chmod-ACL fallback fails.
    - name: acl package for unprivileged become
      ansible.builtin.apt:
        name: acl
        update_cache: false

- hosts: qm:dtcc
  roles: [mq-install]

- hosts: client
  roles: [mq-client]

- hosts: qm
  vars: { qmgr_name: QMAIN }
  roles: [mq-qmgr]

- hosts: dtcc
  vars: { qmgr_name: QDTCC }
  roles: [mq-qmgr]

# Trade-path clients: pymqi venv + the EPN scripts (responder runs on
# dtcc-sim in bindings mode; requester on app-client in client mode).
- hosts: dtcc:client
  tasks:
    - name: pymqi venv
      ansible.builtin.shell: |
        set -e
        python3 -m venv /home/vagrant/mqvenv
        /home/vagrant/mqvenv/bin/pip install pymqi
      args:
        creates: /home/vagrant/mqvenv/bin/python

    - name: deploy EPN codec + clients
      ansible.builtin.copy:
        src: "{{ item.src }}"
        dest: "/home/vagrant/{{ item.dest }}"
      loop:
        - { src: "{{ playbook_dir }}/../src/mqlab/epn.py", dest: epn.py }
        - { src: "{{ playbook_dir }}/../clients/epn_requester.py", dest: epn_requester.py }
        - { src: "{{ playbook_dir }}/../clients/epn_responder.py", dest: epn_responder.py }
        - { src: "{{ playbook_dir }}/../clients/dr_mqi.py", dest: dr_mqi.py }
        - { src: "{{ playbook_dir }}/../clients/dr_flow.py", dest: dr_flow.py }
        - { src: "{{ playbook_dir }}/../clients/dr_responder.py", dest: dr_responder.py }

    # The DR clients import the pure mqlab.dr core (ledger + wire) and mqlab.epn.
    # mqlab/__init__.py is empty (no deps), so shipping the source tree to ~/mqlab
    # makes `import mqlab.dr...` resolve via sys.path[0] — no pip install / no
    # pulling pymqrest/ansible onto the node.
    - name: deploy mqlab package tree for the DR clients
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../src/mqlab/"
        dest: /home/vagrant/mqlab/

    # Client HA requirement #7: a blocking MQI call (esp. MQPUT) to a *fenced*
    # node must detect the dead peer fast and trigger reconnect. Default
    # detection is tied to HBINT (~300s), so a blocked put hangs for minutes.
    # TCP KeepAlive on the client socket + a short OS keepalive interval cut
    # that to ~30s. (Channel-side HBINT/KAINT are set in pcmk-qm-create.sh.)
    - name: client TCP KeepAlive in mqclient.ini (fast dead-peer detection)
      become: true
      ansible.builtin.blockinfile:
        path: /var/mqm/mqclient.ini
        create: true
        owner: mqm
        group: mqm
        marker: "# {mark} DR-HA TCP KEEPALIVE"
        block: |
          TCP:
             KeepAlive=Yes

    - name: short OS TCP keepalive so a blocked call detects a fenced peer
      become: true
      ansible.builtin.copy:
        dest: /etc/sysctl.d/99-mq-keepalive.conf
        content: |
          # DR-HA: detect a fenced MQ peer in ~30s, not the ~15min TCP default.
          net.ipv4.tcp_keepalive_time = 15
          net.ipv4.tcp_keepalive_intvl = 5
          net.ipv4.tcp_keepalive_probes = 3
      register: mq_keepalive_sysctl

    - name: apply the keepalive sysctl drop-in
      become: true
      ansible.builtin.command: sysctl -p /etc/sysctl.d/99-mq-keepalive.conf
      when: mq_keepalive_sysctl.changed
