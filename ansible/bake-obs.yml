---
# Bake the obs box image (#602, epic .github#70 Task 1; log-search tier
# folded in by the consolidation, epic .github#267).
#
# ADDITIVE FOUNDATION: installs only the image-bakeable software for the unified
# observability box — the Grafana/Prometheus/Loki metrics stack, the log-search stack
# (OpenSearch/Dashboards/Data Prepper, folded in for #267), the fleet agents' binaries,
# and the (slow, cgo) mq_prometheus exporter build. It
# drops NO topology-rendered scrape targets or dashboards and bakes NO admin-password
# secret; those stay in the per-run (configure) path (site-obs.yml et al.), which this
# playbook does not touch. Run against a single `bake` host:
#   ansible-playbook -i inventory/bake-host.ini bake-obs.yml
#
# Full proof (MQ media for the exporter's cgo SDK) rides the actual box build later.
#
# See docs/development/box-bake-manifest.md for the authoritative classification.

# In-guest apt auto-updates are permanently OFF in every baked Ubuntu box (#1225): the
# weekly cold rebuild + box staleness gate is the update path, so nothing may grab the dpkg
# lock on first boot. Its own play, FIRST, so the bake's own apt work never races it either.
- name: Disable apt auto-updates for good (weekly cold rebuild is the update path, #1225)
  hosts: bake
  become: true
  tasks:
    - name: mask apt-daily / apt-daily-upgrade / unattended-upgrades + zero APT::Periodic
      ansible.builtin.include_role:
        name: apt-autoupdate-off

- name: Bake the obs box (install-only; no rendered targets/dashboards, no secrets)
  hosts: bake
  become: true
  vars:
    # Skip the per-run TLS ops keystore (pki-distribute) inside the mq-exporter build;
    # the exporter binary + MQ SDK are baked, the keystore is dropped per-run.
    mq_exporter_tls: false
    # Bake the grafana rendering env drop-in so the obs box can render dashboards to
    # PNG/PDF server-side (#877); the grafana-image-renderer service is baked below.
    grafana_rendering: true
  tasks:
    # Fleet agents' binaries (same as every box). node-exporter is all-install;
    # alloy is split → install half only.
    - name: entropy daemon (feed the RNG pool so JVM SecureRandom never blocks — #1190)
      ansible.builtin.include_role:
        name: entropy

    - name: node metrics agent (node-exporter, full role — static config)
      ansible.builtin.include_role:
        name: node-exporter

    - name: log shipper binary (alloy install half only)
      ansible.builtin.include_role:
        name: alloy
        tasks_from: install

    # The obs stack — bake only the INSTALL halves so the box boots INERT (#642): the
    # binaries/package + STATIC config are baked, but the services are NOT enabled or
    # started (no boot-time auto-start in a pre-config state). loki, prometheus, and
    # grafana are all enabled + started per-run in the observe phase (site-obs.yml). The
    # bake never lays down the per-run renders (prometheus targets, grafana dashboards)
    # nor grafana's admin-password secret drop-in.
    - name: loki + logcli (install half — binary + static config + unit, no start)
      ansible.builtin.include_role:
        name: loki
        tasks_from: install

    - name: prometheus (install half — binary + static prometheus.yml + rules + unit)
      ansible.builtin.include_role:
        name: prometheus
        tasks_from: install

    - name: grafana (install half — package + static datasource/provider + service)
      ansible.builtin.include_role:
        name: grafana
        tasks_from: install

    # Server-side dashboard rendering (#877): the standalone grafana-image-renderer
    # service — browser + renderer binary + inert unit. Bakeable; enabled per-run in
    # the observe phase (site-obs.yml). Grafana points at it via the rendering drop-in
    # baked by the grafana install half above (grafana_rendering: true).
    - name: grafana-image-renderer (install half — browser + binary + unit, no start)
      ansible.builtin.include_role:
        name: grafana-image-renderer
        tasks_from: install

    # Reclaim the apt cache before the space-hungry cgo mq_prometheus build (#885). The
    # install-half roles above leave their .debs in /var/cache/apt/archives; #884's Chrome
    # (~0.5 GiB of package + cached .deb) tipped the size-constrained bake box over, so the
    # next task's Go build ran /tmp out of space ("no space left on device") and failed the
    # whole obs bake — blocking every arm, since all arms consume the baked obs box. Cleaning
    # here frees every install-half .deb, restoring more headroom than the pre-#884 baseline
    # that baked clean across 40 arm builds. Placed at bake scope (not in the renderer role)
    # so it reclaims the other install halves' caches too, right before the build that needs it.
    - name: reclaim the apt cache before the mq_prometheus build (#885)
      ansible.builtin.apt:
        clean: true

    # The mq_prometheus exporter: the slow cgo build against the MQ SDK plus its Go
    # toolchain — exactly the work worth baking once. This is Ubuntu-only (it pulls
    # the full MQ via the Ubuntu-deb mq-install role and apt golang), so it lives on
    # the obs/probe box, NOT the RHEL rdqm box (verified #602). The per-instance
    # exporter units + TLS CCDT/keystore stay per-run (site-obs.yml instance loop).
    - name: build mq_prometheus (+ MQ SDK for the cgo build)
      ansible.builtin.include_role:
        name: mq-exporter
        tasks_from: build

    # --- Consolidation (epic .github#267): the log-search tier is folded onto the obs
    # box so one instrumentation machine runs the whole observability platform (metrics
    # + logs). These are the INSTALL halves only (same #642 inert-boot contract as the
    # metrics stack above): binaries/packages + static config + inert units baked; NO
    # enable/start, NO secrets, NO per-run renders — those stay in the configure path
    # (site-obs.yml, into which the log-stack configure was folded, #1179). Placed AFTER the
    # cgo mq_prometheus build so the #885 apt-clean headroom protects that space-hungry build;
    # the log stack installs from tarballs (its own bundled JDKs), not apt. The merged
    # footprint fits the 18 G build disk with ~9 G headroom (box-fit gate, #1178). The
    # standalone bake-logsearch.yml was retired with the logsearch box (#1179).
    - name: opensearch (install half — binary + static opensearch.yml + unit, no start)
      ansible.builtin.include_role:
        name: opensearch
        tasks_from: install

    - name: opensearch-dashboards (install half — package + static config + unit, no start)
      ansible.builtin.include_role:
        name: opensearch-dashboards
        tasks_from: install

    - name: data-prepper (install half — binary + static config + pipelines + unit, no start)
      ansible.builtin.include_role:
        name: data-prepper
        tasks_from: install

# The per-login dynamic MOTD is OFF in every baked Ubuntu box (#1229): pam_motd ran
# /etc/update-motd.d (50-landscape-sysinfo at ~90% CPU per login) on every SSH session.
# Its own play, LAST, so it is independent of the install work above.
- name: Disable the per-login dynamic MOTD (pam_motd / update-motd.d, #1229)
  hosts: bake
  become: true
  tasks:
    - name: comment out pam_motd in /etc/pam.d/{sshd,login} + mask motd-news.timer
      ansible.builtin.include_role:
        name: motd-off

# cloud-init and snapd come off the boot path of every baked Ubuntu box (#1250): cloud-init
# keeps only what a clone needs (mgmt-NIC netplan re-render + root growth), and snapd goes
# when no snap is installed. Its own play, after all the install work (only the #1265 guard
# play follows; it installs nothing), so the snapd guard sees every snap the bake installed.
- name: Trim cloud-init + snapd off the boot path (#1250)
  hosts: bake
  become: true
  tasks:
    - name: cloud-init = netplan re-render + growpart/resizefs only; mask config/final stages
      ansible.builtin.include_role:
        name: cloud-init-trim

    # On aarch64 grafana-image-renderer's browser is the distro chromium-browser, a
    # transitional deb that installs the chromium SNAP, so snapd must stay there (only the
    # snapd.seeded boot gate is masked). x86_64 uses the Google Chrome .deb: no snaps, purge.
    - name: snapd off the boot path (keep on aarch64 for the chromium snap; purge on x86_64)
      ansible.builtin.include_role:
        name: snapd-off
      vars:
        snapd_off_mode: "{{ 'keep' if ansible_architecture == 'aarch64' else 'purge' }}"

# Guard the finished image (#1265): every directory this box's per-run configure halves
# write into must still exist after the whole bake. #1265 lost obs's empty
# grafana-server.service.d to the snapd purge above and only found out in a later
# bootstrap's observe phase. Its own play, LAST, so it checks what is actually packaged.
- name: Guard the baked image (per-run configure dirs survived the bake, #1265)
  hosts: bake
  become: true
  tasks:
    - name: assert the per-run configure halves' directories are in the image
      ansible.builtin.include_role:
        name: bake-dirs-guard
      vars:
        bake_dirs_guard_required:
          - /etc/alloy  # alloy configure: config.alloy
          - /etc/systemd/system/grafana-server.service.d  # grafana configure: env drop-ins
          - /etc/prometheus/targets  # prometheus configure: file_sd target lists
          - /var/lib/opensearch/snapshots  # opensearch configure: path.repo snapshot restore
