---
# Bake the obs-ubuntu2404 box image (#602, epic .github#70 Task 1).
#
# ADDITIVE FOUNDATION: installs only the image-bakeable software for the
# observability box — the Grafana/Prometheus/Loki stack binaries + static config,
# the fleet agents' binaries, and the (slow, cgo) mq_prometheus exporter build. It
# drops NO topology-rendered scrape targets or dashboards and bakes NO admin-password
# secret; those stay in the per-run (configure) path (site-obs.yml et al.), which this
# playbook does not touch. Run against a single `bake` host:
#   ansible-playbook -i inventory/bake-host.ini bake-obs.yml
#
# Full proof (MQ media for the exporter's cgo SDK) rides the actual box build later.
#
# See docs/development/box-bake-manifest.md for the authoritative classification.
- name: Bake obs-ubuntu2404 (install-only; no rendered targets/dashboards, no secrets)
  hosts: bake
  become: true
  vars:
    # Skip the per-run TLS ops keystore (pki-distribute) inside the mq-exporter build;
    # the exporter binary + MQ SDK are baked, the keystore is dropped per-run.
    mq_exporter_tls: false
    # Bake the grafana rendering env drop-in so the obs box can render dashboards to
    # PNG/PDF server-side (#877); the grafana-image-renderer service is baked below.
    grafana_rendering: true
  tasks:
    # Fleet agents' binaries (same as every box). node-exporter is all-install;
    # alloy is split → install half only.
    - name: node metrics agent (node-exporter, full role — static config)
      ansible.builtin.include_role:
        name: node-exporter

    - name: log shipper binary (alloy install half only)
      ansible.builtin.include_role:
        name: alloy
        tasks_from: install

    # The obs stack — bake only the INSTALL halves so the box boots INERT (#642): the
    # binaries/package + STATIC config are baked, but the services are NOT enabled or
    # started (no boot-time auto-start in a pre-config state). loki, prometheus, and
    # grafana are all enabled + started per-run in the observe phase (site-obs.yml). The
    # bake never lays down the per-run renders (prometheus targets, grafana dashboards)
    # nor grafana's admin-password secret drop-in.
    - name: loki + logcli (install half — binary + static config + unit, no start)
      ansible.builtin.include_role:
        name: loki
        tasks_from: install

    - name: prometheus (install half — binary + static prometheus.yml + rules + unit)
      ansible.builtin.include_role:
        name: prometheus
        tasks_from: install

    - name: grafana (install half — package + static datasource/provider + service)
      ansible.builtin.include_role:
        name: grafana
        tasks_from: install

    # Server-side dashboard rendering (#877): the standalone grafana-image-renderer
    # service — browser + renderer binary + inert unit. Bakeable; enabled per-run in
    # the observe phase (site-obs.yml). Grafana points at it via the rendering drop-in
    # baked by the grafana install half above (grafana_rendering: true).
    - name: grafana-image-renderer (install half — browser + binary + unit, no start)
      ansible.builtin.include_role:
        name: grafana-image-renderer
        tasks_from: install

    # Reclaim the apt cache before the space-hungry cgo mq_prometheus build (#885). The
    # install-half roles above leave their .debs in /var/cache/apt/archives; #884's Chrome
    # (~0.5 GiB of package + cached .deb) tipped the size-constrained bake box over, so the
    # next task's Go build ran /tmp out of space ("no space left on device") and failed the
    # whole obs bake — blocking every arm, since all arms consume the baked obs box. Cleaning
    # here frees every install-half .deb, restoring more headroom than the pre-#884 baseline
    # that baked clean across 40 arm builds. Placed at bake scope (not in the renderer role)
    # so it reclaims the other install halves' caches too, right before the build that needs it.
    - name: reclaim the apt cache before the mq_prometheus build (#885)
      ansible.builtin.apt:
        clean: true

    # The mq_prometheus exporter: the slow cgo build against the MQ SDK plus its Go
    # toolchain — exactly the work worth baking once. This is Ubuntu-only (it pulls
    # the full MQ via the Ubuntu-deb mq-install role and apt golang), so it lives on
    # the obs/probe box, NOT the RHEL rdqm box (verified #602). The per-instance
    # exporter units + TLS CCDT/keystore stay per-run (site-obs.yml instance loop).
    - name: build mq_prometheus (+ MQ SDK for the cgo build)
      ansible.builtin.include_role:
        name: mq-exporter
        tasks_from: build
