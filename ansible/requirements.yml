---
# The lab's FIRST galaxy collection (otherwise ansible.builtin only — #156).
# Provisioned declaratively + installed at bootstrap into the ansible.cfg
# collections_path, never hand-installed. See docs/specs/2026-06-16-lab-pki-design.md §3.
collections:
  - name: community.crypto
    version: ">=2.20.0"
  # profile_tasks + timer callbacks for per-task/per-play timing in the bootstrap logs
  # (ansible has no task timestamps by default), enabled in ansible.cfg — the timing-audit
  # instrumentation for the ~1h16m RDQM build (#594).
  - name: ansible.posix
    version: ">=1.5.0"
