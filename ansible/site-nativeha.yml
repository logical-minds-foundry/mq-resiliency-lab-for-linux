# One full-HADR provision for the nativeha-rhel stack (#350 Task 2). Native HA is
# the compositional template; this aligns it to the same shape as the pcmk/rdqm
# stacks. Composed from building blocks (move, don't rewrite):
#   1. _nativeha-cluster-ha.yml    — live site-A Native HA group
#   2. (folded qm-create)          — our-side inter-QM + app MQSC on the active
#                                    instance (raft-replicated to all instances)
#   3. site-distributed-shared.yml — the SVC counterparty QM + inter-QM channels
#                                    + the reconnect-aware app requester
#   4. _nativeha-dr-replication.yml — site-B Recovery group + TLS + CRR
#
# This supersedes the former site-nativeha.yml (site-A HA only) +
# site-nativeha-distributed.yml + site-nativeha-dr.yml. Order is load-bearing: the
# DR/CRR block runs LAST so NHARAPP already has the app/SVC objects, which the
# Recovery group inherits by CRR (the #267 keystone).
#
# Provision-phase var contract (#350): the bootstrap `provision` phase passes the
# #351 QM extra-vars (qm_app / qm_svc / chl_to_svc / chl_to_app). Native HA has no
# floating VIP, so the SVC CONNAME and our-side CONNAME list are lab constants
# supplied below — the phase stays pure and setup_dict (the #356 regression) is
# never referenced.

# Fast-fail reachability gate (#765). From a fully torn-down lab the generous
# connect tolerance (ConnectTimeout=60 x ssh retries=3 ~= 180s, #590) is paid IN
# FULL by every task that touches a host which was never provisioned — the
# delegated "find the active Native HA instance" poll below burns minutes only to
# conclude UNREACHABLE, and its until/retries leader-election wait (#421) never
# even engages because the connection never succeeds. That tolerance is correct
# for a LIVE-but-CPU/IO-starved node (slow SSH banner exchange) and the poll for
# leader election; it is pure dead time on a cold start. A short-timeout TCP probe
# of the active-instance host's port 22 cleanly separates the two cases: a
# torn-down host fails the TCP connect in seconds, whereas a live-but-busy host has
# sshd LISTENING (only the post-connect banner exchange is slow) and passes.
# connection: local makes this a plain socket connect from the control node — NOT
# an SSH connect subject to ConnectTimeout — and any_errors_fatal aborts the whole
# provision up front instead of marching the cluster-ha import into the same
# multi-minute hang. Scoped strictly to the initial "is anything up?" decision; the
# 60s tolerance and the until poll are untouched for the live path.
- name: preflight — fail fast if the nativeha-rhel stack is not up (#765)
  hosts: localhost
  connection: local
  gather_facts: false
  any_errors_fatal: true
  tasks:
    - name: probe the active Native HA instance host on SSH (short timeout)
      ansible.builtin.wait_for:
        host: "{{ hostvars[groups['nha_rhel_a'][0]].ansible_host | default(groups['nha_rhel_a'][0]) }}"
        port: "{{ hostvars[groups['nha_rhel_a'][0]].ansible_port | default(22) }}"
        timeout: 5
        msg: >-
          nativeha-rhel is not up: the active-instance host
          {{ groups['nha_rhel_a'][0] }} is unreachable on SSH within 5s. Bring the
          lab up first (mqlab bootstrap nativeha-rhel) before provisioning — failing
          fast instead of paying the full ~180s SSH connect-timeout budget on a
          torn-down lab (#765).

- import_playbook: _nativeha-cluster-ha.yml

# Folded qm-create (#350 Task 2 step 2): our-side inter-QM + app MQSC on the ACTIVE
# Native HA instance. runmqsc must run on the active instance; Native HA then
# replicates the objects to all instances via raft. Mirrors the RDQM arm's our-side
# MQSC (rdqm-qm-create.sh) and the pcmk arm's inter-qm.mqsc.j2. Body moved verbatim
# from the former site-nativeha-distributed.yml.
- hosts: nha_rhel_a
  become: true
  vars:
    qm_name: "{{ qm_app }}"
    qm_svc_name: "{{ qm_svc }}"
    svc_conn: "svc-sim-ext.service.com"
  tasks:
    # Match the per-instance detail line 'INSTANCE(<node>) ROLE(Active)', NOT the local
    # summary line 'ROLE(Active) INSTANCE(<node>)': dspmq -x is delegated to nha_rhel_a[0]
    # (a1), and the summary line reports only a1's OWN role — so the old summary-order grep
    # found the active only while a1 itself was active, and timed out (empty) whenever the
    # active had drifted to a2/a3. The detail lines list every instance from any node, so
    # this resolves the active regardless of which instance answers (#722).
    - name: find the active Native HA instance
      ansible.builtin.shell: |
        set -o pipefail
        su - mqm -c "/opt/mqm/bin/dspmq -m {{ qm_name }} -o nativeha -x" \
          | grep -oE 'INSTANCE\(nha-rhel-a[0-9]\) ROLE\(Active\)' \
          | grep -oE 'nha-rhel-a[0-9]' | head -1 || true
      args:
        executable: /bin/bash
      register: act
      changed_when: false
      run_once: true
      delegate_to: "{{ groups['nha_rhel_a'][0] }}"
      # Wait out leader election: the HA role starts the instances but returns
      # before the group elects an Active. Poll until one appears, else this step
      # (not a downstream AMQ8146E) fails loud and names the real culprit. (#421)
      until: act.stdout | trim | length > 0
      retries: 30
      delay: 5

    - name: record the active host
      ansible.builtin.set_fact:
        active_host: "{{ act.stdout | trim }}"
      run_once: true

    - name: apply our-side + app MQSC on the active instance (once; raft-replicated)
      ansible.builtin.shell: |
        su - mqm -c "/opt/mqm/bin/runmqsc {{ qm_name }}" <<'MQSC'
        DEFINE LISTENER(L1414) TRPTYPE(TCP) PORT(1414) CONTROL(QMGR) REPLACE
        START LISTENER(L1414)
        DEFINE CHANNEL(APP.SVRCONN) CHLTYPE(SVRCONN) TRPTYPE(TCP) MCAUSER('mqm') SSLCIPH({{ tls_cipher }}) SSLCAUTH(REQUIRED) SSLPEER('{{ tls_peer_client }}') HBINT(15) KAINT(15) REPLACE
        DEFINE CHANNEL(MON.SVRCONN) CHLTYPE(SVRCONN) TRPTYPE(TCP) MCAUSER('mqm') SSLCIPH({{ tls_cipher }}) SSLCAUTH(REQUIRED) SSLPEER('{{ tls_peer_client }}') REPLACE
        ALTER QMGR CHLAUTH(DISABLED) CONNAUTH(' ') CERTLABL('{{ qm_name }}') MONQ(HIGH) MONCHL(HIGH) MONACLS(HIGH) STATMQI(ON) STATQ(ON) STATCHL(HIGH) MAXHANDS(512)
        REFRESH SECURITY TYPE(CONNAUTH)
        DEFINE QLOCAL(APP.REPLY) DEFPSIST(YES) REPLACE
        DEFINE QREMOTE(SVC.REQUEST) RNAME({{ svc_req_queue }}) RQMNAME({{ qm_svc_name }}) XMITQ({{ qm_svc_name }}) REPLACE
        DEFINE QLOCAL({{ qm_svc_name }}) USAGE(XMITQ) TRIGGER TRIGTYPE(FIRST) INITQ(SYSTEM.CHANNEL.INITQ) TRIGDATA({{ qm_name }}.{{ qm_svc_name }}) REPLACE
        DEFINE CHANNEL({{ qm_name }}.{{ qm_svc_name }}) CHLTYPE(SDR) TRPTYPE(TCP) CONNAME('{{ svc_conn }}(1414)') XMITQ({{ qm_svc_name }}) SSLCIPH({{ tls_cipher }}) SSLPEER('{{ tls_peer_svc }}') SHORTRTY(10) SHORTTMR(5) LONGRTY(999999999) LONGTMR(20) REPLACE
        DEFINE CHANNEL({{ qm_svc_name }}.{{ qm_name }}) CHLTYPE(RCVR) TRPTYPE(TCP) SSLCIPH({{ tls_cipher }}) SSLCAUTH(REQUIRED) SSLPEER('{{ tls_peer_svc }}') REPLACE
        START CHANNEL({{ qm_name }}.{{ qm_svc_name }})
        MQSC
      register: mqsc
      changed_when: true
      failed_when: mqsc.rc not in [0, 10]
      run_once: true
      delegate_to: "{{ active_host }}"
      # The raft layer assigns ROLE(Active) a beat before the QM's admin interface
      # is up (STATUS reaches Running slightly later); runmqsc in that window fails
      # AMQ8146E (rc 20). Slow-host timing (macOS-era TCG) can mask it, but the race
      # exists regardless — on an x86 host this RHEL arm runs native KVM (per
      # platforms.py) and may expose it — so retry until the active QM accepts the
      # MQSC, mirroring #421's wait. (#435)
      until: mqsc.rc in [0, 10]
      retries: 30
      delay: 5

    # Enable classes + define/start the collector on the ACTIVE instance; Native HA
    # replicates the SERVICE/QMGR objects to all instances via raft. runmqsc only works
    # on the active instance — a passive replica rejects it with AMQ8478E (Standby queue
    # manager, rc 20), so a bare run_once (which targets groups['nha_rhel_a'][0]) fails
    # whenever the active instance is a2/a3. delegate_to is not valid on include_role, so
    # we target the active instance with a when-guard on active_host (the run_once set_fact
    # above, broadcast to all hosts): the role runs exactly once, on the active instance.
    - name: event monitoring — enable classes + define/start collector (active, once) (#114)
      ansible.builtin.include_role:
        name: mq-event-monitor
        tasks_from: service
      vars:
        qmgr_name: "{{ qm_name }}"
        # Native HA runs a replicated (linear-equivalent) log — LOGGEREV is valid here
        # and the role enables it, after verifying the live QM's LogType matches (#809).
        mq_log_type: replicated
      when: inventory_hostname == active_host

- import_playbook: site-distributed-shared.yml
  vars:
    our_qm: "{{ qm_app }}"
    # This arm's own site-A net-ext IPs (the active instance answers on whichever
    # of the three holds the QM) — NOT another arm's range.
    our_conn: "nha-rhel-a1-ext.client.com(1414),nha-rhel-a2-ext.client.com(1414),nha-rhel-a3-ext.client.com(1414)"
    # The app host reaches the app QM on the data plane; Native HA has no VIP, so it
    # lists the site-A instances. APP.SVRCONN is mutual-TLS here (matches pcmk), so
    # the app requester connects over TLS -> app_tls true. (#411)
    app_conn: "nha-rhel-a1-data-a.client.com(1414),nha-rhel-a2-data-a.client.com(1414),nha-rhel-a3-data-a.client.com(1414)"
    app_tls: true

# Skip the DR (CRR) replication half entirely under `bootstrap --no-dr` (#188): with
# no site-B up there is nothing to replicate to. Default (dr_enabled unset → true) runs
# it, so the full HADR provision is unchanged.
- import_playbook: _nativeha-dr-replication.yml
  when: dr_enabled | default(true) | bool
