---
# Per-run half of the rdqm-state collector (#287; epic .github#294 T7). The collector is
# the BAKED mq-resiliency-observability component (entry point lab-rdqm-state, static units
# in /usr/lib/systemd/system, both laid down by component-install at bake); it reuses
# clusterstate.parse_drbd inside the component, so the cut-down `mqlab` package this role
# used to deploy under /usr/local/lib is gone. This role only: asserts the component is
# baked -> retires the pre-#294 payload and the /etc/systemd/system unit copies (they
# SHADOW the component units) -> renders the deployer-owned env file -> daemon-reload +
# enable the 5s timer. rdqmstatus + drbdsetup both run as root, so the unit runs as root.
# The QM name comes from the observability overlay (rdqm_qm).
- name: look for the baked observability component
  ansible.builtin.stat:
    path: /opt/logical-minds-foundry/mq-resiliency-observability/INSTALLED.json
  register: _rs_baked

- name: the observability component is baked on this box
  ansible.builtin.assert:
    that: _rs_baked.stat.exists
    fail_msg: >-
      mq-resiliency-observability is not installed on {{ inventory_hostname }}
      (no /opt/logical-minds-foundry/mq-resiliency-observability/INSTALLED.json) —
      rebuild its box (mqlab box build <box>) or install it live
      (mqlab component install mq-resiliency-observability --host {{ inventory_hostname }})

- name: textfile dir
  ansible.builtin.file:
    path: /var/lib/node_exporter/textfile
    state: directory
    mode: "0755"

# A pre-#294 `systemctl enable` linked the timer to the /etc copy removed below; drop
# that link (only that one) so the enable at the end re-links the component unit.
- name: look for a timers.target.wants link to the retired /etc timer
  ansible.builtin.stat:
    path: /etc/systemd/system/timers.target.wants/lab-rdqm-state.timer
    follow: false
  register: _rs_wants

- name: drop the wants link to the retired /etc timer
  ansible.builtin.file:
    path: /etc/systemd/system/timers.target.wants/lab-rdqm-state.timer
    state: absent
  when: (_rs_wants.stat.lnk_target | default('')) == '/etc/systemd/system/lab-rdqm-state.timer'

# systemd prefers /etc/systemd/system over /usr/lib/systemd/system: a surviving copy would
# keep running the old /usr/bin/python3 ExecStart (epic .github#294 Review Focus 1).
- name: retire the pre-#294 payload and /etc unit copies (they shadow the component units)
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /usr/local/lib/lab-rdqm-state
    - /etc/systemd/system/lab-rdqm-state.service
    - /etc/systemd/system/lab-rdqm-state.timer

- name: render the deployer-owned env file (read by the component's static unit)
  ansible.builtin.template:
    src: lab-rdqm-state.env.j2
    dest: /etc/opt/logical-minds-foundry/mq-resiliency-observability/lab-rdqm-state.env
    mode: "0644"

- name: daemon-reload, enable + start the timer
  ansible.builtin.systemd:
    name: lab-rdqm-state.timer
    enabled: true
    state: started
    daemon_reload: true
