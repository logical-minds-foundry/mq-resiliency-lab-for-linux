# mq_prometheus exporter on a stable off-cluster node (mon-probe), client-mode
# against the QM (#172). Built from source (no IBM arm64 redistributable exists),
# so the node needs the full MQ client libs + SDK; the exporter runs no QM.
#
# Split (#423): build.yml is the one-time build + shared keystore; instance.yml is
# one per-QM exporter unit. This main.yml runs both for a single default instance;
# site-obs.yml instead runs build.yml once and loops instance.yml per stack.
- name: build mq_prometheus + place the shared ops keystore (once)
  ansible.builtin.include_tasks: build.yml

- name: stand up this exporter instance
  ansible.builtin.include_tasks: instance.yml
