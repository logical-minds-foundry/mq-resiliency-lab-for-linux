# One-time build of the mq_prometheus exporter on mon-probe + the shared ops
# keystore. Split from main.yml (#423) so site-obs.yml can run this ONCE and then
# loop the per-instance unit (instance.yml) per stack, instead of re-running the
# slow cgo build for every exporter. Every step here is idempotent (`creates:` /
# idempotent modules), so a second run is a no-op.
# The exporter binary links the MQ server binding libmqm_r dynamically at runtime
# (the unit sets LD_LIBRARY_PATH=/opt/mqm/lib64), so the node still needs the MQ
# runtime. (The cgo *build* moved out of the guest — see below, #1065.)
- name: install MQ (the runtime libs the exporter links at run time)
  ansible.builtin.include_role:
    name: mq-install

- name: ensure the exporter config directory (#944)
  ansible.builtin.file:
    path: "{{ mq_exporter_confdir }}"
    state: directory
    owner: mqm
    group: mqm
    mode: "0755"
  become: true

# mq_prometheus is built OUT of band — once, on the host, in the Go container
# (ghcr.io/vergil-project/dev-go) against the MQ SDK from the cached MQ tarball; see
# lab/scripts/build-mq-exporter-binary.sh + src/mqlab/mqexporter.py (#1065). The old
# in-guest path installed golang-go and ran a cgo `go build` here, but a newer
# mq-metric-samples go.mod auto-downloaded the entire Go toolchain and overflowed the
# fatbox build guest's disk. We just copy the prebuilt binary from the host-durable
# cache (`mq_exporter_media_dir`, the fat-box bake overrides it — mirrors mq_media_dir).
# Skip-if-baked (#648/#659): the obs/mq-ubuntu fat box already carries it, so gate the
# copy on the installed marker (a live run's worktree build/ cache may be empty).
- name: check for an already-installed mq_prometheus (baked)
  ansible.builtin.stat:
    path: /usr/local/bin/mq_prometheus
  register: mq_prometheus_bin

- name: install the prebuilt mq_prometheus exporter binary (#1065)
  ansible.builtin.copy:
    src: "{{ mq_exporter_media_dir }}/mq_prometheus-x64"
    dest: /usr/local/bin/mq_prometheus
    owner: root
    group: root
    mode: "0755"
  become: true
  when: not mq_prometheus_bin.stat.exists

# TLS (#250): one app-org ops keystore (+ .sth stash) for the exporter, shared by
# every per-QM instance on this probe. Placed once; pki-distribute is idempotent.
- name: place the mq_prometheus keystore (TLS)
  ansible.builtin.include_role:
    name: pki-distribute
  vars:
    pki_entity: mq_prometheus
    pki_dest_dir: /var/mqm/ssl/mq_prometheus   # dedicated dir so the keystore can be key.{p12,sth} (#409)
    pki_owner: mqm
    pki_stash: true
  when: mq_exporter_tls | bool
