# One-time build of the mq_prometheus exporter on mon-probe + the shared ops
# keystore. Split from main.yml (#423) so site-obs.yml can run this ONCE and then
# loop the per-instance unit (instance.yml) per stack, instead of re-running the
# slow cgo build for every exporter. Every step here is idempotent (`creates:` /
# idempotent modules), so a second run is a no-op.
- name: install full MQ (client libs + SDK for the cgo build)
  ansible.builtin.include_role:
    name: mq-install

- name: ensure the exporter config directory (#944)
  ansible.builtin.file:
    path: "{{ mq_exporter_confdir }}"
    state: directory
    owner: mqm
    group: mqm
    mode: "0755"
  become: true

- name: build toolchain (Go + git)
  ansible.builtin.apt:
    name:
      - golang-go
      - git
      - build-essential
    update_cache: true
  become: true

# Per-run GitHub fetch: retry so a rate-limited parallel-boot DNS burst (#648)
# does not fail the one-shot cold rebuild. The git module is idempotent (a settled
# checkout re-runs as a no-op), so retries are safe and steady-state resolves fine.
- name: fetch mq-metric-samples source
  ansible.builtin.git:
    repo: https://github.com/ibm-messaging/mq-metric-samples.git
    dest: /usr/local/src/mq-metric-samples
    version: "{{ mq_exporter_ref }}"
  become: true
  register: mq_samples_git
  until: mq_samples_git is succeeded
  retries: 5
  delay: 10

# cgo against /opt/mqm — the whole reason the node carries the full MQ SDK.
# Idempotent: `creates` skips the (slow, network-fetching) build on re-runs. The
# build also pulls Go modules from the network, so it gets the same #648 retry:
# on a flake the binary is not created, so `creates` lets the retry re-run it.
- name: build mq_prometheus
  ansible.builtin.command:
    cmd: go build -o /usr/local/bin/mq_prometheus ./cmd/mq_prometheus
    chdir: /usr/local/src/mq-metric-samples
    creates: /usr/local/bin/mq_prometheus
  environment:
    CGO_CFLAGS: -I/opt/mqm/inc
    CGO_LDFLAGS: -L/opt/mqm/lib64
    GOFLAGS: -mod=mod
  become: true
  register: mq_prometheus_build
  until: mq_prometheus_build is succeeded
  retries: 5
  delay: 10

# TLS (#250): one app-org ops keystore (+ .sth stash) for the exporter, shared by
# every per-QM instance on this probe. Placed once; pki-distribute is idempotent.
- name: place the mq_prometheus keystore (TLS)
  ansible.builtin.include_role:
    name: pki-distribute
  vars:
    pki_entity: mq_prometheus
    pki_dest_dir: /var/mqm/ssl/mq_prometheus   # dedicated dir so the keystore can be key.{p12,sth} (#409)
    pki_owner: mqm
    pki_stash: true
  when: mq_exporter_tls | bool
