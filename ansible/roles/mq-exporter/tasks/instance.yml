# One mq_prometheus exporter instance (one QM). site-obs.yml loops it per stack after
# build.yml has run once (#423). Caller sets the per-instance vars: mq_exporter_qm /
# _instance / _conn / _channel / _port.
#
# The QM, its CONNAME and the exporter port have no role default: each names one
# stack's QM, so a caller that omits one fails here, naming it, instead of silently
# scraping some other stack's QM.
- name: the caller set this instance's QM, CONNAME and port
  ansible.builtin.assert:
    that:
      - mq_exporter_qm is defined
      - mq_exporter_conn is defined
      - mq_exporter_port is defined
    fail_msg: >-
      mq-exporter tasks_from instance needs mq_exporter_qm, mq_exporter_conn and
      mq_exporter_port; undefined:
      {{ [(mq_exporter_qm is defined) | ternary('', 'mq_exporter_qm'),
          (mq_exporter_conn is defined) | ternary('', 'mq_exporter_conn'),
          (mq_exporter_port is defined) | ternary('', 'mq_exporter_port')]
         | select | join(', ') }}

# Per-instance CCDT: the only way to give a mq-metric-samples client an SSLCIPH (no
# CLI flag exists). Carries this instance's channel/conn(s)/QM + cipher + cert
# label; the unit points MQCCDTURL/MQSSLKEYR at it. mq_exporter_conn may be a
# comma-separated CONNAME list (Native HA has no VIP — the CCDT lists every
# instance so the exporter reaches whichever holds the QM).
- name: render the exporter CCDT (TLS)
  ansible.builtin.template:
    src: exporter-ccdt.json.j2
    dest: "{{ mq_exporter_ccdt }}"
    owner: mqm
    group: mqm
    mode: "0644"
  become: true
  when: mq_exporter_tls | bool

# Per-QM YAML config (#944): the unit runs `mq_prometheus -f <this>`, so the
# connection/object/filter/fire-hose settings all live here (EXTENDED etc. have no
# CLI flag). No credentials are rendered — those stay runtime-injected. Register it
# so a config change (not just a unit change) restarts the exporter below.
- name: render the exporter YAML config
  ansible.builtin.template:
    src: mq-exporter.yaml.j2
    dest: "{{ mq_exporter_config }}"
    owner: mqm
    group: mqm
    mode: "0644"
  become: true
  register: mq_exporter_config_render

# Per-QM unit name so the probe runs one exporter per QM (per-stack alloc ports,
# #423). A static notify-handler can't target a per-instance unit, so restart
# inline when the unit changes.
- name: exporter systemd unit
  ansible.builtin.template:
    src: mq-exporter.service.j2
    dest: "/etc/systemd/system/mq-exporter-{{ mq_exporter_instance }}.service"
    mode: "0644"
  become: true
  register: mq_exporter_unit

# Bounded retry on the transient D-Bus reset seen when a unit is (re)started on a
# freshly-booted, still-settling observability host (#871): the mq-metric-samples
# exporter runs on mon-probe, the same host whose D-Bus channel intermittently
# drops mid-restart ("D-Bus connection terminated / Connection reset by peer").
# Retry ONLY that transient signature; any other failure satisfies `until` on the
# first attempt and fails loud. Mirrors the repo's register/until idiom (#657/#768).
- name: enable + (re)start the exporter
  ansible.builtin.systemd:
    name: "mq-exporter-{{ mq_exporter_instance }}"
    enabled: true
    state: "{{ 'restarted' if (mq_exporter_unit is changed or mq_exporter_config_render is changed) else 'started' }}"
    daemon_reload: true
  become: true
  register: mq_exporter_restart
  until: >-
    mq_exporter_restart is succeeded or
    mq_exporter_restart.msg | default('') is not
    search('Connection reset by peer|D-Bus connection terminated|Service is in unknown state')
  retries: 5
  delay: 5
