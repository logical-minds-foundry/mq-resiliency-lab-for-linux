---
# mq_prometheus exporter — client-mode target (the instrumented subject is our
# HA QM, reached via its data-plane VIP so the exporter follows it across
# failover). Override per QM instance from site-obs.yml.
mq_exporter_qm: "{{ qm_app | default('PCMKAPP') }}"
# Per-instance unit suffix so the probe can run one exporter per QM (#182).
mq_exporter_instance: "{{ mq_exporter_qm | lower }}"
mq_exporter_conn: "10.10.1.200(1414)"
# Dedicated monitoring SVRCONN (#250): the exporter no longer piggybacks on
# APP.SVRCONN/SVC.SVRCONN, whose mutual-TLS SSLPEERs pin the app/responder
# identities. MON.SVRCONN pins O=app-org (the exporter) on both QMs.
mq_exporter_channel: MON.SVRCONN
mq_exporter_port: 9157
# TLS (#250): mq-metric-samples exposes no MQ-TLS CLI flags, so a client
# connection's SSLCIPH must come from a CCDT. We render a one-channel CCDT per
# instance and set MQSSLKEYR to the keystore stem (a sibling .sth stash supplies
# the password). Verified-at-build: cipherSpecification alias + CCDT field names.
mq_exporter_tls: true
mq_exporter_certlabel: mq_prometheus
mq_exporter_keyrepo: /var/mqm/ssl/mq_prometheus/key   # keystore stem; file is key.{p12,sth} (#409)
mq_exporter_ccdt: "/var/mqm/ssl/exporter-ccdt-{{ mq_exporter_instance }}.json"
# YAML config file (#944): the exporter now runs `mq_prometheus -f <yaml>` instead
# of a stack of ExecStart CLI flags. The migration exists because the fire-hose
# knobs below (notably the EXTENDED queue class) have NO CLI flag — YAML is the only
# way to reach them (Phase-0 doc §7, DECIDED 2026-08-06). One rendered file per QM.
mq_exporter_confdir: /var/mqm/exporter
mq_exporter_config: "{{ mq_exporter_confdir }}/mq-exporter-{{ mq_exporter_instance }}.yaml"
# Fire-hose knobs (#944), Phase-0 doc §3/§7 — open everything, prune later:
#   * EXTENDED queue class: 9.4.2+ L2/L3 queue diagnostics, excluded by default and
#     unreachable via CLI. Listing the full class set = maximal queue coverage.
#   * showInactiveChannels: surface defined-but-inactive / stopped channels (a
#     dashboard-critical signal), off by default.
#   * rediscoverInterval: drop the 1h default so newly-created queues are picked up
#     promptly by the next wildcard rediscovery pass.
mq_exporter_queue_selector: [PUT, GET, GENERAL, OPENCLOSE, INQSET, EXTENDED]
mq_exporter_show_inactive_channels: true
mq_exporter_rediscover_interval: 1m
# Object-status poll cadence (#1014): object status is polled in the background at
# this interval so /metrics serves cached results instantly. This decouples scrape
# time from the ~24s fire-hose object gather (a pollInterval of 0s forces a
# synchronous gather on every scrape, which overruns Prometheus' 10s scrape/timeout
# and wedges the exporter). Resource/publication metrics stay continuous regardless.
mq_exporter_poll_interval: "1m"
# Wildcard ALL objects, including SYSTEM.* (#423): filtering is a display concern,
# not a scrape concern, and the system series (e.g. SYSTEM.CLUSTER.* churn) is a
# proven leading indicator we want for free — a production deployment would filter,
# the lab does not.
# MAXHANDS gate (#443): the exporter opens a handle per monitored queue, and the
# wildcard set exceeds the crtmqm MAXHANDS(256) default (~280 handles). Any QM this
# scrapes MUST set MAXHANDS(512) — the mq-qmgr role does; the Native HA app QMs get
# it in their inline MQSC (site-nativeha*.yml). Below it the exporter self-aborts
# (exit 10) and crash-loops, which the QM logs as an AMQ9638E/AMQ9999E SSL flood —
# a masquerade, not a TLS fault.
# NOTE: exact mq-metric-samples wildcard syntax is build-verified on the first cold boot.
mq_exporter_monitored_queues: "*,SYSTEM.*"
mq_exporter_monitored_channels: "*,SYSTEM.*"
# mq-metric-samples source ref. TODO(#172): pin to a release tag once the first
# cold boot confirms the build — master is a placeholder for reproducibility.
mq_exporter_ref: master
