# Base IBM MQ install (NO RDQM stack) from the no-charge Developers Ubuntu tar,
# via apt + the bundled .deb set. The Debian OS-adapter for the OS-agnostic
# mq-nativeha role (#417, Phase 2 of #246) — the peer of install-RedHat.yml. The
# formation logic (main.yml) is shared verbatim; only this install differs.
#
# Unlike the RHEL box (offline, DVD-repo'd, x86_64 — native KVM on an x86 host, TCG
# only on an arm64/macOS host), the Ubuntu guests have apt
# network access, so there is no offline-repo dance — apt resolves the debs' OS
# deps directly. The tar arch suffix tracks the guest arch (host-resolved, #276):
# ARM64 on the Apple-Silicon dev host, X64 on an x86 host — mirroring mq-install.
#
# Skip-if-baked (#103 T6, mirroring install-RedHat.yml #648/#659): the
# Ubuntu mq-nativeha fat box bakes this whole install, so /opt/mqm/inc/cmqc.h is
# already present. Gate the ~2 GiB developer-tar copy + unpack on that marker —
# WITHOUT it a baked node re-copies the tarball EVERY bootstrap (the #659 offender,
# since /tmp is wiped on boot). The apt install / setmqinst / ulimits steps keep
# their own `creates:` / idempotent guards (no-ops when baked). An un-baked base-box
# node (Phase-0) still installs from scratch.
- name: check for an already-installed MQ (skip the baked tar copy/unpack)
  ansible.builtin.stat:
    path: /opt/mqm/inc/cmqc.h
  register: mq_installed

# The MQ media is staged on disk under lab_stage_dir, never /tmp (#1417): Ubuntu 26.04's
# /tmp is a RAM-sized tmpfs that the ~2 GiB tarball + its MQServer/ tree cannot fit in.
- name: staging dir (on disk)
  ansible.builtin.include_tasks: ../../../tasks/lab-stage-dir.yml
  when: not mq_installed.stat.exists

- name: copy MQ Ubuntu tar to node
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../build/cache/mq/{{ mq_version }}-IBM-MQ-Advanced-for-Developers-UbuntuLinux{{ 'ARM64' if ansible_architecture == 'aarch64' else 'X64' }}.tar.gz"
    dest: "{{ lab_stage_dir }}/mqadv.tar.gz"
    mode: "0644"
  become: true  # lab_stage_dir is root-owned 0755
  when: not mq_installed.stat.exists

- name: unpack
  ansible.builtin.unarchive:
    src: "{{ lab_stage_dir }}/mqadv.tar.gz"
    dest: "{{ lab_stage_dir }}"
    remote_src: true
    creates: "{{ lab_stage_dir }}/MQServer"
  become: true
  when: not mq_installed.stat.exists

- name: accept developer licence
  ansible.builtin.command: "{{ lab_stage_dir }}/MQServer/mqlicense.sh -accept"
  args:
    creates: /var/mqm

# Base MQ only (no RDQM/DRBD — Native HA replicates in-QM over raft). ibmmq-samples
# carries the Native HA liveness monitor (/opt/mqm/samp/mqmonitor@.service) that
# main.yml's systemd lifecycle links — the Debian peer of MQSeriesSamples on RHEL.
# One pass before any QM exists: MQ's preinst refuses extra debs once a QM's shared
# resources are live, so the full set (incl. sdk) must land together.
- name: install base IBM MQ debs (no RDQM)
  ansible.builtin.shell: |
    set -e
    apt-get update
    cd "{{ lab_stage_dir }}/MQServer"
    apt-get install -y \
      ./ibmmq-runtime_*.deb ./ibmmq-server_*.deb ./ibmmq-gskit_*.deb \
      ./ibmmq-java_*.deb ./ibmmq-jre_*.deb ./ibmmq-web_*.deb \
      ./ibmmq-sdk_*.deb ./ibmmq-client_*.deb ./ibmmq-samples_*.deb
  args:
    creates: /opt/mqm/bin/crtmqm
  become: true

# /var/tmp is not wiped at boot the way /tmp was: remove the staged tarball and its
# unpacked tree once the debs are installed, so neither is carried into the baked image.
- name: remove the staged MQ media
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - "{{ lab_stage_dir }}/mqadv.tar.gz"
    - "{{ lab_stage_dir }}/MQServer"
  become: true

- name: set primary installation (loader path)
  ansible.builtin.command: /opt/mqm/bin/setmqinst -i -p /opt/mqm
  args:
    creates: /etc/ld.so.conf.d/ibmmq-Installation1.conf
  become: true

- name: mqm ulimits
  ansible.builtin.copy:
    dest: /etc/security/limits.d/99-mqm.conf
    mode: "0644"
    content: |
      mqm soft nofile 10240
      mqm hard nofile 10240
  become: true
