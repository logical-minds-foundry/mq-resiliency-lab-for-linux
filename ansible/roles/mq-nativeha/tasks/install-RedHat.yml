# Base IBM MQ install (NO RDQM stack) from the no-charge Developers LinuxX64 tar,
# with base-OS deps from the attached install DVD (offline, unregistered guest).
# OS-adapter for the OS-agnostic mq-nativeha role (#246) — proven in the Phase-0
# spike. Phase 2 adds install-Debian.yml; the formation logic (main.yml) is shared.
#
# Skip-if-baked (#648/#659, applied to the native-HA RHEL adapter for #88): the
# mq-nativeha RHEL fat box bakes this whole install, so /opt/mqm/inc/cmqc.h is already
# present. Gate the ~2 GiB developer-tar copy + unpack on that marker — WITHOUT it a
# baked node re-copies the tarball EVERY bootstrap (the #659 offender, since /tmp is
# wiped on boot). The dnf install / setmqinst steps keep their own `creates:` guards
# (idempotent no-ops when baked). The DVD mount + repo drop stay UNGUARDED so the offline
# BaseOS+AppStream repo remains available to the per-run configure half (spec §4.4). An
# un-baked base-box node (Phase-0) still installs from scratch.
#
# Version-specific values (the DVD repo name) come from vars/<Distribution>-<major>.yml
# through the shared fail-loud loader (#1277, epic .github#280). Loaded HERE, in the RHEL
# adapter only, so the Debian path carries no RedHat vars file and vice versa.
- name: per-OS-version vars (DVD repo name)
  ansible.builtin.include_tasks: ../../../tasks/os-vars.yml
  vars:
    os_vars_role: mq-nativeha

- name: check for an already-installed MQ (skip the baked tar copy/unpack)
  ansible.builtin.stat:
    path: /opt/mqm/inc/cmqc.h
  register: mq_installed

- name: mount the install DVD (BaseOS+AppStream)
  ansible.builtin.shell: |
    set -e
    mkdir -p /media/rhel
    grep -q '/media/rhel' /etc/fstab || echo '/dev/sr0 /media/rhel iso9660 ro 0 0' >> /etc/fstab
    mountpoint -q /media/rhel || mount /media/rhel
  changed_when: false

- name: dnf repos from the DVD
  ansible.builtin.copy:
    dest: /etc/yum.repos.d/rhel-dvd.repo
    mode: "0644"
    content: |
      [dvd-baseos]
      name={{ nha_dvd_repo_name }} BaseOS
      baseurl=file:///media/rhel/BaseOS
      enabled=1
      gpgcheck=0
      [dvd-appstream]
      name={{ nha_dvd_repo_name }} AppStream
      baseurl=file:///media/rhel/AppStream
      enabled=1
      gpgcheck=0

# `acl` for unprivileged become (main.yml's first `become_user: mqm` step follows this
# adapter). It lives HERE, right after the DVD repo, because the guest is offline and that
# repo is its only package source: an install placed before it finds nothing (#1403 — the
# RHEL 10 minimal base lacks acl; RHEL 9's base happened to carry it). The bake and every
# per-run play get acl from this one task. tests/test_rhel_dvd_repo_order.py pins the order.
- name: acl package (unprivileged become prereq)
  ansible.builtin.dnf:
    name: acl
    state: present

# The MQ media is staged on disk under lab_stage_dir, never /tmp (#1417): the ~2 GiB
# tarball + its MQServer/ tree overflow a RAM-sized tmpfs /tmp. RHEL's /tmp is on disk
# today, so this changes nothing in effect here; one location serves every OS.
- name: staging dir (on disk)
  ansible.builtin.include_tasks: ../../../tasks/lab-stage-dir.yml
  when: not mq_installed.stat.exists

- name: copy MQ LinuxX64 tar to node
  ansible.builtin.copy:
    # mq_media_dir (role default = the per-run path) is overridden by the fat-box bake to
    # the host-durable main-worktree cache (#604) — see roles/mq-nativeha/defaults/main.yml.
    src: "{{ mq_media_dir }}/{{ mq_version }}-IBM-MQ-Advanced-for-Developers-LinuxX64.tar.gz"
    dest: "{{ lab_stage_dir }}/mqadv.tar.gz"
    mode: "0644"
  become: true  # lab_stage_dir is root-owned 0755
  when: not mq_installed.stat.exists

- name: unpack
  ansible.builtin.unarchive:
    src: "{{ lab_stage_dir }}/mqadv.tar.gz"
    dest: "{{ lab_stage_dir }}"
    remote_src: true
    creates: "{{ lab_stage_dir }}/MQServer"
  become: true
  when: not mq_installed.stat.exists

- name: accept developer licence
  ansible.builtin.command: "{{ lab_stage_dir }}/MQServer/mqlicense.sh -accept"
  args:
    creates: /var/mqm

# Base MQ only (no RDQM/DRBD). MQSeriesSamples carries the Native HA liveness
# monitor (/opt/mqm/samp/mqmonitor@.service) used by main.yml's systemd lifecycle.
- name: install base IBM MQ packages (no RDQM)
  ansible.builtin.shell: |
    set -e
    cd "{{ lab_stage_dir }}/MQServer"
    dnf install -y \
      MQSeriesRuntime-*.rpm MQSeriesServer-*.rpm MQSeriesGSKit-*.rpm \
      MQSeriesJava-*.rpm MQSeriesJRE-*.rpm MQSeriesWeb-*.rpm \
      MQSeriesSDK-*.rpm MQSeriesClient-*.rpm MQSeriesSamples-*.rpm
  args:
    creates: /opt/mqm/bin/crtmqm

# Remove the staged tarball and its unpacked tree once the rpms are installed, so neither
# is carried into the baked image (/var/tmp is not cleaned the way /tmp is).
- name: remove the staged MQ media
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - "{{ lab_stage_dir }}/mqadv.tar.gz"
    - "{{ lab_stage_dir }}/MQServer"
  become: true

- name: set primary installation (loader path)
  ansible.builtin.command: /opt/mqm/bin/setmqinst -i -p /opt/mqm
  args:
    creates: /etc/ld.so.conf.d/ibmmq-Installation1.conf

- name: mqm ulimits
  ansible.builtin.copy:
    dest: /etc/security/limits.d/99-mqm.conf
    mode: "0644"
    content: |
      mqm soft nofile 10240
      mqm hard nofile 10240

# runmqakm/runmqras dlopen the OS libicuio at runtime; the minimal box lacks it
# (lab-gotchas.md). Install it in the base so diagnostics (and TLS) always work.
- name: libicu (runmqras / runmqakm ICU runtime dep)
  ansible.builtin.dnf:
    name: libicu
