---
# mq_media_dir: where the MQ-for-Developers LinuxX64 tarball lives. Defaults to the
# shared cache bucket (mqlab_cache_dir, group_vars/all/buckets.yml — the main checkout's
# build/cache from any worktree, #1569). The RHEL mq-nativeha fat-box bake (#88, epic
# .github#88) still passes -e mq_media_dir=<main-worktree>/build/cache/mq explicitly.
# Mirrors rdqm-install / mq-install (#604).
mq_media_dir: "{{ mqlab_cache_dir }}/mq"
