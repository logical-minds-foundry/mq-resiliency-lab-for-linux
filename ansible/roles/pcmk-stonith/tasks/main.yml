# Real STONITH: fence_virsh against the lab hypervisor (the dev VM plays
# the iLO). A dedicated key (gitignored, generated by site-pcmk pre-play)
# lets fence agents ssh to the hypervisor user and virsh-destroy domains.
- name: fence agent package (OS-adapter)
  ansible.builtin.include_tasks: "install-{{ ansible_os_family }}.yml"

- name: fence ssh private key
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../build/state/fence_key"
    dest: /etc/pacemaker/fence_key
    owner: root
    mode: "0600"
  become: true

# Unchanged on Ubuntu 26.04 (pacemaker 3.0.1, pcs 0.12.1, fence-agents 4.17), reviewed
# for #1282: Pacemaker 3.0 defaults pcmk_host_argument to "none" only for agents that
# advertise neither `plug` nor `port`, and fence_virsh advertises both (Pacemaker 3.0
# behavioral changes,
# https://projects.clusterlabs.org/w/projects/pacemaker/pacemaker_3.0_changes/pacemaker_3.0_behavioral_changes/).
# pcs 0.12 removed only creating a stonith device inside a group; these are top-level.
# pcs 0.12 now runs the agent's own option validation on create, which only warns
# unless --agent-validation is given (pcs CHANGELOG 0.12.0a1,
# https://github.com/ClusterLabs/pcs/blob/main/CHANGELOG.md).
- name: stonith primitives + constraints (run once; idempotent)
  ansible.builtin.shell: |
    set -e
    {% for n in pcmk_site_nodes %}
    if ! pcs stonith status fence_{{ n.name }} >/dev/null 2>&1; then
      pcs stonith create fence_{{ n.name }} fence_virsh \
        ip={{ fence_hypervisor_ip }} username={{ fence_hypervisor_user }} \
        identity_file=/etc/pacemaker/fence_key \
        plug=lab_{{ n.name }} pcmk_host_list={{ n.name }}
      pcs constraint location fence_{{ n.name }} avoids {{ n.name }}
    fi
    {% endfor %}
    pcs property set stonith-enabled=true
    echo configured
  run_once: true
  register: st
  changed_when: false
  become: true
