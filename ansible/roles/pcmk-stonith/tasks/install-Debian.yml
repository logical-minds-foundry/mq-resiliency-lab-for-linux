# noble ships fence_virsh in fence-agents-virsh.
- name: fence agent package (apt)
  ansible.builtin.apt:
    name: fence-agents-virsh
    update_cache: false
    # Wait out a fresh-boot unattended-upgrades holding the dpkg frontend lock
    # instead of failing the cold rebuild (#820, epic .github#104).
    lock_timeout: "{{ apt_lock_timeout }}"
  become: true
