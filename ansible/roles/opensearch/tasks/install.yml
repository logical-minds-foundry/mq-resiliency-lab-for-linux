---
# BAKE (epic .github#70): the install-time half of opensearch — the vm.max_map_count
# sysctl, the opensearch system user, the OpenSearch binary tarball, the data + snapshot
# repo dirs, the STATIC opensearch.yml, the JVM heap drop-in, and the systemd unit.
# All image-bakeable. Deliberately EXCLUDES the service enable+start and the admin
# credential (the configure half): a baked service must NOT auto-start on boot in a
# pre-config state, and the runtime SECRET is never baked into an image. A single-host
# `bake` play consumes this via `tasks_from: install`; the per-run path runs it as the
# first half of main.yml.

# OpenSearch (Lucene mmapfs) refuses to start below this; persist it via a sysctl.d
# drop-in so a rebooted node comes up correct (spec §5). Mirrors the repo's established
# sysctl pattern (net-reach #371): drop the file, then flush handlers to apply it NOW —
# not the ansible.posix.sysctl module (ansible-lint's resolver can't see the collection).
- name: vm.max_map_count for OpenSearch (persistent sysctl.d drop-in)
  ansible.builtin.copy:
    dest: /etc/sysctl.d/99-opensearch.conf
    content: "vm.max_map_count = 262144\n"
    mode: "0644"
  notify: apply opensearch sysctl

# Apply now (not at play end) so the value is live before the configure half starts
# OpenSearch on the un-baked full-role path.
- name: apply the vm.max_map_count sysctl now
  ansible.builtin.meta: flush_handlers

- name: opensearch system user
  ansible.builtin.user:
    name: "{{ opensearch_user }}"
    system: true
    shell: /usr/sbin/nologin
    create_home: false

# Skip-if-baked (mirrors the alloy role): the fat box bakes this install half, so the
# binary is already present. Stat the installed launcher and gate the ~700 MB fetch on
# it, so a baked box re-applying the role never re-downloads OpenSearch.
- name: check for an already-installed opensearch binary (skip the baked download)
  ansible.builtin.stat:
    path: "{{ opensearch_home }}/bin/opensearch"
  register: opensearch_installed

- name: download + unpack opensearch
  ansible.builtin.unarchive:
    src: "{{ opensearch_url }}"
    dest: /usr/share
    remote_src: true
    owner: "{{ opensearch_user }}"
    group: "{{ opensearch_user }}"
    creates: "/usr/share/opensearch-{{ opensearch_version }}/bin/opensearch"
  when: not opensearch_installed.stat.exists

- name: symlink {{ opensearch_home }} -> the versioned install dir
  ansible.builtin.file:
    src: "/usr/share/opensearch-{{ opensearch_version }}"
    dest: "{{ opensearch_home }}"
    state: link
    force: true

- name: opensearch data + snapshot-repo dirs
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ opensearch_user }}"
    group: "{{ opensearch_user }}"
    mode: "0750"
  loop:
    - "{{ opensearch_data_dir }}"
    - "{{ opensearch_repo_dir }}"

- name: deploy the static opensearch.yml
  ansible.builtin.template:
    src: opensearch.yml.j2
    dest: "{{ opensearch_home }}/config/opensearch.yml"
    owner: "{{ opensearch_user }}"
    group: "{{ opensearch_user }}"
    mode: "0640"
  notify: restart opensearch

# jvm.options.d is applied LAST, so -XX:-AlwaysPreTouch here overrides the launcher's
# default +AlwaysPreTouch (verified live). AlwaysPreTouch pre-faults the WHOLE heap at
# startup; under macOS host memory pressure (many nested VMs oversubscribing the host)
# that pre-fault is pathologically slow and dominated a 7-min pre-Node-init bootstrap
# gap on a cold boot (#1034, epic .github#198). Disabling it lets the heap fault in
# lazily instead of stalling bring-up up front.
- name: JVM heap drop-in
  ansible.builtin.copy:
    dest: "{{ opensearch_home }}/config/jvm.options.d/heap.options"
    owner: "{{ opensearch_user }}"
    group: "{{ opensearch_user }}"
    mode: "0640"
    content: |
      -Xms{{ opensearch_heap }}
      -Xmx{{ opensearch_heap }}
      -XX:-AlwaysPreTouch
  notify: restart opensearch

- name: install the systemd unit (INERT — not enabled/started here; configure half owns that)
  ansible.builtin.copy:
    dest: /etc/systemd/system/opensearch.service
    mode: "0644"
    content: |
      [Unit]
      Description=OpenSearch
      After=network-online.target
      Wants=network-online.target

      [Service]
      Type=simple
      User={{ opensearch_user }}
      Group={{ opensearch_user }}
      Environment=OPENSEARCH_HOME={{ opensearch_home }}
      Environment=OPENSEARCH_PATH_CONF={{ opensearch_home }}/config
      Environment=OPENSEARCH_JAVA_HOME={{ opensearch_home }}/jdk
      ExecStart={{ opensearch_home }}/bin/opensearch
      LimitNOFILE=65536
      LimitNPROC=4096
      LimitMEMLOCK=infinity
      LimitAS=infinity
      LimitFSIZE=infinity
      TimeoutStartSec=180
      Restart=on-failure

      [Install]
      WantedBy=multi-user.target
  notify: restart opensearch
