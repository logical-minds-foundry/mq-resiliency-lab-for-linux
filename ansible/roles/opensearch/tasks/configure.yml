---
# CONFIGURE (epic .github#70): the per-run half of opensearch — the admin credential seam,
# the service enable+start, the logs-* index template, the native _snapshot fs repo, and
# restore-on-bring-up. Split out of the bakeable install half so the baked box stays inert
# (no boot-time auto-start in a pre-config state). site-obs.yml (later #149 task)
# invokes this via `tasks_from: configure`; the un-baked full-role path runs it as the
# second half of main.yml.

# --- no admin credential under min (epic .github#198) ---------------------------------
# There is deliberately NO admin-password seam here. It existed only to feed the security
# plugin's `OPENSEARCH_INITIAL_ADMIN_PASSWORD` bootstrap, and this role now installs the min
# (core-only) distribution, which ships WITHOUT that plugin — there is no admin user to
# provision and the engine consumes no such credential. Materializing a lab secret for a
# value nothing reads, and asserting fail-loud on it, would be a dead gate; the plaintext
# telemetry-plane posture (#827) makes the credential unnecessary in v1. A future
# security-on flip (follow-on #819) reintroduces both the security-carrying distribution and
# this seam together.

# --- service enable + start -----------------------------------------------------------
- name: enable + start opensearch
  ansible.builtin.systemd:
    name: opensearch
    enabled: true
    state: started
    daemon_reload: true

- name: wait for the OpenSearch cluster to accept requests
  # green or yellow are BOTH healthy here; only red / unreachable is a failure. On a
  # single node with the replicas:0 template below, health should read green.
  #
  # Budget sized to the host-oversubscribed cold-boot reality (#1197; supersedes the #1034
  # estimate). VAL #1177 measured OpenSearch reaching green in ~15 s when the host is
  # UNCONTENDED (fresh reboot of obs alone), but ~20-33 min during a FULL cold bootstrap:
  # the macOS host (24 cores) is CPU-oversubscribed across all 9 guests (obs alone = 12 vCPU)
  # plus the dev VM, so OpenSearch's JIT-heavy FIRST run is throttled at the hypervisor
  # (invisible to the guest load average). It DOES reach green — just slowly — so the old
  # 900 s (15 min) budget failed the bootstrap prematurely. 480 retries x 5 s = 2400 s
  # (40 min) covers the throttled cold-start with margin while still FAILING LOUD if the tier
  # never comes up (Data Prepper / Dashboards downstream both depend on this store). The
  # real speed fix is reducing host contention during bring-up (bootstrap staging) + the
  # dedicated-core cloud path (#1196); this budget is what makes the constrained host RELIABLE.
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ opensearch_http_port }}/_cluster/health"
    method: GET
    status_code: 200
  register: opensearch_health
  until: opensearch_health.status == 200 and opensearch_health.json.status in ['green', 'yellow']
  retries: 480
  delay: 5

# --- logs-* index template BEFORE any sink writes (connector spike gating finding) -----
- name: PUT the logs-* index template (number_of_replicas:0, envelope mappings)
  # MUST exist before the Data Prepper sink first writes logs-* (connector spike): the sink
  # otherwise creates logs-* with the default replicas:1, which reads yellow forever on a
  # single node. Idempotent PUT.
  #
  # Date detection is OFF (#1230). With OpenSearch's default dynamic date detection, the
  # first document of each daily index fixed any date-looking string field as `date`. An
  # MQ JSON log insert (`ibm_commentInsert2`) sometimes looks like a date, so the whole
  # day's index then rejected every later non-date insert in that slot with HTTP 400
  # (~688 docs/min dropped). Now only the fields DECLARED as date in the template
  # (@timestamp, time, ibm_datetime) are dates. Every other new string field gets the
  # default dynamic string mapping (text + .keyword). The `mq_comment_inserts` dynamic
  # template pins the MQ free-form string inserts (ibm_commentInsert1-3) to that same
  # text + .keyword shape explicitly. The MQ numeric inserts (ibm_arithInsert1-2) are
  # JSON numbers and are left to the default numeric mapping.
  # The mapping is fixed when a daily index is created, so a change here applies only from
  # the next new logs-YYYY.MM.DD index. Docs (OpenSearch 3.8):
  #   https://docs.opensearch.org/3.8/mappings/#date-detection
  #   https://docs.opensearch.org/3.8/mappings/#dynamic-templates
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ opensearch_http_port }}/_index_template/{{ opensearch_index_template_name }}"
    method: PUT
    body_format: json
    body: "{{ lookup('ansible.builtin.template', 'index-template.json.j2') | from_json }}"
    status_code: [200, 201]

# --- restore-on-bring-up (snapshot spike; guarded, LOGGED no-op when no snapshot) ------
- name: look for the latest host-side snapshot artifact (control host)
  # The host snapshot store is build/state/logsearch/, resolved via `mqlab build path state`
  # by the CALLER (site-obs.yml passes opensearch_snapshot_state_dir) — the role never
  # hardcodes a build/<X> path. Empty/absent => a fresh build with no snapshot => a clean,
  # LOGGED no-op (spec §7 accepted tradeoff), never a silent skip.
  ansible.builtin.find:
    paths: "{{ opensearch_snapshot_state_dir }}"
    patterns: "*.tar.gz"
  delegate_to: localhost
  become: false
  register: opensearch_host_snapshots
  when: opensearch_snapshot_state_dir | length > 0

- name: stage the latest host snapshot into path.repo
  when:
    - opensearch_snapshot_state_dir | length > 0
    - opensearch_host_snapshots.files | default([]) | length > 0
  block:
    - name: pick the latest snapshot tarball (names sort by UTC timestamp)
      ansible.builtin.set_fact:
        opensearch_latest_snapshot: "{{ opensearch_host_snapshots.files | map(attribute='path') | sort | last }}"

    # Staged on disk under lab_stage_dir, never /tmp (#1417): a log snapshot can be large
    # and obs's Ubuntu 26.04 /tmp is a RAM-sized tmpfs.
    - name: staging dir (on disk)
      ansible.builtin.include_tasks: ../../../tasks/lab-stage-dir.yml

    - name: copy the snapshot tarball to the guest
      ansible.builtin.copy:
        src: "{{ opensearch_latest_snapshot }}"
        dest: "{{ lab_stage_dir }}/{{ opensearch_latest_snapshot | basename }}"
        owner: "{{ opensearch_user }}"
        group: "{{ opensearch_user }}"
        mode: "0640"

    - name: unpack the snapshot repo contents into path.repo
      ansible.builtin.unarchive:
        src: "{{ lab_stage_dir }}/{{ opensearch_latest_snapshot | basename }}"
        dest: "{{ opensearch_repo_dir }}"
        remote_src: true
        owner: "{{ opensearch_user }}"
        group: "{{ opensearch_user }}"

    # /var/tmp is not wiped at boot the way /tmp was: remove the staged tarball now that
    # its contents are in path.repo.
    - name: remove the staged snapshot tarball
      ansible.builtin.file:
        path: "{{ lab_stage_dir }}/{{ opensearch_latest_snapshot | basename }}"
        state: absent

# Register the fs repo AFTER any restored files are in place so OpenSearch scans them.
# Runs on every bring-up (a fresh build registers an empty repo so future snapshots work).
- name: register the native filesystem snapshot repository
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ opensearch_http_port }}/_snapshot/{{ opensearch_snapshot_repo }}"
    method: PUT
    body_format: json
    body:
      type: fs
      settings:
        location: "{{ opensearch_repo_dir }}"
        compress: true
    status_code: [200, 201]

- name: restore the latest snapshot from the staged repo
  when:
    - opensearch_snapshot_state_dir | length > 0
    - opensearch_host_snapshots.files | default([]) | length > 0
  block:
    - name: list the snapshots the staged repo carries
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ opensearch_http_port }}/_snapshot/{{ opensearch_snapshot_repo }}/_all"
        method: GET
        status_code: 200
      register: opensearch_repo_snapshots

    - name: pick the latest snapshot id (names sort by UTC timestamp)
      ansible.builtin.set_fact:
        opensearch_restore_id: "{{ opensearch_repo_snapshots.json.snapshots | map(attribute='snapshot') | sort | last }}"
      when: opensearch_repo_snapshots.json.snapshots | default([]) | length > 0

    # Idempotent restore (#1379). site-obs.yml runs on EVERY stack bootstrap, and the
    # commons (obs) outlive any one stack. The first bring-up restores the snapshot and
    # opens its indices; the Data Prepper sink then keeps writing into the current daily
    # index. A second stack bootstrap that re-POSTs the full restore collides with those
    # open indices (HTTP 500 "an open index with same name already exists") and fails the
    # observe phase. So restore ONLY the snapshot indices the cluster does not already
    # hold. A present index is never overwritten: it already carries the restored corpus
    # plus whatever the live sink appended since. A fresh cold obs holds none of them, so
    # the first restore still restores everything. Genuine API failures stay fail-loud.
    - name: list the indices the cluster already holds (open or closed)
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ opensearch_http_port }}/_cat/indices?format=json&h=index&expand_wildcards=all"
        method: GET
        status_code: 200
      register: opensearch_existing_indices
      when: opensearch_repo_snapshots.json.snapshots | default([]) | length > 0

    - name: compute the snapshot indices missing from the cluster
      ansible.builtin.set_fact:
        opensearch_restore_indices: >-
          {{ opensearch_repo_snapshots.json.snapshots
             | selectattr('snapshot', 'equalto', opensearch_restore_id)
             | map(attribute='indices') | first
             | difference(opensearch_existing_indices.json | map(attribute='index') | list)
             | sort }}
      when: opensearch_repo_snapshots.json.snapshots | default([]) | length > 0

    - name: restore the latest repo snapshot (only the indices not already present)
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ opensearch_http_port }}/_snapshot/{{ opensearch_snapshot_repo }}/{{ opensearch_restore_id }}/_restore?wait_for_completion=true"
        method: POST
        body_format: json
        body:
          indices: "{{ opensearch_restore_indices | join(',') }}"
          include_global_state: false
        status_code: 200
      when:
        - opensearch_repo_snapshots.json.snapshots | default([]) | length > 0
        - opensearch_restore_indices | length > 0

    - name: report when every snapshot index is already present (restore skipped)
      ansible.builtin.debug:
        msg: >-
          opensearch: every index in snapshot '{{ opensearch_restore_id }}' is already
          present in the cluster (an earlier bring-up restored it), so the restore is
          skipped and the live indices are kept.
      when:
        - opensearch_repo_snapshots.json.snapshots | default([]) | length > 0
        - opensearch_restore_indices | length == 0

- name: report when there is no snapshot to restore (fresh build starts empty)
  ansible.builtin.debug:
    msg: >-
      opensearch: no host-side snapshot under
      '{{ opensearch_snapshot_state_dir | default('(unset)', true) }}' — starting with an
      empty corpus (accepted tradeoff, spec §7). Capture one with `mqlab logsearch snapshot`.
  when: >-
    opensearch_snapshot_state_dir | length == 0
    or (opensearch_host_snapshots.files | default([]) | length == 0)
