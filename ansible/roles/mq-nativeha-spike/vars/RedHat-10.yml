---
# mq-nativeha-spike per-OS-version values for RHEL 10 (#1440, epic .github#315), loaded by
# ansible/tasks/os-vars.yml. The spike runs on the reused rdqm-* RHEL slots, so it needs a
# vars file for every OS rdqm-rhel offers. The offline DVD dnf repo's display name; the
# point release comes from the guest's facts.
nha_spike_dvd_repo_name: "RHEL {{ ansible_distribution_version }} DVD"
