---
# pdrbd-qm (epic .github#310, #1427): one RDQM-shaped replicated volume per QM. Every value
# is the RDQM blueprint's (docs/reference/rdqm-blueprint/; reconciled on #1427, adopted by
# the owner 2026-10-17 under .github#362); each line names its source file.
pdrbd_vg: drbdpool                    # rdqm-a1/vgs.txt
pdrbd_res: "{{ qm_name | lower }}"    # HA resource = lower-case QM (rdqm-a1/drbd-dump.txt)
pdrbd_lv: "{{ pdrbd_res }}_00"        # rdqm-a1/lvs.txt (rdqmapp_00)
pdrbd_lv_size: 3072M                  # rdqm-a1/pcmk-config.txt rdqmapp-size=3072; lvs.txt 3.00g
pdrbd_fstype: ext4                    # rdqm-a1/mounts.txt
pdrbd_mount_opts: defaults            # rdqm-a1/mounts.txt (rw,relatime; seclabel is SELinux)
pdrbd_mount_root: /var/mqm/vols       # rdqm-a1/mounts.txt
pdrbd_mount: "{{ pdrbd_mount_root }}/{{ pdrbd_res }}"
pdrbd_ha_port: 7000                   # rdqm-a1/pcmk-config.txt rdqmapp-drbd-port
pdrbd_ha_minor: 100                   # rdqm-a1/pcmk-config.txt rdqmapp-drbd-minor
pdrbd_stickiness: 1                   # rdqm-a1/pcmk-config.txt rsc_defaults
pdrbd_preferred_score: 50             # rdqm-a1/pcmk-config.txt rdqmapp_preferred_location
# Shape (plan "The shape decision"), fixed when the QM is FIRST created and never changed
# on a formed QM (RDQM fixes it at `crtmqm -rr`; IBM "Creating DR/HA RDQMs", 10.0.x).
# DR/HA (the default): the HA resource plus the stacked DR resource, at both sites.
# HA-only (`bootstrap --no-dr` passes dr_enabled=false): the HA resource alone, as RDQM's
# `crtmqm -sx -reh` QM has no `.dr` resource.
pdrbd_dr: "{{ dr_enabled | default(true) | bool }}"
pdrbd_dr_res: "{{ pdrbd_res }}.dr"    # rdqm-a1/drbd-dump.txt (rdqmapp.dr)
pdrbd_dr_port: 7001                   # rdqm-a1/pcmk-config.txt rdqmapp-dr-port
pdrbd_dr_minor: 7001                  # rdqm-a1/drbd-dump.txt device minor 7001
# The other site as ONE logical DR peer, named as RDQM names it (rdqm-a1/drbd-conf.txt
# `on encrypted.remote`; BP README §2.1). DRBD asks tlshd to verify the peer under this
# name, so every node's replication certificate carries it as a SAN (lab #1609; it MUST
# equal pdrbd-replication-tls's pdrbd_repl_group_dns; ledger RP-5, SC-1).
pdrbd_dr_peer_name: encrypted.remote
# The ONE device mkfs formats and Pacemaker mounts. With DR it is the STACKED device
# (rdqm-a1/pcmk-config.txt device=/dev/drbd/by-res/rdqmapp.dr/0): the stacked resource's
# internal metadata makes it smaller than the HA device ([UG] 5.20.1 "Device stacking
# considerations"), so the two must never diverge. HA-only: the HA device. The by-res
# links need udev-always-use-vnr, rendered in global_common.conf as RDQM does.
pdrbd_fs_device: "/dev/drbd/by-res/{{ pdrbd_dr_res if pdrbd_dr | bool else pdrbd_res }}/0"
# The QM's TLS keystore directory, on the replicated volume so SSLKEYR follows the QM
# (the pcmk arm's /mqshared/ssl precedent). pki-distribute needs a dedicated directory.
pdrbd_ssl_dir: "{{ pdrbd_mount }}/ssl"
# Set by the play (site-pdrbd.yml) from vars/pdrbd-peers.yml:
#   pdrbd_site_group:   pdrbd_a | pdrbd_b
#   pdrbd_site_peers:   [{ name, addr_hb, addr_wan, node_id, site }]   # this site's 3 nodes
#   pdrbd_remote_peers: the other site's 3 nodes (the DR template's path targets)
#   pdrbd_my_wan:       this node's net-wan address
#   pdrbd_dr_local_id:  0 at site A, 1 at site B (rdqm-a1/rdqm-b1 drbd-dump.txt)
# and from vars/pdrbd-crm-mon.yml: pdrbd_crm_role_re (the crm_mon clone-role parse).
