---
# There is deliberately NO fixed list of PAM files (#1414): the role DISCOVERS every file
# under /etc/pam.d with an active pam_motd session line (grep -rlP with the regex below) and
# edits each one. Ubuntu 24.04 ships the pair in /etc/pam.d/sshd and /etc/pam.d/login
# (openssh debian/openssh-server.sshd.pam.in, shadow debian/login.pam); Ubuntu 26.04 also
# has one in /etc/pam.d/remote, which the old fixed sshd/login list missed:
#   session    optional     pam_motd.so  motd=/run/motd.dynamic   <- runs /etc/update-motd.d
#   session    optional     pam_motd.so noupdate                  <- static /etc/motd only
# The first line is the expensive one (run-parts /etc/update-motd.d, incl.
# 50-landscape-sysinfo); the second is dropped too so nothing MOTD-related runs per login.
#
# An ACTIVE pam_motd session line: optional leading space, `session`, a control field (a
# bare keyword or a bracketed [..] form), then pam_motd.so. A commented line starts with `#`
# and never matches, which is what makes the replace idempotent. Python- and PCRE-compatible
# (the replace module and the `grep -P` discovery + verify share it).
motd_off_active_regex: '^(\s*session\s+(?:\[[^\]]*\]|\S+)\s+pam_motd\.so\b.*)$'

# The base-files timer that refreshes the MOTD news in the background (motd-news.service
# fetches motd.ubuntu.com). Nothing would display it once pam_motd is off; masked so it
# never wakes up either.
motd_off_timers:
  - motd-news.timer
