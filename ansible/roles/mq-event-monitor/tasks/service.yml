---
# MQ event monitoring — QM-level MQSC (#514 enable + #515 SERVICE define). Runs ONCE on
# the active instance; the objects replicate (raft / DRBD / shared LUN) and travel with
# the QM. Host-prep (main.yml: wrapper + asserts) must have run on every failover-capable
# node first. Requires: qmgr_name; optional mq_event_perf_queues.
#
# Every MQSC step here MUST APPLY, and asserts it did — it never merely "does not error".
# The old `failed_when: rc not in [0, 10]` tolerance silently swallowed a hard rejection
# (LOGGEREV on a circular-logging QM aborted the whole ALTER, so no event class ever
# enabled — #721). A must-apply command that fails now fails loudly, and the collector's
# RUNNING state is proven, not assumed.

# LOGGEREV is now LOG-TYPE-AWARE via declare-and-verify (#809, epic .github#145), resolving the
# #721 note. LOGGEREV is only valid on a linear/replicated-logging queue manager; the arm DECLARES
# its log type (mq_log_type, default circular; Native HA arms declare replicated) and the two steps
# below (1) VERIFY the declaration against the live QM's actual LogType read from qm.ini — the
# authority — failing loud on drift, then (2) emit LOGGEREV(ENABLED) on replicated arms and an
# explicit LOGGEREV(DISABLED) on circular arms. Both are ACCEPTED (spike #808: on a circular QM,
# LOGGEREV(ENABLED) is rejected wholesale with AMQ8518E, but LOGGEREV(DISABLED) is accepted as an
# AMQ8005I no-op) — so a single must-apply ALTER carries a LOGGEREV clause on EVERY arm and the
# circular branch is a VERIFIED NEGATIVE, not an untested omission. (DISPLAY QMGR LOGTYPE does not
# exist — it is a syntax error, AMQ8405I; the log type lives only in qm.ini's Log: stanza.)
#
# The live QM's qm.ini is the authority; the declaration is checked against it, never trusted over
# it. This slurp runs on the active instance (Native HA replicates qm.ini to every node).
- name: read the live queue manager's actual log type from qm.ini (#809)
  ansible.builtin.slurp:
    src: "/var/mqm/qmgrs/{{ qmgr_name }}/qm.ini"
  become: true
  become_user: mqm
  register: qm_ini

- name: extract the actual LogType from the qm.ini Log stanza (#809)
  ansible.builtin.set_fact:
    _qm_actual_logtype: >-
      {{ (qm_ini.content | b64decode
          | regex_search('(?im)^[ \t]*LogType[ \t]*=[ \t]*(\w+)', '\1')
          | default([], true) | first | default('')) | upper }}

- name: assert the declared log type matches the live QM's qm.ini — fail loud on drift (#809)
  ansible.builtin.assert:
    that:
      - _qm_actual_logtype | length > 0
      - >-
        (mq_log_type == 'replicated' and _qm_actual_logtype == 'REPLICATED')
        or (mq_log_type == 'circular' and _qm_actual_logtype == 'CIRCULAR')
    fail_msg: >-
      Declared mq_log_type={{ mq_log_type }} but the live QM {{ qmgr_name }} reports
      LogType={{ _qm_actual_logtype | default('(unreadable)') }} in qm.ini — log-type drift;
      refusing to proceed (LOGGEREV would be wrong for the real log type).
    success_msg: >-
      Log type verified: declared mq_log_type={{ mq_log_type }} matches qm.ini
      LogType={{ _qm_actual_logtype }}.
    quiet: true

# One must-apply ALTER for all 12 classes. The LOGGEREV clause is chosen from the (now verified)
# log type: ENABLED on replicated/linear (valid), DISABLED on circular (accepted no-op, the verified
# negative). Both return AMQ8005I, so the must-apply assertion below is uniform across arms.
- name: enable instrumentation events (log-type-aware LOGGEREV) (#514/#809)
  ansible.builtin.shell: |
    set -o pipefail
    printf "ALTER QMGR AUTHOREV(ENABLED) CHADEV(ENABLED) CHLEV(ENABLED) CONFIGEV(ENABLED) INHIBTEV(ENABLED) LOCALEV(ENABLED) PERFMEV(ENABLED) REMOTEEV(ENABLED) SSLEV(ENABLED) STRSTPEV(ENABLED) {{ 'LOGGEREV(ENABLED)' if mq_log_type == 'replicated' else 'LOGGEREV(DISABLED)' }} CMDEV(NODISPLAY)\n" \
      | /opt/mqm/bin/runmqsc {{ qmgr_name }}
  args:
    executable: /bin/bash
  become: true
  become_user: mqm
  register: evgate
  changed_when: "'AMQ8005' in evgate.stdout"
  # Must apply cleanly: rc 0 AND AMQ8005I (queue manager changed). Anything else — e.g. an
  # invalid attribute rejecting the whole ALTER — is a real failure and must surface.
  failed_when: evgate.rc != 0 or 'AMQ8005' not in evgate.stdout

- name: enable per-queue performance events on the app queue(s) (#514)
  ansible.builtin.shell: |
    set -o pipefail
    printf "ALTER QLOCAL({{ item }}) QDPMAXEV(ENABLED) QDPHIEV(ENABLED) QDEPTHHI(80)\n" \
      | /opt/mqm/bin/runmqsc {{ qmgr_name }}
  args:
    executable: /bin/bash
  become: true
  become_user: mqm
  loop: "{{ mq_event_perf_queues | default([]) }}"
  register: perfq
  changed_when: "'AMQ8008' in perfq.stdout"
  # The ALTER QLOCAL must apply: rc 0 AND AMQ8008I (queue changed). A missing queue or any
  # other rejection must surface, not be tolerated.
  failed_when: perfq.rc != 0 or 'AMQ8008' not in perfq.stdout

# Define the service and start it now. CONTROL(QMGR) auto-starts it on future QM starts.
# STARTCMD launches run.sh under `setsid -w --` so the wrapper leads its own process group (its pid
# == its pgid; #760/A0) — that dedicated group is the point: it lets STOPCMD reap the wrapper AND its
# amqsevt child in one signal (the resilient wrapper, .github#122). STOPCMD is `/bin/kill`, STOPARG is
# `-TERM -- -+MQ_SERVER_PID+`: MQ substitutes the `+MQ_SERVER_PID+` insert (the group-leader pid, since
# setsid makes run.sh the leader) even when embedded, so this expands to `kill -TERM -- -<pid>` and the
# NEGATIVE pid signals the whole process group. `--` is for procps-ng /bin/kill (treat `-<pgid>` as a
# group, not an option). (An earlier design used a stop.sh + pgrep because a T2 diagnostic that OMITTED
# the `+` delimiters wrongly concluded MQ does not substitute MQ_SERVER_PID; #784 corrected that.)
# `-w` keeps the QM-tracked process alive should MQ ever spawn the STARTCMD as a group leader (forcing
# setsid to fork); A0 shows it does not here, so setsid execs in place. DEFINE ... REPLACE always
# emits AMQ8625I; a START on an already-active service reports the AMQ8737W warning (rc 10) — a
# legitimate re-provision no-op. We assert the DEFINE landed (AMQ8625I) here and prove the collector
# is actually RUNNING in the next task; we do NOT fall back to a blanket rc tolerance that would
# re-hide a genuine define/start failure.
# Sink-aware SERVICE clauses (.github#152): for the file sink the SERVICE redirects the wrapper's
# STDOUT/STDERR to the .error file (so wrapper lifecycle + amqsevt diagnostics land there while events
# go to the .json data file via the in-script redirect); for syslog the STDIO clause is empty and the
# DESCR is the original, so the produced MQSC is byte-for-byte the pre-#152 statement.
- name: compute the sink-aware SERVICE clauses
  ansible.builtin.set_fact:
    _svc_stdio: "{{ \"STDOUT('\" + mq_event_error_file + \"') STDERR('\" + mq_event_error_file + \"') \" if mq_event_sink == 'file' else '' }}"
    # DESCR is path-free and fixed-length (embedding mq_event_data_file blew past MQ's limit on a real QM).
    _svc_descr: "{{ 'Drain SYSTEM.ADMIN.*.EVENT as JSONL to a file (.error=diag)' if mq_event_sink == 'file' else 'Drain SYSTEM.ADMIN.*.EVENT to JSON on journald (mq-events)' }}"

# Fail loud BEFORE runmqsc: MQ's SERVICE DESCR maxes at 64 chars, and an over-length one is rejected
# at runtime with AMQ8413E (String Length Error) that aborts the whole DEFINE — vrg-validate cannot
# see a live MQSC field limit, so guard it here (#841).
- name: assert the SERVICE DESCR fits MQ's 64-char limit (AMQ8413E guard, #841)
  ansible.builtin.assert:
    that: _svc_descr | length <= 64
    fail_msg: "event-monitor SERVICE DESCR is {{ _svc_descr | length }} chars (> MQ's 64-char limit): {{ _svc_descr }}"
    quiet: true

- name: define + start the MQ event-monitor service
  ansible.builtin.shell: |
    set -o pipefail
    printf "DEFINE SERVICE(%s) REPLACE CONTROL(QMGR) SERVTYPE(SERVER) STARTCMD('/usr/bin/setsid') STARTARG('-w -- %s/run.sh %s') {{ _svc_stdio }}STOPCMD('/bin/kill') STOPARG('-TERM -- -+MQ_SERVER_PID+') DESCR('%s')\nSTART SERVICE(%s)\n" \
      "{{ mq_event_service_name }}" "{{ mq_event_run_dir }}" "{{ qmgr_name }}" "{{ _svc_descr }}" "{{ mq_event_service_name }}" \
      | /opt/mqm/bin/runmqsc {{ qmgr_name }}
  args:
    executable: /bin/bash
  become: true
  become_user: mqm
  register: svc
  # Changed on a fresh start; a re-provision where the service is already active carries the
  # AMQ8737W warning and is a no-op.
  changed_when: "'AMQ8737' not in svc.stdout"
  # The DEFINE must succeed (AMQ8625I). rc 10 is NOT blanket-tolerated — it is accepted only
  # because the START-already-active warning carries it, and only when the define landed. A
  # genuine define rejection produces no AMQ8625I and fails here; the RUNNING check below is
  # the authoritative end-state gate.
  failed_when: "'AMQ8625' not in svc.stdout"

# Prove the end state rather than trusting the define/start rc: the collector MUST be
# RUNNING. A genuine define/start failure leaves it not-RUNNING and fails loudly here.
- name: verify the event-monitor service is running
  ansible.builtin.shell: |
    set -o pipefail
    printf "DISPLAY SVSTATUS({{ mq_event_service_name }})\n" \
      | /opt/mqm/bin/runmqsc {{ qmgr_name }}
  args:
    executable: /bin/bash
  become: true
  become_user: mqm
  register: svcstat
  changed_when: false
  failed_when: svcstat.rc != 0 or 'STATUS(RUNNING)' not in svcstat.stdout
