---
# MQ event monitoring — host prep (#515). Runs on EVERY node the QM can fail over to:
# assert the collector's deps and install the run.sh wrapper. The QM-level MQSC (enable +
# SERVICE define) is service.yml, run once on the active instance. Requires: qmgr_name.
- name: assert the amqsevt sample binary is present
  ansible.builtin.stat:
    path: "{{ mq_event_amqsevt_bin }}"
  register: amqsevt_bin

- name: fail loudly if amqsevt is missing
  ansible.builtin.fail:
    msg: >-
      {{ mq_event_amqsevt_bin }} not found — the MQ samples (amqsevt) must be installed on
      the QM host for the event collector to run.
  when: not amqsevt_bin.stat.exists

- name: assert the journald rate-limit drop-in is present (no silent event loss)
  ansible.builtin.stat:
    path: /etc/systemd/journald.conf.d/10-mq.conf
  register: rl_dropin

- name: fail loudly if the rate-limit drop-in is missing
  ansible.builtin.fail:
    msg: >-
      /etc/systemd/journald.conf.d/10-mq.conf is absent — mq-diag-logging must run before
      mq-event-monitor, else 'everything on' event bursts are silently rate-dropped by journald.
  # Only the syslog sink is exposed to journald rate-limiting; the file sink writes to a
  # host-local file and never touches journald, so the drop-in is irrelevant there (#152).
  when: mq_event_sink == 'syslog' and not rl_dropin.stat.exists

- name: run dir for the collector wrapper
  ansible.builtin.file:
    path: "{{ mq_event_run_dir }}"
    state: directory
    mode: "0755"
  become: true

# File sink only: the collector (running as mqm) appends events to <QM>.events.json and its
# diagnostics to <QM>.error under this dir. Created on EVERY failover-capable node so the QM can
# host it wherever it activates. mqm-owned (writable by the collector, readable by a file agent). (#152)
- name: file-sink output directory (mqm-owned) — only when the file sink is selected
  ansible.builtin.file:
    path: "{{ mq_event_file_dir }}"
    state: directory
    owner: mqm
    group: mqm
    mode: "0750"
  become: true
  when: mq_event_sink == 'file'

- name: install the collector wrapper script
  ansible.builtin.template:
    src: run.sh.j2
    dest: "{{ mq_event_run_dir }}/run.sh"
    mode: "0755"
  become: true

# The stop is now the inline `-TERM -- -+MQ_SERVER_PID+` group-kill in the SERVICE
# definition (service.yml); the old stop.sh helper is gone (#786). A node provisioned
# before that still carries the dead script, so remove it — nothing references it, and
# leaving it invites an operator to think it is live.
- name: remove the obsolete stop helper (superseded by the inline group-kill, #786)
  ansible.builtin.file:
    path: "{{ mq_event_run_dir }}/stop.sh"
    state: absent
  become: true
