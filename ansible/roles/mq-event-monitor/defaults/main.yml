---
# MQ event collector (#515, epic .github#31)
mq_event_amqsevt_bin: /opt/mqm/samp/bin/amqsevt
mq_event_syslog_tag: mq-events
mq_event_run_dir: /opt/mq-event-monitor
mq_event_service_name: MQ.EVENT.MONITOR

# Max single-message size (bytes) passed to `logger`. logger defaults to RFC 3164's 1 KiB and
# SPLITS any longer input line into multiple syslog/journald entries — which shreds a full
# CONFIG event (a whole-object dump, ~4 KB on a QMGR) into ~1 KiB fragments, none valid JSON.
# 32 KiB holds the largest event our enabled classes emit with wide margin, and stays under
# journald's default LineMax (48 KiB); mq-diag-logging's drop-in only disables rate-limiting,
# so that 48 KiB ceiling is unchanged. Proven in the lab: at the 1 KiB default the config
# event splits into 4 unparseable entries; at 32 KiB it lands as one parseable entry.
mq_event_logger_max_size: 32768

# Resilient wrapper (.github#122). Crash-restart sleep. Kept intentionally SHORTER than the
# queue manager's stale-handle reap window (measured at a consistent ~29s in #760/A3): on a
# crash the restarting amqsevt re-opens the EXCLUSIVE event queue and hits 2042 for the first
# ~2 tries, then succeeds on the ~3rd once the QM has reaped the dead handle. That fail-twice-
# then-succeed pattern is a DELIBERATE, at-no-cost operational tell that the retry path is alive
# and working (per #122 review) — recovery lands at ~30s either way, gated by the reap.
mq_event_sleep_secs: 10
# Bounded open-retry: how long to keep retrying a persistently-failing amqsevt (e.g. a 2042 that
# never clears because a queue is genuinely held by a live owner) before the wrapper exits
# non-zero — loud — so the SERVICE goes down visibly rather than looping forever. 0 = retry
# forever. Order ~30min; comfortably clears the ~29s reap while still surfacing a real wedge.
mq_event_open_retry_secs: 1800

# Log type this arm's QM runs. Native HA arms override to 'replicated' (a linear-
# equivalent log, per IBM — automatic log management on a replicated log); everything
# else is circular. Drives LOGGEREV, which is only valid on a linear/replicated QM
# (#721 / #145 / #809). The declared value is checked against the live QM's actual
# LogType (read from qm.ini) before any ALTER, and drift fails loud.
mq_log_type: circular

# Application queues that should emit performance events (queue depth high / full).
# Empty by default: PERFMEV is enabled at the QMGR, but per-queue QDPMAXEV/QDPHIEV
# thresholds only make sense on real app queues, so each arm sets its own list at the
# include call site (e.g. ["PCMK.SVC.REQUEST"]). Empty = safe no-op.
mq_event_perf_queues: []

# Sink selector (.github#152). The choice lives HERE, in the management layer, and is resolved at
# TEMPLATE-RENDER time — so the delivered run.sh is single-purpose (no runtime sink branch, and no
# `logger` at all in the file variant). 'syslog' stays the lab default: it feeds journald -> Alloy
# and inherits the platform's forwarding/rotation. 'file' appends JSONL to a host-local data file
# for a downstream file-monitoring agent.
mq_event_sink: syslog
# File-sink outputs (only meaningful when mq_event_sink == 'file'). Host-local, mqm-owned, per-QM
# (so a failover node can host its own). .json = the JSONL event stream (THE sink); .error = the
# wrapper's lifecycle + amqsevt's diagnostics (the SERVICE STDOUT/STDERR redirect).
mq_event_file_dir: /var/mqm/event-monitor
mq_event_data_file: "{{ mq_event_file_dir }}/{{ qmgr_name }}.events.json"
mq_event_error_file: "{{ mq_event_file_dir }}/{{ qmgr_name }}.error"
