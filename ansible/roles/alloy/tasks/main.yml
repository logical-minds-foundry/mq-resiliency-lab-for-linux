---
# Split along the bake/configure line (#602): the install half (binary + dirs +
# unit) is image-bakeable; the configure half is the per-run config.alloy render +
# the service start. main.yml runs both in order, so the normal per-run path is
# unchanged. A single-host bake play consumes install.yml directly via
# `tasks_from: install`.
- name: install alloy (bakeable)
  ansible.builtin.import_tasks: install.yml

- name: configure alloy (per-run config + start)
  ansible.builtin.import_tasks: configure.yml
