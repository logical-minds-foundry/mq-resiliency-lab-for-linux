---
# The textfile drop zone is OWNED by the node-exporter role (02775 + the default ACL,
# #449/#458/#493), which runs earlier in this play. This role only checks it: a
# file task here once reset it to 0755 and stripped the requester write access
# (#1378), so never manage its mode outside node-exporter.
- name: look for the shared textfile drop zone
  ansible.builtin.stat:
    path: /var/lib/node_exporter/textfile
  register: _nr_dropzone

- name: the textfile drop zone is the node-exporter shared 02775 dir
  ansible.builtin.assert:
    that:
      - _nr_dropzone.stat.isdir | default(false)
      - _nr_dropzone.stat.mode == '2775'
    fail_msg: >-
      /var/lib/node_exporter/textfile on {{ inventory_hostname }} is missing or not
      mode 2775 - run the node-exporter role (observability.yml) to restore the
      shared drop zone

- name: deploy the peer-ping script (this host's peers baked in)
  ansible.builtin.template:
    src: lab-net-reach.sh.j2
    dest: /usr/local/bin/lab-net-reach.sh
    mode: "0755"

- name: install service + timer
  ansible.builtin.template:
    src: "{{ item }}"
    dest: "/etc/systemd/system/{{ item | basename | regex_replace('\\.j2$', '') }}"
    mode: "0644"
  loop: [lab-net-reach.service.j2, lab-net-reach.timer.j2]

- name: unprivileged ICMP for the ping (no setuid needed)
  ansible.builtin.copy:
    dest: /etc/sysctl.d/99-lab-net-reach.conf
    content: "net.ipv4.ping_group_range = 0 2147483647\n"
    mode: "0644"
  notify: apply ping_group_range sysctl

# Apply the sysctl now (not at play end) so unprivileged ping works before the
# timer's probe runs. (#371: replaces a when-changed command task with a handler.)
- name: apply the ping_group_range sysctl now
  ansible.builtin.meta: flush_handlers

- name: enable + start the timer
  ansible.builtin.systemd:
    name: lab-net-reach.timer
    enabled: true
    state: started
    daemon_reload: true
