---
# node-exporter is deliberately baked WHOLE and left ENABLED at bake (#642 benign
# exception, alongside rdqm.service): it is a static host-metrics exporter with NO
# per-run config (#602 classified it "baked whole, static config"). It serves valid
# metrics from boot, races nothing, and cannot come up in a broken pre-config state, so
# it is exempt from the phased-startup disable→start-per-run treatment that applies to
# services with real per-run config dependencies (named, alloy, grafana/prometheus/
# loki). Leaving it enabled keeps it off the per-run start-management surface. The
# observe phase (observability.yml, `hosts: all`) re-applies this whole role per-run,
# which is idempotent.
- name: node_exporter system user
  ansible.builtin.user:
    name: node_exporter
    system: true
    shell: /usr/sbin/nologin
    create_home: false

# Idempotence guards on the INSTALLED binary, not an ephemeral /tmp path (#648).
# node_exporter is baked into the box (/usr/local/bin/node_exporter); the observe
# phase re-applies this role every run. Keying `creates:`/`when:` on the /tmp
# unpack dir (wiped on boot) made the baked box re-download the tarball from GitHub
# EVERY run — a per-run external fetch that flaked the one-shot cold rebuild when
# the libvirt gateway rate-limited bursty parallel-boot DNS. A baked box now skips
# the fetch entirely; the from-scratch (un-baked) path still downloads + installs.
- name: check for an already-installed node_exporter binary
  ansible.builtin.stat:
    path: /usr/local/bin/node_exporter
  register: node_exporter_installed

- name: download + unpack node_exporter
  ansible.builtin.unarchive:
    src: "{{ node_exporter_url }}"
    dest: /tmp
    remote_src: true
    creates: "/tmp/{{ node_exporter_pkg }}/node_exporter"
  when: not node_exporter_installed.stat.exists

- name: install the binary
  ansible.builtin.copy:
    src: "/tmp/{{ node_exporter_pkg }}/node_exporter"
    dest: /usr/local/bin/node_exporter
    mode: "0755"
    remote_src: true
  when: not node_exporter_installed.stat.exists
  notify: restart node_exporter

# A shared drop zone, not node_exporter's private dir: the root-run collectors AND
# the unprivileged app-requester (User=vagrant, in the node_exporter group) publish
# .prom files here. setgid + group-write (02775) keeps it writable by any group
# member regardless of which role chowned it last — this play runs in the `observe`
# phase, AFTER app-requester's `provision`, so 0755 here silently stole write access
# from vagrant and crash-looped the requester on mkstemp EACCES (#449).
- name: node_exporter textfile dir (shared, group-writable drop zone)
  ansible.builtin.file:
    path: /var/lib/node_exporter/textfile
    state: directory
    owner: node_exporter
    group: node_exporter
    mode: "02775"

# Make the drop-zone mode regression-proof (#458): declare it to systemd-tmpfiles so
# the setgid+group-write mode is owned by ONE declarative source and re-asserted on
# every boot — it can no longer silently drift back to 0755 (the #449 hazard).
- name: node_exporter textfile drop-zone tmpfiles.d rule
  ansible.builtin.copy:
    src: node-exporter-textfile.conf
    dest: /etc/tmpfiles.d/node-exporter-textfile.conf
    owner: root
    group: root
    mode: "0644"
  notify: apply node_exporter textfile tmpfiles

# node-exporter (a separate service user) reads the app-requester's OWNER-ONLY
# (0600) .prom files via a POSIX default ACL — so the files need no group/world mode
# bit (which CodeQL flags as py/overly-permissive-file, #491). The cross-user read is
# an env-specific implementation detail: a dependency on the `acl` package (#493).
- name: acl package (setfacl for the drop-zone default ACL)
  ansible.builtin.package:
    name: acl
    state: present
  become: true

- name: default ACL — node_exporter reads new .prom files in the drop zone (#493)
  ansible.builtin.command:
    cmd: setfacl -d -m u:node_exporter:r /var/lib/node_exporter/textfile
  become: true
  changed_when: false

- name: install the systemd unit
  ansible.builtin.template:
    src: node_exporter.service.j2
    dest: /etc/systemd/system/node_exporter.service
    mode: "0644"
  notify: restart node_exporter

- name: enable + start node_exporter
  ansible.builtin.systemd:
    name: node_exporter
    enabled: true
    state: started
    daemon_reload: true
