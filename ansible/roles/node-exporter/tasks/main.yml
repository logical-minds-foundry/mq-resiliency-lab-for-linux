---
- name: node_exporter system user
  ansible.builtin.user:
    name: node_exporter
    system: true
    shell: /usr/sbin/nologin
    create_home: false

- name: download + unpack node_exporter
  ansible.builtin.unarchive:
    src: "{{ node_exporter_url }}"
    dest: /tmp
    remote_src: true
    creates: "/tmp/{{ node_exporter_pkg }}/node_exporter"

- name: install the binary
  ansible.builtin.copy:
    src: "/tmp/{{ node_exporter_pkg }}/node_exporter"
    dest: /usr/local/bin/node_exporter
    mode: "0755"
    remote_src: true
  notify: restart node_exporter

# A shared drop zone, not node_exporter's private dir: the root-run collectors AND
# the unprivileged app-requester (User=vagrant, in the node_exporter group) publish
# .prom files here. setgid + group-write (02775) keeps it writable by any group
# member regardless of which role chowned it last — this play runs in the `observe`
# phase, AFTER app-requester's `provision`, so 0755 here silently stole write access
# from vagrant and crash-looped the requester on mkstemp EACCES (#449).
- name: node_exporter textfile dir (shared, group-writable drop zone)
  ansible.builtin.file:
    path: /var/lib/node_exporter/textfile
    state: directory
    owner: node_exporter
    group: node_exporter
    mode: "02775"

# Make the drop-zone mode regression-proof (#458): declare it to systemd-tmpfiles so
# the setgid+group-write mode is owned by ONE declarative source and re-asserted on
# every boot — it can no longer silently drift back to 0755 (the #449 hazard).
- name: node_exporter textfile drop-zone tmpfiles.d rule
  ansible.builtin.copy:
    src: node-exporter-textfile.conf
    dest: /etc/tmpfiles.d/node-exporter-textfile.conf
    owner: root
    group: root
    mode: "0644"
  notify: apply node_exporter textfile tmpfiles

- name: install the systemd unit
  ansible.builtin.template:
    src: node_exporter.service.j2
    dest: /etc/systemd/system/node_exporter.service
    mode: "0644"
  notify: restart node_exporter

- name: enable + start node_exporter
  ansible.builtin.systemd:
    name: node_exporter
    enabled: true
    state: started
    daemon_reload: true
