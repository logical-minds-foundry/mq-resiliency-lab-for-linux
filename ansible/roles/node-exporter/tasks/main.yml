---
- name: node_exporter system user
  ansible.builtin.user:
    name: node_exporter
    system: true
    shell: /usr/sbin/nologin
    create_home: false

- name: download + unpack node_exporter
  ansible.builtin.unarchive:
    src: "{{ node_exporter_url }}"
    dest: /tmp
    remote_src: true
    creates: "/tmp/{{ node_exporter_pkg }}/node_exporter"

- name: install the binary
  ansible.builtin.copy:
    src: "/tmp/{{ node_exporter_pkg }}/node_exporter"
    dest: /usr/local/bin/node_exporter
    mode: "0755"
    remote_src: true
  notify: restart node_exporter

- name: node_exporter textfile dir
  ansible.builtin.file:
    path: /var/lib/node_exporter/textfile
    state: directory
    owner: node_exporter
    group: node_exporter
    mode: "0755"

- name: install the systemd unit
  ansible.builtin.template:
    src: node_exporter.service.j2
    dest: /etc/systemd/system/node_exporter.service
    mode: "0644"
  notify: restart node_exporter

- name: enable + start node_exporter
  ansible.builtin.systemd:
    name: node_exporter
    enabled: true
    state: started
    daemon_reload: true
