# node-exporter textfile drop zone (#449/#458). Group-writable + setgid so both the
# root-run collectors AND the unprivileged app-requester (User=vagrant, in the
# node_exporter group) can publish .prom files here. Declared to systemd-tmpfiles so
# the mode is re-asserted on every boot from a single source and cannot silently
# regress to a non-group-writable 0755 (the #449 failure: two roles racing on the dir).
d /var/lib/node_exporter/textfile 2775 node_exporter node_exporter -
