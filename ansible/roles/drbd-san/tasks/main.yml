# Host-based DRBD async (protocol A) between the two SAN target VMs, over
# net-wan. The LUN the cluster sees is then exported FROM the drbd device
# instead of the raw disk, so the block storage itself replicates
# cross-site - the hand-built equivalent of RDQM's built-in DR replication.
# Runs on san-a (primary) and san-b (secondary). Vars per host:
#   drbd_self_ip, drbd_peer_ip, drbd_role (primary|secondary)
# DRBD userland + in-tree kernel module, installed OFFLINE from the pre-cached SAN
# debs (#796). Ubuntu ships the DRBD module in linux-modules-extra for the running
# kernel (no DKMS build needed); drbd-utils is the userland. The mqlab bootstrap
# pre-fetches both into san_media_dir on the controller so a cold rebuild copies +
# dpkgs them (disk-speed) instead of a ~100 MB internet pull. Anything absent from
# the cache — e.g. the base box's kernel moved past the cached linux-modules-extra —
# falls back to a normal network `apt install`, so the path self-heals.
- name: record this SAN target's kernel on the controller (self-heals the pre-cache next rebuild, #816)
  ansible.builtin.copy:
    content: "{{ ansible_kernel }}\n"
    dest: "{{ san_media_dir }}/.target-kernel"
    mode: "0644"
  delegate_to: localhost
  become: false
  run_once: true

- name: locate cached SAN debs for drbd on the controller
  ansible.builtin.find:
    paths: "{{ san_media_dir }}"
    patterns:
      - "drbd-utils_*.deb"
      - "linux-modules-extra-{{ ansible_kernel }}_*.deb"
  delegate_to: localhost
  become: false
  register: drbd_san_cache

- name: ensure the SAN deb-cache dir exists on the target
  ansible.builtin.file:
    path: /var/cache/san-debs
    state: directory
    mode: "0755"
  become: true

- name: stage cached SAN debs on the target
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "/var/cache/san-debs/{{ item | basename }}"
    mode: "0644"
  loop: "{{ drbd_san_cache.files | map(attribute='path') | list }}"
  loop_control:
    label: "{{ item | basename }}"
  become: true

- name: install drbd userland + kernel module (cached debs offline, network fallback)
  ansible.builtin.shell: |
    set -euo pipefail
    args=(); need_net=0
    for pkg in drbd-utils "linux-modules-extra-{{ ansible_kernel }}"; do
      deb=$(ls -1 /var/cache/san-debs/"${pkg}"_*.deb 2>/dev/null | sort -V | tail -n1 || true)
      if [ -n "$deb" ]; then args+=("$deb"); else args+=("$pkg"); need_net=1; fi
    done
    if [ "$need_net" = 1 ]; then apt-get update; fi
    DEBIAN_FRONTEND=noninteractive apt-get install -y "${args[@]}"
  args:
    executable: /bin/bash
  register: drbd_san_install
  changed_when: "'Setting up' in drbd_san_install.stdout"
  become: true

- name: load drbd module (builtin-only; no external collection)
  # ansible-core ships no community.general, and the lab never installs galaxy
  # collections (a hand-installed one vanished on VM rebuild — #156). modprobe
  # is idempotent; the lsmod guard keeps reporting honest. set -e fails loud.
  ansible.builtin.shell: |
    set -e
    set -o pipefail
    if lsmod | grep -q '^drbd '; then
      echo already-loaded
    else
      modprobe drbd
      echo loaded
    fi
  args:
    executable: /bin/bash
  register: drbd_modprobe
  changed_when: "'loaded' in drbd_modprobe.stdout"
  become: true

- name: drbd resource definition
  ansible.builtin.copy:
    dest: /etc/drbd.d/mqlun.res
    mode: "0644"
    content: |
      resource mqlun {
        protocol A;
        net {
          ping-timeout 50;
          # Protocol A over a low-latency virtual WAN needs generous buffers;
          # the defaults throttle the one-time initial resync to ~250 KB/s (an
          # 8 GB sync would take HOURS). These restore line rate (~50 MB/s, the
          # 8 GB device syncs in ~3 min). Found the hard way in #67.
          max-buffers 80k;
          sndbuf-size 2M;
          rcvbuf-size 2M;
        }
        disk {
          # Static resync rate with the dynamic controller off, so the initial
          # sync runs flat-out instead of being auto-throttled toward c-min-rate.
          c-plan-ahead 0;
          resync-rate 500M;
        }
        on san-a {
          device    /dev/drbd0;
          disk      /dev/vdb;
          address   10.99.0.5:7790;
          meta-disk internal;
        }
        on san-b {
          device    /dev/drbd0;
          disk      /dev/vdb;
          address   10.99.0.6:7790;
          meta-disk internal;
        }
      }
  become: true

- name: create metadata (idempotent - skip if the resource is up or md present)
  ansible.builtin.shell: |
    set -e
    # `drbdadm dump-md`/`create-md` have TWO ways to wedge a provision:
    #   1. on an in-use (Primary/up) device they block forever on exclusive
    #      access (D-state, the 2-hour stall in #67) -> dodged by checking the
    #      live state first; `drbdadm status` never blocks.
    #   2. on a DOWN device they can still PROMPT on stdin (residual/foreign
    #      md), and Ansible has no stdin to answer -> infinite S-state hang
    #      (#158). Defend with </dev/null (a prompt gets EOF and bails) AND a
    #      timeout (bounded failure, never hours). set -e makes a real create-md
    #      failure abort loud instead of falling through to `echo created`.
    if drbdadm status mqlun >/dev/null 2>&1; then
      echo resource-up
    elif timeout 30 drbdadm dump-md mqlun </dev/null >/dev/null 2>&1; then
      echo md-exists
    else
      timeout 60 drbdadm create-md --force mqlun </dev/null
      echo created
    fi
  register: drbd_md
  changed_when: "'created' in drbd_md.stdout"
  become: true

- name: bring the resource up
  ansible.builtin.shell: |
    drbdadm up mqlun 2>&1 || true
    drbdadm status mqlun
  register: drbd_up
  changed_when: false
  become: true

# `up` above is idempotent (can't fail-loud on its own), but a real attach
# failure -- e.g. `open(/dev/vdb) busy` or invalid md from a stale, reused SAN
# disk (#160) -- leaves the resource Diskless/Unconfigured. Catch it HERE with
# the actual dstate instead of letting it masquerade as a 120s peer-connect
# timeout two plays later (the trap that hid #158). Declarative command +
# failed_when -- NOT a shell free-form (whose quote-splitter rejects a
# case/"" block, which broke the playbook load in #162).
- name: assert the drbd disk attached (fail loud on a failed up)
  ansible.builtin.command: drbdadm dstate mqlun
  register: drbd_dstate
  changed_when: false
  failed_when: >-
    drbd_dstate.rc != 0
    or 'Diskless' in drbd_dstate.stdout
    or 'Unconfigured' in drbd_dstate.stdout
  become: true

# NOTE: promotion + skip-initial-sync + mkfs is NOT here. It needs BOTH peers up
# and connected so the primary can `--clear-bitmap` (declare both in-sync at
# zero, skipping the 8 GB full copy), and this role runs per-host before the
# peer exists. It lives in a post-both-up play in _pcmk-cluster-ha.yml (the
# building block site-pcmk.yml composes; #350 Task 2 consolidation).
