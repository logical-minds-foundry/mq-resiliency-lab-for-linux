---
# mq-install role defaults (#605, epic .github#70).
#
# mq_media_dir: where the MQ-for-Developers Ubuntu tarball lives. Defaults to the
# shared cache bucket (mqlab_cache_dir, group_vars/all/buckets.yml — the main checkout's
# build/cache from any worktree, #1569; never derived from playbook_dir). The fat-box
# builder still passes -e mq_media_dir=<main-worktree>/build/cache/mq explicitly.
# Mirrors rdqm-install's #604 default so both MQ-install paths source their media the
# same way (see lab/boxes/build-fatbox.sh).
mq_media_dir: "{{ mqlab_cache_dir }}/mq"
