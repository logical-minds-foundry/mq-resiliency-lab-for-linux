# L1a: unpack the (host-fetched) MQ debs and install the server set.
- name: copy MQ tar to node
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../build/mq/{{ mq_version }}-IBM-MQ-Advanced-for-Developers-UbuntuLinuxARM64.tar.gz"
    dest: /tmp/mqadv.tar.gz

- name: unpack
  ansible.builtin.unarchive:
    src: /tmp/mqadv.tar.gz
    dest: /tmp
    remote_src: true
    creates: /tmp/MQServer

- name: accept developer licence
  ansible.builtin.command: /tmp/MQServer/mqlicense.sh -accept
  args:
    creates: /var/mqm
  become: true

# Everything in ONE pass, BEFORE any QM exists: MQ's preinst refuses
# additional debs once queue-manager shared resources are active, so the
# sdk (pymqi bindings need cmqc.h) must land with the server set.
- name: install server + sdk debs and python build deps
  ansible.builtin.shell: |
    set -e
    apt-get update
    apt-get install -y python3-venv python3-dev gcc
    cd /tmp/MQServer
    apt-get install -y ./ibmmq-runtime_*.deb ./ibmmq-server_*.deb \
      ./ibmmq-java_*.deb ./ibmmq-jre_*.deb ./ibmmq-gskit_*.deb \
      ./ibmmq-web_*.deb ./ibmmq-sdk_*.deb ./ibmmq-client_*.deb
  args:
    creates: /opt/mqm/inc/cmqc.h
  become: true

- name: set primary installation (loader path for libmqic_r etc.)
  ansible.builtin.command: /opt/mqm/bin/setmqinst -i -p /opt/mqm
  args:
    creates: /etc/ld.so.conf.d/ibmmq-Installation1.conf
  become: true

- name: mqm ulimits
  ansible.builtin.copy:
    dest: /etc/security/limits.d/99-mqm.conf
    content: |
      mqm soft nofile 10240
      mqm hard nofile 10240
  become: true
