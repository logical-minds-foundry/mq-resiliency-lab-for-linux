# L1a: unpack the (host-fetched) MQ debs and install the server set.
# Ubuntu tar suffix tracks the guest arch (host-resolved, #276): ARM64 on the Mac
# dev path, X64 on an x86 host. (The host-side fetch/manifest map mirrors this.)

# Skip-if-baked (#648/#659): the mq-ubuntu2404 fat box has MQ baked (/opt/mqm/inc/cmqc.h
# present), so gate the ~700MB tar copy + unpack on the INSTALLED marker. Keying only on
# the /tmp unpack dir (wiped on boot) made a baked box re-copy + re-unpack the tarball
# EVERY run (~4.5 min) — the offender #659 eliminates. A baked box skips it entirely; the
# from-scratch (un-baked) Ubuntu MQ nodes (nativeha-ubuntu, pcmk-ubuntu) still install.
- name: check for an already-installed MQ (skip the baked install)
  ansible.builtin.stat:
    path: /opt/mqm/inc/cmqc.h
  register: mq_installed

- name: copy MQ tar to node
  ansible.builtin.copy:
    # mq_media_dir defaults to <playbook_dir>/../build/cache/mq (the per-run path); the
    # fat-box bake overrides it to the host-durable main-worktree cache (#605), since a
    # bake runs this worktree's playbook whose build/ is empty.
    src: "{{ mq_media_dir }}/{{ mq_version }}-IBM-MQ-Advanced-for-Developers-UbuntuLinux{{ 'ARM64' if ansible_architecture == 'aarch64' else 'X64' }}.tar.gz"
    dest: /tmp/mqadv.tar.gz
    mode: "0644"
  when: not mq_installed.stat.exists

- name: unpack
  ansible.builtin.unarchive:
    src: /tmp/mqadv.tar.gz
    dest: /tmp
    remote_src: true
    creates: /tmp/MQServer
  when: not mq_installed.stat.exists

- name: accept developer licence
  ansible.builtin.command: /tmp/MQServer/mqlicense.sh -accept
  args:
    creates: /var/mqm
  become: true

# Everything in ONE pass, BEFORE any QM exists: MQ's preinst refuses
# additional debs once queue-manager shared resources are active, so the
# sdk (pymqi bindings need cmqc.h) must land with the server set. The samples
# deb carries /opt/mqm/samp/bin/amqsevt, the event collector mq-event-monitor
# runs on every QM host (#531) — must land pre-QM here, not bolted on later.
- name: install server + sdk + samples debs and python build deps
  ansible.builtin.shell: |
    set -e
    apt-get update
    apt-get install -y python3-venv python3-dev gcc
    cd /tmp/MQServer
    apt-get install -y ./ibmmq-runtime_*.deb ./ibmmq-server_*.deb \
      ./ibmmq-java_*.deb ./ibmmq-jre_*.deb ./ibmmq-gskit_*.deb \
      ./ibmmq-web_*.deb ./ibmmq-sdk_*.deb ./ibmmq-client_*.deb \
      ./ibmmq-samples_*.deb
  args:
    creates: /opt/mqm/inc/cmqc.h
  become: true

- name: set primary installation (loader path for libmqic_r etc.)
  ansible.builtin.command: /opt/mqm/bin/setmqinst -i -p /opt/mqm
  args:
    creates: /etc/ld.so.conf.d/ibmmq-Installation1.conf
  become: true

- name: mqm ulimits
  ansible.builtin.copy:
    dest: /etc/security/limits.d/99-mqm.conf
    mode: "0644"
    content: |
      mqm soft nofile 10240
      mqm hard nofile 10240
  become: true
