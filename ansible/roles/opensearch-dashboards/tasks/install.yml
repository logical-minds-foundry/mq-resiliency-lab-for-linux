---
# BAKE (epic .github#70): the install-time half of opensearch-dashboards — the dashboards
# system user, the Dashboards binary tarball, the STATIC opensearch_dashboards.yml, the
# security-plugin removal (v1 runs OpenSearch security disabled, #827), and the systemd unit.
# All image-bakeable. Deliberately EXCLUDES the service enable+start and the admin credential
# (the configure half): a baked service must NOT auto-start on boot in a pre-config state, and
# a runtime SECRET is never baked into an image. A single-host `bake` play consumes this via
# `tasks_from: install`; the per-run path runs it as the first half of main.yml.

- name: opensearch-dashboards system user
  ansible.builtin.user:
    name: "{{ opensearch_dashboards_user }}"
    system: true
    shell: /usr/sbin/nologin
    create_home: false

# Skip-if-baked (mirrors the opensearch/alloy roles): the fat box bakes this install half, so
# the binary is already present. Stat the installed launcher and gate the ~1 GB fetch on it,
# so a baked box re-applying the role never re-downloads Dashboards.
- name: check for an already-installed opensearch-dashboards binary (skip the baked download)
  ansible.builtin.stat:
    path: "{{ opensearch_dashboards_home }}/bin/opensearch-dashboards"
  register: opensearch_dashboards_installed

- name: download + unpack opensearch-dashboards
  ansible.builtin.unarchive:
    src: "{{ opensearch_dashboards_url }}"
    dest: /usr/share
    remote_src: true
    owner: "{{ opensearch_dashboards_user }}"
    group: "{{ opensearch_dashboards_user }}"
    creates: "/usr/share/opensearch-dashboards-{{ opensearch_dashboards_version }}/bin/opensearch-dashboards"
  when: not opensearch_dashboards_installed.stat.exists

- name: symlink {{ opensearch_dashboards_home }} -> the versioned install dir
  ansible.builtin.file:
    src: "/usr/share/opensearch-dashboards-{{ opensearch_dashboards_version }}"
    dest: "{{ opensearch_dashboards_home }}"
    state: link
    force: true

# v1 telemetry-plane posture (spec §10, #827): OpenSearch runs plugins.security.disabled, so
# the bundled Dashboards security plugin must be removed or Dashboards fails to start hunting
# for the security APIs. Install-time + static => bakeable. Gated on the plugin actually being
# present (idempotent: `remove` errors if it is already gone) and on the security-disabled
# posture, so a future security-on flip (#819) keeps the plugin.
- name: check whether the bundled security-dashboards plugin is present
  ansible.builtin.stat:
    path: "{{ opensearch_dashboards_home }}/plugins/securityDashboards"
  register: opensearch_dashboards_security_plugin

- name: remove the security-dashboards plugin (v1 runs OpenSearch security disabled, #827)
  ansible.builtin.command:
    cmd: "{{ opensearch_dashboards_home }}/bin/opensearch-dashboards-plugin remove securityDashboards"
  when:
    - not (opensearch_dashboards_security_enabled | bool)
    - opensearch_dashboards_security_plugin.stat.exists
  changed_when: true
  notify: restart opensearch-dashboards

- name: deploy the static opensearch_dashboards.yml
  ansible.builtin.template:
    src: opensearch_dashboards.yml.j2
    dest: "{{ opensearch_dashboards_home }}/config/opensearch_dashboards.yml"
    owner: "{{ opensearch_dashboards_user }}"
    group: "{{ opensearch_dashboards_user }}"
    mode: "0640"
  notify: restart opensearch-dashboards

- name: install the systemd unit (INERT — not enabled/started here; configure half owns that)
  ansible.builtin.copy:
    dest: /etc/systemd/system/opensearch-dashboards.service
    mode: "0644"
    content: |
      [Unit]
      Description=OpenSearch Dashboards
      After=network-online.target
      Wants=network-online.target

      [Service]
      Type=simple
      User={{ opensearch_dashboards_user }}
      Group={{ opensearch_dashboards_user }}
      ExecStart={{ opensearch_dashboards_home }}/bin/opensearch-dashboards
      WorkingDirectory={{ opensearch_dashboards_home }}
      TimeoutStartSec=180
      Restart=on-failure

      [Install]
      WantedBy=multi-user.target
  notify: restart opensearch-dashboards
