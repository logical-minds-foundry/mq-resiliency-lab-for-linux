---
# opensearch-dashboards role, split along the bake/configure line (mirrors opensearch #827
# and loki, epic .github#70). The install half (user + binary + static config + security-
# plugin removal + inert systemd unit) is image-bakeable; the configure half (credential
# seam + service enable+start + /api/status wait + the default logs-* index pattern) is held
# out of the bake so no baked service auto-starts in a pre-config state. main.yml runs both
# in order so any caller of the whole role reaches the same end state. The bake playbook
# (later #149 task) invokes ONLY `tasks_from: install`; the per-run bring-up
# (site-logsearch.yml, later #149 task) invokes `tasks_from: configure`.
- ansible.builtin.import_tasks: install.yml
- ansible.builtin.import_tasks: configure.yml
