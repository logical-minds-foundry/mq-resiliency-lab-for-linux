---
# BAKE (#602): the install-time half of the grafana role — the grafana package,
# the STATIC provisioning (prometheus/loki datasource + the dashboard *provider*),
# and the service. Deliberately excludes the topology-rendered dashboard tree
# (a per-run render) and the admin-password env drop-in (a per-run SECRET — never
# baked into an image). A single-host `bake` play consumes this via
# `tasks_from: install`; the normal per-run path runs it as the first half of main.yml.
- name: grafana apt key
  ansible.builtin.get_url:
    url: https://apt.grafana.com/gpg.key
    dest: /etc/apt/keyrings/grafana.asc
    mode: "0644"

- name: grafana apt repo (deb822)
  ansible.builtin.deb822_repository:
    name: grafana
    types: [deb]
    uris: https://apt.grafana.com
    suites: [stable]
    components: [main]
    signed_by: /etc/apt/keyrings/grafana.asc
    state: present

- name: install grafana (pinned when grafana_version is set, else apt-latest) (#266)
  ansible.builtin.apt:
    name: "{{ ('grafana=' + grafana_version) if grafana_version | default('') else 'grafana' }}"
    update_cache: true

- name: provisioning dirs
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: grafana
    group: grafana
    mode: "0755"
  loop:
    - /etc/grafana/provisioning/datasources
    - /etc/grafana/provisioning/dashboards

- name: provision the prometheus datasource
  ansible.builtin.template:
    src: datasource.yml.j2
    dest: /etc/grafana/provisioning/datasources/prometheus.yml
    mode: "0644"
  notify: restart grafana

- name: provision the dashboard provider
  ansible.builtin.template:
    src: dashboards.yml.j2
    dest: /etc/grafana/provisioning/dashboards/lab.yml
    mode: "0644"
  notify: restart grafana

- name: systemd drop-in dir for grafana-server
  ansible.builtin.file:
    path: /etc/systemd/system/grafana-server.service.d
    state: directory
    mode: "0755"

# Server-side rendering env (#877). STATIC config (not a secret) → baked here in the
# install half, unlike the per-run admin-password drop-in. Points Grafana at the
# standalone grafana-image-renderer service so the render API, alert images, and
# scheduled reports produce PNG/PDF. Gated on grafana_rendering (default off); the obs
# deployment turns it on. The removal task keeps re-provisioning idempotent both ways.
- name: grafana env drop-in — server-side rendering (grafana-image-renderer)
  ansible.builtin.copy:
    dest: /etc/systemd/system/grafana-server.service.d/rendering.conf
    mode: "0644"
    content: |
      [Service]
      Environment=GF_RENDERING_SERVER_URL={{ grafana_rendering_server_url }}
      Environment=GF_RENDERING_CALLBACK_URL={{ grafana_rendering_callback_url }}
  when: grafana_rendering | bool
  notify: restart grafana

- name: remove the rendering drop-in when rendering is disabled
  ansible.builtin.file:
    path: /etc/systemd/system/grafana-server.service.d/rendering.conf
    state: absent
  when: not (grafana_rendering | bool)
  notify: restart grafana

# The service enable+start moved to configure.yml (#642): a baked service must NOT
# auto-start on boot in a pre-config state. The grafana deb also auto-enables
# grafana-server on install, so leave it explicitly disabled + stopped here to keep
# the baked image inert — the per-run configure half enables + starts it. On the
# un-baked full-role path (main.yml), configure re-enables it right after, so the end
# state is unchanged.
- name: grafana disabled + stopped at bake (inert until per-run configure)
  ansible.builtin.systemd:
    name: grafana-server
    enabled: false
    state: stopped
    daemon_reload: true
