---
- name: grafana apt key
  ansible.builtin.get_url:
    url: https://apt.grafana.com/gpg.key
    dest: /etc/apt/keyrings/grafana.asc
    mode: "0644"

- name: grafana apt repo (deb822)
  ansible.builtin.deb822_repository:
    name: grafana
    types: [deb]
    uris: https://apt.grafana.com
    suites: [stable]
    components: [main]
    signed_by: /etc/apt/keyrings/grafana.asc
    state: present

- name: install grafana (pinned when grafana_version is set, else apt-latest) (#266)
  ansible.builtin.apt:
    name: "{{ ('grafana=' + grafana_version) if grafana_version | default('') else 'grafana' }}"
    update_cache: true

- name: provisioning dirs
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: grafana
    group: grafana
    mode: "0755"
  loop:
    - /etc/grafana/provisioning/datasources
    - /etc/grafana/provisioning/dashboards
    - /var/lib/grafana/dashboards

- name: provision the prometheus datasource
  ansible.builtin.template:
    src: datasource.yml.j2
    dest: /etc/grafana/provisioning/datasources/prometheus.yml
    mode: "0644"
  notify: restart grafana

- name: provision the dashboard provider
  ansible.builtin.template:
    src: dashboards.yml.j2
    dest: /etc/grafana/provisioning/dashboards/lab.yml
    mode: "0644"
  notify: restart grafana

- name: deploy the rendered lab dashboard
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../build/work/grafana/dashboards/lab-status.json"
    dest: /var/lib/grafana/dashboards/lab-status.json
    owner: grafana
    group: grafana
    mode: "0644"
  notify: restart grafana

- name: deploy the rendered cluster cockpit dashboard (#219)
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../build/work/grafana/dashboards/lab-pcmk-cluster.json"
    dest: /var/lib/grafana/dashboards/lab-pcmk-cluster.json
    owner: grafana
    group: grafana
    mode: "0644"
  notify: restart grafana

- name: deploy the rendered Native HA cockpit dashboard (#279)
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../build/work/grafana/dashboards/lab-nativeha-cluster.json"
    dest: /var/lib/grafana/dashboards/lab-nativeha-cluster.json
    owner: grafana
    group: grafana
    mode: "0644"
  notify: restart grafana

- name: deploy the rendered Native HA (Ubuntu) cockpit dashboard (#417)
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../build/work/grafana/dashboards/lab-nativeha-ubuntu-cluster.json"
    dest: /var/lib/grafana/dashboards/lab-nativeha-ubuntu-cluster.json
    owner: grafana
    group: grafana
    mode: "0644"
  notify: restart grafana

- name: deploy the rendered RDQM cockpit dashboard (#287)
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../build/work/grafana/dashboards/lab-rdqm-cluster.json"
    dest: /var/lib/grafana/dashboards/lab-rdqm-cluster.json
    owner: grafana
    group: grafana
    mode: "0644"
  notify: restart grafana

# the per-stack messaging-flow boards (#431) — one lab-messaging-<stack>.json each,
# rendered by mqlab; copy whichever exist.
- name: deploy the rendered messaging-flow cockpit dashboards (#431)
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "/var/lib/grafana/dashboards/{{ item | basename }}"
    owner: grafana
    group: grafana
    mode: "0644"
  with_fileglob:
    - "{{ playbook_dir }}/../build/work/grafana/dashboards/lab-messaging-*.json"
  notify: restart grafana

- name: deploy the rendered Watcher dashboard — the lab-state front door (#488)
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../build/work/grafana/dashboards/lab-watcher.json"
    dest: /var/lib/grafana/dashboards/lab-watcher.json
    owner: grafana
    group: grafana
    mode: "0644"
  notify: restart grafana

- name: systemd drop-in dir for grafana-server
  ansible.builtin.file:
    path: /etc/systemd/system/grafana-server.service.d
    state: directory
    mode: "0755"

- name: grafana env drop-in — admin password (+ anonymous access in the lab, #258)
  ansible.builtin.copy:
    dest: /etc/systemd/system/grafana-server.service.d/admin.conf
    mode: "0600"
    content: |
      [Service]
      Environment=GF_SECURITY_ADMIN_PASSWORD={{ grafana_admin_password }}
      {% if grafana_anonymous | bool %}
      Environment=GF_AUTH_ANONYMOUS_ENABLED=true
      Environment=GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      Environment=GF_AUTH_DISABLE_LOGIN_FORM=true
      {% endif %}
  notify: restart grafana

- name: enable + start grafana
  ansible.builtin.systemd:
    name: grafana-server
    enabled: true
    state: started
    daemon_reload: true
