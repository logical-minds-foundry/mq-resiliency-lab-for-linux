---
- name: grafana apt key
  ansible.builtin.get_url:
    url: https://apt.grafana.com/gpg.key
    dest: /etc/apt/keyrings/grafana.asc
    mode: "0644"

- name: grafana apt repo (deb822)
  ansible.builtin.deb822_repository:
    name: grafana
    types: [deb]
    uris: https://apt.grafana.com
    suites: [stable]
    components: [main]
    signed_by: /etc/apt/keyrings/grafana.asc
    state: present

- name: install grafana (pinned when grafana_version is set, else apt-latest) (#266)
  ansible.builtin.apt:
    name: "{{ ('grafana=' + grafana_version) if grafana_version | default('') else 'grafana' }}"
    update_cache: true

- name: provisioning dirs
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: grafana
    group: grafana
    mode: "0755"
  loop:
    - /etc/grafana/provisioning/datasources
    - /etc/grafana/provisioning/dashboards

- name: provision the prometheus datasource
  ansible.builtin.template:
    src: datasource.yml.j2
    dest: /etc/grafana/provisioning/datasources/prometheus.yml
    mode: "0644"
  notify: restart grafana

- name: provision the dashboard provider
  ansible.builtin.template:
    src: dashboards.yml.j2
    dest: /etc/grafana/provisioning/dashboards/lab.yml
    mode: "0644"
  notify: restart grafana

# Deploy the whole rendered dashboard tree exactly as mqlab laid it out (#59):
# each stack's boards under its "<Mechanism> (<OS>)" folder, the Watcher at the
# root. Grafana's foldersFromFilesStructure provider then mirrors that directory
# tree into Grafana folders. The dir is reset first so a reorg (a board changing
# folders) never leaves a stale flat copy behind for Grafana to import twice.
- name: reset the provisioned dashboards dir so a folder reorg leaves no stale copies (#59)
  ansible.builtin.file:
    path: /var/lib/grafana/dashboards
    state: absent

- name: recreate the provisioned dashboards dir (#59)
  ansible.builtin.file:
    path: /var/lib/grafana/dashboards
    state: directory
    owner: grafana
    group: grafana
    mode: "0755"

- name: deploy the rendered dashboards, preserving the per-stack folder tree (#59)
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../build/work/grafana/dashboards/"
    dest: /var/lib/grafana/dashboards/
    owner: grafana
    group: grafana
    mode: "0644"
    directory_mode: "0755"
  notify: restart grafana

- name: systemd drop-in dir for grafana-server
  ansible.builtin.file:
    path: /etc/systemd/system/grafana-server.service.d
    state: directory
    mode: "0755"

- name: grafana env drop-in — admin password (+ anonymous access in the lab, #258)
  ansible.builtin.copy:
    dest: /etc/systemd/system/grafana-server.service.d/admin.conf
    mode: "0600"
    content: |
      [Service]
      Environment=GF_SECURITY_ADMIN_PASSWORD={{ grafana_admin_password }}
      {% if grafana_anonymous | bool %}
      Environment=GF_AUTH_ANONYMOUS_ENABLED=true
      Environment=GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      Environment=GF_AUTH_DISABLE_LOGIN_FORM=true
      {% endif %}
  notify: restart grafana

- name: enable + start grafana
  ansible.builtin.systemd:
    name: grafana-server
    enabled: true
    state: started
    daemon_reload: true
