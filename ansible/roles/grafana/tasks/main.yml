---
# Split along the bake/configure line (#602): the install half (package + static
# provisioning + service) is image-bakeable; the configure half is the per-run
# dashboard render + the admin-password secret drop-in. main.yml runs both in order,
# so the normal per-run path reaches the same end state. A single-host bake play
# consumes install.yml directly via `tasks_from: install`.
- name: install grafana (bakeable)
  ansible.builtin.import_tasks: install.yml

- name: configure grafana (per-run dashboards + secret)
  ansible.builtin.import_tasks: configure.yml
