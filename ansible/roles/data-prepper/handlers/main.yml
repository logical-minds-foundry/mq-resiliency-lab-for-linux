---
# Bounded retry on the transient systemd 'unknown state' / D-Bus query race (#882/#881):
# a non-transient failure satisfies `until` on attempt 1 (fail-loud). Mirrors the
# opensearch/loki handlers.
- name: restart data-prepper
  ansible.builtin.systemd:
    name: data-prepper
    state: restarted
    daemon_reload: true
  register: data_prepper_restart
  until: >-
    data_prepper_restart is succeeded or
    data_prepper_restart.msg | default('') is not
    search('Connection reset by peer|D-Bus connection terminated|Service is in unknown state')
  retries: 5
  delay: 5
