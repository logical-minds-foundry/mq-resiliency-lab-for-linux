# The purpose-built benchmark client on the app host (#1106, epic #227). On-demand tool,
# NOT a managed service: deliberately not entangled with the always-on mq-app-requester
# stream. The client is the BAKED mq-resiliency-clients component's mq-bench entry point
# (epic .github#294 T9); this role asserts the component is baked, retires the pre-#294
# home-dir script, and renders the deployer-owned /home/vagrant/mq-bench wrapper that
# bakes this stack's QM/conn/TLS defaults in front of the entry point (operator-facing
# path and behaviour unchanged, spec §5.4 r6).
- name: look for the baked clients component
  ansible.builtin.stat:
    path: /opt/logical-minds-foundry/mq-resiliency-clients/INSTALLED.json
  register: _bench_client_baked

- name: the clients component is baked on this box
  ansible.builtin.assert:
    that: _bench_client_baked.stat.exists
    fail_msg: >-
      mq-resiliency-clients is not installed on {{ inventory_hostname }}
      (no /opt/logical-minds-foundry/mq-resiliency-clients/INSTALLED.json) -
      rebuild its box (mqlab box build <box>) or install it live
      (mqlab component install mq-resiliency-clients --host {{ inventory_hostname }})

# No dual running (spec 8): the pre-#294 home-dir script goes.
- name: retire the pre-#294 benchmark script
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /home/vagrant/bench_client.py
  become: true

# A thin, deployer-owned wrapper baking this stack's QM/conn/TLS defaults. The sweep
# passes extra args ("$@") that override them (argparse: last occurrence wins), so one
# wrapper still targets NHARCAPP or NHARIAPP via `mq-bench --qm <QM>`.
- name: benchmark client wrapper (mq-bench)
  ansible.builtin.template:
    src: mq-bench.j2
    dest: /home/vagrant/mq-bench
    owner: vagrant
    group: vagrant
    mode: "0755"
  become: true
