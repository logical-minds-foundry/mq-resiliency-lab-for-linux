# The purpose-built benchmark client on the app host (#1106, epic #227). On-demand tool,
# NOT a managed service: deliberately not entangled with the always-on mq-app-requester
# stream. The client is the BAKED mq-resiliency-clients component's mq-bench entry point
# (epic .github#294 T9); this role only asserts the component is baked, retires the
# pre-#294 home-dir copy + wrapper, and puts mq-bench on PATH. The entry point takes every
# target flag itself (--qm, --conn, --channel, --queue, --keyrepo, --certlabel; argparse
# defaults otherwise), so the sweep passes them per {mode, delay} point.
- name: look for the baked clients component
  ansible.builtin.stat:
    path: /opt/logical-minds-foundry/mq-resiliency-clients/INSTALLED.json
  register: _bench_client_baked

- name: the clients component is baked on this box
  ansible.builtin.assert:
    that: _bench_client_baked.stat.exists
    fail_msg: >-
      mq-resiliency-clients is not installed on {{ inventory_hostname }}
      (no /opt/logical-minds-foundry/mq-resiliency-clients/INSTALLED.json) -
      rebuild its box (mqlab box build <box>) or install it live
      (mqlab component install mq-resiliency-clients --host {{ inventory_hostname }})

# No dual running (spec 8): the pre-#294 home-dir script and its wrapper go.
- name: retire the pre-#294 benchmark script and wrapper
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /home/vagrant/bench_client.py
    - /home/vagrant/mq-bench
  become: true

- name: mq-bench on PATH (symlink to the component entry point)
  ansible.builtin.file:
    src: /opt/logical-minds-foundry/mq-resiliency-clients/venv/bin/mq-bench
    dest: /usr/local/bin/mq-bench
    state: link
  become: true
