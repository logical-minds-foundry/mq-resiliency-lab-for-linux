---
# System-level JSON diagnostic logging (#282). Two mqs.ini stanzas:
#   * DiagnosticMessagesTemplate — copied into each new QM's qm.ini at crtmqm, so QMs
#     inherit JSON-to-syslog. NOT seeded on RDQM (mq_diag_template=false, #562): RDQM's
#     `crtmqm -sx` validates the template-derived qm.ini DiagnosticMessages against the
#     mqs.ini DiagnosticMessagesTemplate and rejects the same-named service as a conflict
#     (AMQ7059E "details ... conflict"), regardless of the details — proven live by
#     removing the template. Plain crtmqm (pcmk/nativeha arms) does not do this
#     validation, so the template is fine there. This supersedes the #556 distinct-Name
#     theory, which the churned triage could not actually confirm. (RDQM per-QM logging
#     is restored separately — see the follow-up task.)
#   * DiagnosticSystemMessages — QM-unknown / fallback errors. Seeded on every arm.
# journald rate limiting is disabled so Severities=all is never silently dropped.

- name: seed the DiagnosticMessagesTemplate in mqs.ini (per-QM inheritance at crtmqm)
  ansible.builtin.blockinfile:
    path: /var/mqm/mqs.ini
    marker: "# {mark} MQ-DIAG-TEMPLATE (#282)"
    block: |
      DiagnosticMessagesTemplate:
         Name=ClusterSyslog
         Service=Syslog
         Ident={{ mq_diag_ident }}
         Severities={{ mq_diag_severities }}
         ExcludeMessage={{ mq_diag_exclude }}
  when: mq_diag_template | default(true)
  become: true
  become_user: mqm

- name: seed the DiagnosticSystemMessages in mqs.ini (QM-unknown / fallback errors)
  ansible.builtin.blockinfile:
    path: /var/mqm/mqs.ini
    marker: "# {mark} MQ-DIAG-SYSTEM (#282)"
    block: |
      DiagnosticSystemMessages:
         Name=SystemSyslog
         Service=Syslog
         Ident={{ mq_diag_ident }}
         Severities={{ mq_diag_severities }}
  become: true
  become_user: mqm

- name: journald drop-in directory
  ansible.builtin.file:
    path: /etc/systemd/journald.conf.d
    state: directory
    mode: "0755"
  become: true

- name: disable journald rate-limiting on MQ nodes (no silent log loss)
  ansible.builtin.copy:
    dest: /etc/systemd/journald.conf.d/10-mq.conf
    mode: "0644"
    content: |
      # MQ JSON logging (#282): Severities=all can burst; never drop silently.
      [Journal]
      RateLimitIntervalSec=0
      RateLimitBurst=0
  become: true
  notify: restart journald
