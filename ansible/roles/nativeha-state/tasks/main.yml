---
# Per-run half of the nativeha-state + log-health collectors (#279, #810; epic .github#294
# T7). Both collectors are the BAKED mq-resiliency-observability component (entry points
# lab-nativeha-state and lab-loglifecycle-state, run by the component's static
# lab-nativeha-state.service on its 5s timer; laid down by component-install at bake).
# This role only: asserts the component is baked -> retires the pre-#294 payloads and the
# /etc/systemd/system unit copies (they SHADOW the component units) -> renders the
# deployer-owned env file -> daemon-reload + enable the timer. The QM name comes from the
# observability overlay (nativeha_qm). The collectors shell through `su - mqm -c` so dspmq
# runs as the mqm user, while the unit itself runs as root to write the textfile dir.
- name: look for the baked observability component
  ansible.builtin.stat:
    path: /opt/logical-minds-foundry/mq-resiliency-observability/INSTALLED.json
  register: _nhs_baked

- name: the observability component is baked on this box
  ansible.builtin.assert:
    that: _nhs_baked.stat.exists
    fail_msg: >-
      mq-resiliency-observability is not installed on {{ inventory_hostname }}
      (no /opt/logical-minds-foundry/mq-resiliency-observability/INSTALLED.json) —
      rebuild its box (mqlab box build <box>) or install it live
      (mqlab component install mq-resiliency-observability --host {{ inventory_hostname }})

# The textfile drop zone is OWNED by the node-exporter role (02775 + the default ACL,
# #449/#458/#493), which runs earlier in this play. This role only checks it: a
# file task here once reset it to 0755 and stripped the requester write access
# (#1378), so never manage its mode outside node-exporter.
- name: look for the shared textfile drop zone
  ansible.builtin.stat:
    path: /var/lib/node_exporter/textfile
  register: _nhs_dropzone

- name: the textfile drop zone is the node-exporter shared 02775 dir
  ansible.builtin.assert:
    that:
      - _nhs_dropzone.stat.isdir | default(false)
      - _nhs_dropzone.stat.mode == '2775'
    fail_msg: >-
      /var/lib/node_exporter/textfile on {{ inventory_hostname }} is missing or not
      mode 2775 - run the node-exporter role (observability.yml) to restore the
      shared drop zone

# A pre-#294 `systemctl enable` linked the timer to the /etc copy removed below; drop
# that link (only that one) so the enable at the end re-links the component unit.
- name: look for a timers.target.wants link to the retired /etc timer
  ansible.builtin.stat:
    path: /etc/systemd/system/timers.target.wants/lab-nativeha-state.timer
    follow: false
  register: _nhs_wants

- name: drop the wants link to the retired /etc timer
  ansible.builtin.file:
    path: /etc/systemd/system/timers.target.wants/lab-nativeha-state.timer
    state: absent
  when: (_nhs_wants.stat.lnk_target | default('')) == '/etc/systemd/system/lab-nativeha-state.timer'

# systemd prefers /etc/systemd/system over /usr/lib/systemd/system: a surviving copy would
# keep running the old /usr/bin/python3 ExecStart (epic .github#294 Review Focus 1). The
# pre-#294 nativehastate.py sibling (the import shim loglifecycle used, #810) goes too.
- name: retire the pre-#294 payloads and /etc unit copies (they shadow the component units)
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /usr/local/bin/lab-nativeha-state
    - /usr/local/bin/nativehastate.py
    - /usr/local/bin/lab-loglifecycle-state
    - /etc/systemd/system/lab-nativeha-state.service
    - /etc/systemd/system/lab-nativeha-state.timer

# Importing the retired sibling module compiled it into /usr/local/bin/__pycache__.
- name: find the retired sibling module bytecode
  ansible.builtin.find:
    paths: /usr/local/bin/__pycache__
    patterns: "nativehastate.*.pyc"
  register: _nhs_pyc

- name: retire the sibling module bytecode
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: absent
  loop: "{{ _nhs_pyc.files }}"
  loop_control:
    label: "{{ item.path }}"

- name: render the deployer-owned env file (read by the component's static unit)
  ansible.builtin.template:
    src: lab-nativeha-state.env.j2
    dest: /etc/opt/logical-minds-foundry/mq-resiliency-observability/lab-nativeha-state.env
    mode: "0644"

- name: daemon-reload, enable + start the timer
  ansible.builtin.systemd:
    name: lab-nativeha-state.timer
    enabled: true
    state: started
    daemon_reload: true
