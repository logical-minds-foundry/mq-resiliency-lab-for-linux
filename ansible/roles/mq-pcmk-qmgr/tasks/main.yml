# Crystallized from lab/scripts/pcmk-qm-create.sh (#109). The hand-built spelling
# of RDQM's `crtmqm -sx` + `rdqmint`: QM on the shared LUN, taught to every node,
# handed to Pacemaker as fs -> vip -> qm. Idempotent (guards on every step).

# JSON diagnostic logging (#282): seed the mqs.ini template + journald drop-in BEFORE
# the QM is created on the LUN, so crtmqm bakes the DiagnosticMessages stanza into qm.ini.
- name: seed JSON diagnostic logging (mqs.ini template + journald)
  ansible.builtin.include_role:
    name: mq-diag-logging
    tasks_from: system

# Event monitoring (#114): install the collector wrapper on EVERY pcmk node, so the
# mq-event-monitor SERVICE's STARTCMD is present wherever Pacemaker starts the QM. The
# QM-level enable + SERVICE define runs on the LUN owner while the QM is up (below).
- name: event monitoring — host prep (wrapper on every pcmk node) (#114)
  ansible.builtin.include_role:
    name: mq-event-monitor
  vars:
    qmgr_name: "{{ qm_name }}"

# 0. The mountpoint dir must exist on EVERY node — Pacemaker's Filesystem
#    resource mounts the LUN on whichever node the group lands on (script L34).
- name: mountpoint directory on every node
  ansible.builtin.file:
    path: /mqshared
    state: directory
    mode: "0755"

# Re-run safety (#134): once Pacemaker owns the LUN (the mq_fs resource exists),
# the one-time creation flow below must NOT run again — re-mounting, the MQSC
# step's `endmqm -w`, and especially `umount /mqshared` would each disrupt the
# filesystem/QM Pacemaker is actively managing and fail mq_fs. Detect that and
# skip the whole creation block; the resource definitions further down are
# individually idempotent.
- name: detect whether Pacemaker already owns the LUN (QM already created)
  ansible.builtin.command: pcs resource status mq_fs
  run_once: true
  register: mq_fs_owned
  changed_when: false
  failed_when: false

# 1-3. Create the QM on the LUN, teach the other nodes, release the mount.
#      First-time only — skipped entirely once Pacemaker owns the LUN (#134).
- name: create and hand over the queue manager (first-time only)
  when: hostvars[groups['pcmk_a'][0]].mq_fs_owned.rc != 0
  block:
    # 1. QM on the LUN (creation node only; Pacemaker owns the mount afterward).
    - name: mount the shared LUN (creation node)
      ansible.builtin.shell: >
        (mountpoint -q /mqshared ||
        mount /dev/disk/by-label/MQSHARED /mqshared) &&
        mkdir -p /mqshared/qmgrs /mqshared/log && chown -R mqm:mqm /mqshared
      run_once: true
      changed_when: false

    - name: create the queue manager on the LUN
      ansible.builtin.command:
        cmd: su mqm -c '/opt/mqm/bin/crtmqm -md /mqshared/qmgrs -ld /mqshared/log {{ qm_name }}'
      run_once: true
      register: crtmqm
      failed_when: crtmqm.rc != 0 and 'already exists' not in (crtmqm.stderr | default(''))
      changed_when: crtmqm.rc == 0

    # 1b. TLS (#250): place the PCMK app QM's lab-pki keystore on the shared LUN so
    #     SSLKEYR follows the QM on failover. Registers pki_keyrpwd for the MQSC below.
    #     Verified: GSKit (runmqakm) reads the compatibility2022 PKCS#12 cleanly.
    - name: place {{ qm_name }} keystore on the shared LUN (TLS)
      ansible.builtin.include_role:
        name: pki-distribute
      vars:
        pki_entity: "{{ qm_name }}"
        pki_dest_dir: /mqshared/ssl
      run_once: true

    # 2. MQSC config (lab posture, spec 1), then a clean stop.
    - name: apply MQSC config
      ansible.builtin.shell: |
        set -o pipefail
        su mqm -c '/opt/mqm/bin/strmqm {{ qm_name }}' || true
        printf 'DEFINE LISTENER(L1414) TRPTYPE(TCP) PORT(1414) CONTROL(QMGR) REPLACE\n
        START LISTENER(L1414)\n
        DEFINE CHANNEL(APP.SVRCONN) CHLTYPE(SVRCONN) TRPTYPE(TCP) SSLCIPH({{ tls_cipher }}) SSLCAUTH(REQUIRED) SSLPEER('"'"'{{ tls_peer_client }}'"'"') HBINT(15) KAINT(15) REPLACE\n
        DEFINE CHANNEL(MON.SVRCONN) CHLTYPE(SVRCONN) TRPTYPE(TCP) SSLCIPH({{ tls_cipher }}) SSLCAUTH(REQUIRED) SSLPEER('"'"'{{ tls_peer_client }}'"'"') REPLACE\n
        ALTER QMGR CHLAUTH(DISABLED) CONNAUTH('"'"' '"'"')\n
        REFRESH SECURITY TYPE(CONNAUTH)\n
        ALTER QMGR SSLKEYR('"'"'/mqshared/ssl/key'"'"') KEYRPWD('"'"'{{ pki_keyrpwd.stdout }}'"'"') CERTLABL('"'"'{{ qm_name }}'"'"')\n
        REFRESH SECURITY TYPE(SSL)\n
        DEFINE QLOCAL(HA.TEST) DEFPSIST(YES) REPLACE\n
        ALTER QMGR MONQ(HIGH) MONCHL(HIGH) MONACLS(HIGH) STATMQI(ON) STATQ(ON) STATCHL(HIGH) MAXHANDS(512)\n' | su mqm -c '/opt/mqm/bin/runmqsc {{ qm_name }}'
        su mqm -c '/opt/mqm/bin/endmqm -w {{ qm_name }}'
      args:
        executable: /bin/bash
      run_once: true
      changed_when: true

    # 2b. Inter-QM objects (#147): only when this QM talks to a counterparty
    #     (svc_conn set, i.e. the distributed setup). Defined here at creation so
    #     a cold boot is one-pass and the objects persist on the shared LUN, exactly
    #     like the base MQSC above. The QREMOTE/xmitq/SENDER/RECEIVER/APP.REPLY set
    #     is the our-side half of the QM-to-QM link (spec §5.2).
    - name: render the inter-QM MQSC (counterparty link)
      ansible.builtin.template:
        src: inter-qm.mqsc.j2
        dest: /var/mqm/inter-qm.mqsc
        owner: mqm
        group: mqm
        mode: "0640"
      run_once: true
      when: svc_conn is defined

    - name: apply the inter-QM MQSC
      ansible.builtin.shell: |
        su mqm -c '/opt/mqm/bin/strmqm {{ qm_name }}' || true
        su mqm -c '/opt/mqm/bin/runmqsc {{ qm_name }} < /var/mqm/inter-qm.mqsc'
        su mqm -c '/opt/mqm/bin/endmqm -w {{ qm_name }}'
      run_once: true
      when: svc_conn is defined
      changed_when: true

    # 2c. Stage 2 authorization (#74): applied AFTER the channels + inter-QM objects
    #     exist, so the maps/back-stop reference real channels. Atomic runmqsc batch
    #     before endmqm, so no legitimate channel bounces through the deny-all window.
    #     This is what flips CHLAUTH to ENABLED — blank MCAUSER on the SVRCONNs is
    #     only safe once the back-stop + SSLPEERMAP maps are in place.
    - name: render the authorization MQSC (CHLAUTH + maps)
      ansible.builtin.template:
        src: authz.mqsc.j2
        dest: /var/mqm/authz.mqsc
        owner: mqm
        group: mqm
        mode: "0640"
      run_once: true

    - name: apply the authorization MQSC
      ansible.builtin.shell: |
        su mqm -c '/opt/mqm/bin/strmqm {{ qm_name }}' || true
        su mqm -c '/opt/mqm/bin/runmqsc {{ qm_name }} < /var/mqm/authz.mqsc'
        su mqm -c '/opt/mqm/bin/endmqm -w {{ qm_name }}'
      run_once: true
      changed_when: true

    # 2d. setmqaut grants (#74): the minimal least-privilege authority surface, one
    #     invocation per grant. -t qmgr grants omit -n. Records live on the LUN so
    #     they follow the QM on failover.
    # setmqaut needs the QM RUNNING (AMQ7028E otherwise); the authorization MQSC
    # above ended with `endmqm -w`, so start it first. The refresh-auth task below
    # strmqm/endmqm-cycles again, so the QM still ends stopped for the Pacemaker handover.
    - name: start the QM for the setmqaut grants
      ansible.builtin.shell: su mqm -c '/opt/mqm/bin/strmqm {{ qm_name }}' || true
      args:
        executable: /bin/bash
      run_once: true
      changed_when: true

    - name: apply setmqaut grants (least-privilege OAM)
      ansible.builtin.command:
        cmd: >
          su mqm -c "/opt/mqm/bin/setmqaut -m {{ qm_name }}
          {% if item.object_type != 'qmgr' %}-n {{ item.object }} {% endif %}-t {{ item.object_type }}
          -g {{ item.group }} {{ item.authorities }}"
      loop: "{{ authz_grants }}"
      loop_control: { label: "{{ item.group }} -> {{ item.object_type }} {{ item.object }}" }
      run_once: true
      register: setmqaut_res
      changed_when: true
      failed_when: setmqaut_res.rc != 0

    - name: refresh the authorization service
      ansible.builtin.shell: |
        set -o pipefail
        su mqm -c 'strmqm {{ qm_name }}' || true
        printf 'REFRESH SECURITY TYPE(AUTHSERV)\n' | su mqm -c 'runmqsc {{ qm_name }}'
        su mqm -c 'endmqm -w {{ qm_name }}'
      args:
        executable: /bin/bash
      run_once: true
      changed_when: true

    # 2e. Event monitoring (#114): enable the classes + define/start the collector on
    #     the LUN owner while the QM is up, same start/apply/stop shape as the MQSC
    #     above. The SERVICE object persists on the shared LUN; CONTROL(QMGR) auto-starts
    #     the collector whenever Pacemaker (re)starts the QM on any node. `when: creation
    #     node` (not run_once) because run_once does not propagate through include_role.
    - name: event monitoring — start QM to define the collector (LUN owner)
      ansible.builtin.shell: su mqm -c '/opt/mqm/bin/strmqm {{ qm_name }}' || true
      args:
        executable: /bin/bash
      run_once: true
      changed_when: true

    - name: event monitoring — enable classes + define/start collector (#114)
      ansible.builtin.include_role:
        name: mq-event-monitor
        tasks_from: service
      vars:
        qmgr_name: "{{ qm_name }}"
      when: inventory_hostname == groups['pcmk_a'][0]

    - name: event monitoring — clean stop (hand the QM back to Pacemaker)
      ansible.builtin.shell: su mqm -c '/opt/mqm/bin/endmqm -w {{ qm_name }}'
      args:
        executable: /bin/bash
      run_once: true
      changed_when: true

    # 3. Teach the other nodes the QM definition, then release the mount.
    - name: capture the addmqinf command from the creation node
      ansible.builtin.shell: |
        set -o pipefail
        su mqm -c '/opt/mqm/bin/dspmqinf -o command {{ qm_name }}' | grep '^addmqinf'
      args:
        executable: /bin/bash
      run_once: true
      register: addmqinf_cmd
      changed_when: false

    - name: teach the QM definition to the other nodes
      ansible.builtin.command:
        cmd: "su mqm -c '{{ hostvars[groups['pcmk_a'][0]].addmqinf_cmd.stdout }}'"
      when: inventory_hostname != groups['pcmk_a'][0]
      register: addmqinf
      failed_when: addmqinf.rc != 0 and 'already' not in (addmqinf.stderr | default(''))
      changed_when: addmqinf.rc == 0

    - name: release the LUN on the creation node (Pacemaker owns it now)
      ansible.builtin.command: umount /mqshared
      run_once: true
      failed_when: false
      changed_when: true

# 4. Disabled systemd unit on every node (Pacemaker is the only starter).
#    ExecStop uses `endmqm -w` (clean, blocking) so Pacemaker gets the exit
#    code it expects and relocates cleanly. A crash never runs ExecStop; the
#    only thing that broke reconnect in #64 was the controlled move-BACK to a
#    rebooted node, fixed by resource stickiness below (not -r).
- name: queue-manager systemd unit (disabled)
  ansible.builtin.copy:
    dest: "/etc/systemd/system/mq-{{ qm_name }}.service"
    mode: "0644"
    content: |
      [Unit]
      Description=IBM MQ queue manager {{ qm_name }} (pacemaker-managed)
      [Service]
      Type=forking
      User=mqm
      ExecStart=/opt/mqm/bin/strmqm {{ qm_name }}
      ExecStop=/opt/mqm/bin/endmqm -w {{ qm_name }}
      TimeoutStartSec=300
  notify: daemon-reload

- name: ensure the unit is disabled (cluster-only start)
  ansible.builtin.systemd:
    name: "mq-{{ qm_name }}.service"
    enabled: false
    daemon_reload: true

# 5. Resource stickiness — no auto-failback (the #64 lesson).
- name: resource stickiness (no auto-failback)
  ansible.builtin.command: pcs resource defaults update resource-stickiness=1000
  run_once: true
  changed_when: true

# 6. The resource group: fs -> vip -> qm. mq_fs monitors with OCF_CHECK_LEVEL=20
#    (a real read/write probe, not just the mount table) + on-fail=fence, so a
#    dead SAN under the owner is caught in one interval instead of the default
#    check's ~12-min blind spot.
- name: mq_fs resource (LUN, OCF_CHECK_LEVEL=20, fence on I/O failure)
  ansible.builtin.shell: >
    pcs resource status mq_fs >/dev/null 2>&1 ||
    pcs resource create mq_fs ocf:heartbeat:Filesystem
    device=/dev/disk/by-label/MQSHARED directory=/mqshared fstype=xfs
    op monitor interval=20s timeout=40s OCF_CHECK_LEVEL=20 on-fail=fence --group mq_group
  run_once: true
  changed_when: true

- name: mq_vip resource (internal data-plane floating IP)
  ansible.builtin.shell: >
    pcs resource status mq_vip >/dev/null 2>&1 ||
    pcs resource create mq_vip ocf:heartbeat:IPaddr2 ip={{ qm_vip }} cidr_netmask=24
    --group mq_group --after mq_fs
  run_once: true
  changed_when: true

# Partner-facing VIP on net-ext (#146): the address the counterparty (SVC) QM's
# sender channel connects to. A second IPaddr2 in the same group so it follows the
# QM across node (HA) and site (DR) moves, exactly like the data-plane VIP. The
# internal app keeps using mq_vip; external partners use mq_vip_ext.
- name: mq_vip_ext resource (partner-facing floating IP on net-ext)
  ansible.builtin.shell: >
    pcs resource status mq_vip_ext >/dev/null 2>&1 ||
    pcs resource create mq_vip_ext ocf:heartbeat:IPaddr2 ip={{ qm_vip_ext }} cidr_netmask=24
    --group mq_group --after mq_vip
  run_once: true
  changed_when: true

- name: mq_qm resource (the queue manager)
  ansible.builtin.shell: >
    pcs resource status mq_qm >/dev/null 2>&1 ||
    pcs resource create mq_qm systemd:mq-{{ qm_name }} --group mq_group --after mq_vip_ext
  run_once: true
  changed_when: true
