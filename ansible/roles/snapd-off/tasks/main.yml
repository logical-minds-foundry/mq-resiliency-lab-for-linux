---
# Take snapd off the boot path of a baked Ubuntu box (#1250, epic .github#275).
#
# WHY: #1247's slow-booting guests showed snapd.seeded.service at +60s (obs) and +1min 6s
# (mon-probe); it is Before=multi-user.target and its ExecStart is only
# `snap wait system seed.loaded`, i.e. it holds boot until snapd has started. On the boxes
# with no snaps snapd does nothing at all: the cloud-image base seeds none and no bake
# role installs one (verified #1250: the infra box's state.json is seeded with zero
# snaps; `snap list` on a booted clone: "No snaps are installed yet").
#
# HOW (snapd_off_mode, see defaults/main.yml):
#   purge — refuse if any snap is installed (fail-loud, so a role that starts using a snap
#           cannot be silently broken), purge snapd, pin it out, then verify it is gone and
#           has no install candidate. The purge's deb-systemd-helper also rmdirs every
#           empty dir under /etc/systemd/{system,user}, so those are recorded first and
#           restored (and verified) after; snapd's own stay gone (#1265).
#   keep  — the box needs its snaps (obs on aarch64: the chromium snap behind
#           grafana-image-renderer), so snapd stays enabled and only the snapd.seeded boot
#           gate is masked; the image is already seeded, so the gate only waited.
# Run LAST in each bake, so the purge-mode guard sees every snap the bake installed.
# Debian/Ubuntu only — included by the Ubuntu bake playbooks.

- name: assert this is a Debian/Ubuntu bake host with a known snapd_off_mode
  ansible.builtin.assert:
    that:
      - ansible_os_family == 'Debian'
      - snapd_off_mode in ['purge', 'keep']
    fail_msg: >-
      snapd-off is for the Ubuntu boxes only, with snapd_off_mode purge|keep
      (got os_family={{ ansible_os_family }}, snapd_off_mode={{ snapd_off_mode }}).

- name: look for the snap CLI (absent once a previous run purged snapd)
  ansible.builtin.stat:
    path: /usr/bin/snap
  register: _snapd_off_cli

# noqa command-instead-of-module: a read-only query; no module lists snaps.
- name: list the installed snaps  # noqa: command-instead-of-module
  # `snap list` prints nothing on stdout (a notice on stderr) when no snap is installed,
  # else a header line plus one row per snap. A non-zero rc (snapd unreachable) fails.
  ansible.builtin.command:
    argv: ["snap", "list"]
  register: _snapd_off_snaps
  changed_when: false
  when: _snapd_off_cli.stat.exists

- name: refuse to purge snapd while a snap is installed
  ansible.builtin.assert:
    that: (_snapd_off_snaps.stdout_lines | default([])) | length == 0
    fail_msg: >-
      snapd_off_mode=purge but this box has snaps installed (a bake role pulled them in):
      {{ _snapd_off_snaps.stdout_lines | default([]) }}. Purging would break them; set
      snapd_off_mode=keep for this box in its bake playbook (#1250).
  when: snapd_off_mode == 'purge' and _snapd_off_cli.stat.exists

# The purge has a side effect on OTHER roles' state (#1265): snapd's postrm runs
# `deb-systemd-helper purge`, which (init-system-helpers' rmdir_if_empty) rmdirs EVERY
# empty directory under /etc/systemd/system and /etc/systemd/user, not just snapd's. That
# deleted obs's baked, still-empty grafana-server.service.d on x86_64, so observe's per-run
# drop-in write failed. Record the empty dirs first, so the purge is undone for the rest.
# noqa command-instead-of-module: a read-only listing; no module reports empty dirs.
- name: record the empty dirs under /etc/systemd that the purge would prune  # noqa: command-instead-of-module
  # One line per dir, "<octal mode> <owner> <group> <path>" (find's -printf expands the
  # \n itself). A missing root makes find exit 1, which fails the task (fail-loud).
  ansible.builtin.command:
    argv: "{{ ['find'] + snapd_off_prune_roots + ['-mindepth', '1', '-type', 'd', '-empty', '-printf', snapd_off_dir_format] }}"
  register: _snapd_off_empty_dirs
  changed_when: false
  when: snapd_off_mode == 'purge'

# snapd's own dirs (a last path component containing "snap", e.g.
# snapd.mounts.target.wants) stay gone: removing them is the point of the purge.
- name: keep the non-snapd empty dirs to restore after the purge
  ansible.builtin.set_fact:
    _snapd_off_keep_dirs: "{{ _snapd_off_empty_dirs.stdout_lines | reject('search', snapd_off_own_dir_regex) | list }}"
  when: snapd_off_mode == 'purge'

- name: purge snapd (no snap is installed, nothing uses it)
  ansible.builtin.apt:
    name: snapd
    state: absent
    purge: true
    lock_timeout: "{{ apt_lock_timeout }}"
  when: snapd_off_mode == 'purge'

- name: restore the empty /etc/systemd dirs the purge pruned (snapd's own stay gone)
  ansible.builtin.file:
    path: "{{ item.split(' ', 3)[3] }}"
    state: directory
    mode: "0{{ item.split(' ', 3)[0] }}"
    owner: "{{ item.split(' ', 3)[1] }}"
    group: "{{ item.split(' ', 3)[2] }}"
  loop: "{{ _snapd_off_keep_dirs | default([]) }}"
  when: snapd_off_mode == 'purge'

- name: look for every restored dir (verify the restore)
  ansible.builtin.stat:
    path: "{{ item.split(' ', 3)[3] }}"
  loop: "{{ _snapd_off_keep_dirs | default([]) }}"
  register: _snapd_off_restored
  when: snapd_off_mode == 'purge'

- name: verify no non-snapd dir under /etc/systemd was lost to the purge
  ansible.builtin.assert:
    that: item.stat.isdir | default(false)
    fail_msg: "the snapd purge removed {{ item.item }} and it is still missing (#1265)"
    quiet: true
  loop: "{{ _snapd_off_restored.results | default([]) }}"
  loop_control:
    label: "{{ item.item }}"
  when: snapd_off_mode == 'purge'

- name: pin snapd out so apt never reinstalls it
  ansible.builtin.copy:
    src: 99lab-no-snapd
    dest: "{{ snapd_off_pin }}"
    owner: root
    group: root
    mode: "0644"
  when: snapd_off_mode == 'purge'

- name: gather installed packages (verify the purge)
  ansible.builtin.package_facts:
    manager: apt
  when: snapd_off_mode == 'purge'

- name: verify snapd is gone
  ansible.builtin.assert:
    that: "'snapd' not in ansible_facts.packages"
    fail_msg: "snapd is still installed after the purge (#1250)"
  when: snapd_off_mode == 'purge'

# noqa command-instead-of-module: a read-only query of the pin's effect.
- name: read snapd's apt install candidate  # noqa: command-instead-of-module
  ansible.builtin.command:
    argv: ["apt-cache", "policy", "snapd"]
  register: _snapd_off_policy
  changed_when: false
  when: snapd_off_mode == 'purge'

- name: verify the pin leaves snapd no install candidate
  ansible.builtin.assert:
    that: "'Candidate: (none)' in _snapd_off_policy.stdout"
    fail_msg: "apt could still install snapd; the pin is not in effect: {{ _snapd_off_policy.stdout }}"
  when: snapd_off_mode == 'purge'

- name: refuse keep mode on a box with no snaps (purge it instead)
  ansible.builtin.assert:
    that:
      - _snapd_off_cli.stat.exists
      - (_snapd_off_snaps.stdout_lines | default([])) | length > 0
    fail_msg: >-
      snapd_off_mode=keep but no snap is installed; this box should use the default
      snapd_off_mode=purge (#1250).
  when: snapd_off_mode == 'keep'

- name: mask the snapd.seeded boot gate (the image is already seeded)
  ansible.builtin.systemd:
    name: "{{ snapd_off_seeded_unit }}"
    masked: true
  when: snapd_off_mode == 'keep'

# noqa command-instead-of-module: `systemctl is-enabled` is a state QUERY.
- name: verify snapd.seeded is masked while snapd itself stays enabled  # noqa: command-instead-of-module
  ansible.builtin.command:
    argv: ["systemctl", "is-enabled", "{{ snapd_off_seeded_unit }}", "snapd.service", "snapd.socket"]
  register: _snapd_off_units
  changed_when: false
  # is-enabled exits non-zero when any unit is masked, so judge by the per-unit output.
  failed_when: _snapd_off_units.stdout_lines != ['masked', 'enabled', 'enabled']
  when: snapd_off_mode == 'keep'
