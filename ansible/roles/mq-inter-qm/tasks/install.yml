---
# The bakeable half of mq-inter-qm (#1227): the svc responder's pymqi venv. It is
# per-run-invariant (no QM, no channel, no secret, no host-specific data), so the
# mq-client-ubuntu24 bake runs it (bake-mq-ubuntu.yml, `tasks_from: install`) and main.yml
# imports it per-run, where every task is a near no-op against the baked venv:
#   * venv create is guarded by `creates:` on the venv's python;
#   * the pip module (state present, no version) checks the venv's installed packages
#     locally and skips the PyPI fetch entirely when pymqi is already there.
# pymqi is sourced from PyPI unpinned, exactly as before the bake (there is no wheel
# cache or pin); a baked box carries the release current at bake time, and the weekly
# cold rebuild (rebake) picks up a newer one.

# pymqi compiles its C extension against the MQ SDK headers + libs, so MQ (mq-install:
# SDK + python3-venv/python3-dev/gcc) must already be on the box. Fail loud here rather
# than deep inside a pip build error.
- name: responder venv prerequisite (MQ SDK installed)
  ansible.builtin.stat:
    path: /opt/mqm/inc/cmqc.h
  register: mq_inter_qm_sdk

- name: assert the MQ SDK is present before building pymqi
  ansible.builtin.assert:
    that: mq_inter_qm_sdk.stat.exists
    fail_msg: >-
      /opt/mqm/inc/cmqc.h is missing: the responder's pymqi venv builds against the MQ
      SDK, so mq-install must run before mq-inter-qm (install).
    quiet: true

# venv creation (no network) is split from the pip install (hits PyPI) so the
# retry below re-runs ONLY the fetch: a `creates:` guard keyed on the venv would
# skip the retry after the venv exists but the flaked install left pymqi absent.
- name: pymqi venv for the responder (create; no network)
  ansible.builtin.command:
    cmd: python3 -m venv {{ mq_inter_qm_responder_venv }}
    creates: "{{ mq_inter_qm_responder_venv }}/bin/python"
  become: true
  become_user: mqm

# PyPI fetch only when pymqi is absent (an un-baked box): retry so a rate-limited
# parallel-boot DNS burst (#648) does not fail the one-shot cold rebuild. The pip
# module is idempotent (no-op once satisfied), so retries are safe.
- name: install pymqi into the responder venv
  ansible.builtin.pip:
    name: pymqi
    virtualenv: "{{ mq_inter_qm_responder_venv }}"
  environment:
    LD_LIBRARY_PATH: /opt/mqm/lib64
  become: true
  become_user: mqm
  register: pymqi_install
  until: pymqi_install is succeeded
  retries: 5
  delay: 10

# Prove the venv is usable, not merely present: a baked venv whose python or MQ libs
# drifted would otherwise only surface when the responder service crash-loops.
- name: verify pymqi imports in the responder venv
  ansible.builtin.command:
    cmd: "{{ mq_inter_qm_responder_venv }}/bin/python -c 'import pymqi; print(pymqi.__version__)'"
  environment:
    LD_LIBRARY_PATH: /opt/mqm/lib64
  become: true
  become_user: mqm
  changed_when: false
