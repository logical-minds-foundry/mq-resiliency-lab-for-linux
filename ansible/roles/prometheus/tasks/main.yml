---
- name: prometheus system user
  ansible.builtin.user:
    name: prometheus
    system: true
    shell: /usr/sbin/nologin
    create_home: false

- name: download + unpack prometheus
  ansible.builtin.unarchive:
    src: "{{ prometheus_url }}"
    dest: /tmp
    remote_src: true
    creates: "/tmp/{{ prometheus_pkg }}/prometheus"

- name: install the prometheus binary
  ansible.builtin.copy:
    src: "/tmp/{{ prometheus_pkg }}/prometheus"
    dest: /usr/local/bin/prometheus
    mode: "0755"
    remote_src: true

- name: config + data + targets dirs
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: prometheus
    group: prometheus
    mode: "0755"
  loop:
    - /etc/prometheus
    - /etc/prometheus/targets
    - /etc/prometheus/rules
    - /var/lib/prometheus

- name: deploy prometheus.yml
  ansible.builtin.template:
    src: prometheus.yml.j2
    dest: /etc/prometheus/prometheus.yml
    mode: "0644"
  notify: restart prometheus

- name: deploy the lab recording rules (lab_network_health)
  ansible.builtin.copy:
    src: lab.rules.yml
    dest: /etc/prometheus/rules/lab.rules.yml
    owner: prometheus
    group: prometheus
    mode: "0644"
  notify: restart prometheus

- name: deploy the topology-rendered node targets
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../build/prometheus/targets/node.json"
    dest: /etc/prometheus/targets/node.json
    owner: prometheus
    group: prometheus
    mode: "0644"
  notify: restart prometheus

- name: install the systemd unit
  ansible.builtin.copy:
    dest: /etc/systemd/system/prometheus.service
    mode: "0644"
    content: |
      [Unit]
      Description=Prometheus
      After=network-online.target
      Wants=network-online.target

      [Service]
      User=prometheus
      Group=prometheus
      ExecStart=/usr/local/bin/prometheus \
        --config.file=/etc/prometheus/prometheus.yml \
        --storage.tsdb.path=/var/lib/prometheus \
        --storage.tsdb.retention.time={{ prometheus_retention }} \
        --web.listen-address=:9090
      Restart=on-failure

      [Install]
      WantedBy=multi-user.target
  notify: restart prometheus

- name: enable + start prometheus
  ansible.builtin.systemd:
    name: prometheus
    enabled: true
    state: started
    daemon_reload: true
