---
# Split along the bake/configure line (#602): the install half (binary + static
# config + unit) is image-bakeable; the configure half is the per-run topology
# render. main.yml runs both in order, so the normal per-run path is unchanged.
# A single-host bake play consumes install.yml directly via `tasks_from: install`.
- name: install prometheus (bakeable)
  ansible.builtin.import_tasks: install.yml

- name: configure prometheus (per-run topology targets)
  ansible.builtin.import_tasks: configure.yml
