# Client node: MQ client/sdk debs + a pymqi venv for the requester.
# Ubuntu tar suffix tracks the guest arch (host-resolved, #276): ARM64 on the Mac
# dev path, X64 on an x86 host. (The host-side fetch/manifest map mirrors this.)
- name: copy MQ tar to node
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../build/cache/mq/{{ mq_version }}-IBM-MQ-Advanced-for-Developers-UbuntuLinux{{ 'ARM64' if ansible_architecture == 'aarch64' else 'X64' }}.tar.gz"
    dest: /tmp/mqadv.tar.gz
    mode: "0644"

- name: unpack
  ansible.builtin.unarchive:
    src: /tmp/mqadv.tar.gz
    dest: /tmp
    remote_src: true
    creates: /tmp/MQServer

- name: accept developer licence
  ansible.builtin.command: /tmp/MQServer/mqlicense.sh -accept
  args:
    creates: /var/mqm
  become: true

- name: install client + sdk debs and build deps
  ansible.builtin.shell: |
    set -e
    apt-get update
    apt-get install -y python3-venv python3-dev gcc
    cd /tmp/MQServer
    apt-get install -y ./ibmmq-runtime_*.deb ./ibmmq-client_*.deb \
      ./ibmmq-sdk_*.deb ./ibmmq-gskit_*.deb
  args:
    creates: /opt/mqm/inc/cmqc.h
  become: true

- name: set primary installation (loader path for libmqic_r etc.)
  ansible.builtin.command: /opt/mqm/bin/setmqinst -i -p /opt/mqm
  args:
    creates: /etc/ld.so.conf.d/ibmmq-Installation1.conf
  become: true

# venv creation (no network) is split from the pip install (hits PyPI) so the
# retry below re-runs ONLY the fetch: a `creates:` guard keyed on the venv would
# skip the retry after the venv exists but the flaked install left pymqi absent.
- name: pymqi venv (create; no network)
  ansible.builtin.command:
    cmd: python3 -m venv /home/vagrant/mqvenv
    creates: /home/vagrant/mqvenv/bin/python

# Per-run PyPI fetch: retry so a rate-limited parallel-boot DNS burst (#648) does
# not fail the one-shot cold rebuild. The pip module is idempotent (no-op once
# satisfied), so retries are safe and a settled index resolves fine.
- name: install pymqi into the venv
  ansible.builtin.pip:
    name: pymqi
    virtualenv: /home/vagrant/mqvenv
  register: pymqi_install
  until: pymqi_install is succeeded
  retries: 5
  delay: 10

- name: JSON diagnostic logging for client apps (mqclient.ini) (#282)
  ansible.builtin.include_role:
    name: mq-diag-logging
    tasks_from: client

# TLS (#250): place the app-client keystore + a .sth stash so the requester can
# present its cert over the now-mutual-TLS APP.SVRCONN. Owned by vagrant (the app
# runs as vagrant); SSLPEER on the SVRCONN matches O=app-org (app-client is
# OU=apps, so the org-only peer, not the OU=messaging channel identity).
- name: place the app-client keystore (TLS)
  ansible.builtin.include_role:
    name: pki-distribute
  vars:
    pki_entity: app-client
    pki_dest_dir: /home/vagrant/ssl
    pki_owner: vagrant
    pki_stash: true
