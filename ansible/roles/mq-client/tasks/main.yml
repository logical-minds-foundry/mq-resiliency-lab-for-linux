# Client node: MQ client/sdk debs, the gcc compiler, the mqclient.ini diag logging and the
# app-client keystore. The clients themselves (requester, bench, probes, DR flow) are the
# BAKED mq-resiliency-clients component (epic .github#294 T9): entry points under
# /opt/logical-minds-foundry/mq-resiliency-clients/venv/bin, laid down by component-install
# at bake. This role asserts it is baked and retires the pre-#294 venv + loose scripts.

# FIRST: the clients component must be baked into this box (mq-ubuntu bake: runtime-install,
# then component-install). Fail loud, naming the fix, before changing anything.
- name: look for the baked clients component
  ansible.builtin.stat:
    path: /opt/logical-minds-foundry/mq-resiliency-clients/INSTALLED.json
  register: _mqc_baked

- name: the clients component is baked on this box
  ansible.builtin.assert:
    that: _mqc_baked.stat.exists
    fail_msg: >-
      mq-resiliency-clients is not installed on {{ inventory_hostname }}
      (no /opt/logical-minds-foundry/mq-resiliency-clients/INSTALLED.json) -
      rebuild its box (mqlab box build <box>) or install it live
      (mqlab component install mq-resiliency-clients --host {{ inventory_hostname }})

# Ubuntu tar suffix tracks the guest arch (host-resolved, #276): ARM64 on the Mac
# dev path, X64 on an x86 host. (The host-side fetch/manifest map mirrors this.)

# Skip-if-baked (#648/#659): app-client boots the mq-client fat box, whose baked MQ
# product (server set = client + SDK) leaves /opt/mqm/inc/cmqc.h present. Gate the ~700MB
# tar copy + unpack on that INSTALLED marker so the baked box skips it every run; keying
# only on /tmp/MQServer (wiped on boot) re-copied + re-unpacked the tarball each run. The
# un-baked client path (no fat box) still installs from scratch.
- name: check for an already-installed MQ (skip the baked install)
  ansible.builtin.stat:
    path: /opt/mqm/inc/cmqc.h
  register: mq_installed

# The MQ media is staged on disk under lab_stage_dir, never /tmp (#1417): Ubuntu 26.04's
# /tmp is a RAM-sized tmpfs that the tarball + its MQServer/ tree cannot fit in.
- name: staging dir (on disk)
  ansible.builtin.include_tasks: ../../../tasks/lab-stage-dir.yml
  when: not mq_installed.stat.exists

- name: copy MQ tar to node
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../build/cache/mq/{{ mq_version }}-IBM-MQ-Advanced-for-Developers-UbuntuLinux{{ 'ARM64' if ansible_architecture == 'aarch64' else 'X64' }}.tar.gz"
    dest: "{{ lab_stage_dir }}/mqadv.tar.gz"
    mode: "0644"
  become: true  # lab_stage_dir is root-owned 0755
  when: not mq_installed.stat.exists

- name: unpack
  ansible.builtin.unarchive:
    src: "{{ lab_stage_dir }}/mqadv.tar.gz"
    dest: "{{ lab_stage_dir }}"
    remote_src: true
    creates: "{{ lab_stage_dir }}/MQServer"
  become: true
  when: not mq_installed.stat.exists

- name: accept developer licence
  ansible.builtin.command: "{{ lab_stage_dir }}/MQServer/mqlicense.sh -accept"
  args:
    creates: /var/mqm
  become: true

# gcc STAYS on the running box (spec 5.8): mqlab component install mq-resiliency-clients
# recompiles pymqi against the MQ SDK on the guest. The distro python3-venv/python3-dev are
# gone: the pinned runtime ships its own venv module and headers.
- name: install client + sdk debs and the pymqi compiler
  ansible.builtin.shell: |
    set -e
    apt-get update
    apt-get install -y gcc
    cd "{{ lab_stage_dir }}/MQServer"
    apt-get install -y ./ibmmq-runtime_*.deb ./ibmmq-client_*.deb \
      ./ibmmq-sdk_*.deb ./ibmmq-gskit_*.deb
  args:
    creates: /opt/mqm/inc/cmqc.h
  become: true

# /var/tmp is not wiped at boot the way /tmp was: remove the staged tarball and its
# unpacked tree once the debs are installed.
- name: remove the staged MQ media
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - "{{ lab_stage_dir }}/mqadv.tar.gz"
    - "{{ lab_stage_dir }}/MQServer"
  become: true

- name: set primary installation (loader path for libmqic_r etc.)
  ansible.builtin.command: /opt/mqm/bin/setmqinst -i -p /opt/mqm
  args:
    creates: /etc/ld.so.conf.d/ibmmq-Installation1.conf
  become: true

# No dual running (spec 8): the pre-#294 per-provision pymqi venv and the loose client
# scripts copied into the home dir are replaced by the component; remove them.
- name: retire the pre-#294 pymqi venv and loose client scripts
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /home/vagrant/mqvenv
    - /home/vagrant/app_requester.py
    - /home/vagrant/bench_client.py
    - /home/vagrant/authz_probe.py
    - /home/vagrant/dlq_probe.py
    - /home/vagrant/reconnect_probe.py
    - /home/vagrant/dr_flow.py
    - /home/vagrant/dr_responder.py
    - /home/vagrant/dr_mqi.py
    - /home/vagrant/dr_baseline.py
    - /home/vagrant/dr_forced.py

- name: JSON diagnostic logging for client apps (mqclient.ini) (#282)
  ansible.builtin.include_role:
    name: mq-diag-logging
    tasks_from: client

# TLS (#250): place the app-client keystore + a .sth stash so the requester can
# present its cert over the now-mutual-TLS APP.SVRCONN. Owned by vagrant (the app
# runs as vagrant); SSLPEER on the SVRCONN matches O=app-org (app-client is
# OU=apps, so the org-only peer, not the OU=messaging channel identity).
- name: place the app-client keystore (TLS)
  ansible.builtin.include_role:
    name: pki-distribute
  vars:
    pki_entity: app-client
    pki_dest_dir: /home/vagrant/ssl
    pki_owner: vagrant
    pki_stash: true
