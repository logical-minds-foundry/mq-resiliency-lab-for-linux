# Offline package sources for the RHEL pcmk substrate. BaseOS+AppStream come
# from the attached install DVD (same as rdqm-install). The HighAvailability
# packages are NOT on the binary DVD; they are free OSS, host-fetched from a
# RHEL-compatible repo (Alma/Rocky/Stream 9) into build/rhel-ha/ and served
# from a local file:// repo. No subscription, no RHSM (guests are offline).
# See docs/plans/2026-06-17-pcmk-rhel-phase1-substrate.md (D1) and README.md.
- name: mount the install DVD (fstab + mount; ansible-core has no mount module)
  ansible.builtin.shell: |
    set -e
    mkdir -p /media/rhel
    grep -q '/media/rhel' /etc/fstab || echo '/dev/sr0 /media/rhel iso9660 ro 0 0' >> /etc/fstab
    mountpoint -q /media/rhel || mount /media/rhel
  become: true
  changed_when: false

- name: dnf repos from the DVD (BaseOS + AppStream)
  ansible.builtin.copy:
    dest: /etc/yum.repos.d/rhel-dvd.repo
    content: |
      [dvd-baseos]
      name=RHEL 9.6 DVD BaseOS
      baseurl=file:///media/rhel/BaseOS
      enabled=1
      gpgcheck=0
      [dvd-appstream]
      name=RHEL 9.6 DVD AppStream
      baseurl=file:///media/rhel/AppStream
      enabled=1
      gpgcheck=0
  become: true

- name: copy host-fetched HighAvailability RPMs to the guest
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../build/rhel-ha/"
    dest: /opt/rhel-ha/
  become: true

- name: createrepo for the local HighAvailability repo
  ansible.builtin.command: createrepo_c /opt/rhel-ha
  args:
    creates: /opt/rhel-ha/repodata/repomd.xml
  become: true

- name: dnf repo for the local HighAvailability packages
  ansible.builtin.copy:
    dest: /etc/yum.repos.d/rhel-ha-local.repo
    content: |
      [ha-local]
      name=EL9 HighAvailability (host-fetched, local)
      baseurl=file:///opt/rhel-ha
      enabled=1
      gpgcheck=0
  become: true
