# L1b: create the QM, listener via MQSC, enable mqweb REST, and install
# boot services so reboot brings everything back (spec 8.3).
- name: seed JSON diagnostic logging (mqs.ini template + journald) (#282)
  ansible.builtin.include_role:
    name: mq-diag-logging
    tasks_from: system

- name: create queue manager
  ansible.builtin.command: /opt/mqm/bin/crtmqm -u SYSTEM.DEAD.LETTER.QUEUE {{ qmgr_name }}
  args:
    creates: "/var/mqm/qmgrs/{{ qmgr_name }}"
  become: true
  become_user: mqm

# Channel failover hardening (#1557). This QM receives a sender from every stack's HA app
# QM. After an UNPLANNED failover (a hung node sends no TCP reset) the new active's sender
# arrives from another address while the old receiver instance still looks alive: with
# MQ's defaults (AdoptNewMCA=NO, AdoptNewMCACheck=NAME,ADDRESS,QM) it is refused with
# AMQ9514E until the 360 s receive timeout. IBM's suggested settings are KeepAlive=Yes and
# AdoptNewMCA=ALL; ADDRESS is dropped from the check because it can never match after a
# move to another host, and the channels' mutual TLS + SSLPEER is the protection IBM names
# for that (qm.ini Channels stanza and "Checking that the other end of the channel is still
# available", IBM MQ 9.4/10.0). qm.ini changes take effect at the next QM start.
- name: "{{ qmgr_name }} qm.ini has the Channels and TCP stanzas crtmqm writes"
  ansible.builtin.command: grep -c -E '^(Channels|TCP):' /var/mqm/qmgrs/{{ qmgr_name }}/qm.ini
  register: _mq_qmgr_stanzas
  changed_when: false
  failed_when: _mq_qmgr_stanzas.stdout | trim != '2'
  become: true

- name: "{{ qmgr_name }} qm.ini channel failover settings (#1557)"
  ansible.builtin.lineinfile:
    path: "/var/mqm/qmgrs/{{ qmgr_name }}/qm.ini"
    regexp: "^\\s*{{ item.key }}\\s*="
    line: "   {{ item.key }}={{ item.value }}"
    insertafter: "^{{ item.stanza }}:"
    firstmatch: true
  loop: "{{ mq_qmgr_qmini_settings }}"
  loop_control:
    label: "{{ item.stanza }}: {{ item.key }}={{ item.value }}"
  register: _mq_qmgr_qmini
  become: true
  become_user: mqm

- name: qm systemd unit
  ansible.builtin.template:
    src: qm.service.j2
    dest: "/etc/systemd/system/mq-{{ qmgr_name }}.service"
    mode: "0644"
  become: true

# MQ Console + admin REST API on this QM — via the shared mqweb role. mqweb runs on
# every QM node, ungated, exactly as on the HA/DR stack plays (epic .github#341 spec
# §2.1, #1502; replaces the #1171/#1188 off-by-default gate). Like them, it needs the
# stack's mqweb_aes_passphrase secret and MQWEB_STATE_DIR in the provision env.
- name: enable the MQ Console and admin REST API (mqweb)
  ansible.builtin.include_role:
    name: mqweb

# Restarted when a qm.ini setting changed: MQ reads qm.ini only at queue manager start.
- name: enable + start the queue-manager service
  ansible.builtin.systemd:
    name: "mq-{{ qmgr_name }}.service"
    enabled: true
    state: "{{ 'restarted' if _mq_qmgr_qmini is changed else 'started' }}"
    daemon_reload: true
  become: true

- name: "{{ qmgr_name }} qm.ini holds exactly one of each failover setting"
  ansible.builtin.command: >-
    grep -c -E '^\s*{{ item.key }}={{ item.value }}\s*$' /var/mqm/qmgrs/{{ qmgr_name }}/qm.ini
  loop: "{{ mq_qmgr_qmini_settings }}"
  loop_control:
    label: "{{ item.key }}={{ item.value }}"
  register: _mq_qmgr_qmini_check
  changed_when: false
  failed_when: _mq_qmgr_qmini_check.stdout | trim != '1'
  become: true

- name: relax channel security (LAB ONLY - spec 1 puts security out of scope)
  ansible.builtin.shell: |
    set -o pipefail
    printf "ALTER QMGR CHLAUTH(DISABLED) CONNAUTH(' ')\nREFRESH SECURITY TYPE(CONNAUTH)\n" \
      | /opt/mqm/bin/runmqsc {{ qmgr_name }}
  args:
    executable: /bin/bash
  become: true
  become_user: mqm
  register: relax
  changed_when: "'AMQ8005' in relax.stdout"
  failed_when: relax.rc not in [0, 10]

- name: define + start listener via MQSC (idempotent)
  ansible.builtin.shell: |
    set -o pipefail
    echo "DEFINE LISTENER(L1414) TRPTYPE(TCP) PORT(1414) CONTROL(QMGR) REPLACE
    START LISTENER(L1414)" | /opt/mqm/bin/runmqsc {{ qmgr_name }}
  args:
    executable: /bin/bash
  become: true
  become_user: mqm
  register: lsr
  changed_when: "'AMQ8626' not in lsr.stdout"
  failed_when: lsr.rc not in [0, 10]

# mqoperator (MQWebUser) grants (epic .github#341 spec §2.2, IBM S15; #1501): the shared
# arm-agnostic SET AUTHREC set every HA arm applies, rendered from the pcmk role's template
# and fed to runmqsc on stdin. The mqoperator OS account comes from mq-authz-accounts
# (site-distributed-shared.yml). rc 0 only: every line is a SET AUTHREC, so rc 10 is a
# refused grant, not a re-provision no-op, and must fail loud.
- name: mqoperator grants (MQWebUser, #1501)
  ansible.builtin.command:
    cmd: /opt/mqm/bin/runmqsc {{ qmgr_name }}
    stdin: >-
      {{ lookup('ansible.builtin.template',
                role_path ~ '/../mq-pcmk-qmgr/templates/mqoperator.mqsc.j2',
                template_vars={'qm_name': qmgr_name}) }}
  become: true
  become_user: mqm
  register: mqop
  changed_when: true
  failed_when: mqop.rc != 0

# Enable the resource-monitoring + statistics the mq_prometheus exporter needs
# ($SYS publications are sparse without it); MAXHANDS headroom for its per-queue
# handles. Exporter-ready when an instance is pointed at this QM (#172).
- name: enable QM monitoring for the prometheus exporter
  ansible.builtin.shell: |
    set -o pipefail
    printf "ALTER QMGR MONQ(HIGH) MONCHL(HIGH) MONACLS(HIGH) STATMQI(ON) STATQ(ON) STATCHL(HIGH) MAXHANDS(512)\n" \
      | /opt/mqm/bin/runmqsc {{ qmgr_name }}
  args:
    executable: /bin/bash
  become: true
  become_user: mqm
  register: mon
  changed_when: "'AMQ8005' in mon.stdout"
  failed_when: mon.rc not in [0, 10]

# Event monitoring (#514 enable + #515 collector), the lab-wide standard (epic .github#114).
# Host-prep (wrapper + dep asserts) then the QM-level MQSC. SVCQM is a single standalone
# host, so both halves run here together.
- name: event monitoring — host prep (wrapper + asserts)
  ansible.builtin.include_role:
    name: mq-event-monitor

- name: event monitoring — enable classes + define/start collector
  ansible.builtin.include_role:
    name: mq-event-monitor
    tasks_from: service
