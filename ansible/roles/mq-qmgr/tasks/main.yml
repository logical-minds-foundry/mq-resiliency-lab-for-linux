# L1b: create the QM, listener via MQSC, enable mqweb REST, and install
# boot services so reboot brings everything back (spec 8.3).
- name: seed JSON diagnostic logging (mqs.ini template + journald) (#282)
  ansible.builtin.include_role:
    name: mq-diag-logging
    tasks_from: system

- name: create queue manager
  ansible.builtin.command: /opt/mqm/bin/crtmqm -u SYSTEM.DEAD.LETTER.QUEUE {{ qmgr_name }}
  args:
    creates: "/var/mqm/qmgrs/{{ qmgr_name }}"
  become: true
  become_user: mqm

- name: qm systemd unit
  ansible.builtin.template:
    src: qm.service.j2
    dest: "/etc/systemd/system/mq-{{ qmgr_name }}.service"
    mode: "0644"
  become: true

# REST API on this QM — the every-QM hard requirement (design §1), via the shared
# mqweb role (de-duped from this role's former inline mqweb steps).
- name: enable the admin REST API (mqweb)
  ansible.builtin.include_role:
    name: mqweb

- name: enable + start the queue-manager service
  ansible.builtin.systemd:
    name: "mq-{{ qmgr_name }}.service"
    enabled: true
    state: started
    daemon_reload: true
  become: true

- name: relax channel security (LAB ONLY - spec 1 puts security out of scope)
  ansible.builtin.shell: |
    set -o pipefail
    printf "ALTER QMGR CHLAUTH(DISABLED) CONNAUTH(' ')\nREFRESH SECURITY TYPE(CONNAUTH)\n" \
      | /opt/mqm/bin/runmqsc {{ qmgr_name }}
  args:
    executable: /bin/bash
  become: true
  become_user: mqm
  register: relax
  changed_when: "'AMQ8005' in relax.stdout"
  failed_when: relax.rc not in [0, 10]

- name: define + start listener via MQSC (idempotent)
  ansible.builtin.shell: |
    set -o pipefail
    echo "DEFINE LISTENER(L1414) TRPTYPE(TCP) PORT(1414) CONTROL(QMGR) REPLACE
    START LISTENER(L1414)" | /opt/mqm/bin/runmqsc {{ qmgr_name }}
  args:
    executable: /bin/bash
  become: true
  become_user: mqm
  register: lsr
  changed_when: "'AMQ8626' not in lsr.stdout"
  failed_when: lsr.rc not in [0, 10]

# Enable the resource-monitoring + statistics the mq_prometheus exporter needs
# ($SYS publications are sparse without it); MAXHANDS headroom for its per-queue
# handles. Exporter-ready when an instance is pointed at this QM (#172).
- name: enable QM monitoring for the prometheus exporter
  ansible.builtin.shell: |
    set -o pipefail
    printf "ALTER QMGR MONQ(MEDIUM) MONCHL(MEDIUM) STATMQI(ON) STATQ(ON) STATCHL(MEDIUM) MAXHANDS(512)\n" \
      | /opt/mqm/bin/runmqsc {{ qmgr_name }}
  args:
    executable: /bin/bash
  become: true
  become_user: mqm
  register: mon
  changed_when: "'AMQ8005' in mon.stdout"
  failed_when: mon.rc not in [0, 10]

# Enable ALL Multiplatforms instrumentation-event classes (#514, epic .github#31).
# Everything on to start — pare back once real volume is known. CMDEV(NODISPLAY) captures
# human admin/mutating commands for the events dashboard WITHOUT the exporter's DISPLAY /
# Inquire-PCF poll flood (IBM Docs 9.4: NODISPLAY = command events except DISPLAY MQSC and
# Inquire PCF). BRIDGEEV is deliberately absent — it is z/OS-only (IMS bridge). Events land
# on SYSTEM.ADMIN.*.EVENT; the MQ.EVENT.MONITOR service (#515) drains them to JSON.
- name: enable instrumentation events (#514)
  ansible.builtin.shell: |
    set -o pipefail
    printf "ALTER QMGR AUTHOREV(ENABLED) CHADEV(ENABLED) CHLEV(ENABLED) CONFIGEV(ENABLED) INHIBTEV(ENABLED) LOCALEV(ENABLED) LOGGEREV(ENABLED) PERFMEV(ENABLED) REMOTEEV(ENABLED) SSLEV(ENABLED) STRSTPEV(ENABLED) CMDEV(NODISPLAY)\n" \
      | /opt/mqm/bin/runmqsc {{ qmgr_name }}
  args:
    executable: /bin/bash
  become: true
  become_user: mqm
  register: evgate
  changed_when: "'AMQ8005' in evgate.stdout"
  failed_when: evgate.rc not in [0, 10]

# Performance events (PERFMEV) fire only where a queue carries depth thresholds, so enabling
# PERFMEV at the QMGR alone emits nothing. Set QDPMAXEV/QDPHIEV (+ QDEPTHHI %) on the arm's
# application queue(s). Empty by default (mq_event_perf_queues) — a safe no-op where an arm
# has no curated app queue; the real list is set per-arm at the site-playbook call site.
- name: enable per-queue performance events on the app queue(s) (#514)
  ansible.builtin.shell: |
    set -o pipefail
    printf "ALTER QLOCAL({{ item }}) QDPMAXEV(ENABLED) QDPHIEV(ENABLED) QDEPTHHI(80)\n" \
      | /opt/mqm/bin/runmqsc {{ qmgr_name }}
  args:
    executable: /bin/bash
  become: true
  become_user: mqm
  loop: "{{ mq_event_perf_queues | default([]) }}"
  register: perfq
  changed_when: "'AMQ8008' in perfq.stdout"
  failed_when: perfq.rc not in [0, 10]
