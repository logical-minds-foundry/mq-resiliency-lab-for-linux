---
# Host-side self-heal for the Grafana port-forward relay (#984, was #946). The
# vergil-portforward relay leaks connections on abrupt client disconnect and wedges
# into accept-then-reset after sustained use; the durable fix is upstream
# (vergil-project/vergil-vm#298). Until it lands, a timer runs the standalone
# lab/scripts/relay-heal.sh on a cadence to recover the wedge automatically. The
# healer is deliberately mqlab-free (bash + curl + systemctl only), so unlike the
# host-net-state role it needs no host-runnable mqlab path — the whole class of
# 203/EXEC failure that a wrong mqlab path caused (#984) can't reach it.
- name: install the relay-heal service + timer
  ansible.builtin.template:
    src: "{{ item }}"
    dest: "/etc/systemd/system/{{ item | basename | regex_replace('\\.j2$', '') }}"
    mode: "0644"
  loop:
    - lab-relay-heal.service.j2
    - lab-relay-heal.timer.j2

- name: enable + start the relay-heal timer
  ansible.builtin.systemd:
    name: lab-relay-heal.timer
    enabled: true
    state: started
    daemon_reload: true
