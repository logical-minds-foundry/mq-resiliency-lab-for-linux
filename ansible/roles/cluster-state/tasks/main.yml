---
# Per-run half of the cluster-state collector (#177; epic .github#294 T7). The collector
# itself is the BAKED mq-resiliency-observability component (entry point lab-cluster-state,
# static units in /usr/lib/systemd/system, both laid down by component-install at bake).
# This role only: asserts the component is baked -> retires the pre-#294 payload and the
# /etc/systemd/system unit copies (they SHADOW the component units) -> renders the
# deployer-owned env file -> daemon-reload + enable the 5s timer. cluster_state_role is set
# by the observability overlay (cluster | storage).
- name: look for the baked observability component
  ansible.builtin.stat:
    path: /opt/logical-minds-foundry/mq-resiliency-observability/INSTALLED.json
  register: _cs_baked

- name: the observability component is baked on this box
  ansible.builtin.assert:
    that: _cs_baked.stat.exists
    fail_msg: >-
      mq-resiliency-observability is not installed on {{ inventory_hostname }}
      (no /opt/logical-minds-foundry/mq-resiliency-observability/INSTALLED.json) —
      rebuild its box (mqlab box build <box>) or install it live
      (mqlab component install mq-resiliency-observability --host {{ inventory_hostname }})

# The textfile drop zone is OWNED by the node-exporter role (02775 + the default ACL,
# #449/#458/#493), which runs earlier in this play. This role only checks it: a
# file task here once reset it to 0755 and stripped the requester write access
# (#1378), so never manage its mode outside node-exporter.
- name: look for the shared textfile drop zone
  ansible.builtin.stat:
    path: /var/lib/node_exporter/textfile
  register: _cs_dropzone

- name: the textfile drop zone is the node-exporter shared 02775 dir
  ansible.builtin.assert:
    that:
      - _cs_dropzone.stat.isdir | default(false)
      - _cs_dropzone.stat.mode == '2775'
    fail_msg: >-
      /var/lib/node_exporter/textfile on {{ inventory_hostname }} is missing or not
      mode 2775 - run the node-exporter role (observability.yml) to restore the
      shared drop zone

# A pre-#294 `systemctl enable` linked the timer to the /etc copy removed below; drop
# that link (only that one) so the enable at the end re-links the component unit.
- name: look for a timers.target.wants link to the retired /etc timer
  ansible.builtin.stat:
    path: /etc/systemd/system/timers.target.wants/lab-cluster-state.timer
    follow: false
  register: _cs_wants

- name: drop the wants link to the retired /etc timer
  ansible.builtin.file:
    path: /etc/systemd/system/timers.target.wants/lab-cluster-state.timer
    state: absent
  when: (_cs_wants.stat.lnk_target | default('')) == '/etc/systemd/system/lab-cluster-state.timer'

# systemd prefers /etc/systemd/system over /usr/lib/systemd/system: a surviving copy would
# keep running the old /usr/bin/python3 ExecStart (epic .github#294 Review Focus 1).
- name: retire the pre-#294 payload and /etc unit copies (they shadow the component units)
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /usr/local/bin/lab-cluster-state
    - /etc/systemd/system/lab-cluster-state.service
    - /etc/systemd/system/lab-cluster-state.timer

- name: render the deployer-owned env file (read by the component's static unit)
  ansible.builtin.template:
    src: lab-cluster-state.env.j2
    dest: /etc/opt/logical-minds-foundry/mq-resiliency-observability/lab-cluster-state.env
    mode: "0644"

- name: daemon-reload, enable + start the timer
  ansible.builtin.systemd:
    name: lab-cluster-state.timer
    enabled: true
    state: started
    daemon_reload: true
