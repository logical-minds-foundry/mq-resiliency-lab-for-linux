---
# DRBD 9 kernel TLS for the pcmk-drbd-ubuntu arm (lab #1609, epic .github#310 Task 6b).
# RDQM encrypts both DRBD resources (`tls yes;` in rdqmapp.res `net` and in
# rdqmapp.dr.res `connection { net }`, rdqm-a1/drbd-conf.txt), with tlshd doing the
# handshake from per-node certificates (#545, rdqm-replication-tls). This role builds the
# same from upstream parts, on every node of both sites, BEFORE pdrbd-qm brings any DRBD
# resource up: DRBD starts the tlshd handshake on connect, and with `tls yes` a link never
# reaches Connected without it.
#
# How DRBD uses it (data: LINBIT drbd, drbd/drbd_transport_tcp.c): on connect, both the
# control and the data socket go through tls_client_hello_x509 / tls_server_hello_x509
# (the kernel's net/handshake upcall to tlshd), with the peer's configured name as the
# name to verify. No tls-keyring/-privkey/-certificate is set in the .res files, so tlshd
# uses the certificate and key named in its own config, as RDQM does.
#
# Re-provision is idempotent: the certs, the trust and the config are only rewritten when
# they change, and a changed config restarts tlshd (established kTLS links live in the
# kernel and are not dropped by the restart).

# --- ktls-utils is baked (drbd9 install half); a box from before #1609 fails here ---------
- name: read installed packages (ktls-utils is baked into the pdrbd box)
  ansible.builtin.package_facts:
    manager: apt

- name: assert ktls-utils (tlshd) is baked into this node's box
  ansible.builtin.assert:
    that: "'ktls-utils' in ansible_facts.packages"
    fail_msg: >-
      {{ inventory_hostname }} has no ktls-utils (tlshd), which DRBD's replication TLS needs
      (lab #1609). This node was cloned from a pdrbd box baked before #1609: rebuild it
      (mqlab box build pdrbd-ubuntu{{ ansible_distribution_major_version }}; `mqlab box
      status` shows it STALE) and re-create the stack's nodes.

# The config's format and path follow the INSTALLED ktls-utils, never the OS release
# (data: oracle/ktls-utils source). 0.9 reads [main] debug and has no x509.truststore
# (src/tlshd/config.c, client.c, server.c at ktls-utils-0.9); 0.10 added [debug] loglevel
# and x509.truststore; 1.3.0 moved the file to /etc/tlshd/config, still reading
# /etc/tlshd.conf FIRST when it exists (NEWS; src/tlshd/main.c at ktls-utils-1.3.0).
# Ubuntu: 0.9-2build2 on 24.04, 1.3.0-2 on 26.04. The Debian revision is dropped.
- name: tlshd version (upstream part of the installed ktls-utils)
  ansible.builtin.set_fact:
    pdrbd_tlshd_version: "{{ (ansible_facts.packages['ktls-utils'] | first).version.split('-') | first }}"

- name: tlshd flavour (config format and path for this version)
  ansible.builtin.set_fact:
    pdrbd_tlshd_legacy: "{{ pdrbd_tlshd_version is version('0.10', '<') }}"
    pdrbd_tlshd_conf: "{{ '/etc/tlshd/config' if pdrbd_tlshd_version is version('1.3.0', '>=') else '/etc/tlshd.conf' }}"

# --- kernel prerequisites -----------------------------------------------------------------
# tlshd serves the kernel's "handshake" generic-netlink family (CONFIG_NET_HANDSHAKE,
# built in on Ubuntu's kernels). Without it DRBD's tls_*_hello calls have no upcall.
# Probed with a direct CTRL_CMD_GETFAMILY query, not `genl`: iproute2 6.19's genl aborts
# ("stack smashing detected") on 26.04 arm64, which a shell probe reads as "absent".
- name: the kernel's TLS handshake upcall (handshake genetlink family) is present
  ansible.builtin.script:
    cmd: genl-family-present.py handshake
    executable: python3
  changed_when: false
  become: true

# kTLS: after the handshake tlshd installs the session keys on the socket (TCP_ULP "tls").
# The module autoloads on that setsockopt; it is loaded explicitly, now and at boot, so a
# missing module fails here rather than as a handshake that never completes.
- name: load kTLS at every boot (modules-load.d)
  ansible.builtin.copy:
    dest: /etc/modules-load.d/pdrbd-tls.conf
    content: "tls\n"
    owner: root
    group: root
    mode: "0644"
  become: true

- name: load kTLS now (idempotent; the /proc/modules guard keeps reporting honest)
  ansible.builtin.shell: |
    set -e
    if grep -q '^tls ' /proc/modules; then
      echo already-loaded
    else
      modprobe tls
      echo loaded
    fi
  register: pdrbd_tls_modprobe
  changed_when: pdrbd_tls_modprobe.stdout == 'loaded'
  become: true

- name: read /proc/net/tls_stat (present once kTLS is in the kernel)
  ansible.builtin.stat:
    path: /proc/net/tls_stat
  register: pdrbd_tls_stat_file

- name: assert kTLS is live (/proc/net/tls_stat exists)
  ansible.builtin.assert:
    that: pdrbd_tls_stat_file.stat.exists
    fail_msg: >-
      /proc/net/tls_stat is missing on {{ inventory_hostname }} after `modprobe tls`:
      the kernel has no kTLS, so DRBD's replication TLS cannot work.

# --- certificates: the RDQM arm's #545 minting, into this arm's own CA store --------------
# Controller-side, CA key never on a node (rdqm-replication-tls/tasks/certs.yml). Each node:
# CN=<hostname>, SAN = DNS:<hostname> (the HA mesh peers verify each other by host name)
# + DNS:<pdrbd_repl_group_dns> (the DR resource's logical peer name).
- name: mint the replication CA + this node's cert on the controller (#545 tasks)
  ansible.builtin.include_role:
    name: rdqm-replication-tls
    tasks_from: certs.yml
  vars:
    rdqm_repl_ca_dir: "{{ pdrbd_repl_ca_dir }}"
    rdqm_repl_group_dns: "{{ pdrbd_repl_group_dns }}"
    rdqm_repl_ca_common_name: "{{ pdrbd_repl_ca_common_name }}"

- name: "replication cert dir {{ pdrbd_repl_drbd_dir }} exists"
  ansible.builtin.file:
    path: "{{ pdrbd_repl_drbd_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  become: true

- name: deploy the replication CA certificate
  ansible.builtin.copy:
    src: "{{ pdrbd_repl_ca_dir }}/ca.crt"
    dest: "{{ pdrbd_repl_drbd_dir }}/{{ pdrbd_repl_ca_file }}"
    owner: root
    group: root
    mode: "0644"
  become: true
  notify: restart tlshd (pdrbd)

- name: deploy this node's replication certificate
  ansible.builtin.copy:
    src: "{{ pdrbd_repl_ca_dir }}/{{ inventory_hostname }}.crt"
    dest: "{{ pdrbd_repl_drbd_dir }}/{{ inventory_hostname }}.crt"
    owner: root
    group: root
    mode: "0644"
  become: true
  notify: restart tlshd (pdrbd)

# A regular file, never a symlink: tlshd refuses symlinked key/cert paths (ktls-utils
# README.Debian).
- name: deploy this node's replication private key (root-only)
  ansible.builtin.copy:
    src: "{{ pdrbd_repl_ca_dir }}/{{ inventory_hostname }}.key"
    dest: "{{ pdrbd_repl_drbd_dir }}/{{ inventory_hostname }}.key"
    owner: root
    group: root
    mode: "0600"
  become: true
  no_log: true
  notify: restart tlshd (pdrbd)

# --- trust: x509.truststore where tlshd has it, the system store only on 0.9 -------------
- name: replication CA in the system trust store (ktls-utils 0.9 only; no x509.truststore)
  ansible.builtin.copy:
    src: "{{ pdrbd_repl_ca_dir }}/ca.crt"
    dest: "{{ pdrbd_repl_system_ca }}"
    owner: root
    group: root
    mode: "0644"
  when: pdrbd_tlshd_legacy | bool
  become: true
  notify: refresh the system trust bundle (pdrbd)

- name: replication CA NOT in the system trust store (x509.truststore scopes it to tlshd)
  ansible.builtin.file:
    path: "{{ pdrbd_repl_system_ca }}"
    state: absent
  when: not (pdrbd_tlshd_legacy | bool)
  become: true
  notify: refresh the system trust bundle (pdrbd)

# --- tlshd config + service ---------------------------------------------------------------
- name: render tlshd's config (client + server present this node's certificate)
  ansible.builtin.template:
    src: tlshd.conf.j2
    dest: "{{ pdrbd_tlshd_conf }}"
    owner: root
    group: root
    mode: "0644"
  become: true
  notify: restart tlshd (pdrbd)

- name: no legacy /etc/tlshd.conf to shadow /etc/tlshd/config (ktls-utils >= 1.3.0)
  ansible.builtin.file:
    path: /etc/tlshd.conf
    state: absent
  when: pdrbd_tlshd_conf != '/etc/tlshd.conf'
  become: true
  notify: restart tlshd (pdrbd)

- name: enable + start tlshd (before any DRBD resource connects)
  ansible.builtin.systemd:
    name: tlshd
    enabled: true
    state: started
    daemon_reload: true
  become: true

- name: apply a changed config now (restart tlshd before it is checked)
  ansible.builtin.meta: flush_handlers

# tlshd exits when it cannot read its config or reach the handshake family, and its unit
# has no Restart=, so a bad start shows as a unit that is no longer active a moment later.
- name: tlshd stayed up (ActiveState after a settle; its journal on failure)
  ansible.builtin.shell: |
    set -e
    sleep 3
    state=$(systemctl show -p ActiveState --value tlshd)
    if [ "$state" != active ]; then
      journalctl -u tlshd -n 30 --no-pager >&2
      echo "tlshd is '$state' on $(hostname), not active: DRBD's TLS handshakes would fail" >&2
      exit 1
    fi
    echo "tlshd active ({{ pdrbd_tlshd_conf }}, ktls-utils {{ pdrbd_tlshd_version }})"
  changed_when: false
  become: true
