# Enable the MQ administrative REST API (mqweb) on a node — the every-QM hard
# requirement (lab design §1). Deliberately QM-service-agnostic: it installs and
# runs the stateless per-node mqweb server (spec §8.3) and never touches the QM's
# own lifecycle, so it serves a systemd-managed SVC QM (mq-qmgr) and a
# cluster-managed app QM (mq-pcmk-qmgr / RDQM) alike. Requires MQWEB_AES_PASSPHRASE
# (the lab secret mqweb_aes_passphrase) and MQWEB_STATE_DIR, both exported by `mqlab
# bootstrap` at provision time and never committed (epic .github#341 spec §2.2).
- name: mqweb systemd unit
  ansible.builtin.template:
    src: mqweb.service.j2
    dest: /etc/systemd/system/mqweb.service
    mode: "0644"
  become: true

# TLS (#250): replace Liberty's default self-signed cert with the org-CA `mqweb`
# entity cert, so REST/console is served over a CA-issued cert. No .sth stash —
# Liberty reads the PKCS#12 password from mqwebuser.xml (keyStore element), where it
# is AES-encoded like every other password in the file (IBM S16, encode.yml).
- name: place the mqweb server keystore (TLS)
  ansible.builtin.include_role:
    name: pki-distribute
  vars:
    pki_entity: mqweb
    pki_dest_dir: "{{ mqweb_security_dir }}"
    pki_owner: mqm
  when: mqweb_tls | bool

- name: stash the mqweb keystore password for encoding (no_log)
  ansible.builtin.set_fact:
    mqweb_keyrpwd: "{{ pki_keyrpwd.stdout }}"
  no_log: true
  when: mqweb_tls | bool

# IBM S16: generate the server's AES key once, place it on this node, and encode every
# mqwebuser.xml password once (the users' and the keystore's), persisted under
# state("mqweb") so the render below is byte-identical on every re-provision (#1500).
# Runs after the keystore-password stash above, which it encodes.
- name: encode the registry passwords once (stable render, #1500)
  ansible.builtin.include_tasks: encode.yml

# IBM's three roles, one sample user each, no anonymous access (epic .github#341 spec §2.2).
- name: mqweb basic registry (IBM roles, encoded passwords, no anonymous access)
  ansible.builtin.template:
    src: mqwebuser.xml.j2
    dest: "{{ mqweb_server_dir }}/mqwebuser.xml"
    owner: mqm
    group: mqm
    mode: "0640"
  become: true
  no_log: true
  register: mqwebuser_xml

- name: enable mqweb (boot persistence + daemon reload)
  ansible.builtin.systemd:
    name: mqweb.service
    enabled: true
    daemon_reload: true
  become: true

# Set mqweb (Liberty) properties BEFORE starting it (#741): Liberty reads its config
# at startup, so httpHost must be set first to take effect. Setting it while mqweb is
# stopped is also instant — running setmqweb *during* the slow startup made it contend
# for ~12 min and drop the SSH connection, which surfaced (confusingly) as an
# ansible-core result-deserialization error. The default-guarded `changed_when` plus
# `failed_when: false` keep this non-fatal even if the result is ever malformed.
- name: bind mqweb to all interfaces
  ansible.builtin.command: "/opt/mqm/bin/setmqweb properties -k httpHost -v '*'"
  become: true
  become_user: mqm
  register: setmqweb
  changed_when: "'MQWB' not in (setmqweb.stderr | default(''))"
  failed_when: false

# Was mqweb already running BEFORE this play? On a first bootstrap it is not, so the
# fresh start below already loads the just-rendered TLS keystore + mqwebuser.xml (both
# written above). A restart would then be redundant AND would race the slow (~215s on
# nested arm64) initial cold-start: the restart's strmqweb finds the server lock held
# ("file lock obtained, and server process is running", exit 22), the Type=forking unit
# fails, and systemd reaps the still-initialising JVM (#1169). So the TLS restart below
# fires ONLY when mqweb was already running (a genuine cert rotation on a live server),
# gated on this probe. `is-active --quiet` → rc 0 iff active; non-fatal probe.
# noqa command-instead-of-module: `systemctl is-active` is a read-only state query;
# the systemd module has no equivalent no-op status action (matches site-dns.yml).
- name: check whether mqweb was already running (gate the TLS restart, #1169)  # noqa: command-instead-of-module
  ansible.builtin.command: systemctl is-active --quiet mqweb.service
  register: mqweb_pre_active
  changed_when: false
  failed_when: false
  become: true

# Start non-blocking: --no-block returns immediately so ansible never blocks on the
# systemd start job. The per-node readiness gate at the end of this role (paired with
# the play's `serial: 1`, #1148) is what staggers the cold starts — mqweb is a full
# Liberty JVM whose class-load I/O saturated the shared guest disk when all nodes
# started at once. Idempotent: starting an already-active unit is a no-op.
- name: start mqweb without blocking on its (slow) readiness
  ansible.builtin.systemd:
    name: mqweb.service
    state: started
    no_block: true
  become: true

# Liberty reads its keyStore/ssl config at startup, so a cert/config change needs
# a restart to take effect. --no-block keeps provision from waiting on the slow
# come-up. Only when the rendered XML actually changed AND mqweb was already running
# before this play (#1169): on a first bootstrap the fresh start above already has the
# new config, so restarting would only race its slow cold-start. On a later run that
# rotates the cert against a live server, `mqweb_pre_active.rc == 0` and this fires.
# Bounded retry on the transient systemd 'unknown state' / D-Bus query race (#882,
# extending #881): a non-transient failure satisfies `until` on attempt 1 (fail-loud).
- name: restart mqweb to pick up the TLS cert (non-blocking)
  ansible.builtin.systemd:
    name: mqweb.service
    state: restarted
    no_block: true
  become: true
  when: mqweb_tls | bool and mqwebuser_xml is changed and mqweb_pre_active.rc == 0
  register: mqweb_restart
  until: >-
    mqweb_restart is succeeded or
    mqweb_restart.msg | default('') is not
    search('Connection reset by peer|D-Bus connection terminated|Service is in unknown state')
  retries: 5
  delay: 5

# Readiness gate (bounded, non-fatal) — the last thing this role does, so with the
# play's `serial: 1` mqweb is fully up on this node (post-TLS-restart) before the next
# node starts its Liberty JVM. Isolated, mqweb reaches ready in ~20s, so this both ends
# the shared-disk stampede AND keeps mqweb from bleeding contention into the observe
# phase. Non-fatal (`failed_when: false`) preserves the design intent that the message
# path never blocks on mqweb: if a node is not ready within the cap we warn and proceed
# rather than fail provision. Port 9443 is the IBM mqweb HTTPS default (#1148).
- name: wait for mqweb REST/console to be ready (bounded, non-fatal)
  ansible.builtin.wait_for:
    port: 9443
    host: 127.0.0.1
    timeout: 300
  become: true
  register: mqweb_ready
  failed_when: false

- name: note if mqweb did not reach ready in time (non-fatal)
  ansible.builtin.debug:
    msg: >-
      mqweb REST not ready on {{ inventory_hostname }} within 300s — non-fatal,
      the message path is unaffected ({{ mqweb_ready.msg | default('') }})
  # failed_when:false above always marks the task ok, so detect the timeout by the
  # elapsed wait rather than a failed state.
  when: (mqweb_ready.elapsed | default(0)) | int >= 300

# Fail-loud-vs-slow (#1169): the gate above is non-fatal by design (the message path
# never blocks on mqweb REST). But a unit that actually FAILED to start is a real
# defect, not "just slow" — and treating the two alike is exactly what let a reaped
# mqweb be reported as a green bootstrap. Surface a failed unit distinctly (still
# non-fatal: the data path is unaffected) so an operator / live-lab validation sees it.
- name: detect a failed mqweb unit (distinct from slow-but-coming-up, #1169)  # noqa: command-instead-of-module
  ansible.builtin.command: systemctl is-active mqweb.service
  register: mqweb_post_active
  changed_when: false
  failed_when: false
  become: true

- name: warn loudly if mqweb failed to start (non-fatal, #1169)
  ansible.builtin.debug:
    msg: >-
      mqweb unit is '{{ mqweb_post_active.stdout | default('unknown') | trim }}' on
      {{ inventory_hostname }} — it FAILED to start (not merely slow). The message
      path is unaffected, but the REST/console plane is down; investigate.
  when: (mqweb_post_active.stdout | default('') | trim) == 'failed'
