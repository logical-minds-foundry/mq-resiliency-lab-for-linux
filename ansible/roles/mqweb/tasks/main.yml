# Enable the MQ administrative REST API (mqweb) on a node — the every-QM hard
# requirement (lab design §1). Deliberately QM-service-agnostic: it installs and
# runs the stateless per-node mqweb server (spec §8.3) and never touches the QM's
# own lifecycle, so it serves a systemd-managed SVC QM (mq-qmgr) and a
# cluster-managed app QM (mq-pcmk-qmgr / RDQM) alike. Requires `mqweb_admin_password`
# (injected from the lab secret at provision time, never committed).
- name: mqweb systemd unit
  ansible.builtin.template:
    src: mqweb.service.j2
    dest: /etc/systemd/system/mqweb.service
    mode: "0644"
  become: true

# TLS (#250): replace Liberty's default self-signed cert with the org-CA `mqweb`
# entity cert, so REST/console is served over a CA-issued cert. No .sth stash —
# Liberty reads the PKCS#12 password from mqwebuser.xml (keyStore element).
- name: place the mqweb server keystore (TLS)
  ansible.builtin.include_role:
    name: pki-distribute
  vars:
    pki_entity: mqweb
    pki_dest_dir: "{{ mqweb_security_dir }}"
    pki_owner: mqm
  when: mqweb_tls | bool

- name: stash the mqweb keystore password for the XML (no_log)
  ansible.builtin.set_fact:
    mqweb_keyrpwd: "{{ pki_keyrpwd.stdout }}"
  no_log: true
  when: mqweb_tls | bool

- name: mqweb basic registry (creds from env, never committed)
  ansible.builtin.template:
    src: mqwebuser.xml.j2
    dest: /var/mqm/web/installations/Installation1/servers/mqweb/mqwebuser.xml
    owner: mqm
    group: mqm
    mode: "0640"
  become: true
  no_log: true
  register: mqwebuser_xml

- name: enable mqweb (boot persistence + daemon reload)
  ansible.builtin.systemd:
    name: mqweb.service
    enabled: true
    daemon_reload: true
  become: true

# Set mqweb (Liberty) properties BEFORE starting it (#741): Liberty reads its config
# at startup, so httpHost must be set first to take effect. Setting it while mqweb is
# stopped is also instant — running setmqweb *during* the slow startup made it contend
# for ~12 min and drop the SSH connection, which surfaced (confusingly) as an
# ansible-core result-deserialization error. The default-guarded `changed_when` plus
# `failed_when: false` keep this non-fatal even if the result is ever malformed.
- name: bind mqweb to all interfaces
  ansible.builtin.command: "/opt/mqm/bin/setmqweb properties -k httpHost -v '*'"
  become: true
  become_user: mqm
  register: setmqweb
  changed_when: "'MQWB' not in (setmqweb.stderr | default(''))"
  failed_when: false

# Start non-blocking: --no-block returns immediately so ansible never blocks on the
# systemd start job. The per-node readiness gate at the end of this role (paired with
# the play's `serial: 1`, #1148) is what staggers the cold starts — mqweb is a full
# Liberty JVM whose class-load I/O saturated the shared guest disk when all nodes
# started at once. Idempotent: starting an already-active unit is a no-op.
- name: start mqweb without blocking on its (slow) readiness
  ansible.builtin.systemd:
    name: mqweb.service
    state: started
    no_block: true
  become: true

# Liberty reads its keyStore/ssl config at startup, so a cert/config change needs
# a restart to take effect. --no-block keeps provision from waiting on the slow
# come-up. Only when the rendered XML actually changed.
# Bounded retry on the transient systemd 'unknown state' / D-Bus query race (#882,
# extending #881): a non-transient failure satisfies `until` on attempt 1 (fail-loud).
- name: restart mqweb to pick up the TLS cert (non-blocking)
  ansible.builtin.systemd:
    name: mqweb.service
    state: restarted
    no_block: true
  become: true
  when: mqweb_tls | bool and mqwebuser_xml is changed
  register: mqweb_restart
  until: >-
    mqweb_restart is succeeded or
    mqweb_restart.msg | default('') is not
    search('Connection reset by peer|D-Bus connection terminated|Service is in unknown state')
  retries: 5
  delay: 5

# Readiness gate (bounded, non-fatal) — the last thing this role does, so with the
# play's `serial: 1` mqweb is fully up on this node (post-TLS-restart) before the next
# node starts its Liberty JVM. Isolated, mqweb reaches ready in ~20s, so this both ends
# the shared-disk stampede AND keeps mqweb from bleeding contention into the observe
# phase. Non-fatal (`failed_when: false`) preserves the design intent that the message
# path never blocks on mqweb: if a node is not ready within the cap we warn and proceed
# rather than fail provision. Port 9443 is the IBM mqweb HTTPS default (#1148).
- name: wait for mqweb REST/console to be ready (bounded, non-fatal)
  ansible.builtin.wait_for:
    port: 9443
    host: 127.0.0.1
    timeout: 300
  become: true
  register: mqweb_ready
  failed_when: false

- name: note if mqweb did not reach ready in time (non-fatal)
  ansible.builtin.debug:
    msg: >-
      mqweb REST not ready on {{ inventory_hostname }} within 300s — non-fatal,
      the message path is unaffected ({{ mqweb_ready.msg | default('') }})
  # failed_when:false above always marks the task ok, so detect the timeout by the
  # elapsed wait rather than a failed state.
  when: (mqweb_ready.elapsed | default(0)) | int >= 300
