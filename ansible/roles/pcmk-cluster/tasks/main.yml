# Corosync/Pacemaker formation - the hand-built equivalent of rdqmadm -c.
# Cluster comms ride the heartbeat net (the same axis the fault suite
# severs). hacluster password is runtime-injected (PCMK_HACLUSTER_PASSWORD).
#
# Version-neutral across Ubuntu LTS: 24.04 ships pacemaker 2.1.6 / pcs 0.11.7, 26.04
# ships pacemaker 3.0.1 / pcs 0.12.1 (docs/reference/os-version-support-matrix.md §3.3).
# Reviewed for #1282 against the pcs CHANGELOG (0.12.0a1..0.12.1 "Removed"/"Changed",
# https://github.com/ClusterLabs/pcs/blob/main/CHANGELOG.md) and the Pacemaker 3.0
# changes (https://github.com/ClusterLabs/pacemaker/blob/main/ChangeLog.md,
# https://projects.clusterlabs.org/w/projects/pacemaker/pacemaker_3.0_changes/): none
# of `pcs host auth`, `pcs cluster setup|enable|start` or `pcs status` used here was
# removed or changed, and pacemaker's text node list still prints "Online: [ ... ]"
# (lib/pengine/pe_output.c, Pacemaker-2.1.6 and Pacemaker-3.0.1).
- name: install cluster stack (OS-adapter)
  ansible.builtin.include_tasks: "install-{{ ansible_os_family }}.yml"

# Corosync timing (#1621; defaults/main.yml). The knet link values go to `pcs cluster
# setup` as one link's options, all three or none, as the blueprint that motivates them
# sets them (pcs also refuses ping_interval without ping_timeout and the reverse).
- name: "corosync timing variables are consistent (fail loud)"
  ansible.builtin.assert:
    that:
      - pcmk_cluster_totem_token_ms | int >= 0
      - >-
        [pcmk_cluster_knet_ping_timeout_ms, pcmk_cluster_knet_ping_interval_ms,
        pcmk_cluster_knet_pong_count] | map('int') | select('gt', 0) | list | length in [0, 3]
    fail_msg: >-
      Set pcmk_cluster_knet_ping_timeout_ms, pcmk_cluster_knet_ping_interval_ms and
      pcmk_cluster_knet_pong_count together or not at all (got
      {{ pcmk_cluster_knet_ping_timeout_ms }} / {{ pcmk_cluster_knet_ping_interval_ms }} /
      {{ pcmk_cluster_knet_pong_count }}), and pcmk_cluster_totem_token_ms >= 0 (got
      {{ pcmk_cluster_totem_token_ms }}) (#1621).
  run_once: true

- name: site hosts entries (hb addresses)
  ansible.builtin.lineinfile:
    path: /etc/hosts
    line: "{{ item.hb }} {{ item.name }}"
    regexp: "\\s{{ item.name }}$"
  loop: "{{ pcmk_site_nodes }}"
  become: true

- name: hacluster password
  ansible.builtin.shell: |
    set -o pipefail
    echo "hacluster:{{ lookup('env', 'PCMK_HACLUSTER_PASSWORD') }}" | chpasswd
  args:
    executable: /bin/bash
  no_log: true
  changed_when: false
  become: true

- name: pcsd enabled + started
  ansible.builtin.systemd:
    name: pcsd
    enabled: true
    state: started
  become: true

# Readiness gate (#916). `systemd: state=started` returns as soon as the unit is
# started, not when pcsd is listening, and each node starts its own pcsd in
# parallel. `pcs host auth` (below) runs on the run_once node and talks to every
# site node's pcsd over the heartbeat address (TCP 2224, the pcsd default), so gate
# on exactly that path from exactly that node. Bounded; fails loud naming the node.
- name: wait for pcsd on every site node (hb address, TCP 2224)
  ansible.builtin.wait_for:
    host: "{{ item.hb }}"
    port: 2224
    timeout: 180
    msg: >-
      pcsd on {{ item.name }} ({{ item.hb }}:2224) not reachable from
      {{ inventory_hostname }} within 180s — cannot run pcs host auth for
      {{ pcmk_cluster_name }} (#916)
  loop: "{{ pcmk_site_nodes }}"
  loop_control:
    label: "{{ item.name }} {{ item.hb }}"
  run_once: true

# auth + cluster setup, with a bounded retry (#916: a transient b-site failure
# during a cold provision recovered on a plain `--from provision` re-run).
#
# Retry safety:
# - `pcs host auth` is repeatable: it re-issues and overwrites the pcsd tokens.
# - `pcs cluster setup ... --force` only runs while the corosync.conf probe says the
#   cluster is not formed; `--force` overrides "node already in a cluster", so a
#   setup that half-distributed corosync.conf to the peers is redone cleanly.
# - `pcs cluster enable|start --all` run on EVERY attempt, outside the probe. Both are
#   idempotent on a running cluster, and this heals the half-formed case where a
#   failed attempt wrote corosync.conf here but never started the cluster (the probe
#   would otherwise say "already-formed" and skip the start forever). Anything still
#   not right is caught by "wait for all nodes online" below, which fails loud.
#
# Secret handling: the hacluster password reaches the script via `environment:` and
# is referenced as "$PCMK_HACLUSTER_PASSWORD", so it is never in the rendered command
# line; `no_log` stays on the task that handles it. On final failure the rescue
# surfaces pcs's rc + stdout/stderr with the password redacted, so the flake names
# its cause instead of hiding behind the no_log censor.
- name: auth + cluster setup (run once; bounded retry; redacted diagnostics)
  run_once: true
  become: true
  block:
    - name: auth + cluster setup (run once; idempotent via corosync.conf probe)
      ansible.builtin.shell: |
        set -e
        if grep -q 'cluster_name: {{ pcmk_cluster_name }}' /etc/corosync/corosync.conf 2>/dev/null; then
          echo already-formed
        else
          pcs host auth {% for n in pcmk_site_nodes %}{{ n.name }} addr={{ n.hb }} {% endfor %} -u hacluster -p "$PCMK_HACLUSTER_PASSWORD"
          pcs cluster setup {{ pcmk_cluster_name }} {% for n in pcmk_site_nodes %}{{ n.name }} addr={{ n.hb }} {% endfor %} {% if pcmk_cluster_knet_ping_interval_ms | int > 0 %}transport knet link linknumber=0 ping_timeout={{ pcmk_cluster_knet_ping_timeout_ms | int }} ping_interval={{ pcmk_cluster_knet_ping_interval_ms | int }} pong_count={{ pcmk_cluster_knet_pong_count | int }} {% endif %}{% if pcmk_cluster_totem_token_ms | int > 0 %}totem token={{ pcmk_cluster_totem_token_ms | int }} {% endif %}--force
        fi
        pcs cluster enable --all
        pcs cluster start --all
      args:
        executable: /bin/bash
      environment:
        PCMK_HACLUSTER_PASSWORD: "{{ lookup('env', 'PCMK_HACLUSTER_PASSWORD') }}"
      register: pcsform
      until: pcsform.rc is defined and pcsform.rc == 0
      retries: 4
      delay: 15
      changed_when: "'already-formed' not in pcsform.stdout"
      no_log: true
  rescue:
    # Not no_log: everything printed is passed through the redaction filter, which
    # replaces every occurrence of the password. The guard skips the replace for an
    # empty password (which chpasswd above already rejects) — replace('') would
    # otherwise splice the marker between every character.
    - name: fail loud with pcs rc + output (password redacted)
      vars:
        _pcmk_pw: "{{ lookup('env', 'PCMK_HACLUSTER_PASSWORD') }}"
        _pcmk_rc: "{{ pcsform.rc | default('n/a') }}"
        _pcmk_raw: >-
          module_msg={{ pcsform.msg | default('') }} ||
          stdout={{ pcsform.stdout | default('') }} ||
          stderr={{ pcsform.stderr | default('') }}
      ansible.builtin.fail:
        msg: >-
          pcs auth/cluster setup for {{ pcmk_cluster_name }} failed on
          {{ inventory_hostname }} after {{ pcsform.attempts | default('?') }}
          attempt(s), last rc={{ _pcmk_rc }} (#916):
          {{ (_pcmk_raw | replace(_pcmk_pw, '<redacted>')) if (_pcmk_pw | length > 0) else _pcmk_raw }}

- name: wait for all nodes online
  ansible.builtin.shell: |
    set -o pipefail
    for i in $(seq 1 30); do
      if pcs status 2>/dev/null | grep -q 'Online:.*{{ pcmk_site_nodes | map(attribute="name") | join(".*") }}'; then
        echo all-online; exit 0
      fi
      sleep 5
    done
    pcs status 2>&1 | head -20
    exit 1
  args:
    executable: /bin/bash
  run_once: true
  changed_when: false
  become: true

# Corosync timing check (#1621), only where the play sets a value. Every node, read from
# its running corosync: totem.token is the configured token, the knet values are link
# 0's. pcs writes these only at formation, so a cluster formed before they were set (or
# with others) still runs the old ones; that fails here rather than passing unnoticed.
- name: read the running corosync totem settings
  ansible.builtin.command:
    argv: [corosync-cmapctl, totem.]
  register: pcmk_cluster_cmap
  changed_when: false
  when: (pcmk_cluster_totem_token_ms | int > 0) or (pcmk_cluster_knet_ping_interval_ms | int > 0)
  become: true

- name: "corosync runs the configured timing values (fail loud)"
  ansible.builtin.assert:
    that: >-
      pcmk_cluster_cmap.stdout is search('(?m)^' ~ (item.key | regex_escape)
      ~ ' \(\w+\) = ' ~ item.value ~ '$')
    fail_msg: >-
      corosync on {{ inventory_hostname }} does not run {{ item.key }} = {{ item.value }};
      corosync-cmapctl reports {{ pcmk_cluster_cmap.stdout_lines | select('search',
      item.key) | list }}. pcs sets this only when it forms the cluster, so a cluster
      formed without it keeps its old value: re-form {{ pcmk_cluster_name }} by tearing
      the stack down and bootstrapping it again (#1621).
  loop: >-
    {{ ({'totem.token': pcmk_cluster_totem_token_ms | int}
        if pcmk_cluster_totem_token_ms | int > 0 else {})
       | combine({'totem.interface.0.knet_ping_timeout': pcmk_cluster_knet_ping_timeout_ms | int,
                  'totem.interface.0.knet_ping_interval': pcmk_cluster_knet_ping_interval_ms | int,
                  'totem.interface.0.knet_pong_count': pcmk_cluster_knet_pong_count | int}
                 if pcmk_cluster_knet_ping_interval_ms | int > 0 else {})
       | dict2items }}
  loop_control:
    label: "{{ item.key }} = {{ item.value }}"
