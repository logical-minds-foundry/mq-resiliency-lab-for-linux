# Corosync/Pacemaker formation - the hand-built equivalent of rdqmadm -c.
# Cluster comms ride the heartbeat net (the same axis the fault suite
# severs). hacluster password is runtime-injected (PCMK_HACLUSTER_PASSWORD).
#
# Version-neutral across Ubuntu LTS: 24.04 ships pacemaker 2.1.6 / pcs 0.11.7, 26.04
# ships pacemaker 3.0.1 / pcs 0.12.1 (docs/reference/os-version-support-matrix.md §3.3).
# Reviewed for #1282 against the pcs CHANGELOG (0.12.0a1..0.12.1 "Removed"/"Changed",
# https://github.com/ClusterLabs/pcs/blob/main/CHANGELOG.md) and the Pacemaker 3.0
# changes (https://github.com/ClusterLabs/pacemaker/blob/main/ChangeLog.md,
# https://projects.clusterlabs.org/w/projects/pacemaker/pacemaker_3.0_changes/): none
# of `pcs host auth`, `pcs cluster setup|enable|start` or `pcs status` used here was
# removed or changed, and pacemaker's text node list still prints "Online: [ ... ]"
# (lib/pengine/pe_output.c, Pacemaker-2.1.6 and Pacemaker-3.0.1).
- name: install cluster stack (OS-adapter)
  ansible.builtin.include_tasks: "install-{{ ansible_os_family }}.yml"

- name: site hosts entries (hb addresses)
  ansible.builtin.lineinfile:
    path: /etc/hosts
    line: "{{ item.hb }} {{ item.name }}"
    regexp: "\\s{{ item.name }}$"
  loop: "{{ pcmk_site_nodes }}"
  become: true

- name: hacluster password
  ansible.builtin.shell: |
    set -o pipefail
    echo "hacluster:{{ lookup('env', 'PCMK_HACLUSTER_PASSWORD') }}" | chpasswd
  args:
    executable: /bin/bash
  no_log: true
  changed_when: false
  become: true

- name: pcsd enabled + started
  ansible.builtin.systemd:
    name: pcsd
    enabled: true
    state: started
  become: true

- name: auth + cluster setup (run once; idempotent via corosync.conf probe)
  ansible.builtin.shell: |
    set -e
    if grep -q 'cluster_name: {{ pcmk_cluster_name }}' /etc/corosync/corosync.conf 2>/dev/null; then
      echo already-formed
      exit 0
    fi
    pcs host auth {% for n in pcmk_site_nodes %}{{ n.name }} addr={{ n.hb }} {% endfor %} -u hacluster -p "{{ lookup('env', 'PCMK_HACLUSTER_PASSWORD') }}"
    pcs cluster setup {{ pcmk_cluster_name }} {% for n in pcmk_site_nodes %}{{ n.name }} addr={{ n.hb }} {% endfor %} --force
    pcs cluster enable --all
    pcs cluster start --all
  run_once: true
  register: pcsform
  changed_when: "'already-formed' not in pcsform.stdout"
  no_log: true
  become: true

- name: wait for all nodes online
  ansible.builtin.shell: |
    set -o pipefail
    for i in $(seq 1 30); do
      if pcs status 2>/dev/null | grep -q 'Online:.*{{ pcmk_site_nodes | map(attribute="name") | join(".*") }}'; then
        echo all-online; exit 0
      fi
      sleep 5
    done
    pcs status 2>&1 | head -20
    exit 1
  args:
    executable: /bin/bash
  run_once: true
  changed_when: false
  become: true
