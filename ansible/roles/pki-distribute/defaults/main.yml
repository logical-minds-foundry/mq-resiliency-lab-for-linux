---
# Resolve the controller's keystore tree + secret script relative to the playbook
# (ansible/), matching the {{ playbook_dir }}/../build convention used by mq-client
# and the obs roles. (repo_root is only defined inside the PKI provider's own
# site-pki.yml, not the distributed playbooks that consume this role — #250.)
pki_src_dir: "{{ playbook_dir }}/../build/state/secrets/pki/entities"
pki_secret_script: "{{ playbook_dir }}/../lab/scripts/lab-secret.sh"
pki_owner: mqm
# MQI *clients* (pymqi app/responder, the exporter) read a PKCS#12 keystore's
# password from a sibling `.sth` stash, since pymqi's SCO has no password field.
# QMs/mqweb persist KEYRPWD in their own config instead, so this stays off by
# default and the client roles flip it on (#250). Proven live: stash + SCO
# CertificateLabel = TLS_CONNECT_OK over a mutual-TLS SVRCONN.
pki_stash: false
