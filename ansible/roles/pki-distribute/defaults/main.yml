---
# Resolve the controller's keystore tree + secret script relative to the playbook
# (ansible/), matching the {{ playbook_dir }}/../build convention used by mq-client
# and the obs roles. (repo_root is only defined inside the PKI provider's own
# site-pki.yml, not the distributed playbooks that consume this role — #250.)
pki_src_dir: "{{ playbook_dir }}/../build/secrets/pki/entities"
pki_secret_script: "{{ playbook_dir }}/../lab/scripts/lab-secret.sh"
pki_owner: mqm
