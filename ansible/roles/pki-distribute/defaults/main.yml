---
# The controller's keystore tree lives in the shared state bucket (mqlab_state_dir,
# group_vars/all/buckets.yml, #1569); the secret script is code, so it resolves relative
# to the playbook (ansible/). (repo_root is only defined inside the PKI provider's own
# site-pki.yml, not the distributed playbooks that consume this role — #250.)
pki_src_dir: "{{ mqlab_state_dir }}/secrets/pki/entities"
pki_secret_script: "{{ playbook_dir }}/../lab/scripts/lab-secret.sh"
pki_owner: mqm
# MQI *clients* (the ibmmq app/responder, the exporter) read a PKCS#12 keystore's
# password from a sibling `.sth` stash (SCO.KeyRepoPassword adoption is deferred,
# epic .github#300 §9).
# QMs/mqweb persist KEYRPWD in their own config instead, so this stays off by
# default and the client roles flip it on (#250). Proven live: stash + SCO
# CertificateLabel = TLS_CONNECT_OK over a mutual-TLS SVRCONN.
pki_stash: false
