---
# CONFIGURE (#602): the per-run half of the bind-dns role — the generated zone data
# and the per-host named.conf.{options,local} (keyed by inventory_hostname), rendered
# per lab by `mqlab dns render` into build/work/dns/. These cannot be baked (they are
# topology- and host-specific), so they stay in the per-run path, then named is
# (re)started to serve them.

# Base-OS refresh at instance-build (#606, Ubuntu analogue of #604's dnf-update per
# spec §4.5.1): the infra-ubuntu2404 box freezes its apt package set at bake time, so
# refresh it on first boot to pick up security updates a frozen image would otherwise
# miss. Unlike the RDQM box there is NO kernel-matched kmod to protect (bind9 /
# node-exporter / alloy are all userspace), so nothing is held back. On a bare Ubuntu
# node (un-baked main.yml path) this is a harmless up-front refresh; idempotent either
# way (changed only when packages actually move).
# noqa package-latest: a base-OS refresh is deliberately an unqualified upgrade — that
# is the whole point of the instance-build update.
- name: base-OS refresh at instance-build (apt update + upgrade)  # noqa: package-latest
  ansible.builtin.apt:
    update_cache: true
    upgrade: dist
  become: true

- name: install the zone files
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "/etc/bind/zones/{{ item | basename }}"
    owner: root
    group: bind
    mode: "0644"
  loop: "{{ query('fileglob', bind_dns_src + '/*.zone') }}"
  become: true
  notify: reload named

- name: install this node's forwarders/options
  ansible.builtin.copy:
    src: "{{ bind_dns_src }}/named.conf.options.{{ inventory_hostname }}"
    dest: /etc/bind/named.conf.options
    owner: root
    group: bind
    mode: "0644"
  become: true
  notify: reload named

- name: install this node's zone declarations
  ansible.builtin.copy:
    src: "{{ bind_dns_src }}/named.conf.local.{{ inventory_hostname }}"
    dest: /etc/bind/named.conf.local
    owner: root
    group: bind
    mode: "0644"
  become: true
  notify: reload named

- name: BIND9 enabled and started
  ansible.builtin.systemd:
    name: named
    enabled: true
    state: started
  become: true
