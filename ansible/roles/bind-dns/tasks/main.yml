---
# bind-dns (#476, epic .github#21): serve the generated forward + reverse zones
# from an infra node. Authoritative-zone vs forwarder split is baked into the
# per-node named.conf.{options,local} rendered by `mqlab dns render` — this role
# just installs BIND, drops the files, and reloads. Applied to the `infra` group.
- name: install BIND9
  ansible.builtin.apt:
    name: bind9
    state: present
    update_cache: true
  become: true

- name: authoritative zone directory
  ansible.builtin.file:
    path: /etc/bind/zones
    state: directory
    owner: root
    group: bind
    mode: "0750"
  become: true

- name: install the zone files
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "/etc/bind/zones/{{ item | basename }}"
    owner: root
    group: bind
    mode: "0644"
  loop: "{{ query('fileglob', bind_dns_src + '/*.zone') }}"
  become: true
  notify: reload named

- name: install this node's forwarders/options
  ansible.builtin.copy:
    src: "{{ bind_dns_src }}/named.conf.options.{{ inventory_hostname }}"
    dest: /etc/bind/named.conf.options
    owner: root
    group: bind
    mode: "0644"
  become: true
  notify: reload named

- name: install this node's zone declarations
  ansible.builtin.copy:
    src: "{{ bind_dns_src }}/named.conf.local.{{ inventory_hostname }}"
    dest: /etc/bind/named.conf.local
    owner: root
    group: bind
    mode: "0644"
  become: true
  notify: reload named

- name: BIND9 enabled and started
  ansible.builtin.systemd:
    name: named
    enabled: true
    state: started
  become: true
