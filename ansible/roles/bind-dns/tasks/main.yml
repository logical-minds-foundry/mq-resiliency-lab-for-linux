---
# bind-dns (#476, epic .github#21): serve the generated forward + reverse zones
# from an infra node. Authoritative-zone vs forwarder split is baked into the
# per-node named.conf.{options,local} rendered by `mqlab dns render` — this role
# just installs BIND, drops the files, and reloads. Applied to the `infra` group.
#
# Split along the bake/configure line (#602): the install half (bind9 package +
# zone-dir scaffolding) is image-bakeable; the configure half is the per-run zone
# data + per-host named.conf render + service start. main.yml runs both in order, so
# the normal per-run path is unchanged. A single-host bake play consumes install.yml
# directly via `tasks_from: install`.
- name: install BIND9 (bakeable)
  ansible.builtin.import_tasks: install.yml

- name: configure BIND9 (per-run zones + per-host config)
  ansible.builtin.import_tasks: configure.yml
