---
# BAKE (#602): the install-time half of the bind-dns role — the BIND9 package and
# the authoritative-zone directory scaffolding. NO zone data and NO per-host
# named.conf (both are per-run renders keyed by inventory_hostname — see
# configure.yml). This is the `bind-dns-install` split the task calls for, kept as a
# `tasks_from: install` entry point (matching the repo's mq-exporter idiom) rather
# than a separate role dir, so the zone/config handlers stay in one role. A
# single-host `bake` play consumes this via `tasks_from: install`.
- name: install BIND9
  ansible.builtin.apt:
    name: bind9
    state: present
    update_cache: true
  become: true

- name: authoritative zone directory
  ansible.builtin.file:
    path: /etc/bind/zones
    state: directory
    owner: root
    group: bind
    mode: "0750"
  become: true

# The bind9 deb auto-enables + starts named on install, so a baked box would boot
# named BEFORE its per-run zones + named.conf exist — the pre-config default-state
# race this phased-startup fix targets (#642): named eating first-boot resources and
# racing sshd is the measured infra-ubuntu2404 SSH flake. Leave named explicitly
# disabled + stopped in the bake half; the per-run configure half enables + starts it
# once the rendered zones and this node's named.conf are in place.
- name: named disabled + stopped at bake (inert until per-run configure)
  ansible.builtin.systemd:
    name: named
    enabled: false
    state: stopped
  become: true
