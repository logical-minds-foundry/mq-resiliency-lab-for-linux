# targetcli-fb (the LIO admin tool). Baked into the `san` box (bake-san.yml, #1278), so on
# a baked box the package_facts guard skips the apt run (no per-run archive pull); an
# un-baked host still gets a plain network apt install, which is also what the bake runs.
- name: read the installed packages (skip-if-baked guard)
  ansible.builtin.package_facts:
    manager: apt

- name: install targetcli (skipped when baked)
  ansible.builtin.apt:
    name: targetcli-fb
    state: present
    update_cache: true
    # Wait out a fresh-boot unattended-upgrades holding the dpkg frontend lock instead of
    # failing the run (#820, epic .github#104).
    lock_timeout: "{{ apt_lock_timeout }}"
  when: "'targetcli-fb' not in ansible_facts.packages"
  become: true
