---
# Install ONE staged component artifact (epic .github#294 spec §5.7). This is the ONLY
# install path: the bake plays run it, and so does `mqlab component install` against a
# running lab. The live install is untouched unless the new release passes its selfcheck.
#
# Layout (#1372): every install is a release built at its FINAL path and never moved
# (venvs are not relocatable); `venv` and `previous` are symlinks into releases/:
#   <prefix>/<name>/releases/<version>+<tree>-<stamp>/venv
#   <prefix>/<name>/venv     -> releases/<live>/venv       (what units run)
#   <prefix>/<name>/previous -> releases/<prev>/venv       (rollback: flip venv back)
#
#   1. precondition: the pinned runtime is on the guest (checked BEFORE any change);
#   2. copy the staged artifact (wheel, requirements, deps/, systemd/, BUILD.json);
#   3. build the release venv with the pinned interpreter and THAT venv's own pip,
#      always offline (--no-index --find-links deps/) and hash-pinned — never uv/PyPI;
#   4. selfcheck the release in place — a failure removes it and fails, nothing flips;
#   5. flip `venv` to it atomically (ln -s + mv -T), recording `previous`;
#   6. selfcheck through the live venv/bin path — a failure flips back and fails;
#   7. prune to live + previous, record INSTALLED.json, install the static units,
#      daemon-reload, and (live lab only) restart the enabled ones.

# --- 1. precondition (read-only; nothing above this line or in it changes the guest) ---
- name: Is the pinned runtime installed?
  ansible.builtin.stat:
    path: "{{ component_runtime_prefix }}/cpython-{{ runtime_python.minor }}/PIN"
  register: _c_pin_stat

- name: Read the runtime PIN
  ansible.builtin.slurp:
    src: "{{ component_runtime_prefix }}/cpython-{{ runtime_python.minor }}/PIN"
  register: _c_pin
  when: _c_pin_stat.stat.exists

- name: Precondition — the guest runtime matches the pin (checked BEFORE any change)
  ansible.builtin.assert:
    that:
      - _c_pin_stat.stat.exists
      - (_c_pin.content | b64decode | trim) == runtime_python.token
    fail_msg: >-
      the guest runtime on {{ inventory_hostname }} is
      {{ (_c_pin.content | b64decode | trim) if _c_pin_stat.stat.exists else 'absent' }},
      not the pinned {{ runtime_python.token }} ({{ component_runtime_prefix }}/cpython-{{
      runtime_python.minor }}) — rebuild its box (mqlab box build <box>; mqlab box status
      lists them) and re-provision the guest. Nothing was changed.

- name: Precondition — a staged artifact was supplied for this component
  ansible.builtin.assert:
    that:
      - component_name is defined
      - component_name in component_artifacts
    fail_msg: >-
      no staged artifact for component {{ component_name | default('(component_name unset)') }}
      (supplied: {{ component_artifacts | list | join(', ') or 'none' }}) — run
      mqlab component build <name>, then mqlab component install <name> --host <guest>

- name: Set the component paths
  ansible.builtin.set_fact:
    _c_runtime: "{{ component_runtime_prefix }}/cpython-{{ runtime_python.minor }}/bin/python{{ runtime_python.minor }}"
    _c_root: "{{ component_install_prefix }}/{{ component_name }}"
    _c_etc: "{{ component_config_prefix }}/{{ component_name }}"
    _c_src: "{{ component_artifacts[component_name] }}"
    _c_stage: "/var/tmp/component-{{ component_name }}"

# --- 2. copy the artifact ----------------------------------------------------------------
- name: Clear the guest staging dir
  become: true
  ansible.builtin.file:
    path: "{{ _c_stage }}"
    state: absent

- name: Copy the staged artifact (trailing slash = its contents)
  become: true
  ansible.builtin.copy:
    src: "{{ _c_src }}/"
    dest: "{{ _c_stage }}/"
    mode: preserve

- name: Component dirs (/opt payload, /etc/opt deployer config)
  become: true
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - "{{ _c_root }}"
    - "{{ _c_etc }}"

# --- 3. build the release, in place ------------------------------------------------------
# A Python venv is NOT relocatable: pip writes absolute shebangs into console scripts. So
# each install is built at its FINAL, unique path releases/<version>+<tree>-<stamp>/venv
# and never moved; going live is an atomic flip of the `venv` symlink (#1372, the V1
# #1357 finding: a venv.new -> venv rename left every entry point pointing at venv.new).
- name: Name this release (unique per install, never reused, never moved)
  ansible.builtin.set_fact:
    _c_release_id: "{{ _c_src | basename }}-{{ now(utc=true).strftime('%Y%m%dT%H%M%SZ') }}"

- name: Release path
  ansible.builtin.set_fact:
    _c_release: "{{ _c_root }}/releases/{{ _c_release_id }}"

# sdist dependencies (pymqi) compile here, against the box's MQ SDK. The pinned runtime's
# sysconfig names `clang` (CC/LDSHARED), which the guests do not have (spike report
# docs/reports/2026-10-guest-runtime-spike.md, correction C2): CC and LDSHARED are derived
# from the venv interpreter's OWN sysconfig with only the leading `clang` swapped for
# `gcc`, which keeps the recorded hardening flags (relro, now, noexecstack) and cannot
# drift on a pin bump. No `| head` anywhere: under pipefail a multi-line producer piped
# into an early-exiting reader dies of SIGPIPE (rc 141, #1359).
- name: Build and selfcheck the release (a failure removes it; the live venv is untouched)
  block:
    - name: Build the release venv (pinned runtime, the venv's own pip, offline, hash-pinned)
      become: true
      ansible.builtin.shell: |
        set -euo pipefail
        rel="{{ _c_release }}"
        stage="{{ _c_stage }}"
        rm -rf "$rel"
        mkdir -p "$rel"
        "{{ _c_runtime }}" -m venv "$rel/venv"
        py="$rel/venv/bin/python"
        pip="$rel/venv/bin/pip"
        if [ -s "$stage/build-requirements.txt" ]; then
          "$pip" install --no-index --find-links "$stage/deps" --require-hashes \
            -r "$stage/build-requirements.txt"
        fi
        if [ -s "$stage/requirements.txt" ]; then
          gcc_for() {
            "$py" -c 'import re, sys, sysconfig; v = sysconfig.get_config_var(sys.argv[1]) or ""; print(re.sub(r"^clang(?=\s|$)", "gcc", v))' "$1"
          }
          CC="$(gcc_for CC)"
          LDSHARED="$(gcc_for LDSHARED)"
          if [ -z "$CC" ] || [ -z "$LDSHARED" ]; then
            echo "the pinned runtime's sysconfig has no CC/LDSHARED (CC='$CC' LDSHARED='$LDSHARED')" >&2
            exit 1
          fi
          export CC LDSHARED
          echo "sdist builds use CC='$CC' LDSHARED='$LDSHARED'"
          "$pip" install --no-index --find-links "$stage/deps" --require-hashes \
            --no-build-isolation -r "$stage/requirements.txt"
        fi
        "$pip" install --no-index --no-deps "$stage"/*.whl
      args:
        executable: /bin/bash
      environment:
        LD_LIBRARY_PATH: /opt/mqm/lib64
      changed_when: true

    # --- 4. selfcheck the release IN PLACE, before it goes live ---------------------------
    - name: Selfcheck the release in place (before going live)
      become: true
      ansible.builtin.command:
        argv: ["{{ _c_release }}/venv/bin/{{ component_name }}-selfcheck"]
      environment:
        LD_LIBRARY_PATH: /opt/mqm/lib64
      changed_when: false
  rescue:
    - name: Remove the failed release (nothing went live)
      become: true
      ansible.builtin.file:
        path: "{{ _c_release }}"
        state: absent

    - name: Fail loudly (the live venv was not touched)
      ansible.builtin.fail:
        msg: >-
          {{ component_name }} release {{ _c_release_id }} failed to build or selfcheck on
          {{ inventory_hostname }}; it was removed and the live install is unchanged — see
          the task output above, fix the component, then mqlab component build
          {{ component_name }} and mqlab component install {{ component_name }} --host
          {{ inventory_hostname }}

# --- 5. go live: atomic flip of the venv symlink, remembering the previous release -------
# `venv` -> releases/<id>/venv (relative). The flip is `ln -s` to a temp name then
# `mv -T` (rename(2) is atomic). Legacy layouts are cleared: a real `venv` directory and
# any venv.new / venv.prev from before #1372.
- name: Flip venv to the new release (atomic), recording previous
  become: true
  ansible.builtin.shell: |
    set -euo pipefail
    cd "{{ _c_root }}"
    new="releases/{{ _c_release_id }}/venv"
    prev=""
    if [ -L venv ]; then
      prev="$(readlink venv)"
    elif [ -e venv ]; then
      rm -rf venv
    fi
    rm -rf venv.new venv.prev venv.tmp previous.tmp
    ln -s "$new" venv.tmp
    mv -T venv.tmp venv
    if [ -n "$prev" ] && [ "$prev" != "$new" ]; then
      ln -s "$prev" previous.tmp
      mv -T previous.tmp previous
    fi
    echo "live=$new previous=${prev:-none}"
  args:
    executable: /bin/bash
  register: _c_flip
  changed_when: true

# --- 6. prove it through the LIVE path; on failure flip back ------------------------------
- name: Selfcheck through the live path (a failure flips back to previous)
  block:
    - name: Selfcheck through venv/bin (proves the live entry points execute)
      become: true
      ansible.builtin.command:
        argv: ["{{ _c_root }}/venv/bin/{{ component_name }}-selfcheck"]
      environment:
        LD_LIBRARY_PATH: /opt/mqm/lib64
      changed_when: false
  rescue:
    - name: Flip back to the previous release (or take the broken one offline)
      become: true
      ansible.builtin.shell: |
        set -euo pipefail
        cd "{{ _c_root }}"
        if [ -L previous ]; then
          ln -s "$(readlink previous)" venv.tmp
          mv -T venv.tmp venv
          echo "flipped back to $(readlink venv)"
        else
          rm -f venv
          echo "no previous release: venv removed so nothing broken runs"
        fi
      args:
        executable: /bin/bash
      changed_when: true

    - name: Fail loudly (the live path did not selfcheck)
      ansible.builtin.fail:
        msg: >-
          {{ component_name }} release {{ _c_release_id }} passed its in-place selfcheck but
          FAILED through the live path {{ _c_root }}/venv on {{ inventory_hostname }}; the
          flip was reverted — see the task output above

# --- 7. prune: keep the live release and the previous one --------------------------------
- name: Prune old releases (keep live + previous)
  become: true
  ansible.builtin.shell: |
    set -euo pipefail
    cd "{{ _c_root }}"
    keep_live="$(basename "$(dirname "$(readlink venv)")")"
    keep_prev=""
    if [ -L previous ]; then keep_prev="$(basename "$(dirname "$(readlink previous)")")"; fi
    for d in releases/*/; do
      id="$(basename "$d")"
      if [ "$id" != "$keep_live" ] && [ "$id" != "$keep_prev" ]; then
        rm -rf "releases/$id"
        echo "pruned $id"
      fi
    done
  args:
    executable: /bin/bash
  register: _c_prune
  changed_when: _c_prune.stdout | length > 0

- name: Record INSTALLED.json
  become: true
  ansible.builtin.copy:
    dest: "{{ _c_root }}/INSTALLED.json"
    mode: "0644"
    content: >-
      {{ (lookup('ansible.builtin.file', _c_src + '/BUILD.json') | from_json)
         | combine({'installed_at': now(utc=true).isoformat(),
                    'runtime_installed': runtime_python.token,
                    'release': _c_release_id})
         | to_nice_json }}

- name: Remove the guest staging dir
  become: true
  ansible.builtin.file:
    path: "{{ _c_stage }}"
    state: absent

- name: List the component's static units
  ansible.builtin.set_fact:
    _c_units: "{{ query('ansible.builtin.fileglob', _c_src + '/systemd/*') | map('basename') | sort }}"

- name: Install the component's static units
  become: true
  ansible.builtin.copy:
    src: "{{ _c_src }}/systemd/{{ item }}"
    dest: "/usr/lib/systemd/system/{{ item }}"
    mode: "0644"
  loop: "{{ _c_units }}"

- name: Daemon-reload
  become: true
  ansible.builtin.systemd:
    daemon_reload: true

# noqa command-instead-of-module: `systemctl is-enabled` is a state QUERY (the systemd
# module cannot query without changing state).
- name: Which of this component's units are enabled (live lab only)  # noqa: command-instead-of-module
  when: component_start_units | bool
  ansible.builtin.command:
    argv: ["systemctl", "is-enabled", "{{ item }}"]
  loop: "{{ _c_units }}"
  register: _c_enabled
  changed_when: false
  # is-enabled exits non-zero for "disabled"/"static", so judge by its output: a unit we
  # just installed must report SOME state; an empty answer is a real failure.
  failed_when: _c_enabled.stdout | default('') | length == 0

- name: Restart the enabled ones onto the new venv (a failed restart FAILS the play)
  when:
    - component_start_units | bool
    - item.stdout == 'enabled'
  become: true
  ansible.builtin.systemd:
    name: "{{ item.item }}"
    state: restarted
  loop: "{{ _c_enabled.results | default([]) }}"
  loop_control:
    label: "{{ item.item }}"
