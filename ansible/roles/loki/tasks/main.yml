---
# loki split along the bake/configure line (#642, epic .github#70): the install half
# (user + binary + data dirs + static config + unit + logcli) is image-bakeable; the
# configure half is the service enable+start, held out of the bake so no baked service
# auto-starts on boot in a pre-config state. main.yml runs both in order so any caller
# of the whole role reaches the same end state. The bake playbook (bake-obs.yml)
# invokes ONLY `tasks_from: install`; the per-run obs bring-up (site-obs.yml) invokes
# `tasks_from: configure` on obs_box.
- ansible.builtin.import_tasks: install.yml
- ansible.builtin.import_tasks: configure.yml
