---
# BAKE (#642, epic .github#70): the install-time half of loki — the system user, the
# loki binary, data dirs, the STATIC config, the systemd unit, and the logcli tool.
# All image-bakeable. Deliberately EXCLUDES the service enable+start (the configure
# half): a baked service must NOT auto-start on boot in a pre-config state (#642). A
# single-host `bake` play consumes this via `tasks_from: install`; the per-run path
# runs it as the first half of main.yml.
- name: loki system user
  ansible.builtin.user:
    name: loki
    system: true
    shell: /usr/sbin/nologin
    create_home: false

- name: unzip (needed to unpack the loki release archive)
  ansible.builtin.apt:
    name: unzip
    update_cache: true

- name: download + unpack loki
  ansible.builtin.unarchive:
    src: "{{ loki_url }}"
    dest: /tmp
    remote_src: true
    creates: "/tmp/{{ loki_pkg }}"

- name: install the loki binary
  ansible.builtin.copy:
    src: "/tmp/{{ loki_pkg }}"
    dest: /usr/local/bin/loki
    mode: "0755"
    remote_src: true

- name: loki data dirs
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: loki
    group: loki
    mode: "0755"
  loop:
    - /etc/loki
    - /var/lib/loki
    - /var/lib/loki/chunks
    - /var/lib/loki/rules
    - /var/lib/loki/compactor

- name: deploy loki config
  ansible.builtin.template:
    src: loki-config.yml.j2
    dest: /etc/loki/config.yml
    owner: loki
    group: loki
    mode: "0644"
  notify: restart loki

- name: install the systemd unit
  ansible.builtin.copy:
    dest: /etc/systemd/system/loki.service
    mode: "0644"
    content: |
      [Unit]
      Description=Grafana Loki
      After=network-online.target
      Wants=network-online.target

      [Service]
      User=loki
      Group=loki
      ExecStart=/usr/local/bin/loki -config.file=/etc/loki/config.yml
      Restart=on-failure

      [Install]
      WantedBy=multi-user.target
  notify: restart loki

# logcli (#282): acceptance-check + human debugging tool for the log pipeline.
- name: download + unpack logcli
  ansible.builtin.unarchive:
    src: "{{ logcli_url }}"
    dest: /tmp
    remote_src: true
    creates: "/tmp/{{ logcli_pkg }}"

- name: install the logcli binary
  ansible.builtin.copy:
    src: "/tmp/{{ logcli_pkg }}"
    dest: /usr/local/bin/logcli
    mode: "0755"
    remote_src: true
