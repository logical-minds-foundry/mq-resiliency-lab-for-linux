---
# BAKE (#877, #602): the install-time half of the grafana-image-renderer role — the
# browser, the renderer binary, the service user, and the systemd unit. All
# image-bakeable. Deliberately EXCLUDES the service enable+start (the configure half):
# a baked service must NOT auto-start on boot in a pre-config state (#642). A single-host
# `bake` play consumes this via `tasks_from: install`; the per-run path runs it as the
# first half of main.yml.
- name: grafana-renderer system user (home holds the browser cache/profile)
  ansible.builtin.user:
    name: grafana-renderer
    system: true
    shell: /usr/sbin/nologin
    home: "{{ grafana_image_renderer_home }}"
    create_home: true

# --- Browser (host-resolved) -------------------------------------------------------
# x86_64: Google Chrome from Google's apt repo — a self-contained .deb that pulls its
# own Chromium runtime libraries, and a browser Grafana explicitly supports. Mirrors
# the grafana role's apt-key + deb822_repository idiom.
- name: google chrome apt key (x86_64)
  ansible.builtin.get_url:
    url: https://dl.google.com/linux/linux_signing_key.pub
    dest: /etc/apt/keyrings/google-chrome.asc
    mode: "0644"
  when: ansible_architecture != 'aarch64'

- name: google chrome apt repo (deb822, x86_64)
  ansible.builtin.deb822_repository:
    name: google-chrome
    types: [deb]
    uris: https://dl.google.com/linux/chrome/deb
    suites: [stable]
    components: [main]
    architectures: [amd64]
    signed_by: /etc/apt/keyrings/google-chrome.asc
    state: present
  when: ansible_architecture != 'aarch64'

- name: install google chrome (x86_64)
  ansible.builtin.apt:
    name: google-chrome-stable
    update_cache: true
    lock_timeout: "{{ apt_lock_timeout }}"
  when: ansible_architecture != 'aarch64'

# aarch64: no arm64 Chrome/Edge .deb exists — install the distro Chromium instead.
- name: install chromium (aarch64)
  ansible.builtin.apt:
    name: chromium-browser
    update_cache: true
    lock_timeout: "{{ apt_lock_timeout }}"
  when: ansible_architecture == 'aarch64'

# --- Renderer binary + service -----------------------------------------------------
# The release asset is a single self-contained executable (no archive to unpack).
- name: download the grafana-image-renderer binary
  ansible.builtin.get_url:
    url: "{{ grafana_image_renderer_url }}"
    dest: /usr/local/bin/grafana-image-renderer
    mode: "0755"

- name: install the systemd unit
  ansible.builtin.copy:
    dest: /etc/systemd/system/grafana-image-renderer.service
    mode: "0644"
    content: |
      [Unit]
      Description=Grafana Image Renderer
      After=network-online.target
      Wants=network-online.target

      [Service]
      User=grafana-renderer
      Group=grafana-renderer
      Environment=HOME={{ grafana_image_renderer_home }}
      ExecStart=/usr/local/bin/grafana-image-renderer server \
        --server.addr={{ grafana_image_renderer_addr }} \
        --browser.path={{ grafana_image_renderer_browser_path }}
      Restart=on-failure

      [Install]
      WantedBy=multi-user.target
  notify: restart grafana-image-renderer
# NOTE (#642): the service enable+start moved to configure.yml — a baked service must
# NOT auto-start on boot in a pre-config state. The unit is installed here (bakeable)
# but stays inert until the per-run configure half enables + starts it.
