---
# Entropy daemon — feed the kernel RNG pool on headless nested-virt VMs so Java's
# SecureRandom never blocks during JVM cold-start.
#
# ROOT CAUSE (#1190, root-caused via systematic-debugging while driving VAL #1177):
# the OpenSearch tarball's bundled JDK ships `securerandom.source=file:/dev/random` +
# `securerandom.strongAlgorithms=NativePRNGBlocking`. On a headless nested-virt arm64 VM
# with no hardware RNG and no entropy daemon, `bin/opensearch` wedges in its very first
# helper — `org.opensearch.tools.launchers.TempDirectory` (mints a secure temp-dir name
# BEFORE the node JVM launches) — blocked on `/dev/random`. That hangs the whole launcher:
# no cluster log, never binds :9200, `jstack` can't attach, CPU burns going nowhere. The
# helpers are invoked with minimal args and NEVER read `jvm.options`, so a
# `-Djava.security.egd` line there cannot fix it — the fix must be OS-wide.
#
# A running entropy daemon keeps the kernel pool full so `/dev/random`/NativePRNGBlocking
# never blocks. This is a general nested-virt JVM cold-start hazard (Liberty/mqweb is Java
# too), so it is baked into EVERY box's baseline next to node-exporter.
#
# BAKED ENABLED (a #642 benign exception, like node-exporter/rdqm.service): entropy has no
# per-run config, serves a pure system function from boot, races nothing, and MUST be up
# before the observe/provision phases start their JVMs. So it is enabled+started at bake and
# left running, rather than deferred to a per-run start.

# Refresh the package cache in the SAME task as the install: a freshly-built bake box has
# a stale/empty apt cache, so a bare `package` install fails with "No package matching
# 'haveged' is available" even though haveged is in Ubuntu universe (VAL #1177 bake fail,
# #1192). Every other apt-installing bake role does `update_cache: true` (loki, grafana,
# pcmk-*); pcmk installs pacemaker — also universe — this way, proving universe is enabled.
- name: install the entropy daemon (Debian — haveged from universe)
  ansible.builtin.apt:
    name: "{{ entropy_pkg }}"
    state: present
    update_cache: true
    cache_valid_time: 3600
  when: ansible_os_family == 'Debian'

- name: install the entropy daemon (RedHat — rng-tools from base)
  ansible.builtin.dnf:
    name: "{{ entropy_pkg }}"
    state: present
    update_cache: true
  when: ansible_os_family == 'RedHat'

- name: enable + start the entropy daemon
  ansible.builtin.systemd:
    name: "{{ entropy_service }}"
    enabled: true
    state: started
    daemon_reload: true
