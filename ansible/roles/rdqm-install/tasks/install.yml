# RDQM install — BAKEABLE half (#604, epic .github#70). The slow, per-run-invariant
# install: MQ + the bundled LINBIT/DRBD stack from the no-charge Developers LinuxX64
# tar, in ONE pre-QM pass (Phase B lesson: MQ's preinst refuses changes once QM shared
# memory is live). Baked into the mq-rdqm fat box (ansible/bake-mq-rdqm.yml).
# Holds NO per-instance state: the drbdpool VG (keyed to the instance's fresh extra
# disk), the runtime `modprobe drbd`, and the base-OS `dnf update` are per-run and live
# in configure.yml — NOT here, so the bake needs no extra disk and stays coupling-free.
#
# Base-OS dependencies come from the attached install DVD - a complete BaseOS+AppStream
# repo - keeping guests offline and unregistered. The fstab entry carries `nofail`: this
# line is BAKED into the box, so a boot without a DVD attached (a DVD-less diagnostic /
# throwaway boot) must degrade to "no offline repo" rather than wedge systemd into
# emergency mode with a locked root — un-debuggable, no network, no SSH. Lab instances
# always attach the DVD (topology), so the mount still succeeds there; a genuinely-needed
# but absent repo instead fails loudly at the next dnf step (#604).
#
# Version-specific values (the EL tag, the RDQM PreReqs dirs, the DVD repo name) come from
# vars/<Distribution>-<major>.yml through the shared fail-loud loader (#1277, epic
# .github#280): an OS this role ships no vars file for stops here, before any install.
- name: per-OS-version vars (EL tag, RDQM PreReqs dirs, DVD repo name)
  ansible.builtin.include_tasks: ../../../tasks/os-vars.yml
  vars:
    os_vars_role: rdqm-install

- name: mount the install DVD (fstab + mount; ansible-core has no mount module)
  ansible.builtin.shell: |
    set -e
    mkdir -p /media/rhel
    grep -q '/media/rhel' /etc/fstab || echo '/dev/sr0 /media/rhel iso9660 ro,nofail 0 0' >> /etc/fstab
    mountpoint -q /media/rhel || mount /media/rhel
  become: true
  changed_when: false

- name: dnf repos from the DVD
  ansible.builtin.copy:
    dest: /etc/yum.repos.d/rhel-dvd.repo
    mode: "0644"
    content: |
      [dvd-baseos]
      name={{ rdqm_dvd_repo_name }} BaseOS
      baseurl=file:///media/rhel/BaseOS
      enabled=1
      gpgcheck=0
      [dvd-appstream]
      name={{ rdqm_dvd_repo_name }} AppStream
      baseurl=file:///media/rhel/AppStream
      enabled=1
      gpgcheck=0
  become: true

# `acl` for unprivileged become. It lives HERE, right after the DVD repo, because the guest
# is offline and that repo is its only package source: an install placed before it finds
# nothing unless the base box already carries the package (#1403). configure.yml repeats it
# after its own DVD mount as the per-run no-op. tests/test_rhel_dvd_repo_order.py pins the
# order.
- name: acl package (unprivileged become prereq)
  ansible.builtin.dnf:
    name: acl
    state: present
  become: true

# The MQ media is staged on disk under lab_stage_dir, never /tmp (#1417): the ~2 GiB
# tarball + its MQServer/ tree overflow a RAM-sized tmpfs /tmp. RHEL's /tmp is on disk
# today, so this changes nothing in effect here; one location serves every OS. Every
# MQServer path below (modver, the kmod stat, both dnf steps) follows lab_stage_dir.
- name: staging dir (on disk)
  ansible.builtin.include_tasks: ../../../tasks/lab-stage-dir.yml

- name: copy MQ LinuxX64 tar to node
  ansible.builtin.copy:
    src: "{{ mq_media_dir }}/{{ mq_version }}-IBM-MQ-Advanced-for-Developers-LinuxX64.tar.gz"
    dest: "{{ lab_stage_dir }}/mqadv.tar.gz"
    mode: "0644"
  become: true  # lab_stage_dir is root-owned 0755

- name: unpack
  ansible.builtin.unarchive:
    src: "{{ lab_stage_dir }}/mqadv.tar.gz"
    dest: "{{ lab_stage_dir }}"
    remote_src: true
    creates: "{{ lab_stage_dir }}/MQServer"
  become: true

- name: accept developer licence
  ansible.builtin.command: "{{ lab_stage_dir }}/MQServer/mqlicense.sh -accept"
  args:
    creates: /var/mqm
  become: true

# DRBD kmod choice is IBM's, not ours (#1408). The 10.0 RDQM install doc says to run the
# `modver` helper shipped in the media's kmod-drbd-9 directory to identify the kernel
# module to install
# (https://www.ibm.com/docs/en/ibm-mq/10.0.x?topic=multiplatforms-installing-rdqm-replicated-data-queue-managers).
# modver matches by kernel FAMILY (e.g. 5.14.0-687.5.3 -> the _687.5.1 kmod), where the
# lab's old exact-release glob refused any kernel without a same-release rpm (#1396/#1405).
# Query mode only (`-m <kernel>`), never `-i`: modver's own install would run a lone
# `dnf install` outside the two-step, pre-QM ordering below. With `-m` it prints two lines,
# the kmod rpm file name then the minimum IBM MQ level that kmod needs; an unsupported
# kernel prints "Unsupported kernel release." and exits 1, which fails this task. There is
# no fallback: no kmod from modver means no RDQM install.
- name: ask IBM's modver which drbd kmod fits the running kernel (loud fail)
  ansible.builtin.command:
    argv:
      - "{{ lab_stage_dir }}/MQServer/Advanced/RDQM/PreReqs/{{ drbd_kmod_dir }}/modver"
      - -m
      - "{{ ansible_kernel }}"
  register: kmod_modver
  changed_when: false

# modver exited 0, but check its answer before trusting it: exactly the two `-m` lines, a
# kmod rpm file name, and a minimum MQ level no newer than the MQ being installed.
# tests/test_rdqm_modver.py runs these conditions against captured modver output.
- name: modver named one kmod rpm that this MQ level supports (loud fail)
  ansible.builtin.assert:
    that:
      - kmod_modver.stdout_lines | length == 2
      - kmod_modver.stdout_lines[0] is match('kmod-drbd-[^/ ]+[.]rpm$')
      - kmod_modver.stdout_lines[1] is match('[0-9]+([.][0-9]+){3}$')
      - kmod_modver.stdout_lines[1] is version(mq_version, '<=')
    fail_msg: >-
      IBM's modver gave no usable kmod for kernel {{ ansible_kernel }} with MQ
      {{ mq_version }}. Expected two lines (kmod rpm, minimum MQ level); got:
      {{ kmod_modver.stdout_lines }}
    quiet: true

- name: record the kmod modver chose (relative to the unpacked media) and the kernel release
  ansible.builtin.set_fact:
    rdqm_kmod_rpm: "Advanced/RDQM/PreReqs/{{ drbd_kmod_dir }}/{{ kmod_modver.stdout_lines[0] }}"
    rdqm_kernel_release: "{{ ansible_kernel.split('.' ~ rhel_el_tag) | first }}"

- name: stat the kmod rpm modver chose
  ansible.builtin.stat:
    path: "{{ lab_stage_dir }}/MQServer/{{ rdqm_kmod_rpm }}"
  register: kmod_rpm_stat

- name: the kmod modver chose ships in the unpacked media (loud fail)
  ansible.builtin.assert:
    that:
      - kmod_rpm_stat.stat.exists
    fail_msg: "modver chose {{ rdqm_kmod_rpm }}, but {{ lab_stage_dir }}/MQServer has no such file"
    quiet: true

# IBM's known-issue kernels (#1408). modver maps kernel families only; it says nothing
# about IBM's "Kernel versions with known compatibility issues" table, so the role checks
# that table itself, from the vendored copy in vars/<OS>.yml (the guest is offline, and
# IBM publishes the table only on an HTML support page; the kmod JSON has no such field).
# A hit is a visible WARNING, not a failure: the lab's current GA kernel, 5.14.0-570.12.1,
# is in IBM's RHEL 9 range and is the path the lab runs today. A miss prints a skip per
# range.
- name: WARN if the running kernel is in IBM's known-compatibility-issue list (non-fatal)
  ansible.builtin.debug:
    msg: >-
      WARNING: kernel {{ ansible_kernel }} is in IBM's RDQM range of kernel versions with
      known compatibility issues ({{ item.first }} -> {{ item.last }}). IBM says these
      kernels are "known to require a new kernel module to function correctly with IBM MQ
      RDQM" and advises deferring to them until updated kmods ship. Source:
      {{ rdqm_kernel_known_issues_source }} (copy taken {{ rdqm_kernel_known_issues_as_of }}).
      Installing modver's choice {{ kmod_modver.stdout_lines[0] }} anyway.
  loop: "{{ rdqm_kernel_known_issues }}"
  loop_control:
    label: "{{ item.first }} -> {{ item.last }}"
  when:
    - rdqm_kernel_release | replace('-', '.') is version(item.first | replace('-', '.'), '>=')
    - rdqm_kernel_release | replace('-', '.') is version(item.last | replace('-', '.'), '<=')

# Base-OS packages the RDQM prereqs need but do not declare, from the offline DVD repo
# (#1484). Per-OS list (vars/<Distribution>-<major>.yml), empty where the prereqs are
# self-sufficient. On RHEL 10 it brings python3-setuptools, whose `distutils` shim the
# bundled crmsh needs to start at all.
- name: base-OS packages the RDQM prereqs need but do not declare
  ansible.builtin.dnf:
    name: "{{ rdqm_os_extra_packages }}"
    state: present
  become: true
  when: rdqm_os_extra_packages | length > 0

# Two steps, pre-QM (Phase B lesson), with RDQM LAST: its preinst
# scriptlet requires the MQ server files already on disk and fails when
# ordered inside the same rpm transaction.
- name: install MQ + cluster prereqs (step 1 of 2)
  ansible.builtin.shell: |
    set -e
    cd "{{ lab_stage_dir }}/MQServer"
    dnf install -y \
      MQSeriesRuntime-*.rpm MQSeriesServer-*.rpm MQSeriesGSKit-*.rpm \
      MQSeriesJava-*.rpm MQSeriesJRE-*.rpm MQSeriesWeb-*.rpm \
      MQSeriesSDK-*.rpm MQSeriesClient-*.rpm MQSeriesSamples-*.rpm \
      Advanced/RDQM/PreReqs/{{ pacemaker_dir }}/*.rpm \
      Advanced/RDQM/PreReqs/{{ drbd_utils_dir }}/*.rpm \
      {{ rdqm_kmod_rpm }}
  args:
    creates: /opt/mqm/bin/crtmqm
  become: true

- name: install MQSeriesRDQM (step 2 of 2 - after the server files exist)
  ansible.builtin.shell: |
    set -e
    cd "{{ lab_stage_dir }}/MQServer"
    dnf install -y Advanced/RDQM/MQSeriesRDQM-*.rpm
  args:
    creates: /opt/mqm/bin/rdqmadm
  become: true

# rdqmadm drives Pacemaker through crmsh. If `crm` cannot start (on RHEL 10 the bundled
# crmsh needs the distutils shim, #1484), `rdqmadm -c` only polls it until AMQ3890E, 30 s later
# and far from the cause. Prove `crm` starts here, so an undeclared dependency fails at
# install with crmsh's own message.
- name: "crmsh starts (fail loud: an undeclared dependency surfaces here, not in rdqmadm -c)"
  ansible.builtin.command:
    argv: [/usr/sbin/crm, --version]
  changed_when: false
  become: true

# SELinux modules RDQM's DRBD handlers need (#1486). Per-OS list (vars/<Distribution>-
# <major>.yml), empty where the base policy already lets the kernel's usermode helper run
# IBM's rdqmhandler. On RHEL 10 it is rdqm_drbd_helper (files/rdqm_drbd_helper.cil, header
# explains the defect): without it every DRBD handler exits 255, so RDQM never records its
# initial sync. The lab keeps SELinux enforcing; these run only when it is enabled.
- name: the RDQM SELinux module staging dir
  ansible.builtin.file:
    path: /usr/share/selinux/packages/rdqm
    state: directory
    mode: "0755"
  become: true
  when:
    - ansible_selinux.status | default('disabled') == 'enabled'
    - rdqm_selinux_modules | length > 0

- name: stage the SELinux modules RDQM's DRBD handlers need
  ansible.builtin.copy:
    src: "{{ item }}.cil"
    dest: "/usr/share/selinux/packages/rdqm/{{ item }}.cil"
    mode: "0644"
  loop: "{{ rdqm_selinux_modules }}"
  register: rdqm_selinux_staged
  become: true
  when:
    - ansible_selinux.status | default('disabled') == 'enabled'
    - rdqm_selinux_modules | length > 0

- name: list the loaded SELinux modules
  ansible.builtin.command:
    argv: [semodule, -l]
  register: rdqm_selinux_loaded
  changed_when: false
  become: true
  when:
    - ansible_selinux.status | default('disabled') == 'enabled'
    - rdqm_selinux_modules | length > 0

# (Re)load a module when its staged file changed or it is not loaded yet.
- name: load the SELinux modules RDQM's DRBD handlers need
  ansible.builtin.command:
    argv: [semodule, -i, "/usr/share/selinux/packages/rdqm/{{ item.item }}.cil"]
  loop: "{{ rdqm_selinux_staged.results }}"
  loop_control:
    label: "{{ item.item }}"
  # The `when` below already limits this to a module that is new or changed, so a run
  # that loads one always changes the policy.
  changed_when: true
  become: true
  when:
    - ansible_selinux.status | default('disabled') == 'enabled'
    - rdqm_selinux_modules | length > 0
    - item.changed or item.item not in rdqm_selinux_loaded.stdout_lines

- name: label IBM's RDQM handler with its own entrypoint type
  ansible.builtin.command:
    argv: [restorecon, -v, /opt/mqm/bin/rdqmhandler]
  register: rdqm_handler_restorecon
  changed_when: "'Relabeled' in rdqm_handler_restorecon.stdout"
  become: true
  when:
    - ansible_selinux.status | default('disabled') == 'enabled'
    - rdqm_selinux_modules | length > 0

- name: read the RDQM handler's SELinux label
  ansible.builtin.command:
    argv: [stat, -c, "%C", /opt/mqm/bin/rdqmhandler]
  register: rdqm_handler_label
  changed_when: false
  become: true
  when:
    - ansible_selinux.status | default('disabled') == 'enabled'
    - rdqm_selinux_modules | length > 0

- name: the RDQM handler carries rdqm_handler_exec_t (fail loud)
  ansible.builtin.assert:
    that:
      - "':rdqm_handler_exec_t:' in rdqm_handler_label.stdout"
    fail_msg: >-
      /opt/mqm/bin/rdqmhandler is labelled {{ rdqm_handler_label.stdout }}, not
      rdqm_handler_exec_t: the rdqm_drbd_helper SELinux module is not in effect, so DRBD's
      handlers would exit 255 and RDQM would never record its initial sync (#1486).
  when:
    - ansible_selinux.status | default('disabled') == 'enabled'
    - rdqm_selinux_modules | length > 0

# Remove the staged tarball and its unpacked tree once both dnf steps are done, so
# neither is carried into the baked image (/var/tmp is not cleaned the way /tmp is).
- name: remove the staged MQ media
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - "{{ lab_stage_dir }}/mqadv.tar.gz"
    - "{{ lab_stage_dir }}/MQServer"
  become: true

- name: set primary installation (loader path)
  ansible.builtin.command: /opt/mqm/bin/setmqinst -i -p /opt/mqm
  args:
    creates: /etc/ld.so.conf.d/ibmmq-Installation1.conf
  become: true

- name: mqm joins haclient (documented RDQM step - endmqm/strmqm under
        Pacemaker HA control are refused with AMQ7077E otherwise)
  ansible.builtin.user:
    name: mqm
    groups: haclient
    append: true
  become: true

- name: mqm ulimits
  ansible.builtin.copy:
    dest: /etc/security/limits.d/99-mqm.conf
    mode: "0644"
    content: |
      mqm soft nofile 10240
      mqm hard nofile 10240
  become: true

# JSON diagnostic logging (#282): seed only the journald drop-in at install time. Neither
# mqs.ini diagnostic stanza is seeded on RDQM: RDQM's `crtmqm -sx` rejects the
# DiagnosticMessagesTemplate as a same-named ClusterSyslog conflict (AMQ7059E, fatal, #562)
# and the DiagnosticSystemMessages as a bogus SystemSyslog conflict (AMQ7824W, non-fatal,
# #576). Per-QM JSON logging for the RDQM app QM is restored post-create (#569).
- name: seed JSON diagnostic logging (journald only on RDQM; no mqs.ini diag stanzas)
  ansible.builtin.include_role:
    name: mq-diag-logging
    tasks_from: system
  vars:
    mq_diag_template: false
    mq_diag_system: false
