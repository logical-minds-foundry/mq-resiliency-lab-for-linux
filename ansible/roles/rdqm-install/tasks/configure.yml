# RDQM install — PER-RUN (configure) half (#604, epic .github#70). Everything keyed to
# the specific lab instance, so it runs at bootstrap even on the baked mq-rdqm-rhel9 box
# (which already carries the install half). Two concerns:
#   1. load the DRBD kernel module for this boot;
#   2. build the drbdpool VG on THIS instance's fresh extra disk (/dev/vdb) — the baked
#      box's VG lived on the throwaway build disk and is gone, so it must be (re)created
#      here on every instance.
#
# NOTE (#639): the instance-build base-OS refresh (spec §4.5.1) was removed — a blanket
# `dnf state:latest` fights the pinned baked stack and on RHEL hit a hard LINBIT-pacemaker
# depsolve conflict. OS currency now comes from rebuilding the box, not updating at boot.
#
# Ensure the DVD dnf repo is mounted first: on a baked box the fstab entry + repo file are
# baked, but the mount may not be up yet this boot; on a fresh rhel/9.6 box install.yml
# already mounted it. Idempotent either way.
- name: ensure the install DVD is mounted (offline dnf source)
  ansible.builtin.shell: |
    set -e
    mkdir -p /media/rhel
    grep -q '/media/rhel' /etc/fstab || echo '/dev/sr0 /media/rhel iso9660 ro,nofail 0 0' >> /etc/fstab
    mountpoint -q /media/rhel || mount /media/rhel
  become: true
  changed_when: false

- name: drbd module loads against this kernel
  ansible.builtin.command: modprobe drbd
  become: true
  changed_when: false

# Idempotence by vgs probe, NOT a /dev/drbdpool creates-guard: that path
# only exists while the VG has LVs, so it vanishes when QMs are deleted
# and the task re-fires onto an existing PV.
- name: drbdpool volume group on the extra disk
  ansible.builtin.shell: |
    set -e
    if ! vgs drbdpool >/dev/null 2>&1; then
      pvcreate /dev/vdb
      vgcreate drbdpool /dev/vdb
      echo VG-CREATED
    fi
  register: drbdpool_vg
  changed_when: "'VG-CREATED' in drbdpool_vg.stdout"
  become: true
