# Managed by mq-resiliency-lab-for-linux (ansible role cloud-init-trim, #1250).
#
# cloud-init in the lab's baked Ubuntu boxes is trimmed to the two jobs a clone needs:
#   * cloud-init-local re-renders the mgmt NIC's fallback netplan for the clone's own MAC
#     (not a module; unaffected by the lists below);
#   * the init stage grows / to the guest disk (growpart + resizefs).
# Everything else already ran once at bake. Vagrant owns the hostname.
# See docs/development/box-model.md section 2.
preserve_hostname: true
cloud_init_modules:
  - growpart
  - resizefs
cloud_config_modules: []
cloud_final_modules: []
