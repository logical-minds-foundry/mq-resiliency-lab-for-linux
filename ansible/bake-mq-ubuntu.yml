---
# Bake the mq-client box image (#659, epic .github#70 — the last install-elimination
# lever). This is the Ubuntu peer of bake-mq-rdqm.yml: it bakes the slow, per-run-invariant
# install work the three un-baked Ubuntu MQ commons (svc-sim, app-client, mon-probe) were
# still paying EVERY bootstrap on the plain cloud-image base — MQ + node-exporter + alloy +
# the cgo mq_prometheus build + acl — plus the mq-resiliency-clients component.
#
# ADDITIVE FOUNDATION: installs only the image-bakeable software. It creates NO queue
# managers, forms NO channels, deploys NO app-requester, drops NO per-run renders (alloy
# config.alloy, exporter CCDT/units) and holds NO secrets/keystores; all of that stays in
# the per-run (configure) path — site-distributed-shared.yml (svc/app), site-obs.yml +
# observability.yml (probe/commons) — which this playbook does not touch. Run against a
# single `bake` host:
#   ansible-playbook -i inventory/bake-host.ini bake-mq-ubuntu.yml
#
# Full proof (the Ubuntu MQ media for the deb install + the cgo SDK) rides the actual box
# build (build-fatbox.sh --box <the mq-client box>), which overrides mq_media_dir to the
# host-durable main-worktree cache. See docs/development/box-bake-manifest.md for the
# authoritative per-role bake-vs-configure classification.

# In-guest apt auto-updates are permanently OFF in every baked Ubuntu box (#1225): the
# weekly cold rebuild + box staleness gate is the update path, so nothing may grab the dpkg
# lock on first boot. Its own play, FIRST, so the bake's own apt work never races it either.
- name: Disable apt auto-updates for good (weekly cold rebuild is the update path, #1225)
  hosts: bake
  become: true
  tasks:
    - name: mask apt-daily / apt-daily-upgrade / unattended-upgrades + zero APT::Periodic
      ansible.builtin.include_role:
        name: apt-autoupdate-off

- name: Bake the mq-client box (install-only; no QMs, no channels, no renders, no secrets)
  hosts: bake
  become: true
  vars:
    # Skip the per-run TLS ops keystore (pki-distribute) inside the mq-exporter build;
    # the exporter binary + MQ SDK are baked, the keystore is a per-run/secret concern
    # dropped in the observe phase (mirrors bake-obs.yml / bake-mq-rdqm.yml).
    mq_exporter_tls: false
  tasks:
    # `acl` for unprivileged become — the site-distributed-shared.yml prerequisite,
    # hoisted to bake (coupling-free, apt on Ubuntu). This is the #659 acl-stall kill:
    # baked (not fetched per-run over a rate-limited parallel-boot DNS burst).
    - name: acl package (unprivileged become prereq)
      ansible.builtin.apt:
        name: acl
        state: present

    # THE big install: the Ubuntu MQ product via the deb path — the server set includes
    # the client + SDK + samples, so ONE install serves both svc (needs the server, runs a
    # QM) and app (needs the client libs + SDK for pymqi). No QM is created (mq-install is
    # install-only). Coupling-free; reads its tarball from mq_media_dir (overridden by
    # build-fatbox.sh to the main-worktree cache). The per-run mq-install/mq-client roles
    # now SKIP this via a stat-of-/opt/mqm/inc/cmqc.h guard (#648-style skip-if-baked).
    - name: MQ product (server + client + SDK + samples debs)
      ansible.builtin.include_role:
        name: mq-install

    # Guest components (epic .github#294 spec 5.7, 5.8): this box's catalog entry
    # (lab/versions.yaml roles.mq-client.components) bakes mq-resiliency-clients, the
    # requester, bench, svc responder, probes and DR clients for svc-sim, app-client and
    # mon-probe. pymqi compiles from sdist against the MQ SDK (and gcc), so both MUST follow
    # mq-install above. The pinned runtime goes down FIRST (component-install checks it),
    # then the component: venv, INSTALLED.json and the static units in
    # /usr/lib/systemd/system, left INERT (component_start_units defaults false). The
    # per-run roles (app-requester, mq-inter-qm) render the env files and enable the units.
    # runtime_python + component_artifacts arrive via build-fatbox.sh -e @<install-vars.json>
    # (mqlab box build <box> writes it). This replaces the pre-#294 responder venv bake.
    - name: pinned guest runtime (/opt/vergil/cpython-<minor>, epic .github#294)
      ansible.builtin.include_role:
        name: runtime-install

    - name: clients component (baked; units installed inert)
      ansible.builtin.include_role:
        name: component-install
      vars:
        component_name: mq-resiliency-clients

    # The mq_prometheus exporter: the slow cgo build against the MQ SDK plus its Go
    # toolchain — exactly the work worth baking once (mon-probe paid ~2.8 min/run). The
    # build half installs full MQ (idempotent no-op now — cmqc.h is present from mq-install
    # above), fetches + builds mq_prometheus into /usr/local/bin, and — with mq_exporter_tls
    # false — drops NO keystore. The per-instance exporter units + CCDT/keystore stay
    # per-run (site-obs.yml instance loop). The per-run build's `creates:` guard on the
    # baked /usr/local/bin/mq_prometheus makes it skip the rebuild.
    - name: build mq_prometheus (+ MQ SDK / Go toolchain for the cgo build)
      ansible.builtin.include_role:
        name: mq-exporter
        tasks_from: build

    # Fleet observability agents' binaries — baked so the observe phase does not pay the
    # download/unpack cost per run. node-exporter is baked WHOLE and left ENABLED (#642
    # benign exception, alongside rdqm.service): a static host-metrics exporter with no
    # per-run config that races nothing and cannot boot in a broken pre-config state. alloy
    # is baked INERT — only its install half (binary + unit), NOT the service: it needs a
    # per-run config.alloy (rendered in the observe phase), so its enable+start is deferred.
    - name: entropy daemon (feed the RNG pool so JVM SecureRandom never blocks — #1190)
      ansible.builtin.include_role:
        name: entropy

    - name: node metrics agent (node-exporter, full role — static config, enabled)
      ansible.builtin.include_role:
        name: node-exporter

    - name: log shipper binary (alloy install half only)
      ansible.builtin.include_role:
        name: alloy
        tasks_from: install

# The per-login dynamic MOTD is OFF in every baked Ubuntu box (#1229): pam_motd ran
# /etc/update-motd.d (50-landscape-sysinfo at ~90% CPU per login) on every SSH session.
# Its own play, LAST, so it is independent of the install work above.
- name: Disable the per-login dynamic MOTD (pam_motd / update-motd.d, #1229)
  hosts: bake
  become: true
  tasks:
    - name: comment out pam_motd in /etc/pam.d/{sshd,login} + mask motd-news.timer
      ansible.builtin.include_role:
        name: motd-off

# cloud-init and snapd come off the boot path of every baked Ubuntu box (#1250): cloud-init
# keeps only what a clone needs (mgmt-NIC netplan re-render + root growth), and snapd goes
# when no snap is installed. Its own play, after all the install work (only the #1265 guard
# play follows; it installs nothing), so the snapd guard sees every snap the bake installed.
- name: Trim cloud-init + snapd off the boot path (#1250)
  hosts: bake
  become: true
  tasks:
    - name: cloud-init = netplan re-render + growpart/resizefs only; mask config/final stages
      ansible.builtin.include_role:
        name: cloud-init-trim

    - name: purge snapd (no snaps in this box) and pin it out
      ansible.builtin.include_role:
        name: snapd-off

# Guard the finished image (#1265): every directory this box's per-run configure halves
# write into must still exist after the whole bake. #1265 lost obs's empty
# grafana-server.service.d to the snapd purge above and only found out in a later
# bootstrap's observe phase. Its own play, LAST, so it checks what is actually packaged.
- name: Guard the baked image (per-run configure dirs survived the bake, #1265)
  hosts: bake
  become: true
  tasks:
    - name: assert the per-run configure halves' directories are in the image
      ansible.builtin.include_role:
        name: bake-dirs-guard
      vars:
        bake_dirs_guard_required:
          - /etc/alloy  # alloy configure: config.alloy
