# Lab web-UI convenience (#255/#258). Grafana is opened login-free for this
# disposable, isolated lab — pure convenience, no real data. The role defaults it to
# false (secure); this lab-wide file opts in. LAB ONLY — never carry it to a real
# deployment.
#
# The MQ Console is NOT anonymous: anonymous Console access is retired (epic
# .github#341 spec §2.2, #1500). The Console and the REST API both require a login,
# one sample user per IBM role (ansible/roles/mqweb/defaults/main.yml `mqweb_users`).
grafana_anonymous: true         # Grafana grants anonymous Admin + hides the login form

# Shared auth token between Grafana and its co-located grafana-image-renderer (#935).
# Grafana >= (this lab's pin) REFUSES to start in production with the default renderer
# token ("Using the default [rendering]renderer_token is not allowed"), so a non-default
# value is REQUIRED whenever grafana_rendering is on. Wired into Grafana's
# GF_RENDERING_RENDERER_TOKEN and the renderer's AUTH_TOKEN — the two MUST match. This is
# STATIC config, not a secret: the renderer binds localhost only (both services on the obs
# box), so the token authenticates a loopback call and protects nothing externally. LAB ONLY.
grafana_rendering_token: "lab-obs-renderer-loopback-token"
