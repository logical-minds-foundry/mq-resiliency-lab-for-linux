---
# Shared channel-TLS attributes — identical across stacks (#212 seam), so each stack's
# TLS is a keystore-wiring delta, not a channel-TLS rewrite (#250). Channels negotiate
# TLS 1.3 or higher (ANY_TLS13_OR_HIGHER), with mutual auth enforced and CHLAUTH
# disabled.
tls_cipher: "ANY_TLS13_OR_HIGHER"
tls_peer_app: "O=app-org,OU=messaging" # QM-to-QM: the app QM (O+OU)
tls_peer_svc: "O=svc-org"                            # the SVC side, org-only
tls_peer_client: "O=app-org"                        # app SVRCONN clients, org-only
