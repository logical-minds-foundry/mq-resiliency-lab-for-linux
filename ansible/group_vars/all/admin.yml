# MQWeb admin: username is a fixed lab constant; the password is an auto-generated
# lab secret (lab-secret.sh mqweb_admin_password), injected by `mqlab vm provision`
# as MQWEB_ADMIN_PASSWORD. Never committed.
mqweb_admin_user: mqadmin
mqweb_admin_password: "{{ lookup('env', 'MQWEB_ADMIN_PASSWORD') }}"

# Per-node mqweb is gated OFF by default (#1171, #1188). A per-node Liberty/mqweb
# cold-start failed on the 2-vCPU QM nodes under macOS/arm64 (VAL-A evidence, #1154 — a
# node never reached `started` and another thrashed off SSH under setmqweb). Those runs
# predate the huge-page fix for arm64 nested-virt page-fault cost (#1240, #1241), so
# re-measure before assuming it is still infeasible. mqweb/REST is a non-critical,
# currently-unused placeholder; the stack/DR plays and the mq-qmgr role run mqweb only
# when this is true. Whether and how mqweb returns (per-node, or one client-mode
# instance) is undecided — ad-hoc backlog, .github#266. Flip to true to run the per-node
# path deliberately.
mqweb_enabled: false
