---
# Defaults for manifest-driven versions (#266). The mqlab manifest overlay overrides
# these at provision time; absent a manifest, these reproduce today's behavior so
# nothing breaks before manifests exist.
#
# mq_version is sourced from the single authoritative MQ-version pin (lab/mq-version,
# #1071) rather than duplicating the literal here — the same bare 4-part pin that
# manifest.DEFAULT_MQ_VERSION and scripts/fetch-mq.sh read. lookup('file', …) runs on
# the controller (repo checkout), where playbook_dir is <repo>/ansible, so '../lab/…'
# resolves the repo-root pin. | trim drops the pin's trailing newline. (#1072)
mq_version: "{{ lookup('file', playbook_dir + '/../lab/mq-version') | trim }}"
grafana_version: "13.2.2" # BAKE-authoritative Grafana pin (obs currency, epic .github#236, #1132); the role installs grafana={{ grafana_version }} at bake — matches manifests/_shared/observability.yaml. "" = let apt pick (float)
