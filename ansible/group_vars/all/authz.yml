---
# Stage 2 internal authorization (#74) — single source for accounts, DN→account
# maps, and OAM grant sets. Mirrors tls.yml. Arm-agnostic: the DNs are identical
# across arms (partial-DN PKI); only per-arm channel names differ (chl_to_app).
# NOTE: the SSLPEERMAP DNs are FINER than the Stage-1 channel SSLPEER (org-only):
# Stage 2 reads the OU to tell mqapp (OU=apps) from mqmon (OU=ops).

authz_accounts:
  - { name: mqapp, group: mqapp }
  - { name: mqmon, group: mqmon }
  - { name: mqsvc, group: mqsvc }
  # MQ Console/REST MQWebUser login (epic .github#341 spec §2.2): mqweb authorizes its
  # requests AS this OS user (IBM S8), which must exist with the identical name (S10).
  - { name: mqoperator, group: mqoperator }

# DN→account maps. channel is a literal for SVRCONNs; the inter-QM receiver is the
# chl_to_app VARIABLE (resolved by the template).
authz_chlauth_maps:
  - { channel: "APP.SVRCONN", sslpeer: "O=app-org,OU=apps", mcauser: mqapp }
  - { channel: "MON.SVRCONN", sslpeer: "O=app-org,OU=ops",  mcauser: mqmon }
  - { channel: "{{ chl_to_app }}", sslpeer: "{{ tls_peer_svc }}", mcauser: mqsvc }

# Minimal grant sets (starting hypothesis; hardened by the induced tests).
authz_grants:
  # client app: put requests, get replies
  - { group: mqapp, object_type: qmgr,  object: "",            authorities: "+connect +inq" }
  - { group: mqapp, object_type: queue, object: "SVC.REQUEST", authorities: "+put" }
  - { group: mqapp, object_type: queue, object: "APP.REPLY",   authorities: "+get +inq +browse" }
  # monitoring (mq_prometheus exporter, MON.SVRCONN -> SSLPEERMAP -> mqmon): the mqmon
  # grants are NOT driven from here anymore. They moved to MQSC SET AUTHREC
  # (authz_mqmon_grants below, rendered into authz.mqsc.j2) so the exporter's
  # least-privilege security profile travels co-located with the object definitions
  # (repo rule, 2026-08-06) — the §5 profile of the Phase-0 observability doc (#943 /
  # .github#173). setmqaut here still drives only the mqapp/mqsvc grants.
  # service app (counterparty receiver MCA): put reply, put DLQ; nothing else.
  # +setall (on the qmgr object AND every destination the MCA opens) is REQUIRED
  # (#613): a non-privileged receiving MCA opens the destination queue with
  # MQOO_SET_ALL_CONTEXT to reinstate message context under PUTAUT(DEF) too (not just
  # CTX) — without +setall the inbound RCVR MQPUT fails 2035. This holds for BOTH
  # destinations the MCA opens: APP.REPLY AND the dead-letter queue (see the DLQ note
  # below — #617 proved the DLQ needs +setall too). +setall is scoped to APP.REPLY +
  # the DLQ + the qmgr object — still far short of mqm.
  - { group: mqsvc, object_type: qmgr,  object: "",                authorities: "+connect +setall" }
  - { group: mqsvc, object_type: queue, object: "APP.REPLY",       authorities: "+put +setall" }
  - { group: mqsvc, object_type: queue, object: "{{ mqsvc_dlq }}", authorities: "+put +setall" }

# mq-bench (#1512): the Native HA persistent-commit benchmark PUTs to its OWN queue,
# BENCH.COMMIT, as the app-client identity (mqapp), and inquires its depth. A separate
# list, not authz_grants: only the Native HA arms define BENCH.COMMIT (site-nativeha*.yml),
# and setmqaut on a queue that does not exist fails, so the pcmk/rdqm arms that apply
# authz_grants must not see it. APP.REPLY's posture (mqapp get-only) is unchanged.
authz_bench_grants:
  - { group: mqapp, object_type: queue, object: "BENCH.COMMIT", authorities: "+put +inq" }

# mqmon (mq_prometheus exporter) least-privilege security profile — the §5 grant table
# of the Phase-0 observability doc (#943 / .github#173), expressed as MQSC SET AUTHREC
# (NOT setmqaut) and rendered into authz.mqsc.j2 so the authority travels co-located with
# the object definitions (repo rule, 2026-08-06). Arm-agnostic: every arm that renders
# authz.mqsc.j2 (nativeha-ubuntu, pcmk, rdqm) gets the identical profile.
#
# The exporter is NOT pure pub/sub: at startup it opens SYSTEM.ADMIN.COMMAND.QUEUE (+put)
# and issues PCF DISPLAY to expand its monitoredQueues/Channels patterns, replying on a
# dynamic queue from SYSTEM.DEFAULT.MODEL.QUEUE (+dsp +inq +get); only then does it
# subscribe to the $SYS/MQ resource-monitoring topics, administered by SYSTEM.ADMIN.TOPIC
# (+sub) — NOT SYSTEM.BASE.TOPIC. Those three were pinned empirically against the LIVE
# NHAUAPP exporter (#936 — the MQRC 2035 error progression command-queue -> reply queue
# -> $SYS subscribe -> clean proves each necessary).
#
# PROFILE('**') OBJTYPE(QUEUE) +dsp +inq is the COVERAGE GATE proven live (#943 §3):
# without it the exporter cannot inquire a queue it has no authority on, so backed-up
# idle queues stay invisible — it was authority, not publication activity. It subsumes
# the old per-queue mqmon grants (APP.REPLY, SVC.REQUEST). +dsp +inq only — read-only, no
# put/get, so the N1 denial (mqmon MQPUT APP.REPLY -> 2035) still holds. This is the
# least-privilege profile, not the industry "run the monitor as mqm" cop-out.
authz_mqmon_grants:
  - { objtype: QMGR,  authadd: "CONNECT, INQ, DSP" }
  - { objtype: TOPIC, profile: "SYSTEM.ADMIN.TOPIC",         authadd: "SUB" }
  - { objtype: QUEUE, profile: "SYSTEM.ADMIN.COMMAND.QUEUE", authadd: "PUT" }
  - { objtype: QUEUE, profile: "SYSTEM.DEFAULT.MODEL.QUEUE", authadd: "DSP, INQ, GET" }
  - { objtype: QUEUE, profile: "**",                         authadd: "DSP, INQ" }

# mqoperator — the MQ Console/REST MQWebUser sample login (epic .github#341 spec §2.2). Under
# MQWebUser, mqweb authorizes every request AS THIS USER (IBM S8), so these OAM grants are the
# tier's real boundary: a write is refused by the QUEUE MANAGER even if mqweb is misconfigured.
# The first four entries are IBM's documented MINIMUM for MQWebUser users (S15, "Authorizing
# users to administer remote queue managers in the IBM MQ Console", SSYHRD_10.0.0); the rest
# is display-only object access. +put on the command queue is safe: the command server
# authorizes each command as the message's user, so an ALTER from mqoperator is refused by
# OAM. S15 is written for remote queue managers and IBM documents no separate local-mode
# minimum (spec §2.2), so the list is applied as written; the live-lab acceptance task proves
# it. Rendered by roles/mq-pcmk-qmgr/templates/mqoperator.mqsc.j2 and applied on every QM
# (#1501). Unlike authz_grants these are MQSC SET AUTHREC, not setmqaut (repo rule).
authz_mqoperator_grants:
  - { objtype: QMGR, authadd: "CONNECT, DSP" }
  - { objtype: TOPIC, profile: "SYSTEM.ADMIN.TOPIC", authadd: "SUB, DSP" }
  - { objtype: QUEUE, profile: "SYSTEM.REST.REPLY.QUEUE", authadd: "PUT, GET, BROWSE, INQ" }
  - { objtype: QUEUE, profile: "SYSTEM.ADMIN.COMMAND.QUEUE", authadd: "PUT" }
  - { objtype: QUEUE, profile: "**", authadd: "DSP, INQ, BROWSE" }
  - { objtype: CHANNEL, profile: "**", authadd: "DSP" }
  - { objtype: TOPIC, profile: "**", authadd: "DSP" }
  - { objtype: NAMELIST, profile: "**", authadd: "DSP" }

# DLQ the receiver MCA falls back to. FINAL/minimal (#614): a per-channel /
# per-remote-QM DLQ is NOT an MQ 9.4 feature — DEADQ is a queue-manager-level
# attribute (one per QM) and USEDLQ is only a boolean toggle over that single DLQ.
# So the QM-wide DLQ (set as DEADQ in authz.mqsc.j2) is the architecturally required
# dead-letter destination under USEDLQ(YES) — not a stand-in for a future dedicated
# queue. It cannot be scoped narrower because no per-channel DLQ exists.
#
# +setall on the DLQ (#617): the receiver MCA (PUTAUT(DEF)) writes the dead-letter
# message as [MQDLH + original message] preserving the original context, so it opens
# the DLQ with MQOO_SET_ALL_CONTEXT — exactly as it opens APP.REPLY. That open is
# authority-checked against the MCA user, so the DLQ needs +put AND +setall, not +put
# alone. The interim "+put is enough" (an untested #614 assumption) was INCOMPLETE:
# with +put only, an induced undeliverable reply produced AMQ9599E / MQRC 2035 on the
# DLQ open and the receiver channel wedged in STATUS(PAUSED) SUBSTATE(MQPUT) — the
# message could neither be delivered NOR dead-lettered. Grounded in the #613
# set-all-context mechanic + IBM 9.4 docs (attributes-channel-mqsc-keywords-n-r;
# authority-authorizations-context) and confirmed empirically on the live arm (#617).
# The qmgr-object +setall mqsvc already holds satisfies the qmgr half of the
# "queue AND qmgr" context-authority rule; only the DLQ-queue +setall was missing.
# Per-counterparty segregation, if ever wanted, is a downstream runmqdlq handler
# concern, not a grant change.
mqsvc_dlq: "SYSTEM.DEAD.LETTER.QUEUE"
