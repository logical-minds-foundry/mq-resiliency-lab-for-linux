---
# Bake the infra-ubuntu2404 box image (#602, epic .github#70 Task 1).
#
# ADDITIVE FOUNDATION: installs only the image-bakeable software for the infra box —
# BIND9 (package + zone-dir scaffolding) and the fleet agents' binaries. It drops NO
# zone data and NO per-host named.conf (both are per-run renders keyed by hostname);
# those stay in the per-run (configure) path (site-dns.yml), which this playbook does
# not touch. Run against a single `bake` host:
#   ansible-playbook -i inventory/bake-host.ini bake-infra.yml
#
# See docs/development/box-bake-manifest.md for the authoritative classification.

# In-guest apt auto-updates are permanently OFF in every baked Ubuntu box (#1225): the
# weekly cold rebuild + box staleness gate is the update path, so nothing may grab the dpkg
# lock on first boot. Its own play, FIRST, so the bake's own apt work never races it either.
- name: Disable apt auto-updates for good (weekly cold rebuild is the update path, #1225)
  hosts: bake
  become: true
  tasks:
    - name: mask apt-daily / apt-daily-upgrade / unattended-upgrades + zero APT::Periodic
      ansible.builtin.include_role:
        name: apt-autoupdate-off

- name: Bake infra-ubuntu2404 (install-only; no zones, no per-host named.conf)
  hosts: bake
  become: true
  tasks:
    # bind-dns is the one role with a real bake/configure SPLIT (it is keyed by
    # inventory_hostname for its per-host named.conf, which breaks a lone bake host).
    # Bake only its install half: bind9 package + /etc/bind/zones scaffolding.
    - name: BIND9 install half only (package + zone-dir scaffolding)
      ansible.builtin.include_role:
        name: bind-dns
        tasks_from: install

    # Fleet agents. node-exporter is baked WHOLE and left ENABLED (#642 benign
    # exception): static host-metrics exporter, no per-run config, races nothing, cannot
    # boot in a broken pre-config state. alloy is inert (install half only) — it needs a
    # per-run config.alloy, so its enable+start is deferred to the observe phase.
    - name: entropy daemon (feed the RNG pool so JVM SecureRandom never blocks — #1190)
      ansible.builtin.include_role:
        name: entropy

    - name: node metrics agent (node-exporter, full role — static config, enabled)
      ansible.builtin.include_role:
        name: node-exporter

    - name: log shipper binary (alloy install half only)
      ansible.builtin.include_role:
        name: alloy
        tasks_from: install

# The per-login dynamic MOTD is OFF in every baked Ubuntu box (#1229): pam_motd ran
# /etc/update-motd.d (50-landscape-sysinfo at ~90% CPU per login) on every SSH session.
# Its own play, LAST, so it is independent of the install work above.
- name: Disable the per-login dynamic MOTD (pam_motd / update-motd.d, #1229)
  hosts: bake
  become: true
  tasks:
    - name: comment out pam_motd in /etc/pam.d/{sshd,login} + mask motd-news.timer
      ansible.builtin.include_role:
        name: motd-off

# cloud-init and snapd come off the boot path of every baked Ubuntu box (#1250): cloud-init
# keeps only what a clone needs (mgmt-NIC netplan re-render + root growth), and snapd goes
# when no snap is installed. Its own play, LAST, so the snapd guard sees every snap the
# bake installed.
- name: Trim cloud-init + snapd off the boot path (#1250)
  hosts: bake
  become: true
  tasks:
    - name: cloud-init = netplan re-render + growpart/resizefs only; mask config/final stages
      ansible.builtin.include_role:
        name: cloud-init-trim

    - name: purge snapd (no snaps in this box) and pin it out
      ansible.builtin.include_role:
        name: snapd-off
