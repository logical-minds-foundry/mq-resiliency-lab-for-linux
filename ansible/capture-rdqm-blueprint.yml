---
# Read-only capture of what RDQM GENERATES on a live HA/DR group (epic .github#310 T1, #1422).
# The capture is the blueprint the pacemaker-drbd arm is built to. It changes NOTHING on the
# nodes and never copies secret material off a node (#1603): keystores and the corosync
# authkey are never read; a key file in /etc/drbd.d (by name, or by carrying a PRIVATE KEY
# block) is recorded by path only, never by content; any PRIVATE KEY block left in the DRBD
# items is replaced with a marker, and DRBD shared-secret values are redacted, all at capture
# time (never captured-then-scrubbed). A guard fails the run if any capture item carries
# PRIVATE KEY before the write, and again if any written file does. Any failing command
# fails the run on EVERY host (any_errors_fatal) before anything is written: an incomplete
# blueprint is worse than none. Run by the operator with the rdqm-rhel stack up (both sites)
# and its app QM running:
#   cd ansible && ansible-playbook capture-rdqm-blueprint.yml \
#     -e qm_name=RDQMAPP \
#     -e blueprint_out="$(mqlab build path state)/rdqm-blueprint/$(date -u +%Y%m%dT%H%M%SZ)"
# Output: <blueprint_out>/<host>/<item>.txt for every node in rdqm_a and rdqm_b. Both output
# streams are kept (some tools, rdqmstatus among them, report on stderr), and an item that
# comes out empty fails the run (#1600).
- name: Capture the RDQM blueprint (read-only)
  hosts: rdqm_a:rdqm_b
  become: true
  gather_facts: false
  any_errors_fatal: true
  vars:
    # GNU sed -E: replace any DRBD shared-secret value (quoted or bare) with "REDACTED".
    drbd_secret_redact_sed: 's/(shared-secret[[:space:]]+)("[^"]*"|[^;[:space:]]+)/\1"REDACTED"/'
    # Shell case patterns for key files in /etc/drbd.d (#1603): such a file is listed by path
    # only and its contents are never read. A file of any other name that carries a PRIVATE
    # KEY block is caught by content (grep -q) in the drbd-conf task and treated the same way.
    drbd_key_file_case: "*.key|*.p12|*.kdb|*.sth|*.jks"
    # awk safety net (#1603): every -----BEGIN ... PRIVATE KEY----- ... -----END ... PRIVATE
    # KEY----- block becomes one marker line, whatever file or command it came from. A block
    # with no END line drops the rest of the input and says so; it never passes through.
    # The markers are lower case, so the PRIVATE KEY guard below never trips on them.
    drbd_key_block_redact_awk: >-
      /-----BEGIN [A-Z0-9 ]*PRIVATE KEY-----/ {
      print "[private key block redacted at capture (#1603)]";
      skip = !/-----END [A-Z0-9 ]*PRIVATE KEY-----/; next }
      skip { if (/-----END [A-Z0-9 ]*PRIVATE KEY-----/) skip = 0; next }
      { print }
      END { if (skip) print "[private key block with no END line: rest of input dropped (#1603)]" }
    # Every capture item: <blueprint_out>/<host>/<key>.txt from the registered result. One
    # list, shared by the non-empty check and the write, so neither can miss an item.
    cap_items:
      - { key: drbd-version, value: "{{ cap_drbd_version }}" }
      - { key: drbd-conf, value: "{{ cap_drbd_conf }}" }
      - { key: drbd-dump, value: "{{ cap_drbd_dump }}" }
      - { key: drbd-status, value: "{{ cap_drbd_status }}" }
      - { key: packages, value: "{{ cap_packages }}" }
      - { key: pcmk-config, value: "{{ cap_pcmk_config }}" }
      - { key: pcmk-status, value: "{{ cap_pcmk_status }}" }
      - { key: ocf-agents, value: "{{ cap_ocf_agents }}" }
      - { key: corosync-conf, value: "{{ cap_corosync_conf }}" }
      - { key: quorum, value: "{{ cap_quorum }}" }
      - { key: vgs, value: "{{ cap_vgs }}" }
      - { key: lvs, value: "{{ cap_lvs }}" }
      - { key: mounts, value: "{{ cap_mounts }}" }
      - { key: lsblk, value: "{{ cap_lsblk }}" }
      - { key: rdqm-ini, value: "{{ cap_rdqm_ini }}" }
      - { key: rdqmstatus-qm, value: "{{ cap_rdqmstatus_qm }}" }
      - { key: rdqmstatus-group, value: "{{ cap_rdqmstatus_group }}" }
      - { key: units, value: "{{ cap_units }}" }
      - { key: mqs-ini, value: "{{ cap_mqs_ini }}" }
      - { key: dspmqinf, value: "{{ cap_dspmqinf }}" }
  tasks:
    - name: preflight - blueprint_out (absolute) and qm_name are set
      ansible.builtin.assert:
        that:
          - blueprint_out is defined and blueprint_out | length > 0
          - blueprint_out is abs
          - qm_name is defined and qm_name | length > 0
        fail_msg: "pass -e blueprint_out=<absolute dir> -e qm_name=<RDQM QM, e.g. RDQMAPP>"

    - name: preflight - look for blueprint_out on the controller
      ansible.builtin.stat:
        path: "{{ blueprint_out }}"
      register: cap_out_stat
      delegate_to: localhost
      become: false
      run_once: true

    - name: preflight - blueprint_out does not exist yet (never merge into an older capture)
      ansible.builtin.assert:
        that: not cap_out_stat.stat.exists
        fail_msg: >-
          {{ blueprint_out }} already exists; a capture is only trustworthy as a whole —
          pass a fresh directory (the timestamped default in the header does this)

    # rdqmstatus writes its whole report to STDERR (stdout is empty, rc 0 — observed live on
    # rdqm-rhel, #1600), so it is folded into stdout here: the report IS the data.
    - name: preflight - RDQM reports the QM on this node
      ansible.builtin.shell: /opt/mqm/bin/rdqmstatus -m {{ qm_name | quote }} 2>&1
      register: cap_rdqmstatus_qm
      changed_when: false

    - name: preflight - RDQM reports HA status Normal on this node
      ansible.builtin.assert:
        that: (cap_rdqmstatus_qm.stdout ~ '\n' ~ cap_rdqmstatus_qm.stderr) is regex('(?m)^HA status:\s+Normal\s*$')
        fail_msg: >-
          RDQM is not healthy on {{ inventory_hostname }} (rdqmstatus -m {{ qm_name }}
          does not report "HA status: Normal"); capture only a healthy group.
          stdout: {{ cap_rdqmstatus_qm.stdout }} stderr: {{ cap_rdqmstatus_qm.stderr }}

    - name: preflight - a cluster CLI is present (pcs or crm)
      ansible.builtin.shell: |
        set -e
        if command -v pcs >/dev/null; then echo pcs
        elif command -v crm >/dev/null; then echo crm
        else echo "neither pcs nor crm on PATH" >&2; exit 1; fi
      register: cap_cli
      changed_when: false

    - name: drbd version (userland + loaded kernel module)
      ansible.builtin.shell: |
        set -e
        drbdadm --version
        echo "### /sys/module/drbd/version"
        cat /sys/module/drbd/version
      register: cap_drbd_version
      changed_when: false

    # The two DRBD config items fold stderr in BEFORE the redaction sed and awk, so a
    # diagnostic on stderr can never carry an unredacted secret past them into the capture.
    # Key files are listed by path only (#1603): the drbd.d directory holds each node's DRBD
    # replication TLS private key (rdqm-replication-tls, #545).
    - name: drbd config files (drbd.conf + every non-key /etc/drbd.d file; secrets redacted)
      ansible.builtin.shell: |
        set -euo pipefail
        {
          echo "### /etc/drbd.conf"
          cat /etc/drbd.conf
          echo "### ls -l /etc/drbd.d/"
          ls -l /etc/drbd.d/
          for f in /etc/drbd.d/*; do
            [ -f "$f" ] || continue
            case "$f" in
              {{ drbd_key_file_case }})
                echo "### $f (key file: path recorded, contents not read)"
                continue ;;
            esac
            if grep -q -e 'PRIVATE KEY' -- "$f"; then
              echo "### $f (carries a private key block: path recorded, contents not captured)"
              continue
            fi
            echo "### $f"
            cat "$f"
          done
        } 2>&1 | sed -E {{ drbd_secret_redact_sed | quote }} | awk {{ drbd_key_block_redact_awk | quote }}
      args:
        executable: /bin/bash
      register: cap_drbd_conf
      changed_when: false

    - name: drbd effective config (shared-secret and private key blocks redacted at capture)
      ansible.builtin.shell: |
        set -o pipefail
        drbdadm dump all 2>&1 | sed -E {{ drbd_secret_redact_sed | quote }} | awk {{ drbd_key_block_redact_awk | quote }}
      args:
        executable: /bin/bash
      register: cap_drbd_dump
      changed_when: false

    - name: drbd live status
      ansible.builtin.command: drbdadm status all
      register: cap_drbd_status
      changed_when: false

    - name: installed HA/DR packages (drbd, kmod-drbd, pacemaker, corosync, RDQM, MQ)
      ansible.builtin.shell: |
        set -o pipefail
        rpm -qa | grep -Ei 'drbd|pacemaker|corosync|pcs|crmsh|resource-agents|rdqm|MQSeries' | sort
      args:
        executable: /bin/bash
      register: cap_packages
      changed_when: false

    - name: pacemaker configuration (text, not CIB XML)
      ansible.builtin.command: "{{ 'pcs config' if cap_cli.stdout == 'pcs' else 'crm configure show' }}"
      register: cap_pcmk_config
      changed_when: false

    - name: pacemaker status
      ansible.builtin.command: crm_mon -1 -r -A
      register: cap_pcmk_status
      changed_when: false

    - name: OCF resource agents available (providers + agents; flags IBM-proprietary ones)
      ansible.builtin.shell: |
        set -o pipefail
        find /usr/lib/ocf/resource.d -maxdepth 2 | sort
      args:
        executable: /bin/bash
      register: cap_ocf_agents
      changed_when: false

    - name: corosync config (authkey is a separate file and is never read)
      ansible.builtin.command: cat /etc/corosync/corosync.conf
      register: cap_corosync_conf
      changed_when: false

    - name: quorum state
      ansible.builtin.command: corosync-quorumtool -s
      register: cap_quorum
      changed_when: false

    - name: volume groups
      ansible.builtin.command: vgs -o vg_name,pv_count,lv_count,vg_size,vg_free
      register: cap_vgs
      changed_when: false

    - name: logical volumes (QM LV and any snapshot LV)
      ansible.builtin.command: lvs -a -o lv_name,vg_name,lv_size,lv_attr,origin,devices
      register: cap_lvs
      changed_when: false

    # No mount on a non-owner node is valid, so it is said explicitly: an empty capture file
    # always means data went missing (the non-empty check below fails the run on one).
    - name: mounts under /var/mqm/vols (fstype + options; none on a non-owner node is valid)
      ansible.builtin.shell: |
        set -o pipefail
        findmnt -l -n -o TARGET,SOURCE,FSTYPE,OPTIONS |
          awk '$1 ~ "^/var/mqm/vols" { print; n++ }
               END { if (!n) print "(no filesystem mounted under /var/mqm/vols on this node)" }'
      args:
        executable: /bin/bash
      register: cap_mounts
      changed_when: false

    - name: block devices + filesystems
      ansible.builtin.command: lsblk -f
      register: cap_lsblk
      changed_when: false

    - name: rdqm.ini
      ansible.builtin.command: cat /var/mqm/rdqm.ini
      register: cap_rdqm_ini
      changed_when: false

    - name: rdqmstatus (group view; the report is on stderr, folded in)
      ansible.builtin.shell: /opt/mqm/bin/rdqmstatus 2>&1
      register: cap_rdqmstatus_group
      changed_when: false

    - name: installed systemd units (HA/DR/MQ)
      ansible.builtin.shell: |
        set -o pipefail
        systemctl list-unit-files --no-legend | grep -Ei 'rdqm|drbd|pacemaker|corosync|pcsd|mq' | sort
      args:
        executable: /bin/bash
      register: cap_units
      changed_when: false

    - name: mqs.ini
      ansible.builtin.command: cat /var/mqm/mqs.ini
      register: cap_mqs_ini
      changed_when: false

    - name: dspmqinf (QM data/log paths)
      ansible.builtin.command: su mqm -c '/opt/mqm/bin/dspmqinf -o command {{ qm_name }}'
      register: cap_dspmqinf
      changed_when: false

    # An empty item is data gone missing (e.g. a tool that reports on the stream not
    # captured, #1600), never a valid capture: fail the run on EVERY host before any write.
    - name: check - every capture item is non-empty (stdout + stderr)
      ansible.builtin.assert:
        that: (item.value.stdout ~ item.value.stderr) | trim | length > 0
        fail_msg: >-
          capture item {{ item.key }} is empty on {{ inventory_hostname }} (rc
          {{ item.value.rc }}, no output on stdout or stderr); the blueprint would be
          silently incomplete
        quiet: true
      loop: "{{ cap_items }}"
      loop_control:
        label: "{{ item.key }}"

    # Guard 1 (#1603): no item may carry private key text, on either stream, into the write.
    # The message names the item and host only, never the content.
    - name: check - no capture item carries PRIVATE KEY (stdout + stderr)
      ansible.builtin.assert:
        that: "'PRIVATE KEY' not in (item.value.stdout ~ '\\n' ~ item.value.stderr)"
        fail_msg: >-
          capture item {{ item.key }} on {{ inventory_hostname }} carries PRIVATE KEY text
          after redaction; refusing to write any of the capture (#1603)
        quiet: true
      loop: "{{ cap_items }}"
      loop_control:
        label: "{{ item.key }}"

    # Controller-side writes: reached only once EVERY host has passed every preflight, every
    # capture command and the non-empty check (any_errors_fatal), so a failed run leaves
    # nothing on disk.
    - name: create the per-host capture directory on the controller
      ansible.builtin.file:
        path: "{{ blueprint_out }}/{{ inventory_hostname }}"
        state: directory
        mode: "0755"
      delegate_to: localhost
      become: false

    # Both streams are saved: stdout, then any stderr under a "### stderr" marker. A tool
    # whose data is on stderr is folded into stdout at its task (rdqmstatus); this keeps any
    # other tool's stderr from being silently dropped.
    - name: write the capture on the controller
      ansible.builtin.copy:
        dest: "{{ blueprint_out }}/{{ inventory_hostname }}/{{ item.key }}.txt"
        content: "{{ item.value.stdout }}{{ ('\\n### stderr\\n' ~ item.value.stderr) if item.value.stderr | length > 0 else '' }}\n"
        mode: "0644"
      delegate_to: localhost
      become: false
      loop: "{{ cap_items }}"
      loop_control:
        label: "{{ item.key }}"

    # Guard 2 (#1603): scan what actually landed on disk, every host's files, once all hosts
    # have written. Any match fails the run loudly and names the files (never their content).
    - name: guard - scan the written capture for PRIVATE KEY
      ansible.builtin.find:
        paths: "{{ blueprint_out }}"
        recurse: true
        hidden: true
        file_type: file
        contains: "PRIVATE KEY"
        read_whole_file: true
      register: blueprint_key_scan
      delegate_to: localhost
      become: false
      run_once: true

    - name: guard - no written capture file contains PRIVATE KEY
      ansible.builtin.assert:
        that: blueprint_key_scan.matched == 0
        fail_msg: >-
          PRIVATE KEY text was written to the capture; delete these files now and do not
          commit them (#1603): {{ blueprint_key_scan.files | map(attribute='path') | join(', ') }}
      delegate_to: localhost
      become: false
      run_once: true
