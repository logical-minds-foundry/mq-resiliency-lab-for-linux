---
# Two independent org CAs (spec §4). Each CA: name -> subject.
pki_cas:
  app-org:
    common_name: "app-org Root CA"
    organization_name: "app-org"
  svc-org:
    common_name: "svc-org Root CA"
    organization_name: "svc-org"

# pki_entities is no longer declared here: it is rendered from the topology by
# `mqlab` (src/mqlab/cli.py: _render_pki_entities) and loaded into the play via
# include_vars in site-pki.yml (#351). The rendered artifact lives at
# build/work/pki/entities.json and must exist before the play runs.
