---
# Topology-aware version gather (#266). Each component is probed only on the group it
# lives on, so absence-by-design is never queried. mqlab runs this limited to the
# active setup's groups (ansible-playbook gather-versions.yml --limit <groups>), so
# only running hosts are targeted. Any genuine probe failure fails the play — a
# silently-blank version would corrupt the report corpus (no silent failures).
# A final localhost play merges every host's `gathered` dict into build/work/versions.json.

- hosts: pcmk_a:rdqm_a # QM + HA nodes (ubuntu apt OR rhel bundled — same probes)
  gather_facts: false
  tasks:
    - name: mq
      ansible.builtin.command: dspmqver -b -f 2
      register: p_mq
      changed_when: false
    - name: pacemaker
      ansible.builtin.command: pacemakerd --version
      register: p_pcmk
      changed_when: false
    - name: corosync
      ansible.builtin.command: corosync -v
      register: p_coro
      changed_when: false
    - name: drbd
      ansible.builtin.command: drbdadm --version
      register: p_drbd
      changed_when: false
    - name: kernel
      ansible.builtin.command: uname -r
      register: p_kern
      changed_when: false
    - name: os
      ansible.builtin.shell: '. /etc/os-release && echo "$NAME $VERSION_ID"'
      register: p_os
      changed_when: false
    - name: stash
      ansible.builtin.set_fact:
        gathered:
          mq: "{{ p_mq.stdout }}"
          pacemaker: "{{ p_pcmk.stdout_lines[0] }}"
          corosync: "{{ p_coro.stdout_lines[0] }}"
          drbd: "{{ p_drbd.stdout_lines[0] }}"
          kernel: "{{ p_kern.stdout }}"
          os: "{{ p_os.stdout }}"

- hosts: svc # counterparty QM host (no pacemaker)
  gather_facts: false
  tasks:
    - name: mq
      ansible.builtin.command: dspmqver -b -f 2
      register: d_mq
      changed_when: false
    - name: kernel
      ansible.builtin.command: uname -r
      register: d_kern
      changed_when: false
    - name: stash
      ansible.builtin.set_fact:
        gathered:
          mq: "{{ d_mq.stdout }}"
          kernel: "{{ d_kern.stdout }}"

- hosts: obs_box # grafana / prometheus / loki / alloy
  gather_facts: false
  tasks:
    - name: grafana
      ansible.builtin.command: grafana-server -v
      register: o_graf
      changed_when: false
    - name: prometheus
      ansible.builtin.command: prometheus --version
      register: o_prom
      changed_when: false
    - name: loki
      ansible.builtin.command: loki --version
      register: o_loki
      changed_when: false
    - name: alloy
      ansible.builtin.command: alloy --version
      register: o_allo
      changed_when: false
    - name: stash
      ansible.builtin.set_fact:
        gathered:
          grafana: "{{ o_graf.stdout_lines[0] }}"
          prometheus: "{{ (o_prom.stdout + o_prom.stderr).splitlines()[0] }}"
          loki: "{{ (o_loki.stdout + o_loki.stderr).splitlines()[0] }}"
          alloy: "{{ (o_allo.stdout + o_allo.stderr).splitlines()[0] }}"

- hosts: probe # node_exporter + mq-metric-samples exporter
  gather_facts: false
  tasks:
    - name: node_exporter
      ansible.builtin.command: node_exporter --version
      register: pr_ne
      changed_when: false
    - name: mq_metric_samples build (binary + git sha)
      ansible.builtin.shell: >-
        mq_prometheus --version 2>&1 | head -1;
        git -C /usr/local/src/mq-metric-samples rev-parse --short HEAD
      register: pr_mqms
      changed_when: false
    - name: stash
      ansible.builtin.set_fact:
        gathered:
          node_exporter: "{{ (pr_ne.stdout + pr_ne.stderr).splitlines()[0] }}"
          mq_metric_samples: "{{ pr_mqms.stdout_lines | join(' ') }}"

- hosts: localhost
  gather_facts: false
  tasks:
    - name: merge gathered facts from every probed host
      ansible.builtin.set_fact:
        all_versions: "{{ all_versions | default({}) | combine(hostvars[item].gathered | default({})) }}"
      loop: "{{ groups['all'] | difference(['localhost']) }}"
    - name: write build/work/versions.json
      ansible.builtin.copy:
        dest: "{{ playbook_dir }}/../build/work/versions.json"
        content: "{{ all_versions | to_nice_json }}\n"
        mode: "0644"
