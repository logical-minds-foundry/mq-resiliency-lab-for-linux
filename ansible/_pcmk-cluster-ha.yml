# Building block (#350 Task 2): the LIVE site (site A) of the Pacemaker/SAN
# stack, on its DRBD-replicated LUN. Bodies moved verbatim from the former
# site-pcmk-dr.yml (the full-HADR superset) — DRBD-async under the SAN, LIO on
# /dev/drbd0, then site-A initiators -> cluster -> stonith -> MQ. Composed by
# site-pcmk.yml ahead of _pcmk-dr-replication.yml (the standby site B). The
# DR/DRBD ordering here is load-bearing (docs/reference/drbd-operations.md):
# DRBD up on both peers -> skip-initial-sync -> LIO exports /dev/drbd0 ->
# initiators log in -> cluster. Do not reorder.

# STONITH prerequisite (#133): fence_virsh ssh's from each cluster node to the
# hypervisor (this VM, the libvirt host) as the fence user, then virsh-fences a
# domain. That needs the keypair to exist AND its public half authorized for the
# fence user here. Both are hypervisor-local, and the fence user is the user
# running this play (== fence_hypervisor_user). Without it fence_virsh fails
# "Permission denied (publickey)", STONITH never starts, and the cluster can
# never fence or recover. The pcmk-stonith role copies the private key to the
# nodes; this play generates it (if absent) and authorizes the public half.
- name: fence keypair + hypervisor authorization (STONITH prerequisite)
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    fence_key: "{{ playbook_dir }}/../build/state/fence_key"
  tasks:
    - name: generate the fence keypair once (gitignored, under build/)
      ansible.builtin.command:
        cmd: ssh-keygen -t ed25519 -N "" -C "fence_virsh@lab" -f "{{ fence_key }}"
        creates: "{{ fence_key }}"

    - name: ensure the fence user's ~/.ssh exists
      ansible.builtin.file:
        path: ~/.ssh
        state: directory
        mode: "0700"

    - name: authorize the fence public key for fence_virsh on the hypervisor
      ansible.builtin.lineinfile:
        path: ~/.ssh/authorized_keys
        line: "{{ lookup('file', fence_key + '.pub') }}"
        create: true
        mode: "0600"
        state: present

# Cold-boot guard (#160; the DR twin of #151's site-pcmk guard): a clean
# ground-up build runs `vm create` then `vm provision` back-to-back, and a guest
# that is not yet SSH-ready when its play fires drops out as UNREACHABLE -- which
# silently skips the whole san_a/san_b DRBD+target stage and marches on to the
# cluster plays against half a topology. Wait for every node before any work.
- name: wait for all DR-arm hosts to be SSH-ready (cold-boot guard)
  hosts: pcmk_ubuntu
  gather_facts: false
  tasks:
    - name: wait for connection
      ansible.builtin.wait_for_connection:
        timeout: 180

- hosts: pcmk_ubuntu
  become: true
  tasks:
    - name: acl package for unprivileged become
      ansible.builtin.apt: { name: acl, update_cache: false }

# --- DRBD between the two SAN VMs (san-a primary, san-b secondary) ---
- hosts: san_a
  vars: { drbd_role: primary }
  roles: [drbd-san]
- hosts: san_b
  vars: { drbd_role: secondary }
  roles: [drbd-san]

# Both peers are up now -> skip the 8 GB initial full sync: both backing disks
# are blank, so the primary declares the bitmap clear (both UpToDate at zero)
# instead of copying, then lays down the filesystem, which replicates as normal
# protocol-A traffic. Turns an I/O-bound minutes-to-hours resync into seconds.
- hosts: san_a
  become: true
  tasks:
    - name: wait for the DRBD peer to connect
      ansible.builtin.shell: |
        set -o pipefail
        for i in $(seq 1 60); do
          drbdadm cstate mqlun 2>/dev/null | grep -q Connected && exit 0
          sleep 2
        done
        echo "peer not connected:"; drbdadm cstate mqlun; exit 1
      args:
        executable: /bin/bash
      changed_when: false
    - name: skip-initial-sync + promote + filesystem (run once)
      ansible.builtin.shell: |
        set -e
        set -o pipefail
        if blkid /dev/drbd0 2>/dev/null | grep -q MQSHARED; then
          echo already-initialized; exit 0
        fi
        drbdadm new-current-uuid --clear-bitmap mqlun
        drbdadm primary mqlun
        mkfs.xfs -L MQSHARED /dev/drbd0
        echo initialized
      args:
        executable: /bin/bash
      register: drbd_init
      changed_when: "'initialized' == drbd_init.stdout"

# --- LIO target at site A, backed by the DRBD device ---
- hosts: san_a
  vars:
    san_backing_dev: /dev/drbd0
    san_target_iqn: iqn.2026-06.lab.mq:san-a.lun0
    san_portal_ip: 10.40.1.5
    san_initiator_iqns:
      - iqn.2026-06.lab.mq:pcmk-a1
      - iqn.2026-06.lab.mq:pcmk-a2
      - iqn.2026-06.lab.mq:pcmk-a3
  roles: [iscsi-target]

# --- Site A: initiators, cluster, fencing, MQ ---
- hosts: pcmk_a
  vars: { san_target_iqn: iqn.2026-06.lab.mq:san-a.lun0, san_portal_ip: 10.40.1.5 }
  roles: [iscsi-initiator]
- hosts: pcmk_a
  vars: &a_vars
    pcmk_cluster_name: mqpcmk-a
    pcmk_site_nodes:
      - { name: pcmk-a1, hb: 172.16.1.51 }
      - { name: pcmk-a2, hb: 172.16.1.52 }
      - { name: pcmk-a3, hb: 172.16.1.53 }
    fence_hypervisor_ip: 192.168.121.1
    fence_hypervisor_user: "{{ lookup('env', 'USER') }}"
  roles: [pcmk-cluster]
- hosts: pcmk_a
  vars: *a_vars
  roles: [pcmk-stonith]
- hosts: pcmk_a
  roles: [mq-install]
- hosts: pcmk_a
  roles: [mqweb]  # REST on every QM (design §1), per-node (spec §8.3)
