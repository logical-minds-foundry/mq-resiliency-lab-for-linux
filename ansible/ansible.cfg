[defaults]
inventory = ../build/work/inventory.ini
host_key_checking = False
retry_files_enabled = False
collections_path = ../build/cache
# Per-task + whole-play timing in the bootstrap logs (#594): profile_tasks prints each task's
# wall time inline and a ranked slowest-tasks summary at end-of-play; timer prints the total.
# ansible carries no task timestamps by default, which made the ~1h16m RDQM build impossible to
# analyse. These are aggregate callbacks (they run alongside the default stdout callback), from
# the ansible.posix collection in requirements.yml.
callbacks_enabled = ansible.posix.profile_tasks, ansible.posix.timer
# Raise the SSH connect timeout from the 10s default: during the observe/instrument phase the
# nodes are CPU/IO-starved by parallel alloy/node-exporter installs (and a concurrent DRBD DR
# resync on the RDQM nodes), so sshd cannot complete the banner exchange within 10s and the
# phase fails UNREACHABLE (#590).
timeout = 60
# Ansible's remote temp, pinned to the default explicitly (#1417). Module transfers (a
# controller-side `copy` source such as the multi-GB MQ tarball, a URL `unarchive`
# download) land here before they reach their dest, so it must stay on disk: Ubuntu
# 26.04's /tmp is a RAM-sized tmpfs. ~ is the connecting user's (or become user's) home.
# Never point this at /tmp; tests/test_stage_off_tmpfs.py enforces that.
remote_tmp = ~/.ansible/tmp

[ssh_connection]
# ControlMaster/ControlPersist reuse one persisted SSH master per host, so most tasks skip a
# fresh banner exchange entirely — the single biggest mitigation for the banner-exchange
# storms under load. ConnectTimeout backs up [defaults] timeout for the initial connect;
# ServerAlive* keeps a busy connection from being torn down mid-task. (#590)
ssh_args = -o ControlMaster=auto -o ControlPersist=120s -o ConnectTimeout=60 -o ServerAliveInterval=15 -o ServerAliveCountMax=8
# Retry a transient connection failure (e.g. a starved sshd) instead of failing the run.
retries = 3
