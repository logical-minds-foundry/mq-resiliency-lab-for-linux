# Minimal single-host inventory for the per-box bake playbooks (#602, epic .github#70).
#
# A bake runs against exactly ONE host — the box image being built — with NO lab,
# NO peers, and NO cross-host groups. That is the whole point: it proves each bake
# role is coupling-free (no run_once / delegate_to / group dependency) and installs
# only the image-bakeable software, never per-run lab config.
#
# `ansible_connection=local` is the default because the fat-box builder (#603/#604)
# runs the bake provisioner ON the box itself. Override at invocation for a remote
# bake target, e.g.:
#   ansible-playbook -i inventory/bake-host.ini bake-obs.yml \
#     -e ansible_host=<ip> -e ansible_user=<user> -e ansible_connection=ssh
[bake]
bake-host ansible_connection=local
