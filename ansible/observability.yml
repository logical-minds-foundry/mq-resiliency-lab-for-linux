# Fleet-wide host metrics (#103) + reachability (#108). Render peers first:
#   mqlab obs reach-peers
# then run against whatever arm is up, e.g.:
#   ansible-playbook observability.yml --limit rdqm_a
- hosts: all
  become: true
  vars:
    reach_all: "{{ lookup('file', playbook_dir + '/../build/work/obs/reach-peers.json') | from_json }}"
    reach_peers: "{{ reach_all[inventory_hostname] | default({}) }}"
  roles:
    - node-exporter
    # #282: tail mqweb's JSON messages.log only on QM-bearing nodes (they run mqweb);
    # MQ-core JSON arrives via journald (the alloy syslog-identifier relabel).
    - role: alloy
      vars:
        alloy_tail_mqweb: >-
          {{ 'nha_rhel_a' in group_names or 'nha_rhel_b' in group_names
             or 'nha_ubuntu_a' in group_names or 'nha_ubuntu_b' in group_names
             or 'pcmk_a' in group_names or 'pcmk_b' in group_names
             or 'rdqm_a' in group_names or 'rdqm_b' in group_names }}
    - {role: net-reach, when: reach_peers | length > 0}
    # Cluster-state collector (#177) — only on the PCMK arm. A SINGLE role entry with
    # the role chosen by group membership: Ansible dedupes a role listed twice in one
    # play (allow_duplicates defaults false), which silently skipped the cluster nodes.
    # SAN nodes probe drbd/daemons; pcmk nodes probe crm/stonith/iscsi/daemons.
    - role: cluster-state
      vars:
        cluster_state_role: "{{ 'storage' if ('san_a' in group_names or 'san_b' in group_names) else 'cluster' }}"
      when: >-
        'pcmk_a' in group_names or 'pcmk_b' in group_names
        or 'san_a' in group_names or 'san_b' in group_names
    # Native-HA state collector (#279) — on BOTH Native HA arms (rhel #279, ubuntu #417).
    # Every nha node (Live nha_*_a + Recovery nha_*_b) reports its own dspmq view; the
    # collector emits the same cluster_* shape as cluster-state plus cluster_nha_* facets.
    # The QM is per-arm: NHAUAPP on the ubuntu groups, NHARAPP on the rhel groups (`qm`
    # is unset when this play runs standalone, so the per-group select is load-bearing).
    - role: nativeha-state
      vars:
        nativeha_qm: >-
          {{ 'NHAUAPP' if ('nha_ubuntu_a' in group_names or 'nha_ubuntu_b' in group_names)
             else (qm.name | default('NHARAPP')) }}
      when: >-
        'nha_rhel_a' in group_names or 'nha_rhel_b' in group_names
        or 'nha_ubuntu_a' in group_names or 'nha_ubuntu_b' in group_names
    # RDQM state collector (#287) — only on the rdqm-rhel arm. Every rdqm node (site-A HA
    # rdqm_a + site-B DR rdqm_b) reports its own rdqmstatus + drbdsetup view; the collector
    # emits the same cluster_* shape as cluster-state plus cluster_rdqm_* HA/DR facets.
    - role: rdqm-state
      vars:
        rdqm_qm: "{{ qm.name | default('RDQMAPP') }}"
      when: >-
        'rdqm_a' in group_names or 'rdqm_b' in group_names
