---
# Bake the mq-nativeha-ubuntu box image (#103 T6, epic .github#103). The Ubuntu
# OS-as-only-variable peer of bake-nativeha-rhel.yml: it bakes the per-run-invariant
# install work the six nha-ubuntu-* nodes otherwise pay EVERY bootstrap on the bare
# cloud-image/ubuntu-24.04 base — base IBM MQ (NO RDQM/DRBD, NO kernel pin: Native HA
# replicates in the raft log) + acl + node-exporter + alloy.
#
# ADDITIVE FOUNDATION: installs only image-bakeable software. It creates NO queue
# managers, forms NO Native HA group, appends NO peer set, links NO mqmonitor@ unit and
# holds NO secrets/keystores — all of that stays in the per-run (configure) path
# (site-nativeha-ubuntu.yml -> mq-nativeha main.yml/crr.yml/tls.yml), which this playbook
# does NOT touch. Run against a single `bake` host:
#   ansible-playbook -i inventory/bake-host.ini bake-nativeha-ubuntu.yml
#
# The Ubuntu MQ media for the deb install rides the actual box build
# (build-fatbox.sh --box mq-nativeha-ubuntu), which stages the host-arch developer
# tarball into the shared cache the install role reads. See
# docs/development/box-bake-manifest.md for the authoritative per-role
# bake-vs-configure classification.

# In-guest apt auto-updates are permanently OFF in every baked Ubuntu box (#1225): the
# weekly cold rebuild + box staleness gate is the update path, so nothing may grab the dpkg
# lock on first boot. Its own play, FIRST, so the bake's own apt work never races it either.
- name: Disable apt auto-updates for good (weekly cold rebuild is the update path, #1225)
  hosts: bake
  become: true
  tasks:
    - name: mask apt-daily / apt-daily-upgrade / unattended-upgrades + zero APT::Periodic
      ansible.builtin.include_role:
        name: apt-autoupdate-off

- name: Bake mq-nativeha-ubuntu (install adapter only; no QMs, no formation, no secrets)
  hosts: bake
  become: true
  vars:
    # No TLS keystore work at bake — pki / mq-nativeha tls.yml is a per-run/secret
    # concern (mirrors bake-nativeha-rhel.yml / bake-mq-ubuntu.yml).
    mq_exporter_tls: false
  tasks:
    # `acl` for unprivileged become — the site-nativeha-ubuntu.yml prerequisite, hoisted
    # to bake (coupling-free, apt on Ubuntu). Baked (not fetched per-run over a
    # rate-limited parallel-boot DNS burst) — the #659 acl-stall kill, Ubuntu side.
    - name: acl package (unprivileged become prereq)
      ansible.builtin.apt:
        name: acl
        state: present

    # THE big install: base IBM MQ (server + client + SDK + samples + web, NO RDQM) via
    # the native-HA OS adapter's INSTALL body only (tasks_from: install-Debian) — the way
    # bake-nativeha-rhel.yml bakes install-RedHat. main.yml's crtmqm / peer-set /
    # mqmonitor@ formation is a per-run concern and MUST NOT run at bake. ibmmq-samples
    # (baked here) ships /opt/mqm/samp/mqmonitor@.service, which main.yml links per QM at
    # configure time. Coupling-free (no run_once/delegate/groups); depends on the host-arch
    # Ubuntu MQ media. The per-run install-Debian.yml now SKIPS the tar copy/unpack via a
    # stat-of-cmqc.h guard (#103 T6), so the media is copied once — here.
    - name: base IBM MQ (native-HA Ubuntu install adapter — install body only)
      ansible.builtin.include_role:
        name: mq-nativeha
        tasks_from: install-Debian

    # PHASED-STARTUP (#642): node-exporter is baked WHOLE and left ENABLED — a definitively
    # benign exception (static host-metrics exporter, no per-run config, races nothing,
    # cannot boot in a broken pre-config state). Like bake-nativeha-rhel.yml there is NO
    # rdqm.service benign exception — Native HA has no RDQM reboot daemon. alloy is baked
    # INERT — only its install half (binary + unit); it needs a per-run config.alloy
    # rendered in the observe phase, so its enable+start is deferred.
    - name: entropy daemon (feed the RNG pool so JVM SecureRandom never blocks — #1190)
      ansible.builtin.include_role:
        name: entropy

    - name: node metrics agent (node-exporter, full role — static config, enabled)
      ansible.builtin.include_role:
        name: node-exporter

    - name: log shipper binary (alloy install half only)
      ansible.builtin.include_role:
        name: alloy
        tasks_from: install

# The per-login dynamic MOTD is OFF in every baked Ubuntu box (#1229): pam_motd ran
# /etc/update-motd.d (50-landscape-sysinfo at ~90% CPU per login) on every SSH session.
# Its own play, LAST, so it is independent of the install work above.
- name: Disable the per-login dynamic MOTD (pam_motd / update-motd.d, #1229)
  hosts: bake
  become: true
  tasks:
    - name: comment out pam_motd in /etc/pam.d/{sshd,login} + mask motd-news.timer
      ansible.builtin.include_role:
        name: motd-off

# cloud-init and snapd come off the boot path of every baked Ubuntu box (#1250): cloud-init
# keeps only what a clone needs (mgmt-NIC netplan re-render + root growth), and snapd goes
# when no snap is installed. Its own play, LAST, so the snapd guard sees every snap the
# bake installed.
- name: Trim cloud-init + snapd off the boot path (#1250)
  hosts: bake
  become: true
  tasks:
    - name: cloud-init = netplan re-render + growpart/resizefs only; mask config/final stages
      ansible.builtin.include_role:
        name: cloud-init-trim

    - name: purge snapd (no snaps in this box) and pin it out
      ansible.builtin.include_role:
        name: snapd-off
