---
# Bake the RHEL mq-nativeha box image (#667, epic .github#88). The RHEL native-HA peer
# of bake-mq-rdqm.yml: it bakes the per-run-invariant install work the six nha-rhel-*
# nodes pay EVERY bootstrap on the bare RHEL base box — base IBM MQ (NO RDQM/DRBD, NO
# kernel pin: Native HA replicates in the raft log) + acl + node-exporter + alloy.
#
# ADDITIVE FOUNDATION: installs only image-bakeable software. It creates NO queue
# managers, forms NO Native HA group, appends NO peer set, links NO mqmonitor@ unit and
# holds NO secrets/keystores — all of that stays in the per-run (configure) path
# (site-nativeha.yml -> mq-nativeha main.yml/crr.yml/tls.yml), which this playbook does
# NOT touch. Run against a single `bake` host:
#   ansible-playbook -i inventory/bake-host.ini bake-nativeha-rhel.yml
#
# Full proof (the RHEL MQ media for the rpm install + the install DVD) rides the actual
# box build (build-fatbox.sh --box <the RHEL mq-nativeha box>), which overrides the media path to
# the host-durable main-worktree cache. See docs/development/box-bake-manifest.md for the
# authoritative per-role bake-vs-configure classification.
- name: Bake the RHEL mq-nativeha box (install adapter only; no QMs, no formation, no secrets)
  hosts: bake
  become: true
  vars:
    # No TLS keystore work at bake — pki / mq-nativeha tls.yml is a per-run/secret
    # concern (mirrors bake-mq-rdqm.yml / bake-mq-ubuntu.yml).
    mq_exporter_tls: false
  tasks:
    # THE big install: base IBM MQ (server + client + SDK + samples + web, NO RDQM) via
    # the native-HA OS adapter's INSTALL body only (tasks_from: install-RedHat) — the way
    # bake-mq-rdqm.yml bakes rdqm-install with tasks_from: install. main.yml's
    # crtmqm / peer-set / mqmonitor@ formation is a per-run concern and MUST NOT run at
    # bake. MQSeriesSamples (baked here) ships /opt/mqm/samp/mqmonitor@.service, which
    # main.yml links per QM at configure time. Coupling-free (no run_once/delegate/groups);
    # depends on the install DVD + MQ media. The per-run install-RedHat.yml now SKIPS the
    # tar copy/unpack via a stat-of-cmqc.h guard (#659), so the media is copied once — here.
    #
    # This include MUST stay the first package-installing step. install-RedHat.yml mounts
    # the install DVD and writes rhel-dvd.repo (the offline guest's only package source),
    # then installs `acl` right after it: the unprivileged-become prereq, baked rather than
    # fetched per-run (the #659 acl-stall kill, RHEL side). A dnf/package task above this
    # include finds no repo (#1403). tests/test_rhel_dvd_repo_order.py enforces the order.
    - name: base IBM MQ (native-HA RHEL install adapter — install body only)
      ansible.builtin.include_role:
        name: mq-nativeha
        tasks_from: install-RedHat

    # PHASED-STARTUP (#642): node-exporter is baked WHOLE and left ENABLED — a definitively
    # benign exception (static host-metrics exporter, no per-run config, races nothing,
    # cannot boot in a broken pre-config state). Unlike bake-mq-rdqm.yml there is NO
    # rdqm.service benign exception here — Native HA has no RDQM reboot daemon. alloy is
    # baked INERT — only its install half (binary + unit); it needs a per-run config.alloy
    # rendered in the observe phase, so its enable+start is deferred.
    - name: entropy daemon (feed the RNG pool so JVM SecureRandom never blocks — #1190)
      ansible.builtin.include_role:
        name: entropy

    - name: node metrics agent (node-exporter, full role — static config, enabled)
      ansible.builtin.include_role:
        name: node-exporter

    - name: log shipper binary (alloy install half only)
      ansible.builtin.include_role:
        name: alloy
        tasks_from: install

    # Guest components (epic .github#294 spec §5.7, §5.8): this box's catalog entry
    # (lab/versions.yaml roles.<role>.components) bakes mq-resiliency-observability. The
    # pinned runtime goes down FIRST (component-install's precondition checks it), then the
    # component itself: venv, INSTALLED.json and the static units in /usr/lib/systemd/system,
    # left INERT (component_start_units defaults false). The per-run collector role renders
    # its env file and enables the timer. runtime_python + component_artifacts arrive via
    # build-fatbox.sh's `-e @<install-vars.json>` (mqlab box build <box> writes it).
    - name: pinned guest runtime (/opt/vergil/cpython-<minor>, epic .github#294)
      ansible.builtin.include_role:
        name: runtime-install

    - name: observability component (baked; units installed inert)
      ansible.builtin.include_role:
        name: component-install
      vars:
        component_name: mq-resiliency-observability
