# One full-HADR provision for the pcmk-ubuntu stack (#350 Task 2). Composed from
# building blocks (move, don't rewrite) so a failure localizes:
#   1. _pcmk-cluster-ha.yml      — live site A on the DRBD-replicated LUN
#   2. _pcmk-dr-replication.yml  — standby site B, the cross-site DR receiver
#   3. (folded qm-create)        — the Pacemaker-managed QM + HA resource group
#   4. site-distributed-shared.yml — the SVC counterparty QM + inter-QM channels
#                                    + the reconnect-aware app requester
#
# This supersedes the former site-pcmk.yml (site-A HA only) + site-pcmk-dr.yml
# (HA+DR) + site-distributed.yml: the canonical stack is full HADR + distributed.
# DR/DRBD ordering is load-bearing — see the building blocks and
# docs/reference/drbd-operations.md.
#
# Provision-phase var contract (#350): the bootstrap `provision` phase passes the
# #351 QM extra-vars (qm_app / qm_svc / chl_to_svc / chl_to_app) via
# phases._qm_extra_vars. The fixed lab-topology values (the app QM's VIPs and the
# SVC CONNAME) are supplied here as lab constants — identical to topology.yaml's
# pcmk-ubuntu qm: block and to the nativeha arm's inline svc_conn precedent — so
# the phase stays pure and setup_dict (the #356 regression) is never referenced.
- import_playbook: _pcmk-cluster-ha.yml
# Skip the site-B DR half entirely under `bootstrap --no-dr` (#188): the pcmk_b DR
# recovery cluster is not brought up, so there is nothing to stand up here. san_b
# stays up (Option B, #997) but this import only does its DR-CUTOVER prep (the LIO
# package it exports the LUN from at a forced cutover) — never reached under --no-dr —
# so fully skipping it is safe. Default (dr_enabled unset → true) runs it, so the full
# HADR provision is byte-for-byte unchanged.
- import_playbook: _pcmk-dr-replication.yml
  when: dr_enabled | default(true) | bool

# Stage 2 authorization (#74): the OAM service principals (mqapp/mqmon/mqsvc)
# must exist on EVERY app-QM node before any setmqaut grant, and on both HA + DR
# sites so authorization survives failover (the substrate-consistency invariant).
- name: authz service accounts on every app-QM node (HA + DR)
  # Under `bootstrap --no-dr` (#188) the pcmk_b DR cluster is not brought up, so drop
  # it from the pattern — else this play targets absent DR guests and fails UNREACHABLE.
  # Default (dr_enabled unset → true) keeps the full HA+DR host set unchanged.
  hosts: "pcmk_a{{ ':pcmk_b' if (dr_enabled | default(true) | bool) else '' }}"
  become: true
  roles: [mq-authz-accounts]

# Folded qm-create (#350 Task 2 step 2): the Pacemaker-managed queue manager and
# its fs -> vip -> qm resource group, plus the our-side inter-QM MQSC. Was the
# separate site-pcmk-qm.yml (`mqlab qm create`); now runs inside provision so a
# cold bootstrap is one pass. mq-pcmk-qmgr consumes:
#   qm_name      <- qm_app          (#351, passed by the provision phase)
#   qm_svc / chl_to_svc / chl_to_app (#351, passed by the provision phase)
#   qm_vip / qm_vip_ext / svc_conn   (lab constants below; were the old `qm create`
#                                     extra-vars sourced from the QmConfig)
- name: queue manager + HA resource group (folded qm-create)
  hosts: pcmk_a
  become: true
  vars:
    qm_name: "{{ qm_app }}"
    qm_vip: 10.10.1.200
    qm_vip_ext: 10.60.0.10
    svc_conn: "svc-sim-ext.service.com"
    first_node: "{{ groups['pcmk_a'][0] }}"
  roles: [mq-pcmk-qmgr]

- import_playbook: site-distributed-shared.yml
  vars:
    our_qm: "{{ qm_app }}"
    our_conn: "pcmk-vip-ext-a.client.com(1414),pcmk-vip-ext-b.client.com(1414)"
    # The app host reaches its app QM on the data plane: site-A VIP (HA) + site-B VIP
    # (DR). APP.SVRCONN is mutual-TLS here (#250), so app_tls defaults true. (#429)
    app_conn: "pcmk-vip-a.client.com(1414),pcmk-vip-b.client.com(1414)"
