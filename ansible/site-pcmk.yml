# The Pacemaker/SAN arm (Phase D). Site A; site B plays land with the DR
# task. Run: uv run ansible-playbook site-pcmk.yml [--limit ...]
- hosts: pcmk_san_ha
  become: true
  tasks:
    - name: acl package for unprivileged become
      ansible.builtin.apt:
        name: acl
        update_cache: false

- hosts: san_a
  vars:
    san_backing_dev: /dev/vdb
    san_target_iqn: iqn.2026-06.lab.mq:san-a.lun0
    san_portal_ip: 10.40.1.5
    san_initiator_iqns:
      - iqn.2026-06.lab.mq:pcmk-a1
      - iqn.2026-06.lab.mq:pcmk-a2
      - iqn.2026-06.lab.mq:pcmk-a3
  roles: [iscsi-target]

- hosts: pcmk_a
  vars:
    san_target_iqn: iqn.2026-06.lab.mq:san-a.lun0
    san_portal_ip: 10.40.1.5
  roles: [iscsi-initiator]
  # One-time fs prep (plan Task 2, previously a manual checklist step): format
  # the shared LUN exactly once, labeled MQSHARED, so mq-pcmk-qmgr and the
  # Pacemaker mq_fs Filesystem resource can mount it by-label. Roles run before
  # tasks, so the initiator has logged the LUN in by the time this runs. The
  # idempotent label guard mirrors site-pcmk-dr.yml's /dev/drbd0 init. run_once
  # + the stable iSCSI by-path handle (never a bare /dev/sd?, which is not
  # stable across reboots). NEVER mounted by more than one node here — Pacemaker
  # owns the mount from the QM resource group onward.
  tasks:
    - name: one-time fs prep - format the shared LUN (run once)
      ansible.builtin.shell: |
        set -e
        dev=/dev/disk/by-path/ip-{{ san_portal_ip }}:3260-iscsi-{{ san_target_iqn }}-lun-0
        if blkid "$dev" 2>/dev/null | grep -q MQSHARED; then
          echo already-formatted
          exit 0
        fi
        mkfs.xfs -L MQSHARED "$dev"
        echo formatted
      args:
        executable: /bin/bash
      become: true
      run_once: true
      register: lun_mkfs
      changed_when: "'formatted' in lun_mkfs.stdout_lines"

- hosts: pcmk_a
  vars: &pcmk_a_vars
    pcmk_cluster_name: mqpcmk
    pcmk_site_nodes:
      - { name: pcmk-a1, hb: 172.16.1.51 }
      - { name: pcmk-a2, hb: 172.16.1.52 }
      - { name: pcmk-a3, hb: 172.16.1.53 }
    fence_hypervisor_ip: 192.168.121.1
    fence_hypervisor_user: pmoore
  roles: [pcmk-cluster]

- hosts: pcmk_a
  vars: *pcmk_a_vars
  roles: [pcmk-stonith]

- hosts: pcmk_a
  roles: [mq-install]
