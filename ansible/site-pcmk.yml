# The Pacemaker/SAN arm (Phase D). Site A; site B plays land with the DR
# task. Run: ansible-playbook site-pcmk.yml [--limit ...]

# STONITH prerequisite (#133): fence_virsh ssh's from each cluster node to the
# hypervisor (this VM, the libvirt host) as the fence user, then virsh-fences a
# domain. That needs the keypair to exist AND its public half authorized for the
# fence user here. Both are hypervisor-local, and the fence user is the user
# running this play (== fence_hypervisor_user). Without it fence_virsh fails
# "Permission denied (publickey)", STONITH never starts, and the cluster can
# never fence or recover. The pcmk-stonith role copies the private key to the
# nodes; this play generates it (if absent) and authorizes the public half.
- name: fence keypair + hypervisor authorization (STONITH prerequisite)
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    fence_key: "{{ playbook_dir }}/../build/state/fence_key"
  tasks:
    - name: generate the fence keypair once (gitignored, under build/)
      ansible.builtin.command:
        cmd: ssh-keygen -t ed25519 -N "" -C "fence_virsh@lab" -f "{{ fence_key }}"
        creates: "{{ fence_key }}"

    - name: ensure the fence user's ~/.ssh exists
      ansible.builtin.file:
        path: ~/.ssh
        state: directory
        mode: "0700"

    - name: authorize the fence public key for fence_virsh on the hypervisor
      ansible.builtin.lineinfile:
        path: ~/.ssh/authorized_keys
        line: "{{ lookup('file', fence_key + '.pub') }}"
        create: true
        mode: "0600"
        state: present

# Cold-boot guard (#151): a clean ground-up bootstrap runs `vm up` then
# `vm provision` in quick succession, and a guest that is not yet SSH-ready when
# its play fires drops out of the run — which is how a first provision can skip
# the storage stage entirely (target never installed, initiators never logged in)
# and still report success, leaving `qm create` to fail at the LUN mount. Wait
# for every SAN-arm host to accept a connection before any storage work runs.
- name: wait for all SAN-arm hosts to be SSH-ready (cold-boot guard)
  hosts: pcmk_san_ha
  gather_facts: false
  tasks:
    - name: wait for connection
      ansible.builtin.wait_for_connection:
        timeout: 180

- hosts: pcmk_san_ha
  become: true
  tasks:
    - name: acl package for unprivileged become
      ansible.builtin.apt:
        name: acl
        update_cache: false

- hosts: san_a
  vars:
    san_backing_dev: /dev/vdb
    san_target_iqn: iqn.2026-06.lab.mq:san-a.lun0
    san_portal_ip: 10.40.1.5
    san_initiator_iqns:
      - iqn.2026-06.lab.mq:pcmk-a1
      - iqn.2026-06.lab.mq:pcmk-a2
      - iqn.2026-06.lab.mq:pcmk-a3
  roles: [iscsi-target]

- hosts: pcmk_a
  vars:
    san_target_iqn: iqn.2026-06.lab.mq:san-a.lun0
    san_portal_ip: 10.40.1.5
  roles: [iscsi-initiator]
  # One-time fs prep (plan Task 2, previously a manual checklist step): format
  # the shared LUN exactly once, labeled MQSHARED, so mq-pcmk-qmgr and the
  # Pacemaker mq_fs Filesystem resource can mount it by-label. Roles run before
  # tasks, so the initiator has logged the LUN in by the time this runs. The
  # idempotent label guard mirrors site-pcmk-dr.yml's /dev/drbd0 init. run_once
  # + the stable iSCSI by-path handle (never a bare /dev/sd?, which is not
  # stable across reboots). NEVER mounted by more than one node here — Pacemaker
  # owns the mount from the QM resource group onward.
  tasks:
    - name: one-time fs prep - format the shared LUN (run once)
      ansible.builtin.shell: |
        set -e
        dev=/dev/disk/by-path/ip-{{ san_portal_ip }}:3260-iscsi-{{ san_target_iqn }}-lun-0
        if blkid "$dev" 2>/dev/null | grep -q MQSHARED; then
          echo already-formatted
          exit 0
        fi
        mkfs.xfs -L MQSHARED "$dev"
        echo formatted
      args:
        executable: /bin/bash
      become: true
      run_once: true
      register: lun_mkfs
      changed_when: "'formatted' in lun_mkfs.stdout_lines"

    # The mkfs above is run_once: it labels the LUN on a single node. The other
    # nodes logged in to the *raw* LUN beforehand, so their udev never sees the
    # new MQSHARED label until the device is rescanned — /dev/disk/by-label/MQSHARED
    # resolves only on the formatting node. Pacemaker can then place mq_fs on a
    # peer that cannot resolve the device and fences it (this bit initial
    # placement, not just failover). Rescan + re-trigger udev on EVERY node so the
    # label resolves cluster-wide, and assert it (fail loud, never silent) before
    # the QM resource group is ever created (#151).
    - name: refresh the iSCSI block view so MQSHARED resolves on every node
      ansible.builtin.shell: |
        set -e
        iscsiadm -m session --rescan
        udevadm trigger --action=change --subsystem-match=block
        udevadm settle
        test -e /dev/disk/by-label/MQSHARED
      args:
        executable: /bin/bash
      become: true
      changed_when: false

- hosts: pcmk_a
  vars: &pcmk_a_vars
    pcmk_cluster_name: mqpcmk
    pcmk_site_nodes:
      - { name: pcmk-a1, hb: 172.16.1.51 }
      - { name: pcmk-a2, hb: 172.16.1.52 }
      - { name: pcmk-a3, hb: 172.16.1.53 }
    fence_hypervisor_ip: 192.168.121.1
    fence_hypervisor_user: pmoore
  roles: [pcmk-cluster]

- hosts: pcmk_a
  vars: *pcmk_a_vars
  roles: [pcmk-stonith]

- hosts: pcmk_a
  roles: [mq-install]

# REST API on every node's QMPCMK (design §1). Stateless per-node mqweb (spec §8.3)
# — set up at provision, where mqweb_admin_password is injected; administers the
# local QM whenever the cluster lands it here.
- hosts: pcmk_a
  roles: [mqweb]
