# Building block (#350 Task 2): site-A 3-node RDQM HA group (the live site).
# Body moved verbatim from the former site-rdqm.yml. Composed by site-rdqm.yml
# ahead of _rdqm-dr-replication.yml (site B). rdqm-ha forms the Pacemaker-managed
# replicated-data group; the QM itself is created later (folded qm-create) once
# both sites' groups exist, so the DR secondary has a peer group to land on.
- hosts: rdqm_a
  become: true
  tasks:
    - name: acl package for unprivileged become
      ansible.builtin.dnf:
        name: acl

- hosts: rdqm_a
  roles: [rdqm-install]

# mqm passwordless SSH + sudo (#560) — the RDQM HA prerequisite for `crtmqm -sx` to
# auto-create the secondaries (IBM's coordinated create). MUST run BEFORE mqweb: mqweb
# runs as mqm and would block the `usermod` home move. Removed after qm-create in
# site-rdqm.yml (enable -> create -> remove; not standing access).
- hosts: rdqm_a
  roles: [rdqm-ssh-access]

# REST on every node's RDQMAPP (design §1). Stateless per-node mqweb (spec §8.3),
# set up at provision where mqweb_admin_password is injected; administers the local
# QM whenever RDQM lands it here. Mirrors the pcmk arm's _pcmk-cluster-ha.yml.
- hosts: rdqm_a
  roles: [mqweb]

- hosts: rdqm_a
  vars:
    rdqm_site_nodes:
      - { name: rdqm-a1, hb: 172.16.1.31, data: 10.10.1.31 }
      - { name: rdqm-a2, hb: 172.16.1.32, data: 10.10.1.32 }
      - { name: rdqm-a3, hb: 172.16.1.33, data: 10.10.1.33 }
  roles: [rdqm-ha]
