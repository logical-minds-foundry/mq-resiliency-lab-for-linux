# Distributed MQ (#147), Native HA arm: the QMNATIVE HA substrate (site-nativeha.yml)
# + the shared, substrate-free SVC/app/channel layer (site-distributed-shared.yml),
# identical to the pcmk/rdqm arms. Native HA has no floating VIP, so — like the RDQM
# arm — the partner (QMSVC) reaches QMNATIVE by a CONNAME list of the three
# nha_rhel_a net-ext IPs; MQ tries them and connects to whichever instance is active,
# so the partner link rides a failover with no second IP. Site-A only (Phase 1);
# site B + CRR is Phase 3 on the same consolidated setup.
- import_playbook: site-nativeha.yml

- import_playbook: site-distributed-shared.yml
  vars:
    our_qm: QMNATIVE
    our_conn: "10.60.0.71(1414),10.60.0.72(1414),10.60.0.73(1414)"

# Our-side inter-QM + app MQSC on QMNATIVE. runmqsc must run on the ACTIVE instance;
# Native HA then replicates the objects to all instances via raft. Mirrors the RDQM
# arm's our-side MQSC (rdqm-qm-create.sh) and the pcmk arm's inter-qm.mqsc.j2.
- hosts: nha_rhel_a
  become: true
  vars:
    qm_name: QMNATIVE
    svc_conn: "10.60.0.50"
  tasks:
    - name: find the active Native HA instance
      ansible.builtin.shell: >
        su - mqm -c "/opt/mqm/bin/dspmq -m {{ qm_name }} -o nativeha -x"
        | grep -oE 'ROLE\(Active\) INSTANCE\(nha-rhel-a[0-9]\)'
        | grep -oE 'nha-rhel-a[0-9]' | head -1
      register: act
      changed_when: false
      run_once: true
      delegate_to: "{{ groups['nha_rhel_a'][0] }}"

    - name: record the active host
      ansible.builtin.set_fact:
        active_host: "{{ act.stdout | trim }}"
      run_once: true

    - name: apply our-side + app MQSC on the active instance (once; raft-replicated)
      ansible.builtin.shell: |
        su - mqm -c "/opt/mqm/bin/runmqsc {{ qm_name }}" <<'MQSC'
        DEFINE LISTENER(L1414) TRPTYPE(TCP) PORT(1414) CONTROL(QMGR) REPLACE
        START LISTENER(L1414)
        DEFINE CHANNEL(APP.SVRCONN) CHLTYPE(SVRCONN) TRPTYPE(TCP) MCAUSER('mqm') HBINT(15) KAINT(15) REPLACE
        ALTER QMGR CHLAUTH(DISABLED) CONNAUTH(' ')
        REFRESH SECURITY TYPE(CONNAUTH)
        DEFINE QLOCAL(APP.REPLY) DEFPSIST(YES) REPLACE
        DEFINE QREMOTE(SVC.REQUEST) RNAME(SVC.REQUEST) RQMNAME(QMSVC) XMITQ(QMSVC) REPLACE
        DEFINE QLOCAL(QMSVC) USAGE(XMITQ) TRIGGER TRIGTYPE(FIRST) INITQ(SYSTEM.CHANNEL.INITQ) TRIGDATA({{ qm_name }}.QMSVC) REPLACE
        DEFINE CHANNEL({{ qm_name }}.QMSVC) CHLTYPE(SDR) TRPTYPE(TCP) CONNAME('{{ svc_conn }}(1414)') XMITQ(QMSVC) SHORTRTY(10) SHORTTMR(5) LONGRTY(999999999) LONGTMR(20) REPLACE
        DEFINE CHANNEL(QMSVC.{{ qm_name }}) CHLTYPE(RCVR) TRPTYPE(TCP) REPLACE
        START CHANNEL({{ qm_name }}.QMSVC)
        MQSC
      register: mqsc
      changed_when: true
      failed_when: mqsc.rc not in [0, 10]
      run_once: true
      delegate_to: "{{ active_host }}"
