# Observability pair (#103). Run via `mqlab obs up`, or directly:
#   ansible-playbook site-obs.yml
- hosts: obs_box:probe
  become: true
  roles: [node-exporter]

- hosts: obs_box
  become: true
  roles: [prometheus, grafana]

# The MQ-service exporter on the probe: client-mode mq_prometheus against the
# QM VIP, scraped by Prometheus at mon-probe:9157 (#172). Defaults target QMPCMK;
# QMDTCC needs net-ext on the probe + a second instance (follow-up).
- hosts: probe
  roles: [mq-exporter]
