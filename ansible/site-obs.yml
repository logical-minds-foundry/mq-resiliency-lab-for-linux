# Observability pair (#103). Run via `mqlab obs up`, or directly:
#   ansible-playbook site-obs.yml
#
# The obs node boots the baked obs-ubuntu2404 box (#605, epic .github#70); mon-probe does
# NOT (host-resolved Ubuntu platform). So the two are split: probe runs the FULL install,
# obs runs only the per-run configure halves of the baked roles.

# probe (mon-probe) is un-baked — full node-exporter + alloy install.
- hosts: probe
  become: true
  roles: [node-exporter, alloy]

# MQ-service exporters on the probe: client-mode mq_prometheus, one app + one svc
# instance PER STACK (#423), each on the stack's alloc port and scraped by Prometheus
# on the mgmt plane (#172, #182). The per-stack list (`mq_exporters`) is rendered from
# topology by mqlab (obs targets) and passed as an extra-var. Build the exporter binary
# + shared ops keystore ONCE, then loop the per-instance unit. Metrics are qmgr-keyed
# so a board follows failover; a stopped stack's exporters just report the QM down. Both
# app + svc connect on the dedicated MON.SVRCONN (#250) — the exporter presents O=app-org,
# which MON.SVRCONN pins on every QM. Objects are wildcarded in the role defaults.
#
# ORDER (#893, subset of #886): this play runs BEFORE the obs_box services play below. The
# exporters are the load-bearing MQ metrics (Register C) and the scrape *targets* Prometheus
# consumes — targets before the scraper. Keeping them ahead means a single obs_box service
# failure (e.g. a stale box missing the grafana-image-renderer unit, #886/#877) can no longer
# abort the whole playbook and take MQ metrics down with it. Dependency-safe: this play needs
# only the baked probe box + the pre-rendered `mq_exporters` var, nothing the obs_box play makes.
- hosts: probe
  become: true
  tasks:
    - name: build mq_prometheus + place the shared ops keystore (once)
      ansible.builtin.include_role:
        name: mq-exporter
        tasks_from: build

    - name: per-stack mq_prometheus exporter instances (app + svc per stack)
      ansible.builtin.include_role:
        name: mq-exporter
        tasks_from: instance
      vars:
        mq_exporter_qm: "{{ item.qm }}"
        mq_exporter_instance: "{{ item.instance }}"
        mq_exporter_conn: "{{ item.conn }}"
        mq_exporter_channel: "{{ item.channel }}"
        mq_exporter_port: "{{ item.port }}"
        mq_exporter_ccdt: "/var/mqm/ssl/exporter-ccdt-{{ item.instance }}.json"
      loop: "{{ mq_exporters }}"
      loop_control:
        label: "{{ item.instance }} :{{ item.port }} -> {{ item.qm }}"

# obs is baked (obs-ubuntu2404, #605): every service is baked INERT (install half only,
# #642) — the binaries/package + static config are baked, but nothing auto-starts on
# boot in a pre-config state. So per-run we run the configure halves that enable + start
# them: loki (static config, just enable+start), alloy (rendered config.alloy + start),
# prometheus (topology-rendered scrape targets), grafana (rendered dashboard tree + the
# admin-password secret drop-in). node_exporter is the one benign exception — baked
# enabled (static host-metrics, no per-run config) and re-applied by observability.yml.
- hosts: obs_box
  become: true
  tasks:
    # NOTE (#639): the instance-build base-OS refresh (apt update + upgrade:dist, spec
    # §4.5.1) was removed — a blanket upgrade fights the pinned baked stack. OS currency
    # now comes from rebuilding the box, not updating at boot.

    # STARTUP ORDER IS LOAD-BEARING (#1194). The heavy log-tier JVM/Node cold-starts run
    # FIRST, each gated to ready, on the still-idle node — THEN the light metrics Go services.
    # VAL #1177 measured the reverse order CPU-starving OpenSearch: the metrics services'
    # startup burst (prometheus 154% + grafana 128% + loki 108% + alloy 70%) pegged all cores
    # while OpenSearch's JVM — which came last — got ~37% of one core and never reached green
    # (load ~27 on 8 cores; memory fine). Because the three log-tier roles already carry
    # readiness gates (OpenSearch: cluster green; Data Prepper: otel source accepting;
    # Dashboards: /api/status green), ordering them first makes each heavy cold-start happen
    # while the node is quiet, one at a time, before the metrics burst.

    # --- Log-search tier FIRST (OpenSearch + Data Prepper + Dashboards), consolidated onto obs
    # (#1179, epic .github#267; formerly the standalone site-logsearch.yml, hosts: logsearch
    # #832). OpenSearch is the store the other two depend on — its configure enables+starts
    # OpenSearch, waits for the cluster to go green, PUTs the `logs` index template (replicas:0,
    # load-bearing on a single node), creates the `logsearch-fs` snapshot repo, and restores the
    # last snapshot on bring-up (caller passes opensearch_snapshot_state_dir; empty = clean
    # no-op). Then Data Prepper (sinks to localhost:9200, so AFTER OpenSearch + its template),
    # then Dashboards (queries OpenSearch on localhost, so after the store). ---
    - name: opensearch configure (per-run enable + start, index template, snapshot repo, restore)
      ansible.builtin.include_role:
        name: opensearch
        tasks_from: configure

    - name: data-prepper configure (per-run enable + start; sinks to localhost:9200)
      ansible.builtin.include_role:
        name: data-prepper
        tasks_from: configure

    - name: opensearch-dashboards configure (per-run enable + start; after opensearch)
      ansible.builtin.include_role:
        name: opensearch-dashboards
        tasks_from: configure

    # --- Metrics tier SECOND: the light Go services start fast and, with the heavy JVMs
    # already up and gated-ready, their startup burst no longer starves a cold-starting JVM.
    # loki is on the obs box ONLY and not re-applied fleet-wide by observability.yml, so its
    # per-run enable+start lives here (#642); bring it up before grafana's Loki datasource is
    # queried. node-exporter is re-applied fleet-wide by observability.yml — not repeated here. ---
    - name: loki configure (per-run enable + start)
      ansible.builtin.include_role:
        name: loki
        tasks_from: configure

    - name: alloy configure (per-run config.alloy + start)
      ansible.builtin.include_role:
        name: alloy
        tasks_from: configure

    - name: prometheus configure (per-run topology scrape targets)
      ansible.builtin.include_role:
        name: prometheus
        tasks_from: configure

    # Bring the renderer up before grafana (#877) so it is ready when the first render
    # request arrives; the rendering env drop-in was baked by the grafana install half.
    - name: grafana-image-renderer configure (per-run enable + start)
      ansible.builtin.include_role:
        name: grafana-image-renderer
        tasks_from: configure

    - name: grafana configure (per-run dashboard tree + admin-password secret)
      ansible.builtin.include_role:
        name: grafana
        tasks_from: configure
