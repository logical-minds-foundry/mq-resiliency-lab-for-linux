# Distributed MQ (#147): our site-A HA queue manager (QMPCMK) joined to the DTCC
# service queue manager (QMDTCC) by inter-QM sender/receiver channels over net-ext.
#
# Reuses the ENTIRE SAN/cluster bring-up (site-pcmk.yml) for our side, then stands
# up the counterparty: QMDTCC + the their-side channels + the bindings responder.
# Our-side inter-QM MQSC is defined later, at `mqlab qm create distributed`
# (site-pcmk-qm.yml, gated on dtcc_conn). Channels establish bidirectionally once
# both QMs exist; the responder retries until QMPCMK is up, so order is immaterial.
- import_playbook: site-pcmk.yml

# Cold-boot guard for the DTCC + app hosts (mirrors site-pcmk.yml's guard; #151
# lesson): a guest not yet SSH-ready when its play fires must not drop out.
- name: wait for the DTCC + app hosts to be SSH-ready (cold-boot guard)
  hosts: dtcc:app
  gather_facts: false
  tasks:
    - name: wait for connection
      ansible.builtin.wait_for_connection:
        timeout: 180

- hosts: dtcc
  become: true
  tasks:
    - name: acl package for unprivileged become
      ansible.builtin.apt:
        name: acl
        update_cache: false

- hosts: dtcc
  roles: [mq-install]

- hosts: dtcc
  vars:
    qmgr_name: QMDTCC
  roles: [mq-qmgr]

- hosts: dtcc
  vars:
    qmgr_name: QMDTCC
    our_qm: QMPCMK
    our_conn: "10.60.0.10(1414),10.60.0.20(1414)"
  roles: [mq-inter-qm]

# --- Business A's app (requester): MQ client libs + pymqi + the reconnect-aware
#     app client. The TCP-keepalive tuning lets a blocking MQI call detect a
#     fenced peer in ~30s -- the client HA-cooperation contract (#64). (#148) ---
- hosts: app
  become: true
  roles: [mq-client]

- hosts: app
  tasks:
    - name: pymqi venv
      ansible.builtin.shell: |
        set -e
        python3 -m venv /home/vagrant/mqvenv
        /home/vagrant/mqvenv/bin/pip install pymqi
      args:
        creates: /home/vagrant/mqvenv/bin/python

    - name: deploy the app requester
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../clients/app_requester.py"
        dest: /home/vagrant/app_requester.py
        mode: "0644"

    - name: client TCP KeepAlive in mqclient.ini (fast dead-peer detection)
      become: true
      ansible.builtin.blockinfile:
        path: /var/mqm/mqclient.ini
        create: true
        owner: mqm
        group: mqm
        mode: "0644"
        marker: "# {mark} DR-HA TCP KEEPALIVE"
        block: |
          TCP:
             KeepAlive=Yes

    - name: short OS TCP keepalive so a blocked call detects a fenced peer
      become: true
      ansible.builtin.copy:
        dest: /etc/sysctl.d/99-mq-keepalive.conf
        mode: "0644"
        content: |
          # DR-HA: detect a fenced MQ peer in ~30s, not the ~15min TCP default.
          net.ipv4.tcp_keepalive_time = 15
          net.ipv4.tcp_keepalive_intvl = 5
          net.ipv4.tcp_keepalive_probes = 3
      register: mq_keepalive_sysctl

    - name: apply the keepalive sysctl drop-in
      become: true
      ansible.builtin.command: sysctl -p /etc/sysctl.d/99-mq-keepalive.conf
      when: mq_keepalive_sysctl.changed
