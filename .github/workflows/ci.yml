name: CI

on:
  pull_request:
  workflow_call:
    inputs:
      run-security:
        type: boolean
        default: true
      run-release:
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    uses: vergil-project/vergil-actions/.github/workflows/ci-audit.yml@v2.1
    with:
      language: python
      versions: '["3.12"]'
      container-tag: '3.12'
      container-suffix: python

  quality:
    uses: vergil-project/vergil-actions/.github/workflows/ci-quality.yml@v2.1
    with:
      language: python
      versions: '["3.12"]'
      container-tag: '3.12'
      container-suffix: python

  security:
    uses: vergil-project/vergil-actions/.github/workflows/ci-security.yml@v2.1
    permissions:
      contents: read
      security-events: write
      # Requested by ci-security.yml@v2.1.3: codeql-action/upload-sarif
      # needs it on private repos. See vergil-project/vergil-actions#698.
      actions: read
    with:
      language: python
      run-standards: ${{ inputs.run-release != 'false' }}
      run-security: ${{ inputs.run-security != 'false' }}
      # Public repo with GHAS on: CodeQL runs and uploads SARIF so the
      # code-scanning / GHAS checks (Trivy, Semgrep OSS, CodeQL) materialize and
      # satisfy the required CI gates — a skipped CodeQL job never reports and
      # blocks every merge (#491).
      upload-sarif: true
      container-tag: '3.12'
      container-suffix: python

  test:
    uses: vergil-project/vergil-actions/.github/workflows/ci-test.yml@v2.1
    with:
      language: python
      versions: '["3.12"]'
      container-tag: '3.12'
      container-suffix: python

  version:
    uses: vergil-project/vergil-actions/.github/workflows/ci-version-bump.yml@v2.1
    with:
      language: python
      run-release: ${{ inputs.run-release != 'false' }}
      container-tag: '3.12'
      container-suffix: python

  # Strict docs build, so a PR that breaks the site fails here instead of
  # only at cd-docs deploy after merge. ci-docs self-guards: a repo without
  # docs/site/mkdocs.yml is a no-op pass. It stages the changelog/release
  # sources and runs `mkdocs build --strict`.
  docs:
    uses: vergil-project/vergil-actions/.github/workflows/ci-docs.yml@v2.1
