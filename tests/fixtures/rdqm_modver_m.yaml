# Real output of IBM's `modver -m <kernel>` (#1408), captured 2026-10-09 by running the
# script from the 10.0.0.0 IBM-MQ-Advanced-for-Developers-LinuxX64 tarball
# (MQServer/Advanced/RDQM/PreReqs/el9/kmod-drbd-9/modver) against each kernel below.
# stdout is verbatim, one list item per line; rc is the exit status.
# tests/test_rdqm_modver.py runs the rdqm-install role's parse against these.
mq_version: "10.0.0.0"
kmod_dir: el9/kmod-drbd-9
cases:
  # The lab's RHEL 9.6 GA kernel: modver picks the same-release kmod.
  - kernel: 5.14.0-570.12.1.el9_6.x86_64
    rc: 0
    stdout:
      - kmod-drbd-9.3.1_5.14.0_570.12.1-1.x86_64.rpm
      - "10.0.0.0"
  # A later 9.6 errata kernel: modver picks the newest kmod at or below it in the family.
  - kernel: 5.14.0-570.40.1.el9_6.x86_64
    rc: 0
    stdout:
      - kmod-drbd-9.3.1_5.14.0_570.35.1-1.x86_64.rpm
      - "10.0.0.0"
  # The RHEL 9.8 GA kernel: no same-release kmod ships, modver picks the 687 family's.
  - kernel: 5.14.0-687.5.3.el9_8.x86_64
    rc: 0
    stdout:
      - kmod-drbd-9.3.1_5.14.0_687.5.1-1.x86_64.rpm
      - "10.0.0.0"
  # The RHEL 10.2 GA kernel: outside every family this el9 modver knows.
  - kernel: 6.12.0-211.7.3.el10_2.x86_64
    rc: 1
    stdout:
      - Unsupported kernel release.
      - Please see http://ibm.biz/mqrdqmkernelmods for more information.
