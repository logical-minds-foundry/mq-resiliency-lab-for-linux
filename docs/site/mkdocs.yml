site_name: "MQ Resiliency Lab for Linux"
site_description: "Reproducible nested-virtualization lab for IBM MQ HA and DR resiliency on Linux"
repo_url: https://github.com/logical-minds-foundry/mq-resiliency-lab-for-linux
repo_name: logical-minds-foundry/mq-resiliency-lab-for-linux
docs_dir: docs
strict: true
edit_uri: ""

extra:
  version:
    provider: mike

extra_javascript:
  - js/resize-iframes.js

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - content.code.copy
    - search.highlight
    - search.suggest

plugins:
  - search

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.snippets
  - tables
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Releases:
      - Changelog: changelog.md
      - Release Notes:
          - releases/index.md
  - Getting Started: getting-started.md
  - Architecture: architecture/index.md
  - Design & Specs: design-and-specs.md
