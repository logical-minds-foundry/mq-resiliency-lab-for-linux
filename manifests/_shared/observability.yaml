# Shared obs stack — a singleton served by `mqlab obs up` for every arm (#266).
# Values track today's role defaults. grafana still floats (apt-pick; pin later by
# step-function); the exporter ref is now pinned to the role default (#1120, retires #172).
prometheus: "3.13.3" # ansible/roles/prometheus/defaults; 3.x LTS, was 2.53.2 EOL (currency, epic .github#236; #1133 T7 off spike #1128)
node_exporter: "1.8.2" # ansible/roles/node-exporter/defaults
loki: "3.1.1" # ansible/roles/loki/defaults
alloy: "1.3.1" # ansible/roles/alloy/defaults
grafana: "" # apt-float today; "" = let apt pick (pin later by step-function)
mq_metric_samples_ref: "v6.0.0" # ansible/roles/mq-exporter/defaults (mq_exporter_ref) == mqexporter.MQ_EXPORTER_REF; pinned #1120 (retires #172)
# logsearch tier (#829, epic .github#149). OpenSearch + Dashboards share one upstream
# version; pin both here so a re-bake never changes the engine version under an existing
# snapshot. Currency (obs version-currency, epic .github#236) — reviewed 2026-09-16:
# 3.8.0 latest; next move 3.9.0 ~2026-09-29 (opensearch.org/downloads.html; releases at
# github.com/opensearch-project/OpenSearch/releases).
opensearch: "3.8.0" # ansible/roles/opensearch/defaults (role added in a later #149 task)
opensearch_dashboards: "3.8.0" # ansible/roles/opensearch-dashboards/defaults (later task)
# Data Prepper — the Alloy -> OTLP -> OpenSearch connector (#939, epic .github#149). The
# gating connector spike (#826) proved 2.16.0 end-to-end; pin it here so a re-bake never
# changes the shipper version. The data-prepper role (#939) consumes this pin.
data_prepper: "2.16.0" # ansible/roles/data-prepper/defaults
