[project]
repository-type = "tooling"
versioning-scheme = "semver"
branching-model = "library-release"
release-model = "tagged-release"
primary-language = "python"
# Public repo: GHAS/code-scanning is on. Declared explicitly rather than inferred
# from visibility, so the CI-gates ruleset posture is unambiguous (#491).
ghas = true

[ci]
versions = ["3.14"]
integration-tests = false

[publish]
release = false
docs = true

# Exclude generated docs artifacts from markdownlint. vrg-docs-stage copies
# the changelog/release sources under docs/site/docs/ at build time; those
# copies are machine-generated (and gitignored), so they are not hand-authored
# markdown to lint. The committed sources live at the repo root and are not
# under docs/site/, so markdownlint never sees them either way.
[markdownlint]
ignore = ["docs/site/docs/changelog.md", "docs/site/docs/releases"]

[dependencies]
vergil = "v2.1"

[vm.vergil-user]
# Shared base for the two named instances below (tier-4 role overlay). The lab is
# dual-arch: an x86-targeted stack whose guests run under native KVM on an x86 host
# and under TCG emulation on arm64. This package set serves BOTH backends
# (qemu-system-x86 emulates x86 on the arm64 Mac).
#
# Two named instances inherit this base and add only what differs:
#   - instances.local : the big-beefy Lima box on the Mac (arm64)
#   - instances.cloud : a native-x86 GCP host (driver=kvm, escapes the TCG tax)
# Run them with `vrg-vm <verb> --name local` / `--name cloud`. They are independent
# boxes (own state, volume, fingerprint) and may run simultaneously (vergil-vm#242).
cpus   = 24                   # local/Lima sizing — doubled from 12 (#991): full-lab load hit ~71% CPU steal and Native HA couldn't hold quorum; the Mac's main job right now is this lab. The cloud instance overrides these to match its `instance` machine type (#405)
memory = "64GiB"
# nested KVM (vergil-vm#131): /dev/kvm for the nested lab guests. Native KVM on the
# x86 cloud host; the arm64 Mac falls back to TCG unless macOS 15+ on M3+.
nested = true
# No apt "vagrant": there is no arm64 vagrant deb (HashiCorp ships amd64 only;
# Ubuntu noble dropped it post-BUSL). vergil-vm gem-installs vagrant when
# vagrant_plugins is declared (vergil-project/vergil-vm#130); the gem and the
# vagrant-libvirt plugin compile against the build deps below.
packages = [
  "qemu-system-x86", "qemu-system-arm", "qemu-utils",
  "qemu-efi-aarch64", "ovmf",  # UEFI guest firmware (AAVMF/OVMF) — Recommends-only, so declare explicitly (#20)
  "libvirt-daemon-system", "libvirt-clients", "bridge-utils",
  "dnsmasq-base", "genisoimage",
  "libarchive-tools",  # bsdtar — vagrant box unpacking
  "ruby-dev", "libvirt-dev", "pkg-config", "build-essential",  # vagrant gem + vagrant-libvirt build deps (build-essential = gcc/g++/make/libc6-dev; the cloud base ships no libc6-dev)
]
vagrant_plugins = ["vagrant-libvirt"]
# Expose the lab's Grafana to the workstation. The obs guest's Grafana is a nested
# libvirt guest (static 10.50.0.2:3000) the host can't see directly; vergil-vm (#170)
# provisions a systemd-socket-proxyd relay on the base VM's 0.0.0.0:3000, forwarded
# to the workstation's localhost:3000. Records are "<vm-port>|<host:port>". Takes
# effect on the next `vrg-vm rebuild`.
port_forwards = ["3000|10.50.0.2:3000"]

# --- Post-build hook: RHEL DVD auto-stage (PLACEHOLDER — INERT, NOT YET ACTIVE) ---
# Intent: at the END of every `vrg-vm create`/`rebuild`, run the host-side RHEL DVD
# auto-stage so a wiped /vergil never forces a manual DVD re-copy. The script is
# committed at lab/scripts/stage-rhel-dvd-from-archive.sh (an idempotent rsync from the
# operator's static local DVD archive into build/state/); the flow is documented in
# docs/development/box-model.md.
#
# This block is DELIBERATELY ALL COMMENTS — it declares NO active key. vrg-vm today
# reads only packages, vagrant_plugins, apt_repos, port_forwards, and sizing; it has no
# post-build-hook key. Adding a real key now would be parsed by vrg-vm and could break
# VM provisioning, so the wiring stays a comment until the capability ships.
# Tracked cross-org: vergil-project/vergil-tooling#2407 (referenced in epic
# logical-minds-foundry/.github#91). When it lands, replace this block with the real key
# that issue specifies — the intended shape is roughly:
#
#   post_build_hook = "lab/scripts/stage-rhel-dvd-from-archive.sh"
#
# Until then, run that script by hand after a nuclear rebuild (see box-model.md).
# ----------------------------------------------------------------------------------

[vm.vergil-user.instances.local]
# Big-beefy local Lima box on the Mac (arm64). No backend key = local Lima.
# Inherits packages/nested/forwards/cpus/memory from [vm.vergil-user] above.
disk = "300GiB"               # nested guest qcow2 images are the risk, not RAM

[vm.vergil-user.instances.cloud]
# Native-x86 GCP host — runs the nested guests with /dev/kvm (driver=kvm), escaping
# the arm64 TCG emulation tax (vergil-vm#199; evidence in mq-cluster-tooling #289).
backend  = "off-platform"
provider = "gcp"
region   = "us-east1"
zone     = "us-east1-b"        # reservation mq-lab-n2-8 (#405); us-central1 N2 capacity exhausted 2026-06-29
instance = "n2-standard-8"    # 8 vCPU / 32 GiB; N2/Intel → nested-virt-capable; ~$0.39/hr while running; must match the reservation's machine type
cpus   = 8                    # match n2-standard-8 (overrides the base 12) — declaring more than the
memory = "32GiB"              # machine type provides warns about under-capacity; this is all the reservation gives (#405)
volume   = "400GiB"           # PERSISTENT data disk — outlives the ephemeral VM (cloud analog of `disk`).
                              # Doubled 200→400 GiB alongside the boot disk (.github#120): headroom for the
                              # growing RHEL-DVD/box-archive footprint on the data mount.
boot_disk = "200GiB"          # EPHEMERAL boot disk — holds libvirt's default image pool (/var/lib/libvirt/images).
                              # Default ~29 GiB filled during full-HADR bring-up → QEMU ENOSPC pauses (#375); images
                              # stay on the boot disk (#386 reverted the data-disk redirect — the persistent /vergil
                              # disk is never wiped on rebuild, so orphaned lab_*.img volumes wedged every next
                              # `vagrant up`; that's why we grow the disk rather than relocate the pool). Doubled
                              # 100→200 GiB (.github#120): the boot disk holds BOTH per-run images AND the 8-fat-box
                              # vagrant cache and hit 78% during the #114 rollout — a leaked image could wedge the
                              # host. Sized for the box cache + a couple concurrent stacks with margin. Cloud-only;
                              # local is the roomy Mac box.

[vm.anonymous]
# Credential-less identity for isolated lab bootstrap testing (no GitHub/Claude
# creds), so a from-scratch bootstrap can run in parallel without touching shared
# stacks (#291). This repo has no shared [vm] stanza — composition is [vm] ⊕
# [vm.<identity>] and [vm] is absent — so the full run-the-lab toolchain is
# replicated here rather than inherited. Keep in sync with [vm.vergil-user].
# Depends on vergil-tooling #1705 (auth_type = "none") to actually build.
cpus   = 8          # estimate (~half of vergil-user); raise toward 12 if guests OOM/slow
memory = "32GiB"    # estimate (~half of vergil-user); raise toward 64GiB if needed
disk   = "300GiB"   # match vergil-user — nested guest qcow2 images are the risk, not RAM
nested = true       # REQUIRED — /dev/kvm to KVM-boot the arm64 lab guests (else slow TCG)
packages = [
  "qemu-system-x86", "qemu-system-arm", "qemu-utils",
  "qemu-efi-aarch64", "ovmf",  # UEFI guest firmware (AAVMF/OVMF) — Recommends-only, so declare explicitly (#20)
  "libvirt-daemon-system", "libvirt-clients", "bridge-utils",
  "dnsmasq-base", "genisoimage",
  "libarchive-tools",  # bsdtar — vagrant box unpacking
  "ruby-dev", "libvirt-dev", "pkg-config", "build-essential",  # vagrant gem + vagrant-libvirt build deps (build-essential = gcc/g++/make/libc6-dev; the cloud base ships no libc6-dev)
]
vagrant_plugins = ["vagrant-libvirt"]
# Grafana relay -> workstation localhost:3001 (NOT 3000). vergil-user already
# forwards its base-VM:3000 to the workstation's localhost:3000; this box runs in
# PARALLEL with it, so it must use a distinct workstation port. The record is
# "<vm-port>|<host:port>" and Lima forwards <vm-port> to the same workstation port,
# so the vm-port becomes 3001. The target stays the obs node's Grafana (10.50.0.2:3000),
# which is internal to the lab and unchanged.
port_forwards = ["3001|10.50.0.2:3000"]

# Off-platform lifecycle-validation profile (vergil-vm#199 / vergil-tooling#1706).
# Deliberately tiny: smallest box that runs Claude Code, NO nested virt, NO lab
# toolchain — just to beat on create/session/destroy + SSH and confirm Claude runs
# inside. A standalone cloud identity, so it never collides with vergil-user.
# The scaled-up, full-lab off-platform box is [vm.vergil-user] above (n2-standard-16
# + nested KVM); this profile intentionally stays minimal as the lifecycle smoke test.
[vm.vergil-audit]
backend  = "off-platform"
provider = "gcp"
region   = "us-central1"
instance = "e2-medium"     # 2 vCPU / 4 GiB — comfortably runs Claude Code; ~$0.03/hr
volume   = "50GiB"         # modest while we iterate; bump for the lab later
nested   = false           # not needed for the hello-world lifecycle test
