# Vergil VM profile spec for mq-cluster-tooling.
#
# This is the source-controlled "reference" a Vergil VM *profile* pulls from at
# create time (see ~/.config/vergil/identities.toml -> [vms.mq-lab]). It declares
# the footprint and the additive package set this repo needs to be developed in.
#
# The VM is ephemeral and 100% reproducible: change tooling by editing this file
# and rebuilding (`vrg-vm rebuild --vm mq-lab`), never by `apt install` inside a
# live VM. All working state lives in the gitignored build/ dir (host-mounted).

[vm]
cpus   = 12
memory = "64GiB"
disk   = "300GiB"

# Extra apt packages layered onto the Vergil base image at provision time.
# The base already supplies: curl, jq, ripgrep, zsh, git, gh, node, uv,
# python3, rootless containerd. Only additive lab tooling goes here.
#
# Vagrant itself and the vagrant-libvirt plugin are not plain apt packages on
# Ubuntu 24.04 (HashiCorp apt repo + `vagrant plugin install vagrant-libvirt`);
# the build deps for the plugin are listed here, the install commands are a
# template/provisioning concern handled by the Vergil profile feature.
packages = [
  "qemu-system-x86",
  "qemu-system-arm",
  "qemu-utils",
  "libvirt-daemon-system",
  "libvirt-clients",
  "bridge-utils",
  "dnsmasq-base",
  "genisoimage",
  "ruby-dev",
  "libvirt-dev",
  "pkg-config",
  "gcc",
  "make",
]
