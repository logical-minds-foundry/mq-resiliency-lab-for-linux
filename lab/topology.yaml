# lab/topology.yaml — single source of truth for the lab shape: the guest VMs
# (nodes), the networks/boxes, the atomic `groups` (role × site), and the named
# `setups` that compose those groups into runnable configurations. The RDQM arm
# uses a RHEL x86_64 platform per-node; arch-specific provider mechanics (UEFI,
# input, CPU mode) live in the Vagrantfile keyed on `arch` — see the provider
# spike report (docs/reports/2026-06-06-phase-a-provider-spike.md).
#
# Every node carries a net-mgmt NIC (10.50.0.0/24): the dedicated, host-only
# management plane Ansible connects over, kept off the modeled data/hb/san
# planes. The inventory is rendered from this file (mqlab vm inventory, #101).
boxes:
  # cloud-image/ubuntu-24.04 ships libvirt boxes for both arches; the Ubuntu
  # platform a node uses is host-resolved (default_platform, #276), so guests
  # track the host arch (native-preferred).
  ubuntu2404-arm64:  { box: cloud-image/ubuntu-24.04, arch: aarch64 }
  ubuntu2404-x86_64: { box: cloud-image/ubuntu-24.04, arch: x86_64 }
  alma9-x86_64:      { box: almalinux/9,               arch: x86_64 }
  # dvd: attached as a cdrom; the install DVD doubles as a complete
  # offline BaseOS+AppStream dnf repo for the unregistered guests.
  rhel96-x86_64:
    box: rhel/9.6-x86_64
    arch: x86_64
    dvd: /var/lib/libvirt/images/rhel-9.6-x86_64-dvd.iso
  # The fat RDQM box (#604, epic .github#70): the rhel/9.6 base with MQ + RDQM
  # (DRBD/Pacemaker, kernel-matched kmod-drbd) + node-exporter + alloy + the #569 journald
  # diagnostic default BAKED IN (lab/boxes/build-fatbox.sh --box mq-rdqm-rhel9). The RDQM
  # nodes boot this instead of rhel96-x86_64 so a bootstrap skips the ~hour of heavy
  # installs. Instances still attach the DVD: the per-run configure half (re)mounts it as
  # the offline BaseOS+AppStream repo for dep resolution. The instance-build base-OS dnf
  # update was removed (#639/#641) — OS currency comes from rebuilding the box, not
  # updating at boot; this also keeps the kernel from drifting off the baked kmod-drbd.
  # The box kernel matches its baked kmod-drbd by construction (baked from this exact
  # base) — no separate kernel pin.
  mq-rdqm-rhel9:
    box: mq-rdqm-rhel9
    arch: x86_64
    dvd: /var/lib/libvirt/images/rhel-9.6-x86_64-dvd.iso
  # The fat obs box (#605, epic .github#70): the cloud-image/ubuntu-24.04 base with the
  # observability stack (prometheus/grafana/loki binaries + node-exporter + alloy) and the
  # slow cgo mq_prometheus exporter build + MQ SDK BAKED IN (lab/boxes/build-fatbox.sh
  # --box obs-ubuntu2404). The obs node boots this instead of the host-resolved Ubuntu
  # platform so a bootstrap skips the stack install; the per-run path only renders the
  # topology targets/dashboards (site-obs.yml, configure halves). x86_64 because the box
  # is a baked x86 artifact (no DVD — Ubuntu registers online).
  obs-ubuntu2404:
    box: obs-ubuntu2404
    arch: x86_64
  # The fat infra box (#606, epic .github#70): the cloud-image/ubuntu-24.04 base with
  # BIND9 (package + /etc/bind/zones scaffolding) + node-exporter + alloy BAKED IN
  # (lab/boxes/build-fatbox.sh --box infra-ubuntu2404). The infra nodes boot this
  # instead of the bare Ubuntu image so a bootstrap skips those installs; the per-run
  # configure half (zone data + per-host named.conf, base-OS apt refresh) still runs.
  # arch is pinned x86_64 (unlike host-resolved Ubuntu nodes): the baked binaries are
  # arch-specific and the box is baked on x86_64. No DVD (Ubuntu uses the online archive).
  infra-ubuntu2404:
    box: infra-ubuntu2404
    arch: x86_64
  # The fat MQ-commons box (#659, epic .github#70): the cloud-image/ubuntu-24.04 base with
  # the Ubuntu MQ product (server + client + SDK + samples debs) + node-exporter + alloy +
  # the slow cgo mq_prometheus exporter build + acl BAKED IN (lab/boxes/build-fatbox.sh
  # --box mq-ubuntu2404). The three shared Ubuntu MQ commons (svc-sim, app-client,
  # mon-probe) boot this instead of the host-resolved Ubuntu platform so a bootstrap skips
  # ~15-20 min of per-run installs (MQ debs, alloy, mq_prometheus, the acl stall); the
  # per-run configure half (QMs/channels on svc, the app-requester, the exporter instances)
  # still runs. arch is pinned x86_64 (unlike host-resolved Ubuntu nodes): the baked
  # binaries are arch-specific and the box is baked on x86_64. No DVD (Ubuntu online archive).
  mq-ubuntu2404:
    box: mq-ubuntu2404
    arch: x86_64

# No defaults.platform: the default Ubuntu platform is host-resolved by mqlab
# (default_platform(facts)) so guests track the host arch (native-preferred, #276).
defaults: { cpus: 1, memory: 1024 }

# boot_batch — the vms phase boots the stack's VMs in contiguous batches of at most N
# per `vagrant up` (#638) instead of all at once. vagrant-libvirt has no native "N at a
# time" (all-parallel by default, or fully serial via --no-parallel), so mqlab chunks
# the ordered node list and issues one `vagrant up <batch>` per group — preserving the
# HADR bring-up order (SANs first, site-A before site-B; batches are contiguous slices,
# never reordered). Rationale: booting all 12 fat boxes at once (multi-GB image copies +
# the RDQM drbdpool vdb creates) spikes host disk I/O hard enough to time a heavy guest
# (infra-client, 4 NICs) out on SSH ('inaccessible') while its siblings come up, and it
# only worsens as nodes/stacks are added. This is the speed<->reliability dial: smaller
# N = fewer concurrent boots = more reliable but a bit slower; larger N = faster but
# reintroduces the contention. Must be a positive integer; defaults to 4 when unset.
boot_batch: 4

nodes:
  # --- SVC service VM + app client (the distributed message path) ---
  svc-sim:
    platform: mq-ubuntu2404  # boot the baked MQ-commons box (#659) — MQ/node-exporter/alloy/mq_prometheus/acl pre-installed
    cpus: 2
    memory: 2048
    org: service  # the mocked counterparty — the service.com side of net-ext
    # net-ext (10.60.0.50) is the inter-business WAN to our HA QM's partner VIP (#147).
    nics: { net-mgmt: 10.50.0.50, net-ext: 10.60.0.50 }
  app-client:
    platform: mq-ubuntu2404  # boot the baked MQ-commons box (#659) — MQ client+SDK/node-exporter/alloy/acl pre-installed
    # net-data-a reaches site-A VIPs (10.10.1.x), net-data-b reaches site-B VIPs
    # (10.10.2.x) -- so the app, a reconnectable client given both VIPs, rides a
    # cross-site DR cutover and keeps producing on the survivor.
    nics: { net-mgmt: 10.50.0.60, net-data-a: 10.10.1.60, net-data-b: 10.10.2.60 }

  # --- Observability (#103): obs runs Prometheus+Grafana on the mgmt plane only;
  # mon-probe carries net-data NICs for the (Plan B) client-mode MQ exporters, plus
  # net-ext to reach the SVC counterparty QM across the inter-business WAN (#182). ---
  obs:
    platform: obs-ubuntu2404  # boot the baked obs stack (#605); NICs/resources unchanged
    cpus: 2
    memory: 4096
    nics: { net-mgmt: 10.50.0.2 }
  mon-probe:
    platform: mq-ubuntu2404  # boot the baked MQ-commons box (#659) — MQ/node-exporter/alloy/mq_prometheus/acl pre-installed
    cpus: 1
    memory: 1024
    nics: { net-mgmt: 10.50.0.3, net-data-a: 10.10.1.7, net-data-b: 10.10.2.7, net-ext: 10.60.0.7 }

  # --- DNS infrastructure (#474, epic .github#21): per-side authoritative
  # nameservers, their own failure domain so DNS can be broken and measured
  # independently later. infra-client serves client.com (our estate) and reaches
  # guests on the mgmt + both site data planes; infra-svc is the mock service.com
  # nameserver on the inter-business WAN. Default (small) footprint — BIND is light. ---
  infra-client:
    platform: infra-ubuntu2404  # boot the baked infra box (#606) — bind9/node-exporter/alloy pre-installed
    nics: { net-mgmt: 10.50.0.8, net-data-a: 10.10.1.8, net-data-b: 10.10.2.8, net-ext: 10.60.0.8 }
  infra-svc:
    platform: infra-ubuntu2404  # boot the baked infra box (#606) — bind9/node-exporter/alloy pre-installed
    org: service  # the mock service.com nameserver
    nics: { net-mgmt: 10.50.0.9, net-ext: 10.60.0.9 }

  # --- Phase C: RDQM arm, six RHEL x86_64 TCG nodes (spec 10-C) ---
  rdqm-a1:
    platform: mq-rdqm-rhel9
    cpus: 2
    memory: 2048
    extra_disk: 10
    nics: { net-mgmt: 10.50.0.31, net-data-a: 10.10.1.31, net-hb-a: 172.16.1.31, net-wan: 10.99.0.31, net-ext: 10.60.0.31 }
  rdqm-a2:
    platform: mq-rdqm-rhel9
    cpus: 2
    memory: 2048
    extra_disk: 10
    nics: { net-mgmt: 10.50.0.32, net-data-a: 10.10.1.32, net-hb-a: 172.16.1.32, net-wan: 10.99.0.32, net-ext: 10.60.0.32 }
  rdqm-a3:
    platform: mq-rdqm-rhel9
    cpus: 2
    memory: 2048
    extra_disk: 10
    nics: { net-mgmt: 10.50.0.33, net-data-a: 10.10.1.33, net-hb-a: 172.16.1.33, net-wan: 10.99.0.33, net-ext: 10.60.0.33 }
  rdqm-b1:
    platform: mq-rdqm-rhel9
    cpus: 2
    memory: 2048
    extra_disk: 10
    nics: { net-mgmt: 10.50.0.41, net-data-b: 10.10.2.41, net-hb-b: 172.16.2.41, net-wan: 10.99.0.41 }
  rdqm-b2:
    platform: mq-rdqm-rhel9
    cpus: 2
    memory: 2048
    extra_disk: 10
    nics: { net-mgmt: 10.50.0.42, net-data-b: 10.10.2.42, net-hb-b: 172.16.2.42, net-wan: 10.99.0.42 }
  rdqm-b3:
    platform: mq-rdqm-rhel9
    cpus: 2
    memory: 2048
    extra_disk: 10
    nics: { net-mgmt: 10.50.0.43, net-data-b: 10.10.2.43, net-hb-b: 172.16.2.43, net-wan: 10.99.0.43 }

  # --- Phase D: Pacemaker/SAN arm, arm64 KVM (spec 10-D) ---
  san-a:
    extra_disk: 8
    nics: { net-mgmt: 10.50.0.5, net-san-a: 10.40.1.5, net-wan: 10.99.0.5 }
  pcmk-a1:
    cpus: 2
    memory: 2048
    nics: { net-mgmt: 10.50.0.51, net-data-a: 10.10.1.51, net-hb-a: 172.16.1.51, net-san-a: 10.40.1.51, net-wan: 10.99.0.51, net-ext: 10.60.0.51 }
  pcmk-a2:
    cpus: 2
    memory: 2048
    nics: { net-mgmt: 10.50.0.52, net-data-a: 10.10.1.52, net-hb-a: 172.16.1.52, net-san-a: 10.40.1.52, net-wan: 10.99.0.52, net-ext: 10.60.0.52 }
  pcmk-a3:
    cpus: 2
    memory: 2048
    nics: { net-mgmt: 10.50.0.53, net-data-a: 10.10.1.53, net-hb-a: 172.16.1.53, net-san-a: 10.40.1.53, net-wan: 10.99.0.53, net-ext: 10.60.0.53 }

  # --- Phase D DR: site B mirrors site A on the .2/.6x address plan. san-b is
  # the DRBD secondary (LUN replicated from san-a over net-wan); pcmk-b1..3 are
  # the peer cluster that receives the QM on cutover. hb IPs (172.16.2.61-63)
  # match ansible/site-pcmk-dr.yml; site-B VIP is 10.10.2.200, portal 10.40.2.6.
  san-b:
    extra_disk: 8
    nics: { net-mgmt: 10.50.0.6, net-san-b: 10.40.2.6, net-wan: 10.99.0.6 }
  pcmk-b1:
    cpus: 2
    memory: 2048
    nics: { net-mgmt: 10.50.0.61, net-data-b: 10.10.2.51, net-hb-b: 172.16.2.61, net-san-b: 10.40.2.51, net-wan: 10.99.0.61, net-ext: 10.60.0.61 }
  pcmk-b2:
    cpus: 2
    memory: 2048
    nics: { net-mgmt: 10.50.0.62, net-data-b: 10.10.2.52, net-hb-b: 172.16.2.62, net-san-b: 10.40.2.52, net-wan: 10.99.0.62, net-ext: 10.60.0.62 }
  pcmk-b3:
    cpus: 2
    memory: 2048
    nics: { net-mgmt: 10.50.0.63, net-data-b: 10.10.2.53, net-hb-b: 172.16.2.63, net-san-b: 10.40.2.53, net-wan: 10.99.0.63, net-ext: 10.60.0.63 }

  # --- pcmk-rhel arm: OSS Pacemaker/SAN substrate on RHEL 9.6 (issue #238/#244).
  # Same SAN/hb/data shape as the Ubuntu Phase-D arm, on RHEL x86_64/TCG to match
  # the RDQM platform. New net-san-rhel-a (10.40.3.0/24) plane; .7x host octets. ---
  san-a-rhel:
    platform: rhel96-x86_64
    extra_disk: 8
    nics: { net-mgmt: 10.50.0.70, net-san-rhel-a: 10.40.3.5, net-wan: 10.99.0.70 }
  pcmk-rhel-a1:
    platform: rhel96-x86_64
    cpus: 2
    memory: 2048
    nics: { net-mgmt: 10.50.0.71, net-data-a: 10.10.1.71, net-hb-a: 172.16.1.71, net-san-rhel-a: 10.40.3.71, net-wan: 10.99.0.71, net-ext: 10.60.0.71 }
  pcmk-rhel-a2:
    platform: rhel96-x86_64
    cpus: 2
    memory: 2048
    nics: { net-mgmt: 10.50.0.72, net-data-a: 10.10.1.72, net-hb-a: 172.16.1.72, net-san-rhel-a: 10.40.3.72, net-wan: 10.99.0.72, net-ext: 10.60.0.72 }
  pcmk-rhel-a3:
    platform: rhel96-x86_64
    cpus: 2
    memory: 2048
    nics: { net-mgmt: 10.50.0.73, net-data-a: 10.10.1.73, net-hb-a: 172.16.1.73, net-san-rhel-a: 10.40.3.73, net-wan: 10.99.0.73, net-ext: 10.60.0.73 }

  # --- Native HA arm (#246, #267): six RHEL x86_64 TCG nodes, shared-nothing
  # (raft log replication — NO extra_disk). Site A = nha_rhel_a (HA, Phase 1);
  # site B = nha_rhel_b (CRR/DR, Phase 3). x86 is forced (not RHEL); the Ubuntu
  # peer arm (nha-ubuntu-*, #417) is below. HA replication on net-hb-a; CRR over net-wan.
  # Host octets .9x — kept clear of the pcmk-rhel arm's .7x block (both RHEL/TCG).
  nha-rhel-a1:
    platform: rhel96-x86_64
    cpus: 2
    memory: 2048
    nics: { net-mgmt: 10.50.0.91, net-data-a: 10.10.1.91, net-hb-a: 172.16.1.91, net-wan: 10.99.0.91, net-ext: 10.60.0.91 }
  nha-rhel-a2:
    platform: rhel96-x86_64
    cpus: 2
    memory: 2048
    nics: { net-mgmt: 10.50.0.92, net-data-a: 10.10.1.92, net-hb-a: 172.16.1.92, net-wan: 10.99.0.92, net-ext: 10.60.0.92 }
  nha-rhel-a3:
    platform: rhel96-x86_64
    cpus: 2
    memory: 2048
    nics: { net-mgmt: 10.50.0.93, net-data-a: 10.10.1.93, net-hb-a: 172.16.1.93, net-wan: 10.99.0.93, net-ext: 10.60.0.93 }
  nha-rhel-b1:
    platform: rhel96-x86_64
    cpus: 2
    memory: 2048
    nics: { net-mgmt: 10.50.0.94, net-data-b: 10.10.2.91, net-hb-b: 172.16.2.91, net-wan: 10.99.0.94 }
  nha-rhel-b2:
    platform: rhel96-x86_64
    cpus: 2
    memory: 2048
    nics: { net-mgmt: 10.50.0.95, net-data-b: 10.10.2.92, net-hb-b: 172.16.2.92, net-wan: 10.99.0.95 }
  nha-rhel-b3:
    platform: rhel96-x86_64
    cpus: 2
    memory: 2048
    nics: { net-mgmt: 10.50.0.96, net-data-b: 10.10.2.93, net-hb-b: 172.16.2.93, net-wan: 10.99.0.96 }

  # --- Native HA Ubuntu arm (#417, Phase 2 of #246): the OS-as-only-variable peer
  # of the RHEL arm above. Same shared-nothing raft shape (NO extra_disk), same
  # net plan — HA replication on net-hb, CRR over net-wan. Site A = nha_ubuntu_a
  # (HA), site B = nha_ubuntu_b (CRR/DR). Host octets .1x — clear of every other
  # arm (rdqm .3x/.4x, pcmk .5x/.6x, pcmk-rhel .7x, nha-rhel .9x) so this arm can
  # COEXIST with the running pcmk-ubuntu arm on one host (#417 goal).
  #
  # Platform is host-resolved (#276, no `platform:` key) — NOT pinned to x86 like
  # nha-rhel. On the Apple-Silicon dev host these run native arm64 (so the two
  # Ubuntu stacks are usable side-by-side); on an x86 host they track x86_64. All
  # three instances share one arch either way, which is all Native HA requires.
  nha-ubuntu-a1:
    cpus: 2
    memory: 2048
    nics: { net-mgmt: 10.50.0.11, net-data-a: 10.10.1.11, net-hb-a: 172.16.1.11, net-wan: 10.99.0.11, net-ext: 10.60.0.11 }
  nha-ubuntu-a2:
    cpus: 2
    memory: 2048
    nics: { net-mgmt: 10.50.0.12, net-data-a: 10.10.1.12, net-hb-a: 172.16.1.12, net-wan: 10.99.0.12, net-ext: 10.60.0.12 }
  nha-ubuntu-a3:
    cpus: 2
    memory: 2048
    nics: { net-mgmt: 10.50.0.13, net-data-a: 10.10.1.13, net-hb-a: 172.16.1.13, net-wan: 10.99.0.13, net-ext: 10.60.0.13 }
  nha-ubuntu-b1:
    cpus: 2
    memory: 2048
    nics: { net-mgmt: 10.50.0.14, net-data-b: 10.10.2.11, net-hb-b: 172.16.2.11, net-wan: 10.99.0.14 }
  nha-ubuntu-b2:
    cpus: 2
    memory: 2048
    nics: { net-mgmt: 10.50.0.15, net-data-b: 10.10.2.12, net-hb-b: 172.16.2.12, net-wan: 10.99.0.15 }
  nha-ubuntu-b3:
    cpus: 2
    memory: 2048
    nics: { net-mgmt: 10.50.0.16, net-data-b: 10.10.2.13, net-hb-b: 172.16.2.13, net-wan: 10.99.0.16 }

# groups — atomic role × site groups, each host listed exactly once. These are the
# shared grouping namespace: the Ansible inventory renders them verbatim and the
# playbooks target them; setups (below) compose them. Convention: underscores name
# a group, hyphens name a host (#101).
groups:
  san_a:  [san-a]
  san_b:  [san-b]
  pcmk_a: [pcmk-a1, pcmk-a2, pcmk-a3]
  pcmk_b: [pcmk-b1, pcmk-b2, pcmk-b3]
  san_a_rhel:  [san-a-rhel]
  pcmk_rhel_a: [pcmk-rhel-a1, pcmk-rhel-a2, pcmk-rhel-a3]
  rdqm_a: [rdqm-a1, rdqm-a2, rdqm-a3]
  rdqm_b: [rdqm-b1, rdqm-b2, rdqm-b3]
  nha_rhel_a: [nha-rhel-a1, nha-rhel-a2, nha-rhel-a3]
  nha_rhel_b: [nha-rhel-b1, nha-rhel-b2, nha-rhel-b3]
  nha_ubuntu_a: [nha-ubuntu-a1, nha-ubuntu-a2, nha-ubuntu-a3]
  nha_ubuntu_b: [nha-ubuntu-b1, nha-ubuntu-b2, nha-ubuntu-b3]
  svc:   [svc-sim]
  app:    [app-client]
  # obs_box (not "obs") so the group name never collides with the host named obs
  # (Ansible warns on group==host); probe/mon-probe already differ.
  obs_box: [obs]
  probe:   [mon-probe]
  infra:   [infra-client, infra-svc]

# stacks: — canonical 4-stack registry (#350). Each stack is the authoritative
# union of its old arm (mechanism/verbs/short) and its full-HADR distributed setup
# (groups, qm VIPs, alloc). Added alongside setups:/arms: in Task 1a; cutover
# (retire setups:/arms:) is Task 1b.
#
# QM names derive from `short` via #351 short-derivation: <short>APP / <short>SVC.
# No hardcoded QM literals here — names live exclusively in the short token.
#
# groups: lists the full HADR set (site-A + site-B + SANs, in bring-up order) —
# the canonical "run the whole stack" shape. Individual phase groups are composed
# by the playbooks.
#
# alloc: port/unit constants referenced by playbooks and the mqweb content plays.
stacks:
  pcmk-ubuntu:
    mechanism: pacemaker-san
    os: ubuntu
    short: PCMK
    cluster_group: pcmk_a
    groups: [san_a, pcmk_a, san_b, pcmk_b]
    provision: ansible/site-pcmk.yml
    secrets: [pcmk_hacluster_password, mqweb_admin_password]
    qm: { vip: 10.10.1.200, vip_b: 10.10.2.200, vip_ext: 10.60.0.10, vip_ext_b: 10.60.0.20 }
    alloc: { exporter_app_port: 9157, app_unit: app-pcmk, svc_port: 1414 }
    verbs:
      qm-create:  { playbook: site-pcmk.yml }
      qm-destroy: { playbook: site-pcmk-qm-down.yml }
      qm-up:      { pcs: "resource enable mq_group" }
      qm-down:    { pcs: "resource disable mq_group" }
      qm-status:  { pcs: "status resources" }
  rdqm-rhel:
    mechanism: rdqm
    os: rhel
    short: RDQM
    cluster_group: rdqm_a
    groups: [rdqm_a, rdqm_b]
    provision: ansible/site-rdqm.yml
    secrets: [mqweb_admin_password]
    qm: { vip: 10.10.1.100, vip_b: 10.10.2.100 }
    alloc: { exporter_app_port: 9159, app_unit: app-rdqm, svc_port: 1414 }
    verbs:
      qm-create: { script: rdqm-qm-create.sh }
      qm-status: { cmd: "/opt/mqm/bin/rdqmstatus -m {qm}" }
      qm-up:     { cmd: "su mqm -c '/opt/mqm/bin/strmqm {qm}'" }
      qm-down:   { cmd: "su mqm -c '/opt/mqm/bin/endmqm -w {qm}'" }
  nativeha-rhel:
    mechanism: native-ha
    os: rhel
    short: NHAR
    cluster_group: nha_rhel_a
    groups: [nha_rhel_a, nha_rhel_b]
    provision: ansible/site-nativeha.yml
    secrets: [mqweb_admin_password]
    qm: {}
    alloc: { exporter_app_port: 9161, app_unit: app-nhar, svc_port: 1414 }
    verbs:
      qm-create:   { playbook: site-nativeha.yml }
      qm-status:   { cmd: "su - mqm -c '/opt/mqm/bin/dspmq -m {qm} -o nativeha -x'" }
      qm-up:       { cmd: "systemctl start mqmonitor@{qm}" }
      qm-down:     { cmd: "systemctl stop mqmonitor@{qm}" }
      dr-cutover:  { playbook: site-nativeha-switchover.yml }
      dr-failback: { playbook: site-nativeha-switchover.yml }
      diagnostics: { cmd: "su - mqm -c '/opt/mqm/bin/runmqras -qmlist {qm}'" }
  # nativeha-ubuntu (#417, Phase 2 of #246): the OS-as-only-variable peer of
  # nativeha-rhel. Identical mechanism/verbs (mqmonitor@ systemd lifecycle, qm.ini
  # GroupRole switchover); only the QM names (NHAU*), the groups (nha_ubuntu_*),
  # the exporter ports/app_unit, and the provision playbook differ. Built to coexist
  # with pcmk-ubuntu on one host (collision-free IPs/ports).
  nativeha-ubuntu:
    mechanism: native-ha
    os: ubuntu
    short: NHAU
    cluster_group: nha_ubuntu_a
    groups: [nha_ubuntu_a, nha_ubuntu_b]
    provision: ansible/site-nativeha-ubuntu.yml
    secrets: [mqweb_admin_password]
    qm: {}
    alloc: { exporter_app_port: 9163, app_unit: app-nhau, svc_port: 1414 }
    verbs:
      qm-create:   { playbook: site-nativeha-ubuntu.yml }
      qm-status:   { cmd: "su - mqm -c '/opt/mqm/bin/dspmq -m {qm} -o nativeha -x'" }
      qm-up:       { cmd: "systemctl start mqmonitor@{qm}" }
      qm-down:     { cmd: "systemctl stop mqmonitor@{qm}" }
      dr-cutover:  { playbook: site-nativeha-ubuntu-switchover.yml }
      dr-failback: { playbook: site-nativeha-ubuntu-switchover.yml }
      diagnostics: { cmd: "su - mqm -c '/opt/mqm/bin/runmqras -qmlist {qm}'" }

# svc: — the single shared Business-B counterparty (#446). One SVCQM on svc-sim;
# each app stack owns its own {SHORT}.SVC.REQUEST queue + responder for independence.
# Names derive from `short` (SVCQM = {short}QM) — no hardcoded QM literal (#351).
svc:
  short: SVC
  conn: 10.60.0.50        # inter-business WAN CONNAME (was the per-stack qm.svc_conn)
  listener_port: 1414
  exporter_port: 9158     # the one shared svc exporter port (freed from pcmk's slot)

# commons: — shared observability stack. Replaces the old `monitoring` setup in the
# stacks namespace; the `monitoring` setup entry above remains intact until Task 1b.
commons:
  groups: [obs_box, probe, svc, app, infra]
  provision: ansible/site-obs.yml
