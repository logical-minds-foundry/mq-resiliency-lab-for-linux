# lab/versions.yaml — the ONLY place OS version tokens are written by hand (epic .github#280).
#
# Read by src/mqlab/versions.py, which validates the whole file eagerly and fails
# loudly on anything malformed. Box names are GENERATED as <role>-<os><major>
# (e.g. mq-nativeha-ubuntu24); never write one by hand elsewhere.
#
#   os:     per-family, per-major facts the bake/provision steps need. Keys:
#             base_box (required), base_box_version, point, iso (point+iso required
#             for rhel), arch (host-arch pin; absent = tracks the host), requires,
#             ibm_support: { status: supported|unsupported, source: <citation url> },
#             lab_default_decision: { decided: "<YYYY-MM-DD>", ref: "<owner>/<repo>#<N>" }.
#   roles:  box role -> { bake: { <family>: <ansible/bake-<stem>.yml stem> }, mq_bearing }.
#   infra:  the OS of the shared nodes that run NO MQ (roles infra, obs, san). Not
#           selectable, and not support-gated (no MQ runs there).
#   infra_mq: the OS of the shared nodes that RUN MQ (role mq-client: svc-sim,
#           app-client, mon-probe). Not selectable; support-gated like a stack default
#           (spec §2/§4.1, correction .github#285).
#   stacks: per-stack supported majors and default.
#   The support gate: a default (and infra_mq) may point at an entry with
#           ibm_support.status: unsupported ONLY when that entry records a
#           lab_default_decision (the human's dated call + the issue recording it). An
#           unsupported default without one is refused, so it is never accidental. The
#           decision never edits ibm_support (that stays IBM's word), and bootstrap still
#           warns on the entry. A decision on a supported entry is refused as stale.
os:
  ubuntu:
    24: { base_box: cloud-image/ubuntu-24.04, base_box_version: "20260926.0.0" }
    # Pin from the T0b live spike (docs/reports/2026-10-os-axis-spike.md §1; libvirt amd64
    # + arm64). IBM's MQ 10.0 SPCR lists no Ubuntu 26.04 row
    # (docs/reference/os-version-support-matrix.md §3.1, §6.1), so 26 stays IBM-unsupported
    # and warns on bootstrap. The lab makes it the Ubuntu default anyway, ahead of IBM, by
    # the recorded decision below (#1285; matrix §4): the leading edge is the lab's point.
    26:
      base_box: cloud-image/ubuntu-26.04
      base_box_version: "20260927.0.0"
      ibm_support:
        status: unsupported
        source: "https://www.ibm.com/software/reports/compatibility/clarity-reports/report/json/getTSROsSupportSummary?deliverableId=FA94B1F6888342969E7F9B505149F032"
      lab_default_decision: { decided: "2026-10-14", ref: "logical-minds-foundry/mq-resiliency-lab-for-linux#1285" }
  rhel:
    9: { base_box: rhel/9-x86_64, point: "9.6", iso: rhel-9.6-x86_64-dvd.iso, arch: x86_64 }
    # RHEL 10 (#1286): IBM supports MQ 10.0 + Native HA on it; RDQM joins from MQ 10.0.1,
    # the first level whose tarball ships RHEL 10 DRBD kmods (#1440), so nativeha-rhel-crr
    # and rdqm-rhel both offer it. 10.2 = the latest GA minor (2026-05-19). Built for
    # x86-64-v3, so it needs a v3 CPU under KVM.
    # Sources: docs/reference/os-version-support-matrix.md.
    10: { base_box: rhel/10-x86_64, point: "10.2", iso: rhel-10.2-x86_64-dvd.iso, arch: x86_64, requires: [x86-64-v3] }
roles:
  infra: { bake: { ubuntu: infra } }
  obs: { bake: { ubuntu: obs } }
  # The SAN targets (san-a/san-b): DRBD + LIO install half, no MQ payload (spec §4.7.1).
  san: { bake: { ubuntu: san }, components: [mq-resiliency-observability] }
  mq-client: { bake: { ubuntu: mq-ubuntu }, mq_bearing: true, components: [mq-resiliency-clients] }
  mq-nativeha:
    bake: { ubuntu: nativeha-ubuntu, rhel: nativeha-rhel }
    mq_bearing: true
    components: [mq-resiliency-observability]
  # pcmk is deliberately not MQ-bearing, matching lab/boxes/_manifest-hash.sh.
  pcmk: { bake: { ubuntu: pcmk-ubuntu }, components: [mq-resiliency-observability] }
  mq-rdqm: { bake: { rhel: mq-rdqm }, mq_bearing: true, components: [mq-resiliency-observability] }
infra: ubuntu:26
# On 26 ahead of IBM's SPCR, by os.ubuntu.26's recorded lab_default_decision (#1285).
infra_mq: ubuntu:26
stacks:
  # Default 26 ahead of IBM's SPCR, by os.ubuntu.26's recorded lab_default_decision
  # (#1285); 24 stays selectable via a --config build file.
  nativeha-ubuntu: { supported: [ubuntu:24, ubuntu:26], default: ubuntu:26 }
  pcmk-ubuntu: { supported: [ubuntu:24, ubuntu:26], default: ubuntu:26 }
  # Defaults to rhel:10 (T11, #1289): IBM's MQ 10.0 SPCR lists MQ server + Native HA on
  # RHEL 10 (docs/reference/os-version-support-matrix.md), and the row was validated live
  # (V3, #1288). rhel:10 requires x86-64-v3, so a default bring-up on a host without it
  # is refused and names os: rhel:9 in a --config build file — never a silent fallback.
  nativeha-rhel-crr: { supported: [rhel:9, rhel:10], default: rhel:10 }
  # RHEL 10 is selectable from MQ 10.0.1 (#1440): its tarball ships RHEL 10 DRBD kmods and a
  # Pacemaker 3 stack (docs/reference/os-version-support-matrix.md §2.4). The default stays
  # rhel:9 until a human decides otherwise after the cold-rebuild validation row passes.
  # rhel:10 requires x86-64-v3, like nativeha-rhel-crr's.
  rdqm-rhel: { supported: [rhel:9, rhel:10], default: rhel:9 }
# The ONE pinned guest Python runtime (epic .github#294 spec §5.2): a
# python-build-standalone CPython install_only build, run by every guest component and
# by `mqlab component build`'s tests. The contract is the minor (3.14); a patch bump is
# this block only. sha256 = the install_only tarballs, from the release's SHA256SUMS:
# https://github.com/astral-sh/python-build-standalone/releases/download/20261003/SHA256SUMS
# Proven on Ubuntu 24.04 (both arches) and RHEL 9.6: docs/reports/2026-10-guest-runtime-spike.md.
runtime:
  python:
    version: "3.14.8"
    pbs_release: "20261003"
    sha256:
      x86_64: "371b6c281bbb09b29279e9e3a2996bab4ae2ea03cca52bf869f8bd89286b0ae8"
      aarch64: "abc0c8dd54a144909a5e4905737bc33f244cb17ce8afc4a7b0791ee1e006ae23"
