# Declarative MQ objects for QDTCC - the DTCC-side reciprocal of qm-main.
qmgr: QDTCC
objects:
  - kind: qlocal
    name: TRADE.REQUEST
    attrs: { default_persistence: "yes" }
  - kind: qlocal
    name: QMAIN
    attrs:
      usage: XMITQ
      # Triggered xmitq - see qm-main.yaml QDTCC note (spec 8.3).
      trigger_control: "YES"
      trigger_type: FIRST
      initiation_queue_name: SYSTEM.CHANNEL.INITQ
      trigger_data: QDTCC.QMAIN
  - kind: qremote
    name: FIRM.REPLY
    attrs:
      default_persistence: "yes"
      remote_queue_name: TRADE.REPLY
      remote_queue_manager_name: QMAIN
      transmission_queue_name: QMAIN
  - kind: channel
    name: QDTCC.QMAIN
    attrs:
      channel_type: SDR
      transport_type: TCP
      # Fast reconnect after peer restart (default SHORTTMR 60s can exceed
      # client ack waits - the post-reboot e2e race found in B-Task 8).
      short_retry_interval: 10
      connection_name: 10.20.0.10(1414)
      transmission_queue_name: QMAIN
  - kind: channel
    name: QMAIN.QDTCC
    attrs: { channel_type: RCVR, transport_type: TCP }
  - kind: channel
    name: SIM.SVRCONN
    attrs:
      channel_type: SVRCONN
      transport_type: TCP
      # LAB ONLY: run the channel as mqm so clients clear OAM (spec 1
      # puts security out of scope; never a production posture).
      mca_user: mqm
