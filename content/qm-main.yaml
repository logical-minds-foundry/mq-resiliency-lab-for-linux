# Declarative MQ objects for QMAIN (spec 9.1 distributed-queuing shape).
# Applied via pymqrest ensure_* - keys are pymqrest snake_case request
# parameters; values are raw MQSC where enumerated (SDR/RCVR/SVRCONN/XMITQ).
qmgr: QMAIN
objects:
  - kind: qlocal
    name: TRADE.REPLY
  - kind: qlocal
    name: QDTCC
    attrs: { usage: XMITQ }
  - kind: qremote
    name: DTCC.REQUEST
    attrs:
      remote_queue_name: TRADE.REQUEST
      remote_queue_manager_name: QDTCC
      transmission_queue_name: QDTCC
  - kind: channel
    name: QMAIN.QDTCC
    attrs:
      channel_type: SDR
      transport_type: TCP
      connection_name: 10.20.0.50(1414)
      transmission_queue_name: QDTCC
  - kind: channel
    name: QDTCC.QMAIN
    attrs: { channel_type: RCVR, transport_type: TCP }
  - kind: channel
    name: APP.SVRCONN
    attrs: { channel_type: SVRCONN, transport_type: TCP }
